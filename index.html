　腕を垂直にあげる前の状態における水平にあげた腕に対面する交通については、第二条第一項の表に掲げる赤色の灯火の信号の意味に同じ。"]}],"section":"G01-5","fixed":true},{"id":"G01-24","subject":"学科","chapter":"G01","text":"\u003cp>警察官が灯火を横に振っているとき、灯火が振られている方向に進む交通は、青色の灯火の信号と同じ意味である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>灯火を横に振っている状態では、振られている方向に進行する交通は青色の灯火、これと交差する交通は赤色の灯火の信号と同じ意味です。\u003c/p>","refs":[{"label":"道路交通法施行令 第5条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_5-Pr_1","lines":["法第六条第一項に規定する手信号その他の信号のうち、灯火による信号の種類及び意味は、次の表に掲げるとおりとする。","灯火による信号の種類｜灯火による信号の意味","灯火を横に振つている状態｜一　灯火が振られている方向に進行する交通については、第二条第一項の表に掲げる青色の灯火の信号の意味に同じ。二　灯火が振られている方向に進行する交通とその灯火により交通整理が行なわれている場所において交差する交通については、第二条第一項の表に掲げる赤色の灯火の信号の意味に同じ。"]}],"section":"G01-5","fixed":true},{"id":"G01-25","subject":"学科","chapter":"G01","text":"\u003cp>交差点以外の場所で、横断歩道も自転車横断帯も踏切もないところで警察官が手信号をしているとき、止まる位置は警察官の 1 メートル手前である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>手信号で止まるとき、交差点以外で横断歩道、自転車横断帯や踏切がない場所の停止位置は、手信号を行っている警察官などの 1 メートル手前です。\u003c/p>","refs":[{"label":"道路交通法施行令 第4条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_4-Pr_1","lines":["法第六条第一項に規定する手信号の種類及び意味は、次の表に掲げるとおりとする。","手信号の種類｜手信号の意味","備考　第二条第一項の表に掲げる黄色の灯火又は赤色の灯火の信号の意味と同じ意味を表示する手信号の意味に係る停止位置は、同表の備考の三に規定する場所にあつては、手信号を行なつている警察官又は法第百十四条の四第一項に規定する交通巡視員（以下「警察官等」という。）の一メートル手前の場所とする。"]}],"section":"G01-5","fixed":true},{"id":"G02-01","subject":"学科","chapter":"G02","text":"\u003cp>本標識には、規制標識、指示標識、警戒標識、案内標識の 4 種類がある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>標識には本標識と補助標識があり、本標識は規制標識、指示標識、警戒標識、案内標識の 4 種類です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（1） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（1）標識とは、交通規制などを示す標示板のことをいい、本標識と補助標識があります。本標識には、規制標識、指示標識、警戒標識、案内標識の４種類があります。標識の種類とその意味は付表３（１）のとおりです。"]}],"section":"G02-1","fixed":true},{"id":"G02-02","subject":"学科","chapter":"G02","text":"\u003cp>補助標識は、本標識の意味を補足するもので、普通は本標識の上に取り付けられている。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>補助標識は、普通、本標識の下に取り付けられています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（6） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（6）規制標識など本標識の意味を補足するものとして補助標識が用いられることがあります。補助標識は、普通、本標識の下に取り付けられており、規制の理由を示したり、規制が適用される時間、曜日、自動車の種類などを特定しています。なお、車の種類を特定する場合などには、付表４のような略称を用いることがあります。"]}],"section":"G02-1","fixed":true},{"id":"G02-03","subject":"学科","chapter":"G02","text":"\u003cp>補助標識は、規制の理由を示したり、規制が適用される時間、曜日、自動車の種類などを特定したりする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>補助標識は、本標識の意味を補足し、規制の理由や、規制が適用される時間、曜日、自動車の種類などを示します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（6） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（6）規制標識など本標識の意味を補足するものとして補助標識が用いられることがあります。補助標識は、普通、本標識の下に取り付けられており、規制の理由を示したり、規制が適用される時間、曜日、自動車の種類などを特定しています。なお、車の種類を特定する場合などには、付表４のような略称を用いることがあります。"]}],"section":"G02-1","fixed":true},{"id":"G02-04","subject":"学科","chapter":"G02","text":"\u003cp>最高速度を指定する標識は、指示標識である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>最高速度を指定する標識は、特定の方法に従って通行するよう指定する規制標識です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（2） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（2）規制標識は、特定の交通方法を禁止したり、特定の方法に従つて通行するよう指定したりするものです。例えば、自動車の通行を禁止する標識（付表３（１）４）、最高速度を指定する標識（付表３（１）25）などがあります。"]}],"section":"G02-1","fixed":true},{"id":"G02-05","subject":"学科","chapter":"G02","text":"\u003cp>横断歩道や安全地帯の場所を示す標識は、指示標識である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>指示標識は、特定の交通方法ができることや、道路交通上決められた場所などを示します。横断歩道や安全地帯の場所を示す標識は、その例です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（3） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（3）指示標識は、特定の交通方法ができることや道路交通上決められた場所などを指示するものです。例えば、駐車することができることを示す標識（付表３（１）53）、横断歩道や安全地帯の場所を示す標識（付表３（１）57、59）などがあります。"]}],"section":"G02-1","fixed":true},{"id":"G02-06","subject":"学科","chapter":"G02","text":"\u003cp>前方に踏切があることを示す標識は、警戒標識である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>警戒標識は、道路上の危険や注意すべき状況を前もって知らせるものです。踏切があることや、道路工事中であることを示す標識などがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（4） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（4）警戒標識は、道路上の危険や注意すべき状況などを前もつて道路利用者に知らせて注意を促すものです。例えば、前方に踏切があることを示す標識（付表３（１）181）、道路工事中であることを示す標識（付表３（１）193）などがあります。"]}],"section":"G02-1","fixed":true},{"id":"G02-07","subject":"学科","chapter":"G02","text":"\u003cp>案内標識は、特定の交通方法を禁止したり、指定したりするものである。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>案内標識は、地点の名称、方面、距離などを示して、通行の便宜を図るものです。交通方法を禁止・指定するのは規制標識です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節2（5） 標識の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（5）案内標識は、地点の名称、方面、距離などを示して、通行の便宜を図ろうとするものです。"]}],"section":"G02-1","fixed":true},{"id":"G02-08","subject":"学科","chapter":"G02","text":"\u003cp>標示とは、ペイントや道路びょうなどによって路面に示された線、記号や文字のことで、規制標示と指示標示がある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>標示は路面に示された線、記号や文字で、規制標示と指示標示の 2 種類があります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節3（1） 標示の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=8","site":"警察庁の教則の全文（PDF）","lines":["（1）標示とは、ペイントや道路びようなどによつて路面に示された線、記号や文字のことをいい、規制標示と指示標示の２種類があります。標示の種類とその意味は付表３（２）のとおりです。"]}],"section":"G02-2","fixed":true},{"id":"G02-09","subject":"学科","chapter":"G02","text":"\u003cp>車両の停止位置を示す標示は、規制標示である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>停止位置を示す標示は、道路交通上決められた場所などを示す指示標示の例として挙げられています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節3（2） 標示の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=8","site":"警察庁の教則の全文（PDF）","lines":["（2）規制標示とは、特定の交通方法を禁止又は指定するもので、例えば、駐車を禁止する標示（付表３（２）５）やバスの専用通行帯を指示する標示（付表３（２）15）などがあります。指示標示とは特定の交通方法ができることや道路交通上決められた場所などを指示するもので、斜め横断ができることを示す標示（付表３（２）26）や車両の停止位置を示す標示（付表３（２）29、30）などがあります。"]}],"section":"G02-2","fixed":true},{"id":"G02-10","subject":"学科","chapter":"G02","text":"\u003cp>交通量の多いところでは、道路でキャッチボールやローラースケートなどをしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>交通量の多いところでキャッチボールやローラースケートなどをすることは、道路でしてはいけない危険なことです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節1（2） 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["（2）交通量の多いところでキャッチボールやローラースケートなどをすること。"]},{"label":"道路交通法 第76条第4項第3号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_5-Se_1-At_76-Pr_4-It_3","lines":["何人も、次の各号に掲げる行為は、してはならない。","三　交通のひんぱんな道路において、球戯をし、ローラー・スケートをし、又はこれらに類する行為をすること。"]}],"section":"G02-3","fixed":true},{"id":"G02-11","subject":"学科","chapter":"G02","text":"\u003cp>走っている車に外からつかまることは、短い距離であれば差し支えない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>走っている車や路面電車に外からつかまることは、距離に関係なくしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節1（6） 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["（6）走つている車や路面電車に外からつかまること。"]},{"label":"道路交通法 第76条第4項第6号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_5-Se_1-At_76-Pr_4-It_6","lines":["何人も、次の各号に掲げる行為は、してはならない。","六　道路において進行中の自動車、トロリーバス又は路面電車に飛び乗り、若しくはこれらから飛び降り、又はこれらに外からつかまること。"]}],"section":"G02-3","fixed":true},{"id":"G02-12","subject":"学科","chapter":"G02","text":"\u003cp>凍り付くおそれのあるときでも、ほこりが立たないように道路に水をまくのはよいことである。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>凍り付くおそれのあるときに水をまくことは、道路でしてはいけないこととされています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節1（8） 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["（8）凍り付くおそれのあるときに水をまくこと。"]}],"section":"G02-3","fixed":true},{"id":"G02-13","subject":"学科","chapter":"G02","text":"\u003cp>信号機の近くに、信号と似た色のネオンサインを設けてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>信号や標識・標示がよく見えないと非常に危険なので、信号機の近くに信号と似た色のネオンサインを設けたり、標識の近くに広告看板を設けたりしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節3 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["信号や標識・標示がよく見えないと非常に危険です。信号機の近くに信号と似た色のネオンサインを設けたり、標識の近くに広告看板を設けたり、また、信号機や標識・標示を勝手に操作したり、移したり、壊したりしてはいけません。"]},{"label":"道路交通法 第76条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_5-Se_1-At_76-Pr_2","lines":["何人も、信号機又は道路標識等の効用を妨げるような工作物又は物件を設置してはならない。"]}],"section":"G02-3","fixed":true},{"id":"G02-14","subject":"学科","chapter":"G02","text":"\u003cp>これから車を運転しようとする人に、酒を勧めてはいけないが、頼まれて酒を出すことは差し支えない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>これから車を運転しようとする人に、酒を出すことも、勧めることもしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節5 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["これから車を運転しようとする人に酒を出したり、勧めたりしてはいけません。"]},{"label":"道路交通法 第65条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_65-Pr_3","lines":["何人も、第一項の規定に違反して車両等を運転することとなるおそれがある者に対し、酒類を提供し、又は飲酒をすすめてはならない。"]}],"section":"G02-4","fixed":true},{"id":"G02-15","subject":"学科","chapter":"G02","text":"\u003cp>酒気を帯びていて、車を運転するおそれのある人に、車を貸してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>酒気を帯びている人で、酒気帯び運転をするおそれのある人に、車両等を提供してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第65条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_65-Pr_2","lines":["何人も、酒気を帯びている者で、前項の規定に違反して車両等を運転することとなるおそれがあるものに対し、車両等を提供してはならない。"]}],"section":"G02-4","fixed":true},{"id":"G02-16","subject":"学科","chapter":"G02","text":"\u003cp>運転免許を持っていない人に、車の運転を頼んではいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>免許を持たない人や酒気を帯びた人に運転を頼んではいけません。また、運転者に先を急がせたり、運転の邪魔になる行為をしないようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節4 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["免許を持たない人や酒気を帯びた人に運転を頼んだりしてはいけません。また、運転者に先を急がせたり、運転の邪魔になる行為をしないようにしましよう。"]}],"section":"G02-4","fixed":true},{"id":"G02-17","subject":"学科","chapter":"G02","text":"\u003cp>荷物を急いで届けてもらうためであれば、運転者に、積む物の重さの制限を超えて積んで運転するよう頼んでもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転者に過積載をして車を運転することを求めたり、過積載となるような物を売り渡したり、引き渡したりしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第4節6 道路でしてはいけないことなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["運転者に、過積載（積載物の重量の制限を超えて物を積むことをいいます。）をして車を運転することを求めたり、過積載となるような物を売り渡したり、引き渡したりしてはいけません。"]}],"section":"G02-4","fixed":true},{"id":"G03-01","subject":"学科","chapter":"G03","text":"\u003cp>運転免許は、第一種運転免許、第二種運転免許、仮運転免許の 3 つに区分されている。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>免許は、第一種免許、第二種免許、仮免許に区分されています。\u003c/p>","refs":[{"label":"道路交通法 第84条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_84-Pr_2","lines":["免許は、第一種運転免許（以下「第一種免許」という。）、第二種運転免許（以下「第二種免許」という。）及び仮運転免許（以下「仮免許」という。）に区分する。"]}],"section":"G03-1","fixed":true},{"id":"G03-02","subject":"学科","chapter":"G03","text":"\u003cp>タクシーを、客を乗せて運ぶために運転するときは、第二種運転免許が必要である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>乗合バスやタクシーなどの旅客自動車を旅客運送のため運転するときは、第二種運転免許が必要です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第2節1（2） 運転免許の区分","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=31","site":"警察庁の教則の全文（PDF）","lines":["（2）第二種運転免許乗合バス、タクシーなどの旅客自動車を旅客運送のため運転しようとする場合や代行運転自動車（自動車運転代行業（注５）に従事する運転者が客に代わつて運転する自動車をいいます。）である普通自動車を運転しようとする場合の免許をいいます。"]}],"section":"G03-1","fixed":true},{"id":"G03-03","subject":"学科","chapter":"G03","text":"\u003cp>普通免許を受けた人は、普通自動車のほか、小型特殊自動車と一般原動機付自転車を運転することができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>普通免許で運転できるのは、普通自動車、小型特殊自動車、一般原動機付自転車です。\u003c/p>","refs":[{"label":"道路交通法 第85条第2項（表の一部）","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_85-Pr_2","lines":["前項の表の下欄に掲げる第一種免許を受けた者は、同表の区分に従い当該自動車等を運転することができるほか、次の表の上欄に掲げる免許の種類に応じ、それぞれ同表の下欄に掲げる種類の自動車等を運転することができる。","第一種免許の種類｜運転することができる自動車等の種類","普通免許｜小型特殊自動車及び一般原動機付自転車"]}],"section":"G03-1","fixed":true},{"id":"G03-04","subject":"学科","chapter":"G03","text":"\u003cp>普通免許を受けていれば、普通自動二輪車を運転することができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>普通免許で運転できるのは、普通自動車、小型特殊自動車、一般原動機付自転車です。普通自動二輪車には、普通二輪免許か大型二輪免許が必要です。\u003c/p>","refs":[{"label":"道路交通法 第85条第2項（表の一部）","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_85-Pr_2","lines":["前項の表の下欄に掲げる第一種免許を受けた者は、同表の区分に従い当該自動車等を運転することができるほか、次の表の上欄に掲げる免許の種類に応じ、それぞれ同表の下欄に掲げる種類の自動車等を運転することができる。","第一種免許の種類｜運転することができる自動車等の種類","普通免許｜小型特殊自動車及び一般原動機付自転車","普通二輪免許｜小型特殊自動車及び一般原動機付自転車"]}],"section":"G03-1","fixed":true},{"id":"G03-05","subject":"学科","chapter":"G03","text":"\u003cp>近所を短い時間運転するだけであれば、免許証を携帯しなくてもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>免許を受けた人は、自動車等を運転するときは、距離や時間に関係なく、その免許証を携帯していなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第95条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_3-At_95-Pr_1","lines":["免許を受けた者は、自動車等を運転するときは、当該自動車等に係る免許証を携帯していなければならない。"]}],"section":"G03-1","fixed":true},{"id":"G03-06","subject":"学科","chapter":"G03","text":"\u003cp>総重量が 750 キログラムを超える車をけん引するときは、けん引する自動車を運転できる免許のほかに、けん引免許が必要である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>他の車をけん引するときは、けん引する自動車の種類に応じた免許のほか、けん引免許が必要です。総重量 750 キログラム以下の車をけん引するときは要りません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第2節3 けん引免許","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=32","site":"警察庁の教則の全文（PDF）","lines":["大型自動車、中型自動車、準中型自動車、普通自動車、大型特殊自動車のいずれかで他の車をけん引するときは、けん引する自動車の種類に応じた免許のほか、けん引免許が必要です。しかし、車の総重量（人や荷物をのせた状態での車全体の重さ）が750キログラム以下の車をけん引するときや故障車をロープ、クレーンなどでけん引するときは、けん引免許はいりません。"]}],"section":"G03-1","fixed":true},{"id":"G03-07","subject":"学科","chapter":"G03","text":"\u003cp>故障した車をロープでけん引するときも、けん引免許が必要である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>故障車をロープ、クレーンなどでけん引するときは、けん引免許は要りません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第2節3 けん引免許","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=32","site":"警察庁の教則の全文（PDF）","lines":["大型自動車、中型自動車、準中型自動車、普通自動車、大型特殊自動車のいずれかで他の車をけん引するときは、けん引する自動車の種類に応じた免許のほか、けん引免許が必要です。しかし、車の総重量（人や荷物をのせた状態での車全体の重さ）が750キログラム以下の車をけん引するときや故障車をロープ、クレーンなどでけん引するときは、けん引免許はいりません。"]}],"section":"G03-1","fixed":true},{"id":"G03-08","subject":"学科","chapter":"G03","text":"\u003cp>普通仮免許を受けた人は、練習のためであれば、ひとりで普通自動車を運転することができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>仮免許で練習するときは、その車を運転できる第一種免許を通算 3 年以上受けている人などを助手席に乗せ、その指導の下に運転しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第87条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_87-Pr_2","lines":["大型仮免許を受けた者は大型自動車、中型自動車、準中型自動車又は普通自動車を、中型仮免許を受けた者は中型自動車、準中型自動車又は普通自動車を、準中型仮免許を受けた者は準中型自動車又は普通自動車を、普通仮免許を受けた者は普通自動車を、練習のため又は試験等において運転することができる。この場合において、仮免許を受けた者は、練習のため自動車を運転しようとするときは、その運転者席の横の乗車装置に、当該自動車を運転することができる第一種免許を受けている者（免許の効力が停止されている者を除く。）で当該免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して三年以上のもの、当該自動車を運転することができる第二種免許を受けている者（免許の効力が停止されている者及び二十一歳に満たない者を除く。）その他政令で定める者を同乗させ、かつ、その指導の下に、当該自動車を運転しなければならない。"]}],"section":"G03-2","fixed":true},{"id":"G03-09","subject":"学科","chapter":"G03","text":"\u003cp>仮免許で練習するときに助手席に乗せて指導を受ける人は、その車を運転できる第一種免許を受けて 1 年たっている人であればよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>第一種免許の場合は、免許を受けていた期間が通算して 3 年以上の人です（免許の停止中の人を除く）。第二種免許なら、21 歳以上の人です。\u003c/p>","refs":[{"label":"道路交通法 第87条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_87-Pr_2","lines":["大型仮免許を受けた者は大型自動車、中型自動車、準中型自動車又は普通自動車を、中型仮免許を受けた者は中型自動車、準中型自動車又は普通自動車を、準中型仮免許を受けた者は準中型自動車又は普通自動車を、普通仮免許を受けた者は普通自動車を、練習のため又は試験等において運転することができる。この場合において、仮免許を受けた者は、練習のため自動車を運転しようとするときは、その運転者席の横の乗車装置に、当該自動車を運転することができる第一種免許を受けている者（免許の効力が停止されている者を除く。）で当該免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して三年以上のもの、当該自動車を運転することができる第二種免許を受けている者（免許の効力が停止されている者及び二十一歳に満たない者を除く。）その他政令で定める者を同乗させ、かつ、その指導の下に、当該自動車を運転しなければならない。"]}],"section":"G03-2","fixed":true},{"id":"G03-10","subject":"学科","chapter":"G03","text":"\u003cp>仮免許で練習のために運転するときは、車の前と後ろに、仮免許で練習中であることを示す標識を付けなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>仮免許を受けた人が練習のために運転するときは、自動車の前面と後面に、決められた様式の標識を付けなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第87条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_87-Pr_3","lines":["仮免許を受けた者は、練習のため自動車を運転しようとするときは、内閣府令で定めるところにより当該自動車の前面及び後面に内閣府令で定める様式の標識を付けて当該自動車を運転しなければならない。"]}],"section":"G03-2","fixed":true},{"id":"G03-11","subject":"学科","chapter":"G03","text":"\u003cp>仮免許の有効期間は、その仮免許の適性試験を受けた日から 1 年である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>仮免許の有効期間は、適性試験を受けた日から 6 か月です。\u003c/p>","refs":[{"label":"道路交通法 第87条第6項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_87-Pr_6","lines":["仮免許の有効期間は、当該仮免許に係る第九十七条第一項第一号に掲げる事項について行う運転免許試験（第九十条第一項及び第九十五条の六第一項において「適性試験」という。）を受けた日から起算して六月とする。ただし、当該期間が満了するまでの間に、大型仮免許を受けた者が大型免許若しくは大型第二種免許を受け、中型仮免許を受けた者が大型自動車若しくは中型自動車を運転することができる第一種免許若しくは第二種免許を受け、準中型仮免許を受けた者が大型自動車、中型自動車若しくは準中型自動車を運転することができる第一種免許若しくは第二種免許を受け、又は普通仮免許を受けた者が大型自動車、中型自動車、準中型自動車若しくは普通自動車を運転することができる第一種免許若しくは第二種免許を受けたときは、当該仮免許は、その効力を失う。"]}],"section":"G03-2","fixed":true},{"id":"G03-12","subject":"学科","chapter":"G03","text":"\u003cp>普通免許を受けて 1 年たっていない人が普通自動車を運転するときは、初心者マークを付けなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>準中型免許か普通免許を受けていた期間が通算して 1 年に達しない人は、普通自動車の前と後ろに初心者マークを付けないで運転してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第71条の5第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71_5-Pr_2","lines":["第八十四条第三項の準中型自動車免許又は普通自動車免許を受けた者で、当該準中型自動車免許又は普通自動車免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して一年に達しないもの（当該免許を受けた日前六月以内に準中型自動車免許又は普通自動車免許を受けていたことがある者、現に受けている準中型自動車免許又は普通自動車免許を受けた日以後に当該免許に係る上位免許（第八十五条第二項の規定により一の種類の運転免許について同条第一項の表の区分に従い運転することができる自動車等（以下「免許自動車等」という。）を運転することができる他の種類の運転免許（第八十四条第二項の仮運転免許を除く。）をいう。第百条の二第一項第一号及び第三号において同じ。）を受けた者その他の者で政令で定めるものを除く。）は、内閣府令で定めるところにより普通自動車の前面及び後面に内閣府令で定める様式の標識を付けないで普通自動車を運転してはならない。"]},{"label":"交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車を運転する前には、必ず次のことを確かめましよう。","ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。","イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。","ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。","エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。","オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））","を付けていること。","カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。","キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。"]}],"section":"G03-3","fixed":true},{"id":"G03-13","subject":"学科","chapter":"G03","text":"\u003cp>初心者マークは、車の前か後ろのどちらか見やすい位置に付ければよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>初心者マークは、車の前と後ろの、決められた位置に付けます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車を運転する前には、必ず次のことを確かめましよう。","ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。","イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。","ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。","エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。","オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））","を付けていること。","カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。","キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。"]}],"section":"G03-3","fixed":true},{"id":"G03-14","subject":"学科","chapter":"G03","text":"\u003cp>70 歳以上の人が普通自動車を運転するときは、車の前と後ろに高齢者マークを付けるようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>70 歳以上の高齢運転者が普通自動車を運転するときは、車の前と後ろの決められた位置に高齢者マークを付けるようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節1（2） 運転免許証などを確かめるなどすること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29","site":"警察庁の教則の全文（PDF）","lines":["（2）70歳以上の高齢運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に高齢者マーク（付表５（４））を付けるようにしましよう。"]}],"section":"G03-3","fixed":true},{"id":"G03-15","subject":"学科","chapter":"G03","text":"\u003cp>自動車を運転する前に、有効な自動車検査証と、自動車損害賠償責任保険証明書か責任共済証明書が車に備えてあることを確かめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>運転する前には、有効な自動車検査証と、自賠責保険の証明書か責任共済の証明書を自動車に備えていることを確かめます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車を運転する前には、必ず次のことを確かめましよう。","ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。","イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。","ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。","エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。","オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））","を付けていること。","カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。","キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。"]}],"section":"G03-4","fixed":true},{"id":"G03-16","subject":"学科","chapter":"G03","text":"\u003cp>免許証に「眼鏡等使用」の条件が付いている人でも、視力に自信があるときは、眼鏡を使わずに運転してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転する前に、免許証に記載された条件（眼鏡等使用など）を守っていることを確かめます。条件は守らなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車を運転する前には、必ず次のことを確かめましよう。","ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。","イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。","ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。","エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。","オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））","を付けていること。","カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。","キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。"]}],"section":"G03-4","fixed":true},{"id":"G03-17","subject":"学科","chapter":"G03","text":"\u003cp>長い時間運転するときは、4 時間に 1 回休息をとれば十分である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>長時間にわたって運転するときは、2 時間に 1 回は休息をとります。眠気を感じたら、速やかに休息をとってから運転します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節2 運転計画を立てること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=30","site":"警察庁の教則の全文（PDF）","lines":["長距離運転のときはもちろん、短区間を運転するときにも、自分の運転技能と車の性能に合つた運転計画を立てることが必要です。あらかじめ、運転コース、所要時間、休息場所、駐車場所などについて計画を立てておきましよう。長時間にわたつて運転するときは、２時間に１回は休息をとりましよう。また、眠気を感じたら、速やかに休息をとつて眠気を覚ましてから運転しましよう。"]}],"section":"G03-4","fixed":true},{"id":"G03-18","subject":"学科","chapter":"G03","text":"\u003cp>運転計画は長い距離を運転するときに立てるもので、短い区間を運転するときは考えなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>長距離運転のときはもちろん、短区間を運転するときにも、自分の運転技能と車の性能に合った運転計画を立てることが必要です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節2 運転計画を立てること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=30","site":"警察庁の教則の全文（PDF）","lines":["長距離運転のときはもちろん、短区間を運転するときにも、自分の運転技能と車の性能に合つた運転計画を立てることが必要です。あらかじめ、運転コース、所要時間、休息場所、駐車場所などについて計画を立てておきましよう。長時間にわたつて運転するときは、２時間に１回は休息をとりましよう。また、眠気を感じたら、速やかに休息をとつて眠気を覚ましてから運転しましよう。"]}],"section":"G03-4","fixed":true},{"id":"G03-19","subject":"学科","chapter":"G03","text":"\u003cp>眠くなる作用のある風邪薬を飲んだときは、運転をしないようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>睡眠作用のある風邪薬や頭痛薬などを服用したときは、運転をしないようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節3 体調を整えること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=30","site":"警察庁の教則の全文（PDF）","lines":["疲れているとき、病気のとき、心配ごとのあるときなどは、注意力が散漫になつたり、判断力が衰えたりするため、思い掛けない事故を引き起こすことがあります。このようなときは、運転を控えるか、体の調子を整えてから運転するようにしましよう。また、睡眠作用のある風邪薬や頭痛薬などを服用したときは、運転をしないようにしましよう。過労のときは、運転してはいけません。"]}],"section":"G03-5","fixed":true},{"id":"G03-20","subject":"学科","chapter":"G03","text":"\u003cp>酒を飲んだのが前の晩であれば、翌朝には酒の影響はないので、運転してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>酒を飲んだのが前夜であっても、翌朝の運転時まで酒の影響を受けていることがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節4 酒気を帯びた状態などで運転をしないこと","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=30","site":"警察庁の教則の全文（PDF）","lines":["酒気を帯びているときや麻薬、覚せい剤、シンナーなどの影響を受けているときは、運転してはいけません。また、酒を飲んだのが前夜であつても、翌朝の運転時まで酒の影響を受けていることがあることに注意しましよう。"]}],"section":"G03-5","fixed":true},{"id":"G03-21","subject":"学科","chapter":"G03","text":"\u003cp>過労のため正常な運転ができないおそれがあるときは、車を運転してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>過労、病気、薬物の影響などにより、正常な運転ができないおそれがある状態で車両等を運転してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第66条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_66","lines":["（過労運転等の禁止）","第六十六条　何人も、前条第一項に規定する場合のほか、過労、病気、薬物の影響その他の理由により、正常な運転ができないおそれがある状態で車両等を運転してはならない。"]}],"section":"G03-5","fixed":true},{"id":"G03-22","subject":"学科","chapter":"G03","text":"\u003cp>運転する前に、非常信号用具や停止表示器材などを車に積んでいることを確かめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>運転する前には、非常信号用具や停止表示器材（停止表示板又は停止表示灯）などを車に積んでいることを確かめます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車を運転する前には、必ず次のことを確かめましよう。","ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。","イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。","ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。","エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。","オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））","を付けていること。","カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。","キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。"]}],"section":"G03-4","fixed":true},{"id":"G04-01","subject":"学科","chapter":"G04","text":"\u003cp>交通量の多いところでは、車の乗り降りは左側のドアからするようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>乗り降りするときは、後方からの車の有無を確かめ、交通量の多いところでは左側のドアから乗り降りします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節1（1） 車の乗り降り","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=41","site":"警察庁の教則の全文（PDF）","lines":["（1）乗り降りするときは、周囲の状況、特に後方からの車の有無を確かめ、交通量の多いところでは左側のドアから乗り降りしましよう。乗つてからドアを閉めるときは、少し手前で一度止め、力を入れて閉めるようにしましよう。また、降りるためにドアを開けるときは、まず少し開けて一度止め、安全を確かめてから降りましよう。降りるときの最初に少し開ける動作は、他の交通への合図にもなります。"]}],"section":"G04-1","fixed":true},{"id":"G04-02","subject":"学科","chapter":"G04","text":"\u003cp>車から降りるときは、後ろから来る車に早く気付いてもらうため、ドアを一気に大きく開けてから降りるようにする。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>降りるためにドアを開けるときは、まず少し開けて一度止め、安全を確かめてから降ります。最初に少し開ける動作は、ほかの交通への合図にもなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節1（1） 車の乗り降り","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=41","site":"警察庁の教則の全文（PDF）","lines":["（1）乗り降りするときは、周囲の状況、特に後方からの車の有無を確かめ、交通量の多いところでは左側のドアから乗り降りしましよう。乗つてからドアを閉めるときは、少し手前で一度止め、力を入れて閉めるようにしましよう。また、降りるためにドアを開けるときは、まず少し開けて一度止め、安全を確かめてから降りましよう。降りるときの最初に少し開ける動作は、他の交通への合図にもなります。"]}],"section":"G04-1","fixed":true},{"id":"G04-03","subject":"学科","chapter":"G04","text":"\u003cp>シートの前後の位置は、クラッチを踏み込んだとき、ひざが伸び切るように合わせる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>シートの前後の位置は、クラッチを踏み込んだとき、ひざがわずかに曲がる状態に合わせます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節2（1） 運転姿勢など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=41","site":"警察庁の教則の全文（PDF）","lines":["（1）ゆとりのある正しい運転姿勢は、安全運転の第一歩です。シートの前後の位置は、クラッチを踏み込んだとき、ひざがわずかに曲がる状態に合わせ、シートの背は、ハンドルに両手を掛けたとき、ひじがわずかに曲がる状態に合わせることが大切です。体を斜めにして運転するのはやめましよう。"]}],"section":"G04-1","fixed":true},{"id":"G04-04","subject":"学科","chapter":"G04","text":"\u003cp>げたやハイヒールなどを履いて運転してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>運転するときは活動しやすい服装をし、げたやハイヒールなどを履いて運転してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節2（2） 運転姿勢など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=41","site":"警察庁の教則の全文（PDF）","lines":["（2）運転するときは、活動しやすいような服装をしましよう。また、げたやハイヒールなどを履いて運転したりしてはいけません。"]}],"section":"G04-1","fixed":true},{"id":"G04-05","subject":"学科","chapter":"G04","text":"\u003cp>自動車が走っている間に、携帯電話を手に持って通話してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動車等が停止しているときを除き、手で持たなければ使えない携帯電話などを通話のために使用してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第71条第5号の5","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71-Pr_1-It_5_5","lines":["車両等の運転者は、次に掲げる事項を守らなければならない。","五の五　自動車、原動機付自転車又は自転車（以下この号において「自動車等」という。）を運転する場合においては、当該自動車等が停止しているときを除き、携帯電話用装置、自動車電話用装置その他の無線通話装置（その全部又は一部を手で保持しなければ送信及び受信のいずれをも行うことができないものに限る。第百十八条第一項第四号において「無線通話装置」という。）を通話（傷病者の救護又は公共の安全の維持のため当該自動車等の走行中に緊急やむを得ずに行うものを除く。同号において同じ。）のために使用し、又は当該自動車等に取り付けられ若しくは持ち込まれた画像表示用装置（道路運送車両法第四十一条第一項第十六号若しくは第十七号又は第四十四条第十一号に規定する装置であるものを除く。第百十八条第一項第四号において同じ。）に表示された画像を注視しないこと。"]},{"label":"交通の方法に関する教則 第5章第1節2（4） 運転姿勢など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=41","site":"警察庁の教則の全文（PDF）","lines":["（4）走行中にスマートフォンなどの携帯電話などを使用したり、カーナビゲーション装置などに表示された画像を注視したりすることにより、周囲の交通の状況などに対する注意が不十分になると大変危険です。自動運転車において自動運行装置を適切に使つている場合を除き、走行中はスマートフォンなどの携帯電話などを使用したり、カーナビゲーション装置などに表示された画像を注視したりしてはいけません。また、スマートフォンなどの携帯電話などについては、運転する前に電源を切つたり、ドライブモードに設定したりするなどして呼出音が鳴らないようにしましよう。"]}],"section":"G04-1","fixed":true},{"id":"G04-06","subject":"学科","chapter":"G04","text":"\u003cp>シートベルトを備えた自動車では、運転者が着用すればよく、後部座席の同乗者には着用させなくてもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転者自身が着用するとともに、助手席や後部座席の同乗者にも着用させなければなりません（病気などやむを得ない理由がある場合を除く）。\u003c/p>","refs":[{"label":"道路交通法 第71条の3第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71_3-Pr_2","lines":["自動車の運転者は、座席ベルトを装着しない者を運転者席以外の乗車装置（当該乗車装置につき座席ベルトを備えなければならないこととされているものに限る。以下この項において同じ。）に乗車させて自動車を運転してはならない。ただし、幼児（適切に座席ベルトを装着させるに足りる座高を有するものを除く。以下この条において同じ。）を当該乗車装置に乗車させるとき、疾病のため座席ベルトを装着させることが療養上適当でない者を当該乗車装置に乗車させるとき、その他政令で定めるやむを得ない理由があるときは、この限りでない。"]},{"label":"交通の方法に関する教則 第5章第1節3（1） シートベルトの着用","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=42","site":"警察庁の教則の全文（PDF）","lines":["（1）シートベルトは、交通事故に遭つた場合の被害を大幅に軽減するとともに、正しい運転姿勢を保たせることにより疲労を軽減するなど、さまざまな効果があります。シートベルトを備えている自動車を運転するときは、運転者自身がこれを着用するとともに、助手席や後部座席の同乗者にもこれを着用させなければなりません（その自動車がエアバッグを備えている場合も同じです。）。しかし、病気などやむを得ない理由がある場合は別です。"]}],"section":"G04-2","fixed":true},{"id":"G04-07","subject":"学科","chapter":"G04","text":"\u003cp>エアバッグを備えている自動車では、シートベルトを着用しなくてもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>エアバッグを備えている自動車でも、運転者も同乗者もシートベルトを着用しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節3（1） シートベルトの着用","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=42","site":"警察庁の教則の全文（PDF）","lines":["（1）シートベルトは、交通事故に遭つた場合の被害を大幅に軽減するとともに、正しい運転姿勢を保たせることにより疲労を軽減するなど、さまざまな効果があります。シートベルトを備えている自動車を運転するときは、運転者自身がこれを着用するとともに、助手席や後部座席の同乗者にもこれを着用させなければなりません（その自動車がエアバッグを備えている場合も同じです。）。しかし、病気などやむを得ない理由がある場合は別です。"]}],"section":"G04-2","fixed":true},{"id":"G04-08","subject":"学科","chapter":"G04","text":"\u003cp>シートベルトの腰ベルトは骨盤を巻くようにしっかり締め、肩ベルトは首にかからないようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>腰ベルトは骨盤を巻くようにしっかり締め、三点式の肩ベルトは首にかからないようにします。肩ベルトのたるみにも注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節3（2） シートベルトの着用","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=42","site":"警察庁の教則の全文（PDF）","lines":["（2）シートベルトは、正しく着用しましよう。正しい着用の方法は次のとおりです。","アシートの背は倒さずに、シートに深く腰掛けましよう。","イ腰ベルトは骨盤を巻くように、しつかり締めましよう。","ウ肩ベルト（三点式ベルトの場合）は、首にかからないようにしましよう。また、肩ベルトがたるんでいると事故の際危険ですので注意しましよう。","エバックルの金具は確実に差し込み、シートベルトが外れないようにしましよう。","オベルトがねじれていないかどうか確認しましよう。"]}],"section":"G04-2","fixed":true},{"id":"G04-09","subject":"学科","chapter":"G04","text":"\u003cp>妊娠中は、おなかを圧迫しないよう、シートベルトは腰ベルトだけを着用する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>妊娠中は、腰ベルトのみの着用は行わず、腰ベルトと肩ベルトを共に着用し、大きくなった腹部をベルトが横切らないようにします。着用が適当かどうかは医師に確認します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節3（3） シートベルトの着用","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=42","site":"警察庁の教則の全文（PDF）","lines":["（3）妊娠中のシートベルトの着用妊娠中であつても、シートベルトを正しく着用することにより、交通事故に遭つた際の被害から母体と胎児を守ることができます。ただし、妊娠の状態は個人により異なりますので、シートベルトを着用することが健康保持上適当かどうか、医師に確認するようにしましよう。","妊娠中は、事故などの際の胎児への影響を少なくするために、腰ベルトのみの着用は行わず、腰ベルトと肩ベルトを共に着用するとともに、大きくなつた腹部をベルトが横切らないようにするなど、正しくシートベルトを着用することが必要です。"]}],"section":"G04-2","fixed":true},{"id":"G04-10","subject":"学科","chapter":"G04","text":"\u003cp>幼児を自動車に乗せるときは、その幼児の発育の程度に応じた形状のチャイルドシートを使用させなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>幼児を乗せるときは、発育の程度に応じた形状のチャイルドシート（幼児用補助装置）を使用させなければなりません（病気などやむを得ない理由がある場合を除く）。\u003c/p>","refs":[{"label":"道路交通法 第71条の3第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71_3-Pr_3","lines":["自動車の運転者は、幼児用補助装置（幼児を乗車させる際座席ベルトに代わる機能を果たさせるため座席に固定して用いる補助装置であつて、道路運送車両法第三章及びこれに基づく命令の規定に適合し、かつ、幼児の発育の程度に応じた形状を有するものをいう。以下この項において同じ。）を使用しない幼児を乗車させて自動車を運転してはならない。ただし、疾病のため幼児用補助装置を使用させることが療養上適当でない幼児を乗車させるとき、その他政令で定めるやむを得ない理由があるときは、この限りでない。"]},{"label":"交通の方法に関する教則 第5章第1節4（1） チャイルドシートの使用","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=43","site":"警察庁の教則の全文（PDF）","lines":["（1）チャイルドシートは、交通事故に遭つた場合の被害を大幅に軽減するとともに、子供が運転操作の支障となることを防止する効果もありますので、シートベルトを適切に着用させることができない子供にはチャイルドシートを使用させましよう。","特に、幼児を自動車に乗せるときは、その幼児に発育の程度に応じた形状のチャイルドシートを使用させなければなりません。しかし、病気などやむを得ない理由がある場合は別です。"]}],"section":"G04-2","fixed":true},{"id":"G04-11","subject":"学科","chapter":"G04","text":"\u003cp>車に乗る前に、車の前後に人がいないか、車の下に子供がいないかを確かめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>発進に当たっての安全確認として、車に乗る前に、車の前後や車の下を確かめます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節5（1） 発進に当たつての安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=43","site":"警察庁の教則の全文（PDF）","lines":["（1）車に乗る前に、車の前後に人がいないか、車の下に子供がいないかを確かめましよう。"]}],"section":"G04-3","fixed":true},{"id":"G04-12","subject":"学科","chapter":"G04","text":"\u003cp>車庫に車を入れるときは、次に出しやすいように、前向きに入れておくのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>バックで発進することは危険なので、車庫などに入れるときは、あらかじめ発進しやすいようにバックで入れておきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第1節5（3） 発進に当たつての安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=43","site":"警察庁の教則の全文（PDF）","lines":["（3）バックで発進することは危険ですから、車庫などに入れるときは、あらかじめ発進しやすいようにバックで入れておきましよう。やむを得ずバックで発進する場合で、後方の見通しがよくない場合や狭い道路から広い道路に出るときは、同乗者などに後方の確認を手伝つてもらいましよう。（平11公安告18・旧４繰下）"]}],"section":"G04-3","fixed":true},{"id":"G04-13","subject":"学科","chapter":"G04","text":"\u003cp>車は、道路の中央（中央線があるときは中央線）から左の部分を通行しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車両は、道路の中央から左の部分（左側部分）を通行しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第17条第4項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_4","lines":["車両は、道路（歩道等と車道の区別のある道路においては、車道。以下第九節の二までにおいて同じ。）の中央（軌道が道路の側端に寄つて設けられている場合においては当該道路の軌道敷を除いた部分の中央とし、道路標識等による中央線が設けられているときはその中央線の設けられた道路の部分を中央とする。以下同じ。）から左の部分（以下「左側部分」という。）を通行しなければならない。"]},{"label":"交通の方法に関する教則 第5章第2節1 道路の左側を走ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=44","site":"警察庁の教則の全文（PDF）","lines":["道路の中央（中央線があるときは、その中央線）から左の部分を通行しなければなりません。しかし、次の場合には、道路の中央から右の部分にはみ出して通行することができますが、この場合でも、（１）の場合のほかは、はみ出し方ができるだけ少なくなるようにしなければなりません。","（1）一方通行となつているとき。","（2）工事などのため左側部分だけでは、通行するのに十分な幅がないとき。","（3）左側部分の幅が６メートル未満の見通しのよい道路でほかの車を追い越そうとするとき（標識（付表３（１）15）や標示（付表３（２）２）で、追越しのため右側の部分にはみ出して通行することが禁止されている場合を除きます。）","（4）こう配の急な道路の曲がり角付近で、「右側通行」の標示（付表３（２）28）があるとき。"]}],"section":"G04-4","fixed":true},{"id":"G04-14","subject":"学科","chapter":"G04","text":"\u003cp>一方通行になっている道路では、道路の中央から右の部分にはみ出して通行することができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>一方通行の道路では、右側部分にはみ出して通行できます。この場合は、はみ出し方を少なくする必要もありません。\u003c/p>","refs":[{"label":"道路交通法 第17条第5項第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_5-It_1","lines":["一　当該道路が一方通行（道路における車両の通行につき一定の方向にする通行が禁止されていることをいう。以下同じ。）となつているとき。"]}],"section":"G04-4","fixed":true},{"id":"G04-15","subject":"学科","chapter":"G04","text":"\u003cp>左側部分の幅が 6 メートル以上ある見通しのよい道路では、追い越すために道路の右側部分にはみ出して通行することができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>追越しのために右側部分にはみ出せるのは、左側部分の幅が 6 メートルに満たない道路で、右側部分を見通すことができ、対向の交通を妨げるおそれがないときです。\u003c/p>","refs":[{"label":"道路交通法 第17条第5項第4号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_5-It_4","lines":["四　当該道路の左側部分の幅員が六メートルに満たない道路において、他の車両を追い越そうとするとき（当該道路の右側部分を見とおすことができ、かつ、反対の方向からの交通を妨げるおそれがない場合に限るものとし、道路標識等により追越しのため右側部分にはみ出して通行することが禁止されている場合を除く。）。"]}],"section":"G04-4","fixed":true},{"id":"G04-16","subject":"学科","chapter":"G04","text":"\u003cp>車両通行帯のない道路では、追越しなどのとき以外でも、道路の中央寄りを通行するのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>車両通行帯のない道路では、追越しなどでやむを得ない場合のほかは、自動車は道路の左側に寄って通行します。\u003c/p>","refs":[{"label":"道路交通法 第18条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_18-Pr_1","lines":["車両（トロリーバスを除く。）は、車両通行帯の設けられた道路を通行する場合を除き、自動車及び一般原動機付自転車（原動機付自転車のうち第二条第一項第十号イに該当するものをいう。以下同じ。）にあつては道路の左側に寄つて、特定小型原動機付自転車及び軽車両（以下「特定小型原動機付自転車等」という。）にあつては道路の左側端に寄つて、それぞれ当該道路を通行しなければならない。ただし、追越しをするとき、第二十五条第二項若しくは第三十四条第二項若しくは第四項の規定により道路の中央若しくは右側端に寄るとき、又は道路の状況その他の事情によりやむを得ないときは、この限りでない。"]},{"label":"交通の方法に関する教則 第5章第2節2（1） 道路の左寄りに走ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=44","site":"警察庁の教則の全文（PDF）","lines":["（1）車両通行帯（車線やレーンともいいます。）のない道路では、追越しなどでやむを得ない場合のほかは、道路の左に寄つて通行しなければなりません。"]}],"section":"G04-5","fixed":true},{"id":"G04-17","subject":"学科","chapter":"G04","text":"\u003cp>同じ方向に車両通行帯が 2 つある道路では、速度の速い車は、追越しをしないときでも右側の車両通行帯を通行してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>同一の方向に二つの車両通行帯があるときは、左側の車両通行帯を通行しなければなりません。右側の車両通行帯は、追越しなどのときに使います。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節2（2） 道路の左寄りに走ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=44","site":"警察庁の教則の全文（PDF）","lines":["（2）同一の方向に二つの車両通行帯があるときは、左側の車両通行帯を通行しなければなりません。また、三つ以上の車両通行帯があるときは、最も右側の車両通行帯は追越しのために空けておき、それ以外の車両通行帯を通行することができます。この場合には、速度の遅い車が左側、速度が速くなるにつれて順次右側寄りの車両通行帯を通行しましよう。しかし、標識（付表３（１）32、32の２、32の３、33、33の２、34の２）や標示（付表３（２）14、14の２、14の３、15、16の２）によつて通行区分が示されているときは、それに従わなければなりません。"]}],"section":"G04-5","fixed":true},{"id":"G04-18","subject":"学科","chapter":"G04","text":"\u003cp>同じ方向に 3 つ以上の車両通行帯がある道路では、最も右側の車両通行帯は追越しのために空けておき、それ以外の車両通行帯を通行することができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>三つ以上の車両通行帯があるときは、最も右側は追越しのために空けておき、それ以外を通行できます。速度の遅い車ほど左側を通行します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節2（2） 道路の左寄りに走ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=44","site":"警察庁の教則の全文（PDF）","lines":["（2）同一の方向に二つの車両通行帯があるときは、左側の車両通行帯を通行しなければなりません。また、三つ以上の車両通行帯があるときは、最も右側の車両通行帯は追越しのために空けておき、それ以外の車両通行帯を通行することができます。この場合には、速度の遅い車が左側、速度が速くなるにつれて順次右側寄りの車両通行帯を通行しましよう。しかし、標識（付表３（１）32、32の２、32の３、33、33の２、34の２）や標示（付表３（２）14、14の２、14の３、15、16の２）によつて通行区分が示されているときは、それに従わなければなりません。"]},{"label":"道路交通法 第20条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_20-Pr_1","lines":["車両は、車両通行帯の設けられた道路においては、道路の左側端から数えて一番目の車両通行帯を通行しなければならない。ただし、自動車（小型特殊自動車及び道路標識等によつて指定された自動車を除く。）は、当該道路の左側部分（当該道路が一方通行となつているときは、当該道路）に三以上の車両通行帯が設けられているときは、政令で定めるところにより、その速度に応じ、その最も右側の車両通行帯以外の車両通行帯を通行することができる。"]}],"section":"G04-5","fixed":true},{"id":"G04-19","subject":"学科","chapter":"G04","text":"\u003cp>追越しのために最も右側の車両通行帯を通行したときは、前の車を追い越し終わったら、速やかにそれ以外の車両通行帯に戻らなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>最も右側の車両通行帯を追越しのため通行した場合でも、追い越し終わったときは、速やかにそれ以外の車両通行帯に戻ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節2（3） 道路の左寄りに走ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=44","site":"警察庁の教則の全文（PDF）","lines":["（3）追越しのため最も右側の車両通行帯を通行する場合であつても、前の車を追い越し終わつたときは、速やかにそれ以外の車両通行帯に戻らなければなりません。"]}],"section":"G04-5","fixed":true},{"id":"G04-20","subject":"学科","chapter":"G04","text":"\u003cp>車両通行帯のある道路では、前の車が遅いときは、追越しのとき以外でも、空いている車両通行帯にこまめに移って通行するのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>車両通行帯をみだりに変えて通行すると、後続車の迷惑となり、事故の原因にもなるので、同一の車両通行帯を通行します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節3 車線を変えずに走ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=45","site":"警察庁の教則の全文（PDF）","lines":["車両通行帯のある道路では、追越しなどでやむを得ない場合のほかは、車両通行帯からはみ出したり、二つの車両通行帯にまたがつたりして通行してはいけません。また、車両通行帯をみだりに変えて通行すると、後続車の迷惑となり、ひいては事故の原因ともなりますから、同一の車両通行帯を通行しなければなりません。"]}],"section":"G04-5","fixed":true},{"id":"G04-21","subject":"学科","chapter":"G04","text":"\u003cp>交差点やその付近で緊急自動車が近づいてきたときは、交差点を避け、道路の左側に寄って一時停止しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>交差点又はその付近では、交差点を避け、かつ、道路の左側に寄って一時停止しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第40条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_7-At_40-Pr_1","lines":["交差点又はその附近において、緊急自動車が接近してきたときは、路面電車は交差点を避けて、車両（緊急自動車を除く。以下この条において同じ。）は交差点を避け、かつ、道路の左側（一方通行となつている道路においてその左側に寄ることが緊急自動車の通行を妨げることとなる場合にあつては、道路の右側。次項において同じ。）に寄つて一時停止しなければならない。"]}],"section":"G04-6","fixed":true},{"id":"G04-22","subject":"学科","chapter":"G04","text":"\u003cp>交差点やその付近ではない場所で緊急自動車が近づいてきたときは、その場ですぐに停止しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>交差点やその付近以外の場所では、道路の左側に寄って、緊急自動車に進路を譲ります。必ずしも停止する必要はありません。\u003c/p>","refs":[{"label":"道路交通法 第40条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_7-At_40-Pr_2","lines":["前項以外の場所において、緊急自動車が接近してきたときは、車両は、道路の左側に寄つて、これに進路を譲らなければならない。"]}],"section":"G04-6","fixed":true},{"id":"G04-23","subject":"学科","chapter":"G04","text":"\u003cp>一方通行の道路で、左側に寄るとかえって緊急自動車の妨げになるときは、道路の右側に寄る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>一方通行の道路で左側に寄ると、かえって緊急自動車の妨げとなるようなときは、右側に寄ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節5 緊急自動車の優先","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=45","site":"警察庁の教則の全文（PDF）","lines":["緊急自動車が近づいてきたときは、交差点の付近では、交差点を避けて、道路の左側に寄つて一時停止をし、その他のところでは、道路の左側に寄つて進路を譲らなければなりません。しかし、一方通行の道路で左側に寄ると、かえつて緊急自動車の妨げとなるようなときは、右側に寄らなければなりません。"]},{"label":"道路交通法 第40条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_7-At_40-Pr_1","lines":["交差点又はその附近において、緊急自動車が接近してきたときは、路面電車は交差点を避けて、車両（緊急自動車を除く。以下この条において同じ。）は交差点を避け、かつ、道路の左側（一方通行となつている道路においてその左側に寄ることが緊急自動車の通行を妨げることとなる場合にあつては、道路の右側。次項において同じ。）に寄つて一時停止しなければならない。"]}],"section":"G04-6","fixed":true},{"id":"G04-24","subject":"学科","chapter":"G04","text":"\u003cp>停留所で止まっていた路線バスが発進の合図をしても、後ろの車は、速度を変えずにそのまま進んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>停留所で止まっている路線バスなどが発進の合図をしたときは、後方の車はその発進を妨げてはいけません。急ブレーキや急ハンドルで避けなければならない場合は別です。\u003c/p>","refs":[{"label":"道路交通法 第31条の2","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_31_2","lines":["（乗合自動車の発進の保護）","第三十一条の二　停留所において乗客の乗降のため停車していた乗合自動車が発進するため進路を変更しようとして手又は方向指示器により合図をした場合においては、その後方にある車両は、その速度又は方向を急に変更しなければならないこととなる場合を除き、当該合図をした乗合自動車の進路の変更を妨げてはならない。"]},{"label":"交通の方法に関する教則 第5章第2節6（1） 路線バスなどの優先","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=45","site":"警察庁の教則の全文（PDF）","lines":["（1）停留所で止まつている路線バスなどが方向指示器などで発進の合図をしたときは、後方の車はその発進を妨げてはいけません。しかし、急ブレーキや急ハンドルで避けなければならないような場合は別です。"]}],"section":"G04-6","fixed":true},{"id":"G04-25","subject":"学科","chapter":"G04","text":"\u003cp>路線バスなどの優先通行帯を通行しているときに、路線バスなどが近づいてきても、そのまま通行を続けてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>優先通行帯を通行している自動車は、路線バスなどが近づいてきたときは、速やかにそこから出なければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節6（3） 路線バスなどの優先","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=45","site":"警察庁の教則の全文（PDF）","lines":["（3）標識（付表３（１）34）や標示（付表３（２）16）によつて路線バスなどの優先通行帯が指定されている道路では、優先通行帯を通行している自動車は、路線バスなどが近づいてきたときは、速やかにそこから出なければなりません。また、交通が混雑していて、路線バスなどが近づいてきてもそこから出られなくなるおそれがあるときは、はじめからその通行帯を通行してはいけません。しかし、右左折をするため道路の右端、中央や左端に寄る場合などや工事などでやむを得ない場合は別です。"]}],"section":"G04-6","fixed":true},{"id":"G04-26","subject":"学科","chapter":"G04","text":"\u003cp>交通が混雑していて、路線バスなどが近づいてきても優先通行帯から出られなくなるおそれがあるときは、はじめからその通行帯を通行してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>混雑していて、路線バスなどが近づいても出られなくなるおそれがあるときは、はじめから優先通行帯を通行してはいけません（右左折のためなどを除く）。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節6（3） 路線バスなどの優先","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=45","site":"警察庁の教則の全文（PDF）","lines":["（3）標識（付表３（１）34）や標示（付表３（２）16）によつて路線バスなどの優先通行帯が指定されている道路では、優先通行帯を通行している自動車は、路線バスなどが近づいてきたときは、速やかにそこから出なければなりません。また、交通が混雑していて、路線バスなどが近づいてきてもそこから出られなくなるおそれがあるときは、はじめからその通行帯を通行してはいけません。しかし、右左折をするため道路の右端、中央や左端に寄る場合などや工事などでやむを得ない場合は別です。"]}],"section":"G04-6","fixed":true},{"id":"G04-27","subject":"学科","chapter":"G04","text":"\u003cp>道路に面したガソリンスタンドに入るために歩道を横切るときは、歩道に入る直前で一時停止し、歩行者の通行を妨げないようにしなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路外の施設に出入りするため歩道等を横断するときは、歩道等に入る直前で一時停止し、かつ、歩行者の通行を妨げないようにしなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第17条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_2","lines":["前項ただし書の場合において、車両は、歩道等に入る直前で一時停止し、かつ、歩行者の通行を妨げないようにしなければならない。"]}],"section":"G04-7","fixed":true},{"id":"G04-28","subject":"学科","chapter":"G04","text":"\u003cp>歩道や路側帯のない道路では、路端から 0.5 メートルの部分（路肩）にはみ出して通行してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>歩道や路側帯のない道路を通行するときは、路肩（路端から 0.5 メートルの部分）にはみ出して通行してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節7（4） 通行してはいけないところ","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=46","site":"警察庁の教則の全文（PDF）","lines":["（4）歩道や路側帯のない道路を通行するときは、路肩（路端から０.５メートルの部分）にはみ出して通行してはいけません。"]}],"section":"G04-7","fixed":true},{"id":"G04-29","subject":"学科","chapter":"G04","text":"\u003cp>安全地帯に歩行者がいないときは、車が安全地帯に入って通行してもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>歩行者がいるかどうかに関係なく、車両は安全地帯に入ってはいけません。\u003c/p>","refs":[{"label":"道路交通法 第17条第6項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_6","lines":["車両は、安全地帯又は道路標識等により車両の通行の用に供しない部分であることが表示されているその他の道路の部分に入つてはならない。"]},{"label":"交通の方法に関する教則 第5章第2節7（3） 通行してはいけないところ","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=46","site":"警察庁の教則の全文（PDF）","lines":["（3）安全地帯や「立入り禁止部分」の標示（付表３（２）７）によつて車の通行が禁止されている場所に入つてはいけません。"]}],"section":"G04-7","fixed":true},{"id":"G04-30","subject":"学科","chapter":"G04","text":"\u003cp>路面電車の軌道敷内は、右折する場合や、標識で通行が認められた車の場合などを除き、通行してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>軌道敷内を通行してはいけません。「軌道敷内通行可」の標識によって認められた車が通行する場合や、右折する場合などは別です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第2節7（5） 通行してはいけないところ","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=46","site":"警察庁の教則の全文（PDF）","lines":["（5）軌道敷内を通行してはいけません。しかし、「軌道敷内通行可」の標識（付表３（１）52）によつて認められた車が通行する場合や右折する場合などは別です。"]}],"section":"G04-7","fixed":true},{"id":"G05-01","subject":"学科","chapter":"G05","text":"\u003cp>歩行者のそばを通るときは、警音器を鳴らして知らせれば、安全な間隔を空けたり徐行したりしなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>歩行者の側方を通過するときは、歩行者との間に安全な間隔を保つか、徐行しなければなりません。警音器で知らせても、このきまりは変わりません。\u003c/p>","refs":[{"label":"道路交通法 第18条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_18-Pr_2","lines":["車両は、前項の規定により歩道と車道の区別のない道路を通行する場合その他の場合において、歩行者の側方を通過するときは、これとの間に安全な間隔を保ち、又は徐行しなければならない。"]},{"label":"交通の方法に関する教則 第5章第3節1（1） 歩行者のそばを通るとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=46","site":"警察庁の教則の全文（PDF）","lines":["（1）歩行者のそばを通るときは、歩行者との間に安全な間隔を空けるか、徐行しなければなりません。"]}],"section":"G05-1","fixed":true},{"id":"G05-02","subject":"学科","chapter":"G05","text":"\u003cp>歩行者がいる安全地帯のそばを通るときは、安全な間隔を空ければ、徐行しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>歩行者がいる安全地帯のそばを通るときは、徐行しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節1（2） 歩行者のそばを通るとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=46","site":"警察庁の教則の全文（PDF）","lines":["（2）歩行者がいる安全地帯のそばを通るときは、徐行しなければなりません。"]}],"section":"G05-1","fixed":true},{"id":"G05-03","subject":"学科","chapter":"G05","text":"\u003cp>停留所で乗客が乗り降りしている路面電車に追いついたときは、乗り降りする人や横断する人がいなくなるまで、路面電車の後方で停止して待たなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>乗客の乗降のため停車中の路面電車に追いついたときは、乗り降りや横断する人がいなくなるまで、路面電車の後方で停止しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第31条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_31","lines":["（停車中の路面電車がある場合の停止又は徐行）","第三十一条　車両は、乗客の乗降のため停車中の路面電車に追いついたときは、当該路面電車の乗客が乗降を終わり、又は当該路面電車から降りた者で当該車両の前方において当該路面電車の左側を横断し、若しくは横断しようとしているものがいなくなるまで、当該路面電車の後方で停止しなければならない。ただし、路面電車に乗降する者の安全を図るため設けられた安全地帯があるとき、又は当該路面電車に乗降する者がいない場合において当該路面電車の左側に当該路面電車から一・五メートル以上の間隔を保つことができるときは、徐行して当該路面電車の左側を通過することができる。"]}],"section":"G05-1","fixed":true},{"id":"G05-04","subject":"学科","chapter":"G05","text":"\u003cp>停留所で止まっている路面電車に乗り降りする人がいないときは、路面電車との間に 1 メートルの間隔が空けられれば、徐行して通過することができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>乗り降りする人がいないときに徐行して通過できるのは、路面電車との間に 1.5 メートル以上の間隔を保てるときです（安全地帯があるときも徐行して通過できます）。\u003c/p>","refs":[{"label":"道路交通法 第31条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_31","lines":["（停車中の路面電車がある場合の停止又は徐行）","第三十一条　車両は、乗客の乗降のため停車中の路面電車に追いついたときは、当該路面電車の乗客が乗降を終わり、又は当該路面電車から降りた者で当該車両の前方において当該路面電車の左側を横断し、若しくは横断しようとしているものがいなくなるまで、当該路面電車の後方で停止しなければならない。ただし、路面電車に乗降する者の安全を図るため設けられた安全地帯があるとき、又は当該路面電車に乗降する者がいない場合において当該路面電車の左側に当該路面電車から一・五メートル以上の間隔を保つことができるときは、徐行して当該路面電車の左側を通過することができる。"]}],"section":"G05-1","fixed":true},{"id":"G05-05","subject":"学科","chapter":"G05","text":"\u003cp>水たまりのあるところでは、泥や水をはねて歩行者に迷惑を掛けないよう、徐行するなどして注意して通らなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>ぬかるみや水たまりを通行するときは、徐行するなどして、泥や汚水などを飛び散らせて他人に迷惑を掛けないようにします。\u003c/p>","refs":[{"label":"道路交通法 第71条第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71-Pr_1-It_1","lines":["車両等の運転者は、次に掲げる事項を守らなければならない。","一　ぬかるみ又は水たまりを通行するときは、泥よけ器を付け、又は徐行する等して、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにすること。"]},{"label":"交通の方法に関する教則 第5章第3節1（4） 歩行者のそばを通るとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=46","site":"警察庁の教則の全文（PDF）","lines":["（4）ぬかるみや水たまりのあるところでは、泥や水をはねて他人に迷惑を掛けないように徐行するなど注意して通らなければなりません。"]}],"section":"G05-1","fixed":true},{"id":"G05-06","subject":"学科","chapter":"G05","text":"\u003cp>横断歩道に近づいたときは、横断しようとする人がいるかどうか分からなくても、速度を落とさずに進んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>横断歩道や自転車横断帯に近づいたときは、横断する人や自転車がいないことが明らかな場合のほかは、手前で停止できるように速度を落として進みます。\u003c/p>","refs":[{"label":"道路交通法 第38条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6_2-At_38-Pr_1","lines":["車両等は、横断歩道又は自転車横断帯（以下この条において「横断歩道等」という。）に接近する場合には、当該横断歩道等を通過する際に当該横断歩道等によりその進路の前方を横断しようとする歩行者又は自転車（以下この条において「歩行者等」という。）がないことが明らかな場合を除き、当該横断歩道等の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止することができるような速度で進行しなければならない。この場合において、横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、当該横断歩道等の直前で一時停止し、かつ、その通行を妨げないようにしなければならない。"]},{"label":"交通の方法に関する教則 第5章第3節2（2） 歩行者が横断しているときなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["（2）横断歩道や自転車横断帯に近づいたときは、横断する人や自転車がいないことが明らかな場合のほかは、その手前で停止できるように速度を落として進まなければなりません。また、歩行者や自転車が横断しているときや横断しようとしているときは、横断歩道や自転車横断帯の手前（停止線があるときは、その手前）で一時停止をして歩行者や自転車に道を譲らなければなりません。"]}],"section":"G05-2","fixed":true},{"id":"G05-07","subject":"学科","chapter":"G05","text":"\u003cp>横断歩道を歩行者が横断しようとしているときは、歩行者がまだ横断を始めていなくても、横断歩道の手前で一時停止して道を譲らなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>歩行者が横断しているときだけでなく、横断しようとしているときも、横断歩道の手前（停止線があればその手前）で一時停止し、通行を妨げないようにします。\u003c/p>","refs":[{"label":"道路交通法 第38条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6_2-At_38-Pr_1","lines":["車両等は、横断歩道又は自転車横断帯（以下この条において「横断歩道等」という。）に接近する場合には、当該横断歩道等を通過する際に当該横断歩道等によりその進路の前方を横断しようとする歩行者又は自転車（以下この条において「歩行者等」という。）がないことが明らかな場合を除き、当該横断歩道等の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止することができるような速度で進行しなければならない。この場合において、横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、当該横断歩道等の直前で一時停止し、かつ、その通行を妨げないようにしなければならない。"]}],"section":"G05-2","fixed":true},{"id":"G05-08","subject":"学科","chapter":"G05","text":"\u003cp>横断歩道の手前で止まっている車があるときは、そのそばを通って前方に出る前に、一時停止しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>横断歩道等やその手前で停止している車両等があるとき、その側方を通って前方に出ようとするときは、その前方に出る前に一時停止しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第38条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6_2-At_38-Pr_2","lines":["車両等は、横断歩道等（当該車両等が通過する際に信号機の表示する信号又は警察官等の手信号等により当該横断歩道等による歩行者等の横断が禁止されているものを除く。次項において同じ。）又はその手前の直前で停止している車両等がある場合において、当該停止している車両等の側方を通過してその前方に出ようとするときは、その前方に出る前に一時停止しなければならない。"]},{"label":"交通の方法に関する教則 第5章第3節2（3） 歩行者が横断しているときなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["（3）横断歩道や自転車横断帯やその手前で止まつている車があるときは、そのそばを通つて前方に出る前に一時停止をしなければなりません。"]}],"section":"G05-2","fixed":true},{"id":"G05-09","subject":"学科","chapter":"G05","text":"\u003cp>横断歩道とその手前から 30 メートル以内の場所では、ほかの車を追い越すことは禁止されているが、追い抜くことは禁止されていない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>横断歩道や自転車横断帯とその手前から 30 メートル以内の場所では、追い越しも追い抜きもしてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第38条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6_2-At_38-Pr_3","lines":["車両等は、横断歩道等及びその手前の側端から前に三十メートル以内の道路の部分においては、第三十条第三号の規定に該当する場合のほか、その前方を進行している他の車両等（特定小型原動機付自転車等を除く。）の側方を通過してその前方に出てはならない。"]},{"label":"交通の方法に関する教則 第5章第3節2（4） 歩行者が横断しているときなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["（4）横断歩道や自転車横断帯とその手前から30メートル以内の場所では、ほかの車を追い越したり、追い抜いたりしてはいけません。"]}],"section":"G05-2","fixed":true},{"id":"G05-10","subject":"学科","chapter":"G05","text":"\u003cp>横断歩道のない交差点やその近くを歩行者が横断しているときは、その通行を妨げてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>横断歩道のない交差点やその近くを歩行者が横断しているときは、その通行を妨げてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節2（1） 歩行者が横断しているときなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["（1）横断歩道のない交差点やその近くを歩行者が横断しているときは、その通行を妨げてはいけません。"]}],"section":"G05-2","fixed":true},{"id":"G05-11","subject":"学科","chapter":"G05","text":"\u003cp>盲導犬を連れた人が歩いているときは、警音器を鳴らして注意を促せば、そのままの速度で通過してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>白や黄のつえを持った人や盲導犬を連れた人が歩いているときは、一時停止か徐行をして、安全に通れるようにしなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節3 身体の不自由な人の保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["身体障害者用の車で通行している人がいる場合や白や黄のつえを持つた人や盲導犬を連れた人が歩いている場合には、一時停止か徐行をして、これらの人が安全に通れるようにしなければなりません。"]}],"section":"G05-3","fixed":true},{"id":"G05-12","subject":"学科","chapter":"G05","text":"\u003cp>子供が独りで歩いているときは、警音器を鳴らして注意を促せば、そのままの速度で通過してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>子供が独りで歩いている場合には、一時停止か徐行をして、安全に通れるようにしなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節4（1） 子供の保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["（1）子供が独りで歩いている場合には、一時停止か徐行をして、安全に通れるようにしなければなりません。子供は、興味をひくものに夢中になり、突然路上に飛び出したり、判断力が未熟なために、無理に道路を横断しようとしたりすることがあるので、特に注意しましよう。"]}],"section":"G05-3","fixed":true},{"id":"G05-13","subject":"学科","chapter":"G05","text":"\u003cp>止まっている通学通園バスのそばを通るときは、安全な間隔を空ければ、徐行しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>児童や幼児の乗降のため停車している通学通園バスの側方を通過するときは、徐行して安全を確認しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第71条第2号の3","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71-Pr_1-It_2_3","lines":["車両等の運転者は、次に掲げる事項を守らなければならない。","二の三　児童、幼児等の乗降のため、政令で定めるところにより停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、徐行して安全を確認すること。"]},{"label":"交通の方法に関する教則 第5章第3節4（2） 子供の保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=47","site":"警察庁の教則の全文（PDF）","lines":["（2）止まつている通学通園バスのそばを通るときは、徐行して安全を確かめなければなりません。"]}],"section":"G05-3","fixed":true},{"id":"G05-14","subject":"学科","chapter":"G05","text":"\u003cp>歩行補助車を使っている高齢者が通行しているときは、一時停止か徐行をして、安全に通れるようにしなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>つえを持って歩いていたり、歩行補助車を使っていたりする、通行に支障のある高齢者が通行しているときは、一時停止か徐行をします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節5 高齢者の保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=48","site":"警察庁の教則の全文（PDF）","lines":["つえを持つて歩いていたり、歩行補助車を使つていたり、その通行に支障のある高齢者が通行している場合には、一時停止か徐行をして、これらの人が安全に通れるようにしなければなりません。高齢者は、加齢に伴う身体の機能の変化により、個人差があるものの、一般的に歩行が遅くなつたり、危険を回避するためにとつさの行動をとることが困難となつたり、危険の発見や回避が遅れがちになつたり、歩行が不安定になつたりするので、特に注意しましよう。また、高齢の歩行者の事故は、高齢者が車の直前又は直後を横断しているときに多く起こつていますので、注意しましよう。"]},{"label":"道路交通法 第71条第2号の2","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71-Pr_1-It_2_2","lines":["車両等の運転者は、次に掲げる事項を守らなければならない。","二の二　前号に掲げるもののほか、高齢の歩行者、身体の障害のある歩行者その他の歩行者でその通行に支障のあるものが通行しているときは、一時停止し、又は徐行して、その通行を妨げないようにすること。"]}],"section":"G05-3","fixed":true},{"id":"G05-15","subject":"学科","chapter":"G05","text":"\u003cp>歩行者用道路は、特に通行を認められた車であれば、歩行者がいないときは徐行しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>歩行者用道路を特に通行を認められた車が通るときは、歩行者に注意して徐行しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節6（1） 歩行者用道路を通行するとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=48","site":"警察庁の教則の全文（PDF）","lines":["（1）歩行者用道路では、沿道に車庫を持つ車などで特に通行を認められた車だけが通行できます。この場合は、特に歩行者に注意して徐行しなければなりません。"]}],"section":"G05-4","fixed":true},{"id":"G05-16","subject":"学科","chapter":"G05","text":"\u003cp>自転車を追い越すためにそのそばを通るときは、自転車のふらつきなどを予想して、安全な間隔を空けるか、徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>追越しのため特定小型原動機付自転車や自転車のそばを通るときは、ふらつきなどを予想し、安全な間隔を空けるか、徐行しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節7（2） 特定小型原動機付自転車や自転車の保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=48","site":"警察庁の教則の全文（PDF）","lines":["（2）追越しのため特定小型原動機付自転車や自転車のそばを通るときは、特定小型原動機付自転車や自転車のふらつきなどを予想し、特定小型原動機付自転車や自転車との間に安全な間隔を空けるか、徐行しなければなりません。"]}],"section":"G05-4","fixed":true},{"id":"G05-17","subject":"学科","chapter":"G05","text":"\u003cp>同じ方向に進んでいる自転車の右側を追い抜くとき、自転車との間に十分な間隔がないときは、間隔に応じた安全な速度で進まなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自転車などの右側を通過する場合に、十分な間隔がないときは、その間隔に応じた安全な速度で進行しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第18条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_18-Pr_3","lines":["車両（特定小型原動機付自転車等を除く。）は、当該車両と同一の方向に進行している特定小型原動機付自転車等（歩道又は自転車道を通行しているものを除く。）の右側を通過する場合（当該特定小型原動機付自転車等を追い越す場合を除く。）において、当該車両と当該特定小型原動機付自転車等との間に十分な間隔がないときは、当該特定小型原動機付自転車等との間隔に応じた安全な速度で進行しなければならない。"]},{"label":"交通の方法に関する教則 第5章第3節7（3） 特定小型原動機付自転車や自転車の保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=48","site":"警察庁の教則の全文（PDF）","lines":["（3）追抜きのため特定小型原動機付自転車や自転車の右側を通過する場合であつて、当該特定小型原動機付自転車や自転車との間に十分な間隔がないときは、それらとの間隔に応じた安全な速度で進行しなければなりません。"]}],"section":"G05-4","fixed":true},{"id":"G05-18","subject":"学科","chapter":"G05","text":"\u003cp>初心者マークを付けた普通自動車が前を走っているときは、危険を避けるためやむを得ない場合のほか、その前方に無理に割り込んではいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>初心者マークを付けた車や仮免許練習中の車などには、危険を避けるためやむを得ない場合のほか、幅寄せをしたり、前方に無理に割り込んだりしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節8（1） 初心運転者などの保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=49","site":"警察庁の教則の全文（PDF）","lines":["（1）危険を避けるためやむを得ない場合のほか、次の車の側方に幅寄せをしたり、前方に無理に割り込んではいけません。","ア準中型免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた準中型自動車","イ準中型免許又は普通免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた普通自動車","ウ70歳以上の高齢者が運転している高齢者マークを付けた普通自動車","エ聴覚障害のある運転者が運転している聴覚障害者マークを付けた準中型自動車又は普通自動車","オ身体の不自由な運転者が運転している身体障害者マークを付けた普通自動車","カ仮免許で練習中の者が運転している自動車"]},{"label":"道路交通法 第71条第5号の4","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71-Pr_1-It_5_4","lines":["車両等の運転者は、次に掲げる事項を守らなければならない。","五の四　自動車を運転する場合において、第七十一条の五第一項から第四項まで若しくは第七十一条の六第一項から第三項までに規定する者又は第八十四条第二項に規定する仮運転免許を受けた者が表示自動車（第七十一条の五第一項、第七十一条の六第一項若しくは第八十七条第三項に規定する標識を付けた準中型自動車又は第七十一条の五第二項から第四項まで、第七十一条の六第二項若しくは第三項若しくは第八十七条第三項に規定する標識を付けた普通自動車をいう。以下この号において同じ。）を運転しているときは、危険防止のためやむを得ない場合を除き、進行している当該表示自動車の側方に幅寄せをし、又は当該自動車が進路を変更した場合にその変更した後の進路と同一の進路を後方から進行してくる表示自動車が当該自動車との間に第二十六条に規定する必要な距離を保つことができないこととなるときは進路を変更しないこと。"]}],"section":"G05-5","fixed":true},{"id":"G05-19","subject":"学科","chapter":"G05","text":"\u003cp>仮免許で練習中の人が運転している自動車には、幅寄せや割込みをしてはいけないというきまりはない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>仮免許で練習中の人が運転している自動車も、幅寄せや無理な割込みをしてはいけない車に含まれます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節8（1） 初心運転者などの保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=49","site":"警察庁の教則の全文（PDF）","lines":["（1）危険を避けるためやむを得ない場合のほか、次の車の側方に幅寄せをしたり、前方に無理に割り込んではいけません。","ア準中型免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた準中型自動車","イ準中型免許又は普通免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた普通自動車","ウ70歳以上の高齢者が運転している高齢者マークを付けた普通自動車","エ聴覚障害のある運転者が運転している聴覚障害者マークを付けた準中型自動車又は普通自動車","オ身体の不自由な運転者が運転している身体障害者マークを付けた普通自動車","カ仮免許で練習中の者が運転している自動車"]}],"section":"G05-5","fixed":true},{"id":"G05-20","subject":"学科","chapter":"G05","text":"\u003cp>聴覚障害者マークを付けた車の運転者は、警音器の音が聞こえないことがあるので、安全に通行できるように配慮する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>聴覚障害者マークを付けた準中型自動車や普通自動車の運転者は、警音器の音が聞こえないことがあるので、安全に通行できるように配慮します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節8（2） 初心運転者などの保護","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=49","site":"警察庁の教則の全文（PDF）","lines":["（2）聴覚障害者マークを付けた準中型自動車又は普通自動車の運転者は警音器の音が聞こえないことがあるので、安全に通行できるように配慮しましよう。"]}],"section":"G05-5","fixed":true},{"id":"G05-21","subject":"学科","chapter":"G05","text":"\u003cp>著しく他人に迷惑を及ぼす騒音を生じさせるような空ぶかしをしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>著しく他人に迷惑を及ぼす騒音を生じさせるような急発進、急加速や空ぶかしをしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第3節10 騒音運転などの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=49","site":"警察庁の教則の全文（PDF）","lines":["著しく他人に迷惑を及ぼす騒音を生じさせるような急発進、急加速や空ぶかしをしてはいけません。"]}],"section":"G05-5","fixed":true},{"id":"G06-01","subject":"学科","chapter":"G06","text":"\u003cp>標識や標示で最高速度が指定されていない、中央線のある一般道路では、自動車の最高速度は時速 60 キロメートルである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>中央線や車両通行帯が設けられている一般道路などでは、自動車の法定の最高速度は時速 60 キロメートルです。\u003c/p>","refs":[{"label":"道路交通法施行令 第11条","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_11","lines":["（最高速度）","第十一条　法第二十二条第一項の政令で定める最高速度（以下この条、次条及び第二十七条において「最高速度」という。）のうち、自動車及び原動機付自転車が高速自動車国道の本線車道（第二十七条の二に規定する本線車道を除く。第一号イ及び第二十七条において同じ。）並びにこれに接する加速車線及び減速車線以外の道路（以下この条及び次条において「一般道路」という。）を通行する場合の最高速度は、自動車にあつては次の各号に掲げる一般道路の区分に応じ当該各号に定める速度、原動機付自転車にあつては三十キロメートル毎時とする。","一　次に掲げる一般道路　六十キロメートル毎時","　イ　高速自動車国道のうち、本線車道並びにこれに接する加速車線及び減速車線以外のもの","　ロ　自動車専用道路","　ハ　道路標識等による中央線又は車両通行帯が設けられている一般道路","　ニ　道路の構造上又は柵その他の内閣府令で定める工作物により自動車の通行が往復の方向別に分離されている一般道路","二　前号に掲げる一般道路以外の一般道路　三十キロメートル毎時"]}],"section":"G06-1","fixed":true},{"id":"G06-02","subject":"学科","chapter":"G06","text":"\u003cp>標識や標示で最高速度が指定されていない、中央線などがない生活道路のような一般道路では、自動車の最高速度は時速 30 キロメートルである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>中央線などがない一般道路では、自動車の法定の最高速度は時速 30 キロメートルです（2026 年 9 月 1 日から）。\u003c/p>","refs":[{"label":"道路交通法施行令 第11条","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_11","lines":["（最高速度）","第十一条　法第二十二条第一項の政令で定める最高速度（以下この条、次条及び第二十七条において「最高速度」という。）のうち、自動車及び原動機付自転車が高速自動車国道の本線車道（第二十七条の二に規定する本線車道を除く。第一号イ及び第二十七条において同じ。）並びにこれに接する加速車線及び減速車線以外の道路（以下この条及び次条において「一般道路」という。）を通行する場合の最高速度は、自動車にあつては次の各号に掲げる一般道路の区分に応じ当該各号に定める速度、原動機付自転車にあつては三十キロメートル毎時とする。","一　次に掲げる一般道路　六十キロメートル毎時","　イ　高速自動車国道のうち、本線車道並びにこれに接する加速車線及び減速車線以外のもの","　ロ　自動車専用道路","　ハ　道路標識等による中央線又は車両通行帯が設けられている一般道路","　ニ　道路の構造上又は柵その他の内閣府令で定める工作物により自動車の通行が往復の方向別に分離されている一般道路","二　前号に掲げる一般道路以外の一般道路　三十キロメートル毎時"]},{"label":"交通の方法に関する教則 第5章第4節1（1） 安全な速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車を運転する場合は、標識（付表３（１）25、25の２）や標示（付表３（２）６）によつて示されている最高速度を超えて運転してはいけません。標識や標示で指定されていないときは、主として地域住民の日常生活に利用される生活道路のような、中央線などがない一般道路（注８）では時速30キロメートル、それ以外の一般道路では時速60キロメートルを超えて運転してはいけません（高速自動車国道については、第７章第２節２を参照）。"]}],"section":"G06-1","fixed":true},{"id":"G06-03","subject":"学科","chapter":"G06","text":"\u003cp>一般原動機付自転車の法定の最高速度は、時速 30 キロメートルである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>標識などで指定されていないとき、一般原動機付自転車の最高速度は時速 30 キロメートルです。\u003c/p>","refs":[{"label":"道路交通法施行令 第11条","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_11","lines":["（最高速度）","第十一条　法第二十二条第一項の政令で定める最高速度（以下この条、次条及び第二十七条において「最高速度」という。）のうち、自動車及び原動機付自転車が高速自動車国道の本線車道（第二十七条の二に規定する本線車道を除く。第一号イ及び第二十七条において同じ。）並びにこれに接する加速車線及び減速車線以外の道路（以下この条及び次条において「一般道路」という。）を通行する場合の最高速度は、自動車にあつては次の各号に掲げる一般道路の区分に応じ当該各号に定める速度、原動機付自転車にあつては三十キロメートル毎時とする。","一　次に掲げる一般道路　六十キロメートル毎時","　イ　高速自動車国道のうち、本線車道並びにこれに接する加速車線及び減速車線以外のもの","　ロ　自動車専用道路","　ハ　道路標識等による中央線又は車両通行帯が設けられている一般道路","　ニ　道路の構造上又は柵その他の内閣府令で定める工作物により自動車の通行が往復の方向別に分離されている一般道路","二　前号に掲げる一般道路以外の一般道路　三十キロメートル毎時"]},{"label":"交通の方法に関する教則 第5章第4節1（2） 安全な速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（2）一般原動機付自転車を運転する場合は、時速30キロメートルを超えて運転してはいけません。標識（付表３（１）25、25の２）や標示（付表３（２）６）によつて時速30キロメートル以下の最高速度が示されているときは、その最高速度を超えて運転してはいけません。"]}],"section":"G06-1","fixed":true},{"id":"G06-04","subject":"学科","chapter":"G06","text":"\u003cp>決められた最高速度の範囲内であれば、天候や視界にかかわらず、その最高速度で走るのが安全である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>決められた速度の範囲内でも、道路や交通の状況、天候や視界などをよく考えて、安全な速度で走ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節1（3） 安全な速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（3）決められた速度の範囲内であつても、道路や交通の状況、天候や視界などをよく考え、特に生活道路においては、歩行者が優先という意識を持つて、安全な速度で走りましよう。"]}],"section":"G06-1","fixed":true},{"id":"G06-05","subject":"学科","chapter":"G06","text":"\u003cp>停止距離とは、空走距離と制動距離を合わせた距離のことである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>危険を感じてからブレーキが効き始めるまでに走る空走距離と、ブレーキが効き始めてから停止するまでの制動距離を合わせたものが停止距離です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節2（1） 停止距離と車間距離","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（1）車は、急には止まれません。停止するまでには、運転者が危険を感じてからブレーキを踏み、ブレーキが実際に効き始めるまでの間に車が走る距離（空走距離）と、ブレーキが効き始めてから車が停止するまでの距離（制動距離）とを合わせた距離（停止距離）を必要とします。この停止距離を考えて、危険が発生した場合でも、安全に停止できるような速度で運転しましよう。"]}],"section":"G06-2","fixed":true},{"id":"G06-06","subject":"学科","chapter":"G06","text":"\u003cp>運転者が疲れているときは、危険を感じてから判断するまでに時間がかかるので、制動距離が長くなる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転者が疲れているときに長くなるのは、空走距離です。制動距離が長くなるのは、雨にぬれた道路を走るときや、重い荷物を積んでいるときなどです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節2（2） 停止距離と車間距離","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（2）運転者が疲れているときは、危険を認知して判断するまでに時間がかかるので、空走距離は長くなります。また雨にぬれた道路を走る場合や重い荷物を積んでいる場合などは制動距離が長くなります。"]}],"section":"G06-2","fixed":true},{"id":"G06-07","subject":"学科","chapter":"G06","text":"\u003cp>重い荷物を積んでいるときは、車が安定するので、制動距離は短くなる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>雨にぬれた道路を走る場合や重い荷物を積んでいる場合などは、制動距離が長くなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節2（2） 停止距離と車間距離","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（2）運転者が疲れているときは、危険を認知して判断するまでに時間がかかるので、空走距離は長くなります。また雨にぬれた道路を走る場合や重い荷物を積んでいる場合などは制動距離が長くなります。"]}],"section":"G06-2","fixed":true},{"id":"G06-08","subject":"学科","chapter":"G06","text":"\u003cp>路面が雨にぬれ、タイヤがすり減っているときの停止距離は、乾燥した路面でタイヤの状態が良いときに比べて 2 倍程度に延びることがある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>路面が雨にぬれ、タイヤがすり減っている場合の停止距離は、2 倍程度に延びることがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節2（3） 停止距離と車間距離","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50","site":"警察庁の教則の全文（PDF）","lines":["（3）路面が雨にぬれ、タイヤがすり減つている場合の停止距離は、乾燥した路面でタイヤの状態が良い場合に比べて２倍程度に延びることがあります。"]}],"section":"G06-2","fixed":true},{"id":"G06-09","subject":"学科","chapter":"G06","text":"\u003cp>前の車の後ろを走るときは、前の車が急に止まっても追突しないような車間距離をとらなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>同一の進路を進行している車の直後を進行するときは、前の車が急に停止しても追突を避けられる距離を保たなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第26条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_26","lines":["（車間距離の保持）","第二十六条　車両等は、同一の進路を進行している他の車両等の直後を進行するときは、その直前の車両等が急に停止したときにおいてもこれに追突するのを避けることができるため必要な距離を、これから保たなければならない。"]}],"section":"G06-2","fixed":true},{"id":"G06-10","subject":"学科","chapter":"G06","text":"\u003cp>ブレーキは、はじめから強く踏み込み、早く速度を落とすのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ブレーキは、最初はできるだけ軽く踏み込み、それから必要な強さまで徐々に踏み込んでいきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節3（1） ブレーキの掛け方","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（1）最初はできるだけ軽く踏み込みましよう。それから必要な強さまで徐々に踏み込んでいきます。"]}],"section":"G06-3","fixed":true},{"id":"G06-11","subject":"学科","chapter":"G06","text":"\u003cp>滑りやすい道路では、ブレーキは一度に強く踏み込むのが効果的である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ブレーキは数回に分けて使います。この方法は、道路が滑りやすい状態のときにとりわけ効果的で、ブレーキ灯が点滅して後車への合図にもなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節3（2） ブレーキの掛け方","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（2）ブレーキは数回に分けて使いましよう。この方法は、道路が滑りやすい状態のときには、とりわけ効果的です。また、数回に分けて使えば、ブレーキ灯が点滅し、後車への合図となつて追突事故防止に役立ちます。"]}],"section":"G06-3","fixed":true},{"id":"G06-12","subject":"学科","chapter":"G06","text":"\u003cp>危険を防止するためやむを得ない場合を除き、急ブレーキを掛けてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>危険を防止するためやむを得ない場合を除き、急に停止したり、速度を急激に落としたりするような急ブレーキを掛けてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第24条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_2-At_24","lines":["（急ブレーキの禁止）","第二十四条　車両等の運転者は、危険を防止するためやむを得ない場合を除き、その車両等を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならない。"]}],"section":"G06-3","fixed":true},{"id":"G06-13","subject":"学科","chapter":"G06","text":"\u003cp>アンチロックブレーキシステム（ABS）を備えた車で急ブレーキを掛けるときは、ブレーキを数回に分けて踏むのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ABS を備えた自動車で急ブレーキを掛ける場合は、システムを作動させるために、一気に強く踏み込み、そのまま踏み込み続けます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第4節3（3） ブレーキの掛け方","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（3）危険を避けるためにやむを得ない場合のほかは、急ブレーキを掛けてはいけません。なお、アンチロックブレーキシステム（走行中の自動車の制御に著しい支障を及ぼす車輪の回転運動の停止を有効に防止できる装置をいいます。）を備えた自動車で急ブレーキを掛ける場合には、システムを作動させるために、一気に強く踏み込み、そのまま踏み込み続けることが必要です。"]}],"section":"G06-3","fixed":true},{"id":"G06-14","subject":"学科","chapter":"G06","text":"\u003cp>徐行とは、車がすぐに停止することができるような速度で進むことをいう。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>徐行とは、車両等が直ちに停止することができるような速度で進行することです。\u003c/p>","refs":[{"label":"道路交通法 第2条第1項第20号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_2-Pr_1-It_20","lines":["この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。","二十　徐行　車両等が直ちに停止することができるような速度で進行することをいう。"]}],"section":"G06-4","fixed":true},{"id":"G06-15","subject":"学科","chapter":"G06","text":"\u003cp>徐行とは、法令で時速 10 キロメートル以下と決められた速度で進むことである。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>法令は、徐行を「直ちに停止することができるような速度で進行すること」と決めていて、速度の数字は決めていません。\u003c/p>","refs":[{"label":"道路交通法 第2条第1項第20号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_2-Pr_1-It_20","lines":["この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。","二十　徐行　車両等が直ちに停止することができるような速度で進行することをいう。"]}],"section":"G06-4","fixed":true},{"id":"G06-16","subject":"学科","chapter":"G06","text":"\u003cp>道路の曲がり角付近でも、見通しがよければ、徐行しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>道路の曲がり角付近は、見通しに関係なく、徐行しなければならない場所です。\u003c/p>","refs":[{"label":"道路交通法 第42条第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42-Pr_1-It_2","lines":["車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。","二　道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するとき。"]}],"section":"G06-4","fixed":true},{"id":"G06-17","subject":"学科","chapter":"G06","text":"\u003cp>上り坂の頂上付近と、勾配の急な下り坂では、徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>上り坂の頂上付近と勾配の急な下り坂は、徐行しなければならない場所です。\u003c/p>","refs":[{"label":"道路交通法 第42条第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42-Pr_1-It_2","lines":["車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。","二　道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するとき。"]},{"label":"交通の方法に関する教則 第5章第4節4（4） 徐行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（4）上り坂の頂上付近やこう配の急な下り坂"]}],"section":"G06-4","fixed":true},{"id":"G06-18","subject":"学科","chapter":"G06","text":"\u003cp>勾配の急な上り坂を通行するときは、徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>徐行しなければならないのは、上り坂の頂上付近と勾配の急な下り坂です。勾配の急な上り坂は含まれません。\u003c/p>","refs":[{"label":"道路交通法 第42条第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42-Pr_1-It_2","lines":["車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。","二　道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するとき。"]}],"section":"G06-4","fixed":true},{"id":"G06-19","subject":"学科","chapter":"G06","text":"\u003cp>左右の見通しがきかない交差点でも、信号機による交通整理が行われているときは、徐行しなければならないわけではない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>左右の見通しがきかない交差点では徐行しますが、交通整理が行われている場合や、優先道路を通行している場合は除かれます。\u003c/p>","refs":[{"label":"道路交通法 第42条第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42-Pr_1-It_1","lines":["車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。","一　左右の見とおしがきかない交差点に入ろうとし、又は交差点内で左右の見とおしがきかない部分を通行しようとするとき（当該交差点において交通整理が行なわれている場合及び優先道路を通行している場合を除く。）。"]}],"section":"G06-4","fixed":true},{"id":"G06-20","subject":"学科","chapter":"G06","text":"\u003cp>左右の見通しがきかない交差点では、優先道路を通行しているときでも、徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>優先道路を通行している場合は、左右の見通しがきかない交差点でも、徐行しなければならない場合から除かれます。\u003c/p>","refs":[{"label":"道路交通法 第42条第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42-Pr_1-It_1","lines":["車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。","一　左右の見とおしがきかない交差点に入ろうとし、又は交差点内で左右の見とおしがきかない部分を通行しようとするとき（当該交差点において交通整理が行なわれている場合及び優先道路を通行している場合を除く。）。"]},{"label":"交通の方法に関する教則 第5章第4節4（2） 徐行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（2）左右の見通しがきかない交差点（信号機などによる交通整理が行われている場合や優先道路を通行している場合を除きます。）"]}],"section":"G06-4","fixed":true},{"id":"G06-21","subject":"学科","chapter":"G06","text":"\u003cp>「徐行」の標識があるところでは、徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路標識等により徐行すべきことが指定されている道路の部分を通行するときは、徐行しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第42条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42","lines":["（徐行すべき場所）","第四十二条　車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。","一　左右の見とおしがきかない交差点に入ろうとし、又は交差点内で左右の見とおしがきかない部分を通行しようとするとき（当該交差点において交通整理が行なわれている場合及び優先道路を通行している場合を除く。）。","二　道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するとき。"]},{"label":"交通の方法に関する教則 第5章第4節4（1） 徐行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（1）「徐行」の標識（付表３（１）38）があるところ"]}],"section":"G06-4","fixed":true},{"id":"G07-01","subject":"学科","chapter":"G07","text":"\u003cp>交差点で左折するときの合図は、交差点の手前の側端から 10 メートル手前の地点に達したときに行う。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>左折、右折、転回の合図は、その地点（交差点では交差点の手前の側端）から 30 メートル手前の地点に達したときに行います。\u003c/p>","refs":[{"label":"道路交通法施行令 第21条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_1","lines":["法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。","合図を行う場合｜合図を行う時期｜合図の方法","左折するとき。｜その行為をしようとする地点（交差点においてその行為をする場合にあつては、当該交差点の手前の側端）から三十メートル手前の地点に達したとき。｜左腕を車体の左側の外に出して水平に伸ばし、若しくは右腕を車体の右側の外に出して肘を垂直に上に曲げること、又は左側の方向指示器を操作すること。"]}],"section":"G07-1","fixed":true},{"id":"G07-02","subject":"学科","chapter":"G07","text":"\u003cp>同じ方向に進みながら進路を右に変えるときの合図は、進路を変えようとする約 10 秒前に行う。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>同一方向に進行しながら進路を変えるときの合図は、その行為をしようとする時の 3 秒前に行います。\u003c/p>","refs":[{"label":"道路交通法施行令 第21条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_1","lines":["法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。","合図を行う場合｜合図を行う時期｜合図の方法","同一方向に進行しながら進路を右方に変えるとき。｜その行為をしようとする時の三秒前のとき。"]}],"section":"G07-1","fixed":true},{"id":"G07-03","subject":"学科","chapter":"G07","text":"\u003cp>左折の合図は、右腕を車の右側の外に出して、肘を垂直に上に曲げて行うこともできる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>左折の合図は、左腕を車体の左側の外に出して水平に伸ばすか、右腕を車体の右側の外に出して肘を垂直に上に曲げるか、左側の方向指示器を操作して行います。\u003c/p>","refs":[{"label":"道路交通法施行令 第21条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_1","lines":["法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。","合図を行う場合｜合図を行う時期｜合図の方法","左折するとき。｜その行為をしようとする地点（交差点においてその行為をする場合にあつては、当該交差点の手前の側端）から三十メートル手前の地点に達したとき。｜左腕を車体の左側の外に出して水平に伸ばし、若しくは右腕を車体の右側の外に出して肘を垂直に上に曲げること、又は左側の方向指示器を操作すること。"]}],"section":"G07-1","fixed":true},{"id":"G07-04","subject":"学科","chapter":"G07","text":"\u003cp>徐行や停止をするときの合図は、ブレーキ灯をつけるか、腕を車の外に出して斜め下に伸ばして行う。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>徐行し、又は停止するときは、その行為をしようとするときに、腕を車体の外に出して斜め下に伸ばすか、制動灯（ブレーキ灯）をつけて合図をします。\u003c/p>","refs":[{"label":"道路交通法施行令 第21条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_1","lines":["法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。","合図を行う場合｜合図を行う時期｜合図の方法","徐行し、又は停止するとき。｜その行為をしようとするとき。｜腕を車体の外に出して斜め下に伸ばすこと、又は車両の保安基準に関する規定若しくはトロリーバスの保安基準に関する規定により設けられる制動灯をつけること。"]}],"section":"G07-1","fixed":true},{"id":"G07-05","subject":"学科","chapter":"G07","text":"\u003cp>後退するときの手による合図は、腕を車の外に出して水平に伸ばし、その腕を上下に動かして行う。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>後退の手による合図は、腕を車体の外に出して斜め下に伸ばし、手のひらを後ろに向けてその腕を前後に動かします。後退灯をつけてもかまいません。\u003c/p>","refs":[{"label":"道路交通法施行令 第21条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_1","lines":["法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。","合図を行う場合｜合図を行う時期｜合図の方法","後退するとき。｜その行為をしようとするとき。｜腕を車体の外に出して斜め下に伸ばし、かつ、手のひらを後ろに向けてその腕を前後に動かすこと、又は車両の保安基準に関する規定に定める後退灯を備える自動車にあつてはその後退灯を、トロリーバスにあつてはトロリーバスの保安基準に関する規定により設けられる後退灯を、それぞれつけること。"]}],"section":"G07-1","fixed":true},{"id":"G07-06","subject":"学科","chapter":"G07","text":"\u003cp>右折などの合図は、その行為が終わるまで続け、終わったら速やかにやめなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>合図は、これらの行為が終わるまで継続し、行為を終わったときは合図をやめなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第53条第4項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_53-Pr_4","lines":["車両の運転者は、第一項又は第二項に規定する行為を終わつたときは、当該合図をやめなければならないものとし、また、これらの規定に規定する合図に係る行為をしないのにかかわらず、当該合図をしてはならない。"]},{"label":"交通の方法に関する教則 第5章第5節1（3） 安全の確認と合図","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（3）これらの行為を終わつたときは、速やかに合図をやめなければなりません。また、必要がないのに合図をしてはいけません。"]}],"section":"G07-1","fixed":true},{"id":"G07-07","subject":"学科","chapter":"G07","text":"\u003cp>夕日の反射などで方向指示器が見えにくいときは、方向指示器の操作と併せて、手による合図も行うようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>夕日の反射などによって方向指示器が見えにくい場合には、方向指示器の操作と併せて、手による合図を行うようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第5節1（4） 安全の確認と合図","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（4）夕日の反射などによつて方向指示器が見えにくい場合には、方向指示器の操作と併せて、手による合図を行うようにしましよう。"]}],"section":"G07-1","fixed":true},{"id":"G07-08","subject":"学科","chapter":"G07","text":"\u003cp>進路を変えるときは、先に合図をしてから、バックミラーなどで安全を確かめる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>進路変更、転回、後退などをしようとするときは、あらかじめバックミラーなどで安全を確かめてから合図をしなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第5節1（1） 安全の確認と合図","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（1）進路変更、転回、後退などをしようとするとき（環状交差点でこれらの行為をしようとするときを除きます。）は、あらかじめバックミラーなどで安全を確かめてから合図をしなければなりません。合図の仕方は次表のとおりです。合図を行う場合合図を行う場所合図の方法左折するとき。左折しようとする地点（交差点左側の方向指示器を操作するで左折する場合は、その交差点）か、右腕を車の右側の外に出しから30メートル手前の地点に達て肘を垂直に上に曲げるか、左したとき。腕を車の左側の外に出して水平同一方向に進行しながら進路を変えようとする時の約３に伸ばす。進路を左方に変えると秒前。き。右折か転回をするとき。右折か転回をしようとする地点右側の方向指示器を操作する（交差点で右折する場合は、そか、右腕を車の右側の外に出しの交差点）から30メートル手前て水平に伸ばすか、左腕を車のの地点に達したとき。左側の外に出して肘を垂直に上同一方向に進行しながら進路を変えようとする時の約３に曲げる。進路を右方に変えると秒前。き。徐行か停止をするとき。徐行か停止をしようとするとブレーキ灯をつけるか、腕を車き。の外に出して斜め下に伸ばす。後退するとき。後退しようとするとき。後退灯をつけるか、腕を車の外に出して斜め下に伸ばし、手のひらを後ろに向けてその腕を前後に動かす。"]}],"section":"G07-1","fixed":true},{"id":"G07-09","subject":"学科","chapter":"G07","text":"\u003cp>「警笛鳴らせ」の標識がある場所でも、ほかの車や歩行者が見えなければ、警音器を鳴らさなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>「警笛鳴らせ」の標識がある場所を通るときは、ほかの車や歩行者
