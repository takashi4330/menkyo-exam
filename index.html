// 1 問 1 点の試験（危険物など）は、点ではなく「何問中何問」と正答率で言う
const sameForm = () => SUBJECTS.every(s => s.count === SUBJECTS[0].count && s.pass === SUBJECTS[0].pass);
const byCount = () => SUBJECTS.every(s => s.points === 1);
const rateOf = s => Math.round(s.pass * 100 / s.count);
const allWord = () => SUBJECTS.length === 2 ? '両方' : 'すべて';
const passText = (word = '合格') => SUBJECTS.length === 1 && byCount()
  ? `${SUBJECTS[0].count} 問中 ${SUBJECTS[0].pass} 問以上（正答率 ${rateOf(SUBJECTS[0])}% 以上）の正解なら${word}です。`
  : byCount()
  ? `${SUBJECTS.every(s => rateOf(s) === rateOf(SUBJECTS[0])) ? `各科目で正答率 ${rateOf(SUBJECTS[0])}% 以上、つまり` : ''}${SUBJECTS.map(s => `${s.name}は ${s.count} 問中 ${s.pass} 問`).join('、')}以上の正解なら${word}です。`
  : sameForm()
  ? `1 問 ${SUBJECTS[0].points} 点で各科目 ${SUBJECTS[0].count * SUBJECTS[0].points} 点満点、${allWord()}の科目で ${SUBJECTS[0].pass} 点以上なら${word}です。`
  : `1 問 ${SUBJECTS[0].points} 点で、${SUBJECTS.map(s => `${s.name}は ${s.count * s.points} 点満点で ${s.pass} 点以上`).join('、')}なら${word}です。`;
// ○× の試験（D.app.ox）は、選択肢の番号の代わりに ○・× を出し、文を「正しい」「誤り」にする
const noOf = (q, orig, k) => D.app.ox ? q.choices[orig] : k + 1;
const ctOf = (q, orig) => D.app.ox ? (orig === 0 ? '正しい' : '誤り') : q.choices[orig];
const choicesCls = (extra = '') => `choices${D.app.ox ? ' ox' : ''}${extra}`;
const countText = () => SUBJECTS.length === 1 ? `${SUBJECTS[0].name} ${SUBJECTS[0].count} 問` : sameForm() ? `${SUBJECTS.map(s => s.name).join('と')}が各 ${SUBJECTS[0].count} 問` : SUBJECTS.map(s => `${s.name} ${s.count} 問`).join(SUBJECTS.length === 2 ? 'と' : '、');

function record(id, ok) {
  const s = stats[id] || { n: 0, ok: 0, last: 0, t: 0 };
  s.n += 1; s.ok += ok ? 1 : 0; s.last = ok ? 1 : 0; s.t = Date.now();
  stats[id] = s;
  store.set('stats', stats);
}
function summary(list) {
  return { total: list.length, done: list.filter(q => stats[q.id]).length, right: list.filter(q => stats[q.id]?.last === 1).length };
}
const bar = (v, total, label) => `<div class="bar" role="img" aria-label="${esc(label || `${total} 問中 ${v} 問`)}"><i style="width:${total ? v * 100 / total : 0}%"></i></div>`;
const examText = () => `本番は${countText()}${SUBJECTS.length === 1 ? 'で、時間は' : '、合わせて'} ${L.exam.minutes} 分です。${passText()}`;
const onlyBadge = c => c.only ? `<span class="badge" title="${esc(c.only)}で増える範囲">${esc(c.only)}</span>` : '';

// ── ホーム ─────────────────────────────────────────
function viewHome() {
  const wrongN = QS.filter(q => stats[q.id]?.last === 0).length;
  const extra = CHS.filter(c => c.only), base = D.licenses[0], others = D.licenses.filter(l => l !== L);
  $app.innerHTML = `<h2>${esc(L.short)}の練習問題と教科書</h2>
  <p>${esc(L.name)}（${esc(L.short)}）の${esc(D.app.examName || '国家試験')}に向けた、非公式の練習問題と教科書です。${esc(examText())}</p>
  ${extra.length ? `<p>${esc(L.short)}の試験の範囲は、${esc(base.short)}の範囲を含みます。この問題集では、${esc(base.short)}の ${CHS.length - extra.length} 章に、${esc(L.short)}で増える ${extra.length} 章（${extra.map(c => `「${esc(c.title)}」`).join('')}）を足しています。${esc(base.short)}で解いた記録は、${esc(L.short)}でもそのまま使えます。</p>` : ''}
  ${L.video ? `<p>動画でも見られます：YouTube「<a href="${esc(L.video.url)}" target="_blank" rel="noopener">${esc(L.video.title)}</a>」（${esc(L.video.length)}）。試験の形と取り方、この問題集の使い方を説明しています。</p>` : ''}
  ${L.scenes ? `<section class="scenes"><h3>${esc(L.short)}が必要な場面</h3>
  ${L.scenes.lead ? `<p>${L.scenes.lead}</p>` : ''}
  <ul>${L.scenes.items.map(h => `<li>${h}</li>`).join('')}</ul>
  ${L.scenes.note ? `<p class="hint">${L.scenes.note}</p>` : ''}</section>` : ''}
  <p class="status">${esc(L.status)}</p>
  <div class="actions">${others.map(l => `<button type="button" data-act="lic" data-v="${esc(l.id)}">${esc(l.short)}（${esc(l.name)}）に切り替える</button>`).join('')}</div>
  <div class="cards">${SUBJECTS.map(s => {
    const list = QS.filter(q => q.subject === s.name), m = summary(list);
    return `<section class="card"><h3>${esc(s.name)}</h3>
      <p class="meta">${chaptersFor(s.name).length} 章・${list.length} 問</p>
      <p>解いた問題 ${m.done} / ${m.total}　最後に正解 ${m.right}</p>
      ${bar(m.right, m.total, `${m.total} 問中 ${m.right} 問が最後に正解`)}
      <a class="btn" href="#/practice" data-act="pick-subject" data-v="${esc(s.name)}">${esc(s.name)}を練習する</a></section>`;
  }).join('')}</div>
  <div class="actions">
    <a class="btn primary" href="#/mock">模擬試験を受ける</a>
    <a class="btn" href="#/review">まちがえた問題を復習する（${wrongN} 問）</a>
    <a class="btn" href="#/book">教科書を読む</a>
  </div>`;
}

// ── 練習 ─────────────────────────────────────────
function viewPractice(args) {
  if (args[0] === 'run' && sess) return sess.done ? viewResult() : viewQuestion();
  if (args[0] === 'result' && sess?.done) return viewResult();
  const chs = chaptersFor(prefs.subj);
  const chosen = new Set(prefs.chapters || chs.map(c => c.id));
  const radio = (name, value, label, on) => `<label class="pill"><input type="radio" name="${name}" value="${esc(value)}"${on ? ' checked' : ''}> ${esc(label)}</label>`;
  $app.innerHTML = `<h2>練習</h2>
  <form id="setup">
    <fieldset><legend>科目</legend>${[['', allWord()], ...SUBJECTS.map(s => [s.name, s.name])].map(([v, t]) => radio('subj', v, t, v === prefs.subj)).join('')}</fieldset>
    <fieldset><legend>章</legend>
      <div class="chk">${chs.map(c => {
        const list = QS.filter(q => q.chapter === c.id), m = summary(list);
        return `<label><input type="checkbox" name="ch" value="${c.id}"${chosen.has(c.id) ? ' checked' : ''}><span>${esc(c.subject)}　${esc(chLabel(c))}${onlyBadge(c)}<small>${list.length} 問・解いた ${m.done}・最後に正解 ${m.right}</small></span></label>`;
      }).join('')}</div>
      <div class="actions"><button type="button" data-act="all-ch">すべて選ぶ</button><button type="button" data-act="no-ch">すべて外す</button></div>
    </fieldset>
    <fieldset><legend>問題の数</legend>${[5, 10, 20, 0].map(n => radio('n', n, n ? `${n} 問` : 'すべて', n === prefs.n)).join('')}</fieldset>

function pickBalanced(pool, n) {
  // 章ごとに順番に 1 問ずつ取り、いろいろな章から出す。出す順は章の順（本番も分野ごとに並ぶ）
  const groups = new Map();
  for (const q of shuffle(pool)) { if (!groups.has(q.chapter)) groups.set(q.chapter, []); groups.get(q.chapter).push(q); }
  const lists = [...groups.values()], out = [];
  while (out.length < n && lists.some(g => g.length)) for (const g of lists) if (g.length && out.length < n) out.push(g.shift());
  const at = id => CHS.findIndex(c => c.id === id);
  return out.sort((a, b) => at(a.chapter) - at(b.chapter)).map(q => q.id);
}
function startExam() {
  const ids = SUBJECTS.flatMap(s => pickBalanced(QS.filter(q => q.subject === s.name), s.count));
  const now = Date.now();

  });

async function importRecords(file) {
  const msg = t => { const el = document.getElementById('ioMsg'); if (el) el.textContent = t; };
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== D.app.exportApp || typeof d.stats !== 'object') throw new Error();
    // 同じ問題は、解いた回数の多いほうを残す
    for (const [id, s] of Object.entries(d.stats)) if (QBY.has(id) && (!stats[id] || s.n > stats[id].n)) stats[id] = s;
    store.set('stats', stats);
    for (const l of D.licenses) {
      const incoming = d.mocks?.[l.id] ?? (l === D.licenses[0] ? d.mock : null);
      if (!Array.isArray(incoming)) continue;
      const seen = new Set(), mock = [...store.get(keyOf('mock', l.id), []), ...incoming].filter(h => !seen.has(h.d) && seen.add(h.d)).sort((a, b) => b.d - a.d).slice(0, 30);
      store.set(keyOf('mock', l.id), mock);
    }
    viewReview();
    msg('記録を読み込みました。');
  } catch { msg('このファイルは読み込めませんでした。「記録を書き出す」で作ったファイルを選んでください。'); }
}

function searchBook(term) {

  const low = term.toLowerCase(), hits = [];
  for (const c of CHS) for (const s of c.search) {

  box.innerHTML = hits.length ? `<p class="meta">${hits.length} か所</p>` + hits.slice(0, 40).map(({ c, s, at }) => {
    const from = Math.max(0, at - 24), t = s.text;
    return `<a href="#/book/${c.id}${s.id ? '/' + s.id : ''}"><b>${esc(c.subject)}・${esc(chLabel(c))}${s.title ? `「${esc(s.title)}」` : ''}</b><span>${from ? '…' : ''}${esc(t.slice(from, at))}<mark>${esc(t.slice(at, at + term.length))}</mark>${esc(t.slice(at + term.length, at + term.length + 40))}…</span></a>`;
  }).join('') : '<p class="hint">見つかりませんでした。</p>';
}
function viewChapter(c, secId) {
  const list = QS.filter(q => q.chapter === c.id), same = chaptersFor(c.subject), k = same.indexOf(c);
  const prev = same[k - 1], next = same[k + 1];
  $app.innerHTML = `${sess && !sess.done ? '<p class="noprint"><a class="btn" href="#/practice/run">← 問題にもどる</a></p>' : ''}
  <p class="crumbs noprint"><a href="#/book">教科書</a> › ${esc(c.subject)}</p>
  <h2>${esc(c.subject)}　${esc(chLabel(c))}${onlyBadge(c)}</h2>
  ${c.sections.length ? `<nav class="chtoc noprint" aria-label="この章の節"><ol>${c.sections.map(s => `<li><a href="#/book/${c.id}/${s.id}">${esc(s.title)}</a></li>`).join('')}</ol></nav>` : ''}
  <article class="book">${c.html}</article>
  <div class="actions noprint"><button class="primary" type="button" data-act="chapter-practice" data-v="${c.id}">この章の問題を解く（${list.length} 問）</button><button type="button" data-act="print">印刷する</button></div>
  <p class="pager noprint">${prev ? `<a href="#/book/${prev.id}">← ${esc(chLabel(prev))}</a>` : '<span></span>'}${next ? `<a href="#/book/${next.id}">${esc(chLabel(next))} →</a>` : ''}</p>`;
  if (secId) document.getElementById(secId)?.scrollIntoView();
}

// ── 使い方 ─────────────────────────────────────────
function viewHelp() {
  $app.innerHTML = `<h2>使い方</h2>
  <h3>この問題集について</h3>
  <p>${D.licenses.map(l => `${esc(l.name)}（${esc(l.short)}）`).join('と')}の${D.licenses.length > 1 ? esc(D.app.examName || '国家試験') : '試験'}に向けて、個人が作った非公式の練習問題と教科書です。${esc(D.app.disclaimer)}とは関係ありません。</p>
  <p>問題は過去の試験問題を写したものではなく、${esc(D.app.basis)}をもとに、新しく作ったものです。${SUBJECTS.filter(s => s.needRefs).map(s => esc(s.name)).join('と')}の問題には、根拠になる条文を付けています。条文は e-Gov 法令検索から ${esc(D.lawsFetched)} に取得したものです。${D.intlChecked ? `国際法規（通信憲章と無線通信規則）は e-Gov にないので、ITU（国際電気通信連合）が発行した英語の原文と、この問題集の日本語訳を載せています（${esc(D.intlChecked)} に確認）。` : ''}</p>
  ${D.licenses.length > 1 ? `<h3>資格の切り替え</h3>
  <p>画面のいちばん上の「${D.licenses.map(l => esc(l.short)).join('」「')}」で切り替えます。${D.licenses.slice(1).map(l => `${esc(l.short)}の範囲は ${esc(D.licenses[0].short)}の範囲を含むので、${esc(l.short)}には ${esc(D.licenses[0].short)}の章もすべて入っています。`).join('')}解いた記録は資格に関係なく共通で、練習の設定と模擬試験の結果は資格ごとに残ります。</p>` : ''}
  <h3>練習</h3>
  <p>科目・章・問題の数を選んで解きます。答えるとすぐに、正解と解説が出ます。「教科書で読む」から関係する節を読み、「問題にもどる」で続きに戻れます。</p>
  <h3>模擬試験</h3>
  <p>${esc(L.short)}の${esc(examText())}模擬試験も同じ形で解き、時間を計って採点します。</p>
  <h3>復習</h3>
  <p>まちがえた問題を集めて、解き直せます。「最後にまちがえた問題」は、いちばん新しい答えがまちがっていた問題です。</p>
  <h3>記録</h3>
  <p>記録は、この端末のこのブラウザーの中だけに保存され、どこにも送られません。ブラウザーの閲覧データを消すと、記録も消えます。ほかの端末に移すときは、「復習」の画面で書き出して読み込みます。</p>
  <h3>キーボード</h3>
  <ul><li>1〜${D.app.choices}：選択肢を選ぶ</li><li>Enter か →：次の問題（練習）</li><li>← と →：前の問題・次の問題（模擬試験）</li></ul>
  ${D.app.helpExam ? `<h3>本番の試験</h3>
  <p>${D.app.helpExam}</p>` : ''}
  ${D.app.related.length || L.video ? `<h3>関連</h3>
  ${D.app.related.map(h => `<p>${h}</p>`).join('')}
  ${L.video ? `<p>YouTube の動画「<a href="${esc(L.video.url)}" target="_blank" rel="noopener">${esc(L.video.title)}</a>」（${esc(L.video.length)}）で、試験の形と取り方、この問題集の使い方を見られます。</p>` : ''}` : ''}`;
}

// ── 画面の切り替え ─────────────────────────────────────
const VIEWS = { home: viewHome, practice: viewPractice, mock: viewMock, review: viewReview, book: viewBook, help: viewHelp };
function route() {
  if (skipHash) { skipHash = false; return; }
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const name = VIEWS[parts[0]] ? parts[0] : 'home';
  if (exam && !exam.done && name !== 'mock') {
    if (!confirm('模擬試験の途中です。やめてほかの画面に移りますか？（答えは採点されません）')) { skipHash = true; location.hash = '#/mock'; return; }
    exam = null;
    clearInterval(timer);
  }
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === name));
  window.scrollTo(0, 0);
  VIEWS[name](parts.slice(1));
  $app.focus({ preventScroll: true });
}

const ACTIONS = {
  'pick-subject': v => { prefs.subj = v; prefs.chapters = null; savePrefs(); },
  'lic': v => switchLicense(v),
  'all-ch': () => { document.querySelectorAll('#setup input[name=ch]').forEach(x => { x.checked = true; }); readSetup(); updateCount(); },
  'no-ch': () => { document.querySelectorAll('#setup input[name=ch]').forEach(x => { x.checked = false; }); readSetup(); updateCount(); },
  'choose': (v, el) => { if (el.getAttribute('aria-disabled') !== 'true') choosePractice(+v); },
  'next': () => nextPractice(),
  'quit': () => {
    const done = sess.ids.filter(id => sess.answers[id] !== undefined);
    if (!done.length) { sess = null; go('#/practice'); return; }
    sess.ids = done; sess.done = true; go('#/practice/result');
  },
  'retry-wrong': () => startSession(shuffle(sess.ids.filter(id => sess.answers[id] !== qOf(id).answer))),
  'retry-same': () => startSession(shuffle(sess.ids)),
  'to-setup': () => { sess = null; },
  'exam-start': () => startExam(),
  'exam-choose': v => { exam.answers[exam.ids[exam.i]] = +v; viewExam(); },
  'exam-go': v => { exam.i = +v; viewExam(); },
  'exam-prev': () => { if (exam.i > 0) { exam.i--; viewExam(); } },
  'exam-next': () => { if (exam.i < exam.ids.length - 1) { exam.i++; viewExam(); } },
  'exam-flag': () => { const id = exam.ids[exam.i]; exam.flags[id] = !exam.flags[id]; viewExam(); },
  'exam-finish': () => {
    const left = exam.ids.filter(id => exam.answers[id] === undefined).length;
    if (left && !confirm(`まだ答えていない問題が ${left} 問あります。採点しますか？`)) return;
    finishExam(false);
  },
  'exam-quit': () => { if (confirm('模擬試験をやめますか？（答えは採点されません）')) { exam = null; clearInterval(timer); go('#/mock'); } },
  'exam-wrong': () => startSession(shuffle(exam.ids.filter(id => exam.answers[id] !== qOf(id).answer))),
  'review-last': () => startSession(shuffle(QS.filter(q => stats[q.id]?.last === 0).map(q => q.id))),
  'review-ever': () => startSession(shuffle(QS.filter(q => stats[q.id] && stats[q.id].ok < stats[q.id].n).map(q => q.id))),
  'solve-one': v => startSession([v]),
  'chapter-practice': v => startSession(shuffle(QS.filter(q => q.chapter === v).map(q => q.id))),
  'print': () => window.print(),
  'export': () => exportRecords(),
  'clear': () => {
    if (!confirm(`解いた記録と模擬試験の結果（${D.licenses.map(l => l.short).join('・')}）を、すべて消しますか？`)) return;
    stats = {}; store.del('stats');
    for (const l of D.licenses) store.del(keyOf('mock', l.id));
    viewReview();
  },
};
// 資格を切り替える。模擬試験の途中なら確かめる。練習の途中のものはやめて、いまの画面を新しい資格で描き直す
// （練習の問題・結果や、新しい資格にない章の教科書を開いていたときは、その画面の入口に戻す）
function switchLicense(id) {
  if (!D.licenses.some(l => l.id === id) || id === L.id) return;
  if (exam && !exam.done && !confirm('模擬試験の途中です。資格を切り替えると、答えは採点されません。切り替えますか？')) return;
  exam = null; clearInterval(timer); sess = null;
  useLicense(id);
  renderFoot();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const keep = parts[0] === 'book' && parts[1] && L.chapters.includes(parts[1]);
  go(keep ? location.hash : `#/${parts[0] && VIEWS[parts[0]] ? parts[0] : ''}`);
}
document.getElementById('lic').addEventListener('click', e => { const b = e.target.closest('[data-lic]'); if (b) switchLicense(b.dataset.lic); });
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !ACTIONS[t.dataset.act]) return;
  if (t.tagName !== 'A') e.preventDefault();
  ACTIONS[t.dataset.act](t.dataset.v, t);
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files[0]) return importRecords(t.files[0]);
  if (!t.closest('#setup')) return;
  if (t.name === 'subj') { prefs.subj = t.value; prefs.chapters = null; savePrefs(); viewPractice([]); return; }
  readSetup();
  updateCount();
});
$app.addEventListener('submit', e => {
  if (e.target.id !== 'setup') return;
  e.preventDefault();
  readSetup();
  const pool = poolFromPrefs();
  if (pool.length) startSession(pickQuestions(pool, prefs.n, prefs.order));
});
$app.addEventListener('input', e => { if (e.target.id === 'q') searchBook(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest?.('input, textarea, select')) return;
  const name = location.hash.replace(/^#\/?/, '').split('/')[0];
  const n = '123456789'.indexOf(e.key);
  if (name === 'practice' && sess && !sess.done && document.querySelector('[data-act=choose]')) {
    const id = sess.ids[sess.i], answered = sess.answers[id] !== undefined;
    if (!answered && n >= 0 && n < sess.orders[id].length) { e.preventDefault(); choosePractice(sess.orders[id][n]); }
    else if (answered && (e.key === 'Enter' || e.key === 'ArrowRight') && !e.target.closest('button, a')) { e.preventDefault(); nextPractice(); }
  } else if (name === 'mock' && exam && !exam.done) {
    const id = exam.ids[exam.i];
    if (n >= 0 && n < exam.orders[id].length) { exam.answers[id] = exam.orders[id][n]; viewExam(); }
    else if (e.key === 'ArrowLeft') ACTIONS['exam-prev']();
    else if (e.key === 'ArrowRight') ACTIONS['exam-next']();
  }
});
window.addEventListener('beforeunload', e => { if (exam && !exam.done) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', route);

function renderFoot() {
  document.getElementById('foot').innerHTML = `<p>非公式の練習問題と教科書です。${esc(D.app.disclaimer)}とは関係ありません。問題は過去の試験問題の写しではありません。</p>
<p>法令の本文：e-Gov 法令検索（${esc(D.lawsFetched)} 取得）${D.intlChecked ? `・国際法規：ITU の原文（${esc(D.intlChecked)} 確認）` : ''}${(D.docsChecked || []).map(d => `・${esc(d.name)}：${esc(d.site)}（${esc(d.checked)} 確認）`).join('')}・最終更新：${esc(D.generated)}・${esc(L.short)} ${QS.length} 問</p>`;
}
// はじめの資格：アドレスの ?lic=3ama などがあればそれ、なければ前に選んだ資格、なければ 4アマ
const licParam = (() => { try { return new URLSearchParams(location.search).get('lic'); } catch { return null; } })();
useLicense(D.licenses.some(l => l.id === licParam) ? licParam : store.get('lic', D.licenses[0].id));
renderFoot();
route();
</script>
