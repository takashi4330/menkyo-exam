が見えるかどうかに関係なく、警音器を鳴らさなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第54条第1項第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_54-Pr_1-It_1","lines":["車両等（自転車以外の軽車両を除く。以下この条において同じ。）の運転者は、次の各号に掲げる場合においては、警音器を鳴らさなければならない。","一　左右の見とおしのきかない交差点、見とおしのきかない道路のまがりかど又は見とおしのきかない上り坂の頂上で道路標識等により指定された場所を通行しようとするとき。"]},{"label":"交通の方法に関する教則 第5章第5節1（5） 安全の確認と合図","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51","site":"警察庁の教則の全文（PDF）","lines":["（5）警音器は「警笛鳴らせ」の標識（付表３（１）36）がある場所を通るときや、「警笛区間」の標識（付表３（１）37）がある区間内で見通しのきかない交差点、曲がり角、上り坂の頂上を通るときには、鳴らさなければなりません。また、危険を避けるためやむを得ない場合は、鳴らすことができますが、これらの場合以外は鳴らしてはいけません。"]}],"section":"G07-2","fixed":true},{"id":"G07-10","subject":"学科","chapter":"G07","text":"\u003cp>「警笛区間」の標識がある区間内では、見通しのよい交差点を通るときも、警音器を鳴らさなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>警笛区間内で警音器を鳴らさなければならないのは、見通しのきかない交差点、見通しのきかない曲がり角、見通しのきかない上り坂の頂上を通るときです。\u003c/p>","refs":[{"label":"道路交通法 第54条第1項第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_54-Pr_1-It_2","lines":["車両等（自転車以外の軽車両を除く。以下この条において同じ。）の運転者は、次の各号に掲げる場合においては、警音器を鳴らさなければならない。","二　山地部の道路その他曲折が多い道路について道路標識等により指定された区間における左右の見とおしのきかない交差点、見とおしのきかない道路のまがりかど又は見とおしのきかない上り坂の頂上を通行しようとするとき。"]}],"section":"G07-2","fixed":true},{"id":"G07-11","subject":"学科","chapter":"G07","text":"\u003cp>前の車の速度が遅いときは、警音器を鳴らして、道を譲るように促してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>法令で鳴らさなければならないとされている場合のほかは、危険を防止するためやむを得ないときを除き、警音器を鳴らしてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第54条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_54-Pr_2","lines":["車両等の運転者は、法令の規定により警音器を鳴らさなければならないこととされている場合を除き、警音器を鳴らしてはならない。ただし、危険を防止するためやむを得ないときは、この限りでない。"]}],"section":"G07-2","fixed":true},{"id":"G07-12","subject":"学科","chapter":"G07","text":"\u003cp>危険を避けるためやむを得ないときは、警音器を鳴らすことができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>危険を防止するためやむを得ないときは、警音器を鳴らすことができます。\u003c/p>","refs":[{"label":"道路交通法 第54条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_54-Pr_2","lines":["車両等の運転者は、法令の規定により警音器を鳴らさなければならないこととされている場合を除き、警音器を鳴らしてはならない。ただし、危険を防止するためやむを得ないときは、この限りでない。"]}],"section":"G07-2","fixed":true},{"id":"G07-13","subject":"学科","chapter":"G07","text":"\u003cp>進路を変えると、後ろから来る車が急ブレーキや急ハンドルで避けなければならなくなるときは、進路を変えてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>進路を変更した場合に、後方から来る車両等の速度や方向を急に変えさせることとなるおそれがあるときは、進路を変更してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第26条の2第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_26_2-Pr_2","lines":["車両は、進路を変更した場合にその変更した後の進路と同一の進路を後方から進行してくる車両等の速度又は方向を急に変更させることとなるおそれがあるときは、進路を変更してはならない。"]},{"label":"交通の方法に関する教則 第5章第5節2（1） 進路変更","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=53","site":"警察庁の教則の全文（PDF）","lines":["（1）みだりに進路を変更してはいけません。また、進路を変更すると、後から来る車が急ブレーキや急ハンドルで避けなければならないような場合には、進路を変えてはいけません。やむを得ず進路を変更するときは、バックミラーや目視で安全を確認してから変更しましよう。"]}],"section":"G07-3","fixed":true},{"id":"G07-14","subject":"学科","chapter":"G07","text":"\u003cp>車両通行帯が黄色の線で区画されているところでは、その黄色の線を越えて進路を変えてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車両通行帯が黄の線で区画されている場合は、この黄の線を越えて進路を変更してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第5節2（2） 進路変更","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=53","site":"警察庁の教則の全文（PDF）","lines":["（2）車両通行帯が黄の線で区画されている場合は、この黄の線を越えて進路を変更してはいけません。また、白の線で区画されている場合でも、自分が通行している車両通行帯の側に平行して黄の線が引かれているときは同じです。"]}],"section":"G07-3","fixed":true},{"id":"G07-15","subject":"学科","chapter":"G07","text":"\u003cp>車両通行帯が白の線で区画されていれば、自分の通行している側に黄色の線が平行して引かれていても、その線を越えて進路を変えてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>白の線で区画されている場合でも、自分が通行している車両通行帯の側に平行して黄の線が引かれているときは、越えて進路を変更してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第5節2（2） 進路変更","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=53","site":"警察庁の教則の全文（PDF）","lines":["（2）車両通行帯が黄の線で区画されている場合は、この黄の線を越えて進路を変更してはいけません。また、白の線で区画されている場合でも、自分が通行している車両通行帯の側に平行して黄の線が引かれているときは同じです。"]}],"section":"G07-3","fixed":true},{"id":"G07-16","subject":"学科","chapter":"G07","text":"\u003cp>歩行者やほかの車の正常な通行を妨げるおそれがあるときは、横断、転回や後退をしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>歩行者や他の車両等の正常な交通を妨害するおそれがあるときは、横断、転回、後退や、道路外に出入りするための右左折をしてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第25条の2第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_3-At_25_2-Pr_1","lines":["車両は、歩行者又は他の車両等の正常な交通を妨害するおそれがあるときは、道路外の施設若しくは場所に出入するための左折若しくは右折をし、横断し、転回し、又は後退してはならない。"]}],"section":"G07-4","fixed":true},{"id":"G07-17","subject":"学科","chapter":"G07","text":"\u003cp>標識で転回が禁止されているところでも、ほかの車がいなければ転回してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>標識や標示で転回が禁止されているところでは、ほかの車がいるかどうかに関係なく、転回してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第25条の2第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_3-At_25_2-Pr_2","lines":["車両は、道路標識等により横断、転回又は後退が禁止されている道路の部分においては、当該禁止された行為をしてはならない。"]},{"label":"交通の方法に関する教則 第5章第5節3（2） 横断など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=53","site":"警察庁の教則の全文（PDF）","lines":["（2）標識（付表３（１）13、14）や標示（付表３（２）１）によつて横断や転回が禁止されているところでは、横断や転回をしてはいけません。"]}],"section":"G07-4","fixed":true},{"id":"G07-18","subject":"学科","chapter":"G07","text":"\u003cp>道路外に出るため左折するときは、あらかじめできるだけ道路の左端に寄って徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路外に出るため左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、徐行しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第25条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_3-At_25-Pr_1","lines":["車両は、道路外に出るため左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、徐行しなければならない。"]}],"section":"G07-4","fixed":true},{"id":"G07-19","subject":"学科","chapter":"G07","text":"\u003cp>一方通行の道路で、道路外に出るため右折するときは、あらかじめできるだけ道路の中央に寄って徐行する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>道路外に出るため右折するときは道路の中央に寄りますが、一方通行の道路では、道路の右端に寄って徐行します。\u003c/p>","refs":[{"label":"道路交通法 第25条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_3-At_25-Pr_2","lines":["車両（特定小型原動機付自転車等及びトロリーバスを除く。）は、道路外に出るため右折するときは、あらかじめその前からできる限り道路の中央（当該道路が一方通行となつているときは、当該道路の右側端）に寄り、かつ、徐行しなければならない。"]}],"section":"G07-4","fixed":true},{"id":"G07-20","subject":"学科","chapter":"G07","text":"\u003cp>前の車が道路外に出るため道路の中央に寄ろうとして合図をしたときは、急ブレーキや急ハンドルで避けなければならない場合を除き、その進路の変更を妨げてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前の車が道路外に出るため道路の左端、中央や右端に寄ろうとして合図をしている場合は、急ブレーキや急ハンドルで避けなければならない場合を除き、その進路の変更を妨げてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第25条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_3-At_25-Pr_3","lines":["道路外に出るため左折又は右折をしようとする車両が、前二項の規定により、それぞれ道路の左側端、中央又は右側端に寄ろうとして手又は方向指示器による合図をした場合においては、その後方にある車両は、その速度又は方向を急に変更しなければならないこととなる場合を除き、当該合図をした車両の進路の変更を妨げてはならない。"]},{"label":"交通の方法に関する教則 第5章第5節3（4） 横断など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=53","site":"警察庁の教則の全文（PDF）","lines":["（4）前の車が道路外に出るため道路の左端や中央や右端に寄ろうとして合図をしている場合は、その進路の変更を妨げてはいけません。しかし、急ブレーキや急ハンドルで避けなければならないような場合は別です。"]}],"section":"G07-4","fixed":true},{"id":"G08-01","subject":"学科","chapter":"G08","text":"\u003cp>追越しとは、車が進路を変えて、進行中の前の車の前方に出ることをいう。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>追越しとは、車が進路を変えて、進行中の前の車の前方に出ることです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節1（1） 追越しの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=54","site":"警察庁の教則の全文（PDF）","lines":["（1）追越しとは、車が進路を変えて、進行中の前の車の前方に出ることをいいます。追越しは、進路を変え、加速した上で再び進路を戻すという複雑な運転操作を必要とします。"]}],"section":"G08-1","fixed":true},{"id":"G08-02","subject":"学科","chapter":"G08","text":"\u003cp>前の車がほかの自動車を追い越そうとしているときに、その車を追い越し始めてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前車が他の自動車を追い越そうとしているときは、追越しを始めてはいけません（二重追越しの禁止）。\u003c/p>","refs":[{"label":"道路交通法 第29条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_29","lines":["（追越しを禁止する場合）","第二十九条　後車は、前車が他の自動車又はトロリーバスを追い越そうとしているときは、追越しを始めてはならない。"]}],"section":"G08-1","fixed":true},{"id":"G08-03","subject":"学科","chapter":"G08","text":"\u003cp>前の車が右折のため右側に進路を変えようとしているときは、その車を追い越してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前の車が右折などのため右側に進路を変えようとしているときは、危険なので追越しをしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節1（2） 追越しの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=54","site":"警察庁の教則の全文（PDF）","lines":["（2）次の場合は危険ですから追越しをしてはいけません。","ア前の車が自動車を追い越そうとしているとき（二重追越し）。","イ前の車が右折などのため右側に進路を変えようとしているとき。","ウ道路の右側部分に入つて追越しをしようとする場合に、反対方向からの車や路面電車の進行を妨げるようなときや前の車の進行を妨げなければ道路の左側部分に戻ることができないようなとき。","エ後ろの車が自分の車を追い越そうとしているとき。"]}],"section":"G08-1","fixed":true},{"id":"G08-04","subject":"学科","chapter":"G08","text":"\u003cp>後ろの車が自分の車を追い越そうとしているときでも、前の車が遅ければ、前の車を追い越してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>後ろの車が自分の車を追い越そうとしているときは、追越しをしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節1（2） 追越しの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=54","site":"警察庁の教則の全文（PDF）","lines":["（2）次の場合は危険ですから追越しをしてはいけません。","ア前の車が自動車を追い越そうとしているとき（二重追越し）。","イ前の車が右折などのため右側に進路を変えようとしているとき。","ウ道路の右側部分に入つて追越しをしようとする場合に、反対方向からの車や路面電車の進行を妨げるようなときや前の車の進行を妨げなければ道路の左側部分に戻ることができないようなとき。","エ後ろの車が自分の車を追い越そうとしているとき。"]}],"section":"G08-1","fixed":true},{"id":"G08-05","subject":"学科","chapter":"G08","text":"\u003cp>道路の曲がり角付近でも、見通しがよければ、自動車を追い越すために進路を変えてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>道路の曲がり角付近は、見通しに関係なく、追越しが禁止されている場所です。\u003c/p>","refs":[{"label":"道路交通法 第30条第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30-Pr_1-It_1","lines":["車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","一　道路の曲がり角付近、上り坂の頂上付近又は勾配の急な下り坂"]}],"section":"G08-2","fixed":true},{"id":"G08-06","subject":"学科","chapter":"G08","text":"\u003cp>勾配の急な上り坂では、自動車を追い越してはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>追越しが禁止されているのは、上り坂の頂上付近と勾配の急な下り坂です。勾配の急な上り坂は、追越し禁止の場所ではありません。\u003c/p>","refs":[{"label":"道路交通法 第30条第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30-Pr_1-It_1","lines":["車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","一　道路の曲がり角付近、上り坂の頂上付近又は勾配の急な下り坂"]}],"section":"G08-2","fixed":true},{"id":"G08-07","subject":"学科","chapter":"G08","text":"\u003cp>車両通行帯のないトンネルでは、自動車を追い越すため進路を変えてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>トンネルは追越し禁止の場所ですが、車両通行帯の設けられた道路の部分は除かれます。\u003c/p>","refs":[{"label":"道路交通法 第30条第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30-Pr_1-It_2","lines":["車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","二　トンネル（車両通行帯の設けられた道路以外の道路の部分に限る。）"]}],"section":"G08-2","fixed":true},{"id":"G08-08","subject":"学科","chapter":"G08","text":"\u003cp>トンネルの中は、車両通行帯があるかどうかに関係なく、追越しが禁止されている。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>トンネルで追越しが禁止されるのは、車両通行帯が設けられていない場合です。\u003c/p>","refs":[{"label":"道路交通法 第30条第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30-Pr_1-It_2","lines":["車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","二　トンネル（車両通行帯の設けられた道路以外の道路の部分に限る。）"]}],"section":"G08-2","fixed":true},{"id":"G08-09","subject":"学科","chapter":"G08","text":"\u003cp>交差点とその手前から 30 メートル以内の場所では、優先道路を通行している場合を除き、自動車を追い越すため進路を変えてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>交差点とその手前の側端から 30 メートル以内は追越し禁止の場所です。ただし、優先道路を通行している場合のその優先道路にある交差点は除かれます。\u003c/p>","refs":[{"label":"道路交通法 第30条第3号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30-Pr_1-It_3","lines":["車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","三　交差点（当該車両が第三十六条第二項に規定する優先道路を通行している場合における当該優先道路にある交差点を除く。）、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に三十メートル以内の部分"]}],"section":"G08-2","fixed":true},{"id":"G08-10","subject":"学科","chapter":"G08","text":"\u003cp>横断歩道の手前 30 メートル以内の場所でも、横断する歩行者がいなければ、自動車を追い越してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>踏切、横断歩道、自転車横断帯とその手前の側端から 30 メートル以内は、歩行者がいるかどうかに関係なく、追越し禁止の場所です。\u003c/p>","refs":[{"label":"道路交通法 第30条第3号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30-Pr_1-It_3","lines":["車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","三　交差点（当該車両が第三十六条第二項に規定する優先道路を通行している場合における当該優先道路にある交差点を除く。）、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に三十メートル以内の部分"]}],"section":"G08-2","fixed":true},{"id":"G08-11","subject":"学科","chapter":"G08","text":"\u003cp>追越し禁止の場所でも、進路を変えずに前を走る自動車の横を通り過ぎて前に出るのであれば、差し支えない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>追越し禁止の場所では、追い越すために進路を変えることも、前車の側方を通過することもしてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第30条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30","lines":["（追越しを禁止する場所）","第三十条　車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。","一　道路の曲がり角付近、上り坂の頂上付近又は勾配の急な下り坂","二　トンネル（車両通行帯の設けられた道路以外の道路の部分に限る。）","三　交差点（当該車両が第三十六条第二項に規定する優先道路を通行している場合における当該優先道路にある交差点を除く。）、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に三十メートル以内の部分"]}],"section":"G08-2","fixed":true},{"id":"G08-12","subject":"学科","chapter":"G08","text":"\u003cp>ほかの車を追い越すときは、原則として、その左側を通行しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>他の車両を追い越そうとするときは、原則として前車の右側を通行します。左側を通るのは、前の車が右折のため道路の中央に寄っているときなどです。\u003c/p>","refs":[{"label":"道路交通法 第28条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_28-Pr_1","lines":["車両は、他の車両を追い越そうとするときは、その追い越されようとする車両（以下この節において「前車」という。）の右側を通行しなければならない。"]}],"section":"G08-3","fixed":true},{"id":"G08-13","subject":"学科","chapter":"G08","text":"\u003cp>前の車が右折するため道路の中央に寄って通行しているときは、その左側を通行して追い越す。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前の車が右折するため道路の中央（一方通行の道路では右端）に寄って通行しているときは、その左側を通行します。\u003c/p>","refs":[{"label":"道路交通法 第28条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_28-Pr_2","lines":["車両は、他の車両を追い越そうとする場合において、前車が第二十五条第二項又は第三十四条第二項若しくは第四項の規定により道路の中央又は右側端に寄つて通行しているときは、前項の規定にかかわらず、その左側を通行しなければならない。"]}],"section":"G08-3","fixed":true},{"id":"G08-14","subject":"学科","chapter":"G08","text":"\u003cp>路面電車を追い越すときは、原則として、その右側を通行しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>路面電車を追い越すときは、その左側を通行します。軌道が道路の左側端に寄って設けられているときは別です。\u003c/p>","refs":[{"label":"道路交通法 第28条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_28-Pr_3","lines":["車両は、路面電車を追い越そうとするときは、当該車両が追いついた路面電車の左側を通行しなければならない。ただし、軌道が道路の左側端に寄つて設けられているときは、この限りでない。"]}],"section":"G08-3","fixed":true},{"id":"G08-15","subject":"学科","chapter":"G08","text":"\u003cp>ほかの車に追い越されるときは、追越しが終わるまで速度を上げてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>追い越されるときは、追越しが終わるまで速度を上げてはいけません。追越しに十分な余地がないときは、できるだけ左に寄り進路を譲ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節2（4） 追越しの方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=55","site":"警察庁の教則の全文（PDF）","lines":["（4）追い越されるときは、追越しが終わるまで速度を上げてはいけません。また、追越しに十分な余地のない場合は、できるだけ左に寄り進路を譲らなければなりません。"]}],"section":"G08-3","fixed":true},{"id":"G08-16","subject":"学科","chapter":"G08","text":"\u003cp>追越しをするときは、右側の方向指示器を出してから約 3 秒後に、進路を緩やかに右にとる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>右側の方向指示器を出し、約 3 秒後、最高速度の制限内で加速しながら進路を緩やかに右にとります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節3 追越しの運転手順","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=55","site":"警察庁の教則の全文（PDF）","lines":["追越しは、次の順序でしましよう。","（1）追越し禁止の場所でないことを確かめる。","（2）前方の安全を確かめるとともに、バックミラーなどで右側や右斜め後方の安全を確かめる。道路の右側部分にはみ出した追越しをする場合には反対方向の安全を必ず確かめる。","（3）右側の方向指示器を出す。","（4）約３秒後、最高速度の制限内で加速しながら進路を緩やかに右にとり、前の車の右側を安全な間隔を保ちながら通過する。","（5）左側の方向指示器を出す。","（6）追い越した車がルームミラーで見えるくらいの距離までそのまま進み、進路を緩やかに左にとる。","（7）合図をやめる。"]}],"section":"G08-3","fixed":true},{"id":"G08-17","subject":"学科","chapter":"G08","text":"\u003cp>追越しは短い時間で終わらせる必要があるので、最高速度を少しなら超えてもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>追越しのときも、加速は最高速度の制限内でします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節3 追越しの運転手順","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=55","site":"警察庁の教則の全文（PDF）","lines":["追越しは、次の順序でしましよう。","（1）追越し禁止の場所でないことを確かめる。","（2）前方の安全を確かめるとともに、バックミラーなどで右側や右斜め後方の安全を確かめる。道路の右側部分にはみ出した追越しをする場合には反対方向の安全を必ず確かめる。","（3）右側の方向指示器を出す。","（4）約３秒後、最高速度の制限内で加速しながら進路を緩やかに右にとり、前の車の右側を安全な間隔を保ちながら通過する。","（5）左側の方向指示器を出す。","（6）追い越した車がルームミラーで見えるくらいの距離までそのまま進み、進路を緩やかに左にとる。","（7）合図をやめる。"]}],"section":"G08-3","fixed":true},{"id":"G08-18","subject":"学科","chapter":"G08","text":"\u003cp>追い越したあとは、追い越した車がルームミラーで見えるくらいの距離まで進んでから、進路を緩やかに左にとる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>左側の方向指示器を出し、追い越した車がルームミラーで見えるくらいの距離までそのまま進み、進路を緩やかに左にとります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節3 追越しの運転手順","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=55","site":"警察庁の教則の全文（PDF）","lines":["追越しは、次の順序でしましよう。","（1）追越し禁止の場所でないことを確かめる。","（2）前方の安全を確かめるとともに、バックミラーなどで右側や右斜め後方の安全を確かめる。道路の右側部分にはみ出した追越しをする場合には反対方向の安全を必ず確かめる。","（3）右側の方向指示器を出す。","（4）約３秒後、最高速度の制限内で加速しながら進路を緩やかに右にとり、前の車の右側を安全な間隔を保ちながら通過する。","（5）左側の方向指示器を出す。","（6）追い越した車がルームミラーで見えるくらいの距離までそのまま進み、進路を緩やかに左にとる。","（7）合図をやめる。"]}],"section":"G08-3","fixed":true},{"id":"G08-19","subject":"学科","chapter":"G08","text":"\u003cp>前の車が踏切の手前で停止しているときは、その前に割り込んだり、その前を横切ったりしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前の車が交差点や踏切などで停止や徐行しているときは、その前に割り込んだり、その前を横切ったりしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節4 割込みなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=55","site":"警察庁の教則の全文（PDF）","lines":["前の車が交差点や踏切などで停止や徐行しているときは、その前に割り込んだり、その前を横切つたりしてはいけません。また、そのほかの場合でも、ほかの車の前方に急に割り込んだり、並進している車に幅寄せをしたりしてはいけません。"]},{"label":"道路交通法 第32条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_32","lines":["（割込み等の禁止）","第三十二条　車両は、法令の規定若しくは警察官の命令により、又は危険を防止するため、停止し、若しくは停止しようとして徐行している車両等又はこれらに続いて停止し、若しくは徐行している車両等に追いついたときは、その前方にある車両等の側方を通過して当該車両等の前方に割り込み、又はその前方を横切つてはならない。"]}],"section":"G08-4","fixed":true},{"id":"G08-20","subject":"学科","chapter":"G08","text":"\u003cp>進路の前方に障害物があるときは、あらかじめ一時停止か減速をして、反対方向から来る車に道を譲る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>進路の前方に障害物があるときは、あらかじめ一時停止か減速をして、反対方向からの車に道を譲ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第6節5（2） 行き違い","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（2）進路の前方に障害物があるときは、あらかじめ一時停止か減速をして、反対方向からの車に道を譲りましよう。"]}],"section":"G08-4","fixed":true},{"id":"G09-01","subject":"学科","chapter":"G09","text":"\u003cp>右折しようとするときは、対向車線を直進してくる二輪車が見えにくくなることがあるので、十分注意する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>特に右折しようとするときは、対向車線を直進する二輪車が見えにくくなることがあるので、十分注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第7節1（1） 交差点を通行するときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（1）交差点とその付近は、最も事故が多い場所です。交差点（環状交差点を除きます。）に入ろうとするときや、交差点内（環状交差点内を除きます。）を通行するときは、右折車、歩行者などに気を配りながら、交差点の状況に応じてできる限り安全な速度と方法で進行しなければなりません。特に右折しようとするときは、対向車線を直進する二輪車が見えにくくなることがあるので、十分注意しましよう。"]}],"section":"G09-1","fixed":true},{"id":"G09-02","subject":"学科","chapter":"G09","text":"\u003cp>車が右左折するときは、内輪差によって、後輪が前輪より外側を通る。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>内輪差は、曲がるとき後輪が前輪より内側を通ることによる、前後輪の軌跡の差です。左側の歩行者や自転車などを巻き込まないよう注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第7節1（3） 交差点を通行するときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（3）車が右左折するときは、内輪差（曲がるとき後輪が前輪より内側を通ることによる前後輪の軌跡の差をいいます。）が生じます。特に大型車は内輪差が大きく、左後方が見えにくいので左側を通行している歩行者、特定小型原動機付自転車や自転車などを巻き込まないよう注意しましよう。"]}],"section":"G09-1","fixed":true},{"id":"G09-03","subject":"学科","chapter":"G09","text":"\u003cp>左折するときは、後ろの車に知らせるため、あらかじめ道路の中央寄りに寄ってから、大きく左に曲がる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>左折するときは、あらかじめその前からできる限り道路の左側端に寄り、できる限り道路の左側端に沿って徐行しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第34条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_34-Pr_1","lines":["車両は、左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、できる限り道路の左側端に沿つて（道路標識等により通行すべき部分が指定されているときは、その指定された部分を通行して）徐行しなければならない。"]},{"label":"交通の方法に関する教則 第5章第7節2（1） 交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（1）左折しようとするときは、あらかじめできるだけ道路の左端に寄り、交差点の側端に沿つて徐行しながら通行しなければなりません。"]}],"section":"G09-2","fixed":true},{"id":"G09-04","subject":"学科","chapter":"G09","text":"\u003cp>自動車が右折するときは、あらかじめできるだけ道路の中央に寄り、交差点の中心のすぐ内側を徐行しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動車が右折するときは、あらかじめ道路の中央に寄り、交差点の中心の直近の内側を徐行します。\u003c/p>","refs":[{"label":"道路交通法 第34条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_34-Pr_2","lines":["自動車、一般原動機付自転車又はトロリーバスは、右折するときは、あらかじめその前からできる限り道路の中央に寄り、かつ、交差点の中心の直近の内側（道路標識等により通行すべき部分が指定されているときは、その指定された部分）を徐行しなければならない。"]}],"section":"G09-2","fixed":true},{"id":"G09-05","subject":"学科","chapter":"G09","text":"\u003cp>自動車が右折するときは、交差点の中心のすぐ外側を、できるだけ大回りして通行する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自動車が右折するときは、交差点の中心のすぐ内側を通行します。大回りではなく、小回りです。\u003c/p>","refs":[{"label":"道路交通法 第34条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_34-Pr_2","lines":["自動車、一般原動機付自転車又はトロリーバスは、右折するときは、あらかじめその前からできる限り道路の中央に寄り、かつ、交差点の中心の直近の内側（道路標識等により通行すべき部分が指定されているときは、その指定された部分）を徐行しなければならない。"]},{"label":"交通の方法に関する教則 第5章第7節2（2） 交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（2）右折しようとするときは、あらかじめできるだけ道路の中央に寄り、交差点の中心のすぐ内側を徐行しながら通行しなければなりません。ただし、一般原動機付自転車が二段階の右折方法により右折しようとするときは別です。"]}],"section":"G09-2","fixed":true},{"id":"G09-06","subject":"学科","chapter":"G09","text":"\u003cp>一方通行の道路から右折するときは、あらかじめ道路の右端に寄り、交差点の中心の内側を徐行する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>一方通行となっている道路において右折するときは、あらかじめできる限り道路の右側端に寄り、交差点の中心の内側を徐行します。\u003c/p>","refs":[{"label":"道路交通法 第34条第4項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_34-Pr_4","lines":["自動車、一般原動機付自転車又はトロリーバスは、一方通行となつている道路において右折するときは、第二項の規定にかかわらず、あらかじめその前からできる限り道路の右側端に寄り、かつ、交差点の中心の内側（道路標識等により通行すべき部分が指定されているときは、その指定された部分）を徐行しなければならない。"]}],"section":"G09-2","fixed":true},{"id":"G09-07","subject":"学科","chapter":"G09","text":"\u003cp>標識で進行方向が直進と左折に指定されている交差点では、右折してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>標識によって直進や左折など進行方向が指定されている交差点では、その指定された方向にしか進行してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第7節2（7） 交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（7）標識（付表３（１）12）によつて直進や左折など進行方向が指定されている交差点では、その指定された方向にしか進行してはいけません。"]}],"section":"G09-2","fixed":true},{"id":"G09-08","subject":"学科","chapter":"G09","text":"\u003cp>交差点で右折しようとするとき、自分の車が先に交差点に入っていれば、直進してくる対向車より先に右折してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>右折する場合に、その交差点で直進か左折をする車があるときは、自分の車が先に交差点に入っていても、その進行を妨げてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第37条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_37","lines":["第三十七条　車両等は、交差点で右折する場合において、当該交差点において直進し、又は左折しようとする車両等があるときは、当該車両等の進行妨害をしてはならない。"]},{"label":"交通の方法に関する教則 第5章第7節2（5） 交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（5）右折しようとする場合に、その交差点で直進か左折をする車や路面電車があるときは、自分の車が先に交差点に入つていても、その進行を妨げてはいけません。"]}],"section":"G09-3","fixed":true},{"id":"G09-09","subject":"学科","chapter":"G09","text":"\u003cp>前方が混雑していて、交差点内で止まってしまうおそれがあるときは、信号が青でも交差点に入ってはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前方の車両等の状況により、交差点内で停止することとなり交差方向の車の通行を妨げるおそれがあるときは、信号が青でも交差点に入ってはいけません。\u003c/p>","refs":[{"label":"道路交通法 第50条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_50-Pr_1","lines":["交通整理の行なわれている交差点に入ろうとする車両等は、その進行しようとする進路の前方の車両等の状況により、交差点（交差点内に道路標識等による停止線が設けられているときは、その停止線をこえた部分。以下この項において同じ。）に入つた場合においては当該交差点内で停止することとなり、よつて交差道路における車両等の通行の妨害となるおそれがあるときは、当該交差点に入つてはならない。"]},{"label":"交通の方法に関する教則 第5章第7節2（9） 交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（9）前方の交通が混雑しているため交差点内で止まつてしまい交差方向の車の通行を妨げるおそれがあるときは、信号が青でも交差点に入つてはいけません。また、警察署や消防署の前などで「停止禁止部分」の標示（付表３（２）８）のある場所や横断歩道や踏切で動きがとれなくなるおそれがあるときも同じです。（昭60公安告11・平３公安告４・平４公安告４・平20公安告７・平26公安告21・令５公安告15・一部改正）"]}],"section":"G09-3","fixed":true},{"id":"G09-10","subject":"学科","chapter":"G09","text":"\u003cp>「停止禁止部分」の標示のある場所で止まってしまうおそれがあるときは、その部分に入ってはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前方の状況により、横断歩道、自転車横断帯、踏切や「停止禁止部分」などの標示で区画された部分で止まることになるおそれがあるときは、その部分に入ってはいけません。\u003c/p>","refs":[{"label":"道路交通法 第50条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_50-Pr_2","lines":["車両等は、その進行しようとする進路の前方の車両等の状況により、横断歩道、自転車横断帯、踏切又は道路標示によつて区画された部分に入つた場合においてはその部分で停止することとなるおそれがあるときは、これらの部分に入つてはならない。"]},{"label":"交通の方法に関する教則 第5章第7節2（9） 交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56","site":"警察庁の教則の全文（PDF）","lines":["（9）前方の交通が混雑しているため交差点内で止まつてしまい交差方向の車の通行を妨げるおそれがあるときは、信号が青でも交差点に入つてはいけません。また、警察署や消防署の前などで「停止禁止部分」の標示（付表３（２）８）のある場所や横断歩道や踏切で動きがとれなくなるおそれがあるときも同じです。（昭60公安告11・平３公安告４・平４公安告４・平20公安告７・平26公安告21・令５公安告15・一部改正）"]}],"section":"G09-3","fixed":true},{"id":"G09-11","subject":"学科","chapter":"G09","text":"\u003cp>交通整理の行われていない交差点で、交差する道路が優先道路のときでも、自分の車が先に交差点に入れば、優先道路の車より先に進んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>交差する道路が優先道路であるときや、その幅が広いときは、徐行するとともに、交差する道路を通行する車や路面電車の進行を妨げてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第7節3（1） 交通整理の行われていない交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=57","site":"警察庁の教則の全文（PDF）","lines":["（1）交差する道路が優先道路であるときやその幅が広いときは、徐行するとともに、交差する道路を通行する車や路面電車の進行を妨げてはいけません。"]}],"section":"G09-4","fixed":true},{"id":"G09-12","subject":"学科","chapter":"G09","text":"\u003cp>交通整理の行われていない、道幅が同じような道路の交差点では、右方から来る車の進行を妨げてはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>道幅が同じような道路の交差点では、路面電車や左方から来る車の進行を妨げてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第7節3（2） 交通整理の行われていない交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=57","site":"警察庁の教則の全文（PDF）","lines":["（2）道幅が同じような道路の交差点では、路面電車や左方から来る車があるときは、その路面電車や車の進行を妨げてはいけません。"]},{"label":"道路交通法 第36条第1項第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_36-Pr_1-It_1","lines":["車両等は、交通整理の行なわれていない交差点においては、次項の規定が適用される場合を除き、次の各号に掲げる区分に従い、当該各号に掲げる車両等の進行妨害をしてはならない。","一　車両である場合　その通行している道路と交差する道路（以下「交差道路」という。）を左方から進行してくる車両及び交差道路を通行する路面電車"]}],"section":"G09-4","fixed":true},{"id":"G09-13","subject":"学科","chapter":"G09","text":"\u003cp>「一時停止」の標識がある交差点で、停止線がないときは、交差点の直前で一時停止する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>「一時停止」の標識があるときは、停止線の直前（停止線がないときは、交差点の直前）で一時停止をし、交差する道路を通行する車などの進行を妨げてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第43条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_43","lines":["（指定場所における一時停止）","第四十三条　車両等は、交通整理が行なわれていない交差点又はその手前の直近において、道路標識等により一時停止すべきことが指定されているときは、道路標識等による停止線の直前（道路標識等による停止線が設けられていない場合にあつては、交差点の直前）で一時停止しなければならない。この場合において、当該車両等は、第三十六条第二項の規定に該当する場合のほか、交差道路を通行する車両等の進行妨害をしてはならない。"]},{"label":"交通の方法に関する教則 第5章第7節3（3） 交通整理の行われていない交差点（環状交差点を除きます。）の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=57","site":"警察庁の教則の全文（PDF）","lines":["（3）「一時停止」の標識（付表３（１）40）があるときは、停止線の直前（停止線がないときは、交差点の直前）で一時停止をするとともに、交差する道路を通行する車や路面電車の進行を妨げてはいけません。また、進行方向に赤の点滅信号があるときも同じです。"]}],"section":"G09-4","fixed":true},{"id":"G09-14","subject":"学科","chapter":"G09","text":"\u003cp>「一時停止」の標識のある交差点では、一時停止をすれば、交差する道路の車より先に進んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>一時停止をしたあとも、交差する道路を通行する車や路面電車の進行を妨げてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第43条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_43","lines":["（指定場所における一時停止）","第四十三条　車両等は、交通整理が行なわれていない交差点又はその手前の直近において、道路標識等により一時停止すべきことが指定されているときは、道路標識等による停止線の直前（道路標識等による停止線が設けられていない場合にあつては、交差点の直前）で一時停止しなければならない。この場合において、当該車両等は、第三十六条第二項の規定に該当する場合のほか、交差道路を通行する車両等の進行妨害をしてはならない。"]}],"section":"G09-4","fixed":true},{"id":"G09-15","subject":"学科","chapter":"G09","text":"\u003cp>環状交差点で右折するときは、あらかじめできるだけ道路の中央に寄り、環状交差点の中心の内側を通行する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>環状交差点では、左折、右折、直進、転回のどれでも、あらかじめできるだけ道路の左端に寄り、環状交差点の側端に沿って徐行します。\u003c/p>","refs":[{"label":"道路交通法 第35条の2第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_35_2-Pr_1","lines":["車両は、環状交差点において左折し、又は右折するときは、第三十四条第一項から第五項までの規定にかかわらず、あらかじめその前からできる限り道路の左側端に寄り、かつ、できる限り環状交差点の側端に沿つて（道路標識等により通行すべき部分が指定されているときは、その指定された部分を通行して）徐行しなければならない。"]},{"label":"交通の方法に関する教則 第5章第7節4（1） 環状交差点の通行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=58","site":"警察庁の教則の全文（PDF）","lines":["（1）左折、右折、直進、転回しようとするときは、あらかじめできるだけ道路の左端に寄り、環状交差点の側端に沿つて徐行しながら通行しなければなりません。"]}],"section":"G09-5","fixed":true},{"id":"G09-16","subject":"学科","chapter":"G09","text":"\u003cp>環状交差点に入ろうとするときは、徐行するとともに、環状交差点内を通行する車の進行を妨げてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>環状交差点に入ろうとするときは徐行し、環状交差点内を通行する車両等の進行妨害をしてはいけません。\u003c/p>","refs":[{"label":"道路交通法 第37条の2第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_37_2-Pr_1","lines":["車両等は、環状交差点においては、第三十六条第一項及び第二項並びに前条の規定にかかわらず、当該環状交差点内を通行する車両等の進行妨害をしてはならない。"]},{"label":"道路交通法 第37条の2第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_37_2-Pr_2","lines":["車両等は、環状交差点に入ろうとするときは、第三十六条第三項の規定にかかわらず、徐行しなければならない。"]}],"section":"G09-5","fixed":true},{"id":"G09-17","subject":"学科","chapter":"G09","text":"\u003cp>環状交差点を出るときは、出ようとする出口の直前の出口の側方を通過したときに、左側の方向指示器を操作して合図をする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>環状交差点を出るときの合図は、出ようとする地点の直前の出口の側方を通過したとき（入った直後の出口を出る場合は、環状交差点に入ったとき）に、左側の方向指示器などで行います。\u003c/p>","refs":[{"label":"道路交通法施行令 第21条第2項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_2","lines":["法第五十三条第二項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。","合図を行う場合｜合図を行う時期｜合図の方法","環状交差点を出るとき。｜その行為をしようとする地点の直前の出口の側方を通過したとき（環状交差点に入つた直後の出口を出る場合にあつては、当該環状交差点に入つたとき）。｜左腕を車体の左側の外に出して水平に伸ばし、若しくは右腕を車体の右側の外に出して肘を垂直に上に曲げること、又は左側の方向指示器を操作すること。"]}],"section":"G09-5","fixed":true},{"id":"G10-01","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車はクラッチ操作が要らず運転が楽なので、マニュアル車より気軽に扱ってよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>クラッチ操作がいらない分、操作の負担が軽減されますが、安易な気持ちで取り扱ってはいけません。運転の基本を理解し、正確に操作することが必要です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（1） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（1）運転に当たつての心構えオートマチック車の運転には、クラッチ操作がいらないので、その分操作の負担が軽減され、運転が楽になりますが、安易な気持ちで取り扱つてはいけません。オートマチック車の運転の基本を理解し、正確に操作することが安全運転のために必要です。"]}],"section":"G10-1","fixed":true},{"id":"G10-02","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車のエンジンを掛ける前には、ブレーキペダルを踏んでその位置を確かめ、アクセルペダルの位置を目で見て確かめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>エンジンを始動する前に、ブレーキペダルを踏んでその位置を確認し、アクセルペダルの位置を目で見て確認します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（2） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（2）エンジンの始動","アエンジンを始動する前に、ブレーキペダルを踏んでその位置を確認し、アクセルペダルの位置を目で見て確認しましよう。","イハンドブレーキが掛かつており、チェンジレバーがPの位置にあることを確認した上で、ブレーキペダルを踏み、エンジンを始動しましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-03","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車のエンジンは、チェンジレバーが P の位置にあることを確かめ、ブレーキペダルを踏んで始動する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>ハンドブレーキが掛かっていて、チェンジレバーが P の位置にあることを確認した上で、ブレーキペダルを踏み、エンジンを始動します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（2） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（2）エンジンの始動","アエンジンを始動する前に、ブレーキペダルを踏んでその位置を確認し、アクセルペダルの位置を目で見て確認しましよう。","イハンドブレーキが掛かつており、チェンジレバーがPの位置にあることを確認した上で、ブレーキペダルを踏み、エンジンを始動しましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-04","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車で発進するときは、チェンジレバーを D に入れてから、ブレーキペダルを踏む。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ブレーキペダルをしっかり踏んだまま、チェンジレバーを D（後退は R）に入れます。ブレーキを踏まずにレバーを操作すると、急発進や突然の後退が起きることがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（3） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（3）発進ブレーキペダルをしつかりと踏んだまま、チェンジレバーを前進のときはDに、後退のときはRに入れ、その位置が間違つていないことを目で見て確認した上で、ハンドブレーキを戻して、ブレーキペダルを徐々に放し、アクセルペダルを静かに踏んで発進しましよう。","ブレーキペダルをしつかり踏んでチェンジレバーを操作しないと、急発進したり、突然後退したりすることがあります。","なお、エンジン始動直後やエアコン作動時は、エンジンの回転数が高くなり、急発進する危険がありますので、ブレーキペダルを特にしつかりと踏みましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-05","subject":"学科","chapter":"G10","text":"\u003cp>エンジンを掛けた直後や、エアコンが作動しているときは、エンジンの回転数が高くなり急発進する危険があるので、ブレーキペダルを特にしっかり踏む。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>エンジン始動直後やエアコン作動時は、エンジンの回転数が高くなり、急発進する危険があるので、ブレーキペダルを特にしっかりと踏みます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（3） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（3）発進ブレーキペダルをしつかりと踏んだまま、チェンジレバーを前進のときはDに、後退のときはRに入れ、その位置が間違つていないことを目で見て確認した上で、ハンドブレーキを戻して、ブレーキペダルを徐々に放し、アクセルペダルを静かに踏んで発進しましよう。","ブレーキペダルをしつかり踏んでチェンジレバーを操作しないと、急発進したり、突然後退したりすることがあります。","なお、エンジン始動直後やエアコン作動時は、エンジンの回転数が高くなり、急発進する危険がありますので、ブレーキペダルを特にしつかりと踏みましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-06","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車は、チェンジレバーが D の位置でも、アクセルペダルを踏まなければ動き出さない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ブレーキペダルをしっかり踏んでおかないと、アクセルペダルを踏まなくても車がゆっくり動き出します（クリープ現象）。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（4） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（4）交差点などで停止したとき停止中は、必ずブレーキペダルをしつかり踏んでおき、念のためハンドブレーキも掛けておきましよう。停止時間が長くなりそうなときは、チェンジレバーをNに入れておきましよう。","ブレーキペダルをしつかり踏んでおかないと、アクセルペダルを踏まなくても自動車がゆつくり動き出し（クリープ現象）、追突などの思わぬ事故を起こすことがありますので注意しましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-07","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車で、交差点などでの停止時間が長くなりそうなときは、チェンジレバーを N に入れておく。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>停止中は必ずブレーキペダルをしっかり踏んでおき、停止時間が長くなりそうなときは、チェンジレバーを N に入れておきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（4） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（4）交差点などで停止したとき停止中は、必ずブレーキペダルをしつかり踏んでおき、念のためハンドブレーキも掛けておきましよう。停止時間が長くなりそうなときは、チェンジレバーをNに入れておきましよう。","ブレーキペダルをしつかり踏んでおかないと、アクセルペダルを踏まなくても自動車がゆつくり動き出し（クリープ現象）、追突などの思わぬ事故を起こすことがありますので注意しましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-08","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車を駐車するときは、ブレーキペダルを踏んだままハンドブレーキを確実に掛けてから、チェンジレバーを P に入れる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>駐車の際には、ブレーキペダルを踏んだままハンドブレーキを確実に掛けてから、チェンジレバーを P に入れます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（5） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（5）駐車駐車の際には、ブレーキペダルを踏んだままハンドブレーキを確実に掛けてから、チェンジレバーをPに入れましよう。自動車が完全に停止しないうちにチェンジレバーをPに入れるのはやめましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-09","subject":"学科","chapter":"G10","text":"\u003cp>オートマチック車は、完全に停止する前にチェンジレバーを P に入れると、早く止まることができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自動車が完全に停止しないうちにチェンジレバーを P に入れてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節1（5） オートマチック車の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63","site":"警察庁の教則の全文（PDF）","lines":["（5）駐車駐車の際には、ブレーキペダルを踏んだままハンドブレーキを確実に掛けてから、チェンジレバーをPに入れましよう。自動車が完全に停止しないうちにチェンジレバーをPに入れるのはやめましよう。"]}],"section":"G10-1","fixed":true},{"id":"G10-10","subject":"学科","chapter":"G10","text":"\u003cp>衝突被害軽減ブレーキなどの安全運転を支援するシステムには限界があるので、その技術を過信せずに運転する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>先進安全自動車のシステムには、一定以上の速度では適切に作動しない場合があるなどの限界があります。限界や注意点を正しく理解し、過信せずに運転します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節2 先進安全自動車（ASV）の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=64","site":"警察庁の教則の全文（PDF）","lines":["先進安全自動車（ASV）（注９）は、先進技術を利用して運転者の安全運転を支援するシステムが搭載された自動車ですが、このシステムは、例えば、一定以上の速度で走行している場合には、適切に作動しない場合があるなどの限界があります。自動運行装置とは異なり、運転者が絶えず周囲の状況を確認しながら必要な運転操作を行うことを前提とした運転支援技術ですので、その限界や注意点を正しく理解し、その技術を過信せずに運転しましよう。"]}],"section":"G10-2","fixed":true},{"id":"G10-11","subject":"学科","chapter":"G10","text":"\u003cp>先進安全自動車の運転支援システムは、運転者が周囲の状況を確かめなくても安全に走れることを前提とした技術である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転支援技術は、運転者が絶えず周囲の状況を確認しながら必要な運転操作を行うことを前提としています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節2 先進安全自動車（ASV）の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=64","site":"警察庁の教則の全文（PDF）","lines":["先進安全自動車（ASV）（注９）は、先進技術を利用して運転者の安全運転を支援するシステムが搭載された自動車ですが、このシステムは、例えば、一定以上の速度で走行している場合には、適切に作動しない場合があるなどの限界があります。自動運行装置とは異なり、運転者が絶えず周囲の状況を確認しながら必要な運転操作を行うことを前提とした運転支援技術ですので、その限界や注意点を正しく理解し、その技術を過信せずに運転しましよう。"]}],"section":"G10-2","fixed":true},{"id":"G10-12","subject":"学科","chapter":"G10","text":"\u003cp>自動運行装置は、その装置の使用条件を満たさない場合には、使って運転してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動運行装置を備えている自動車の運転者は、使用条件を満たさない場合に、その自動運行装置を使用して運転してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第71条の4の2第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71_4_2-Pr_1","lines":["自動運行装置を備えている自動車の運転者は、当該自動運行装置に係る使用条件を満たさない場合においては、当該自動運行装置を使用して当該自動車を運転してはならない。"]}],"section":"G10-2","fixed":true},{"id":"G10-13","subject":"学科","chapter":"G10","text":"\u003cp>自動運行装置を使って運転しているときは、引継ぎの要請があるまでは、運転操作を引き継げる状態でいる必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自動運行装置を使って運転しているときは、引継ぎ要請や自動運転車の異常を直ちに認知し、運転操作を引き継ぐことができる状態でいなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節3（3） 自動運転車","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=64","site":"警察庁の教則の全文（PDF）","lines":["（3）自動運行装置を使つて運転する場合の遵守事項自動運行装置を使つて自動車を運転しているときは、自動運行装置から発せられる運転操作の引継ぎ要請や自動運転車の異常を直ちに認知し、かつ、運転操作を引き継ぐことができる状態でいなければなりません。"]}],"section":"G10-2","fixed":true},{"id":"G10-14","subject":"学科","chapter":"G10","text":"\u003cp>自動運行装置を使って運転しているときは、装置が運転するので、運転者には安全運転の責任はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自動運行装置を使って運転する場合でも、運転者として責任を持って安全運転をしなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第9節3（1） 自動運転車","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=64","site":"警察庁の教則の全文（PDF）","lines":["（1）運転に当たつての心構え自動運行装置を使つて運転する場合であつても、運転者として責任を持つて安全運転をしなければなりません。自動運行装置を使つて運転する際には、その自動運行装置の使用条件の内容、性能及び使用方法を正しく理解し、過信せずに適切に使つて運転しましよう。"]}],"section":"G10-2","fixed":true},{"id":"G11-01","subject":"学科","chapter":"G11","text":"\u003cp>踏切を通過しようとするときは、その直前（停止線があるときはその直前）で一時停止し、安全を確かめなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>踏切を通過しようとするときは、踏切の直前で停止し、安全であることを確認した後でなければ進行してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第33条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_5-At_33-Pr_1","lines":["車両等は、踏切を通過しようとするときは、踏切の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止し、かつ、安全であることを確認した後でなければ進行してはならない。ただし、信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができる。"]}],"section":"G11-1","fixed":true},{"id":"G11-02","subject":"学科","chapter":"G11","text":"\u003cp>信号機のある踏切で青色の灯火の信号が出ているときは、一時停止をしないで通過することができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができます。\u003c/p>","refs":[{"label":"道路交通法 第33条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_5-At_33-Pr_1","lines":["車両等は、踏切を通過しようとするときは、踏切の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止し、かつ、安全であることを確認した後でなければ進行してはならない。ただし、信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができる。"]}],"section":"G11-1","fixed":true},{"id":"G11-03","subject":"学科","chapter":"G11","text":"\u003cp>踏切で安全を確かめるときは、窓を閉めたまま、目で左右を見れば十分である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>踏切の直前で一時停止をし、窓を開けるなどして、自分の目と耳で左右の安全を確かめなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節1（1） 一時停止と安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=65","site":"警察庁の教則の全文（PDF）","lines":["（1）踏切では、死亡・重傷事故のような大きな事故が起こりがちです。踏切を通過しようとするときは、その直前（停止線があるときは、その直前）で一時停止をし、窓を開けるなどして自分の目と耳で左右の安全を確かめなければなりません。なお、踏切に信号機のある場合は、信号に従つて通過することができます。"]}],"section":"G11-1","fixed":true},{"id":"G11-04","subject":"学科","chapter":"G11","text":"\u003cp>踏切で一方から列車が通過したときは、その直後に反対方向から列車が来ることはないので、すぐに踏切に入ってよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>一方からの列車が通過しても、その直後に反対の方向からの列車が近づいて来ることがあるので、十分注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節1（2） 一時停止と安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=65","site":"警察庁の教則の全文（PDF）","lines":["（2）安全を確認する場合、一方からの列車が通過しても、その直後に反対の方向からの列車が近づいて来ることがありますから十分注意しましよう。"]}],"section":"G11-1","fixed":true},{"id":"G11-05","subject":"学科","chapter":"G11","text":"\u003cp>踏切の遮断機が降り始めていても、列車が見えなければ、急いで踏切を通過してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>遮断機が閉じようとしているとき、閉じているとき、警報機が鳴っているときは、踏切に入ってはいけません。\u003c/p>","refs":[{"label":"道路交通法 第33条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_5-At_33-Pr_2","lines":["車両等は、踏切を通過しようとする場合において、踏切の遮断機が閉じようとし、若しくは閉じている間又は踏切の警報機が警報している間は、当該踏切に入つてはならない。"]}],"section":"G11-1","fixed":true},{"id":"G11-06","subject":"学科","chapter":"G11","text":"\u003cp>前の車に続いて踏切を通過するときは、前の車が安全を確かめているので、一時停止しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>前の車に続いて通過するときでも、一時停止をし、安全を確かめなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節1（4） 一時停止と安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=65","site":"警察庁の教則の全文（PDF）","lines":["（4）前の車に続いて通過するときでも、一時停止をし、安全を確かめなければなりません。また、踏切の向こう側が混雑しているため、そのまま進むと踏切内で動きがとれなくなるおそれがあるときは、入つてはいけません。"]}],"section":"G11-1","fixed":true},{"id":"G11-07","subject":"学科","chapter":"G11","text":"\u003cp>踏切の向こう側が混雑していて、そのまま進むと踏切内で止まってしまうおそれがあるときは、踏切に入ってはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>踏切の向こう側が混雑していて、踏切内で動きがとれなくなるおそれがあるときは、踏切に入ってはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節1（4） 一時停止と安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=65","site":"警察庁の教則の全文（PDF）","lines":["（4）前の車に続いて通過するときでも、一時停止をし、安全を確かめなければなりません。また、踏切の向こう側が混雑しているため、そのまま進むと踏切内で動きがとれなくなるおそれがあるときは、入つてはいけません。"]},{"label":"道路交通法 第50条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_50-Pr_2","lines":["車両等は、その進行しようとする進路の前方の車両等の状況により、横断歩道、自転車横断帯、踏切又は道路標示によつて区画された部分に入つた場合においてはその部分で停止することとなるおそれがあるときは、これらの部分に入つてはならない。"]}],"section":"G11-1","fixed":true},{"id":"G11-08","subject":"学科","chapter":"G11","text":"\u003cp>踏切内では、早く通過するため、途中でギアを高速に切り替える。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>踏切内では、エンストを防止するため、変速しないで、発進したときの低速ギアのまま一気に通過します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節1（5） 一時停止と安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=65","site":"警察庁の教則の全文（PDF）","lines":["（5）踏切内では、エンストを防止するため、変速しないで、発進したときの低速ギアのまま一気に通過しましよう。また、歩行者や対向車に注意しながら、落輪しないようにやや中央寄りを通りましよう。"]}],"section":"G11-1","fixed":true},{"id":"G11-09","subject":"学科","chapter":"G11","text":"\u003cp>踏切内では、対向車に注意して、できるだけ左端に寄って通過する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>踏切内では、歩行者や対向車に注意しながら、落輪しないようにやや中央寄りを通ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節1（5） 一時停止と安全確認","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=65","site":"警察庁の教則の全文（PDF）","lines":["（5）踏切内では、エンストを防止するため、変速しないで、発進したときの低速ギアのまま一気に通過しましよう。また、歩行者や対向車に注意しながら、落輪しないようにやや中央寄りを通りましよう。"]}],"section":"G11-1","fixed":true},{"id":"G11-10","subject":"学科","chapter":"G11","text":"\u003cp>踏切で車が動かなくなったときは、踏切支障報知装置や発炎筒などで列車に知らせるとともに、車を踏切の外に移動させる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>踏切で動かなくなったときは、踏切支障報知装置を活用したり、発炎筒などで合図をしたりして、一刻も早く列車の運転士などに知らせ、車を踏切の外に移動させます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第1節2 踏切で故障したとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["踏切で動かなくなつたときは、次の要領で一刻も早く列車の運転士などに知らせるとともに、車を踏切の外に移動させなければなりません。","（1）警報機のある踏切では、警報機の柱などに取り付けられている押しボタン式の踏切支障報知装置を活用する。","（2）踏切支障報知装置のないところでは、携帯している発炎筒などを使い列車に分かるようにできるだけ早く合図をする。","（3）発炎筒などがなかつたり、使い切つてしまつたりしたときは、煙の出やすいものを付近で燃やすなどして合図をする。"]},{"label":"道路交通法 第33条第3項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_5-At_33-Pr_3","lines":["車両等の運転者は、故障その他の理由により踏切において当該車両等を運転することができなくなつたときは、直ちに非常信号を行う等踏切に故障その他の理由により停止している車両等があることを鉄道若しくは軌道の係員又は警察官に知らせるための措置を講ずるとともに、当該車両等を踏切以外の場所に移動するため必要な措置を講じなければならない。"]}],"section":"G11-2","fixed":true},{"id":"G11-11","subject":"学科","chapter":"G11","text":"\u003cp>上り坂で前の車に続いて止まるときは、前の車が後退してくることがあるので、接近し過ぎないようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>上り坂で前の車に続いて停車するときは、前の車が後退して衝突することがあるので、余り接近し過ぎないようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（1） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（1）上り坂で前の車に続いて停車するときは、余り接近し過ぎないようにしましよう。前の車が後退して衝突することがあります。"]}],"section":"G11-3","fixed":true},{"id":"G11-12","subject":"学科","chapter":"G11","text":"\u003cp>上り坂で発進するときは、できるだけハンドブレーキを利用する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>上り坂で発進するときは、できるだけハンドブレーキを利用します。クラッチ操作だけで発進しようとすると、失敗して後退し、後ろの車と衝突することがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（2） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（2）上り坂で発進するときは、できるだけハンドブレーキを利用しましよう。クラッチ操作だけで発進しようとすると、失敗して車が後退し、後ろの車と衝突することがあります。"]}],"section":"G11-3","fixed":true},{"id":"G11-13","subject":"学科","chapter":"G11","text":"\u003cp>長い下り坂では、エンジンブレーキはあまり使わず、フットブレーキをこまめに使って速度を調節する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>下り坂では、低速のギアを用いてエンジンブレーキを活用します。長い下り坂でフットブレーキをひんぱんに使い過ぎると、急にブレーキが効かなくなることがあり危険です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（4） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（4）下り坂では、低速のギアを用い（オートマチック車ではチェンジレバーを２かL（又は１）に入れ）、エンジンブレーキを活用しましよう。長い下り坂で、フットブレーキをひんぱんに使い過ぎると、急にブレーキが効かなくなることがあり危険です。"]}],"section":"G11-3","fixed":true},{"id":"G11-14","subject":"学科","chapter":"G11","text":"\u003cp>オートマチック車で下り坂を走るときは、チェンジレバーを 2 か L（又は 1）に入れて、エンジンブレーキを使う。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>下り坂では、オートマチック車ではチェンジレバーを 2 か L（又は 1）に入れ、エンジンブレーキを活用します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（4） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（4）下り坂では、低速のギアを用い（オートマチック車ではチェンジレバーを２かL（又は１）に入れ）、エンジンブレーキを活用しましよう。長い下り坂で、フットブレーキをひんぱんに使い過ぎると、急にブレーキが効かなくなることがあり危険です。"]}],"section":"G11-3","fixed":true},{"id":"G11-15","subject":"学科","chapter":"G11","text":"\u003cp>下り坂では停止距離が短くなるので、平地より車間距離を詰めてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>下り坂では加速がつき、停止距離が長くなるので、車間距離を広くとります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（5） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（5）下り坂では、車間距離を広くとりましよう。加速がつき、停止距離が長くなるので危険です。"]}],"section":"G11-3","fixed":true},{"id":"G11-16","subject":"学科","chapter":"G11","text":"\u003cp>坂道で行き違うときは、上り坂での発進がむずかしいので、下りの車が上りの車に道を譲る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>坂道では、上り坂での発進がむずかしいため、下りの車が上りの車に道を譲ります。近くに待避所があるときは、上りの車でもその待避所に入って待ちます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（6） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（6）坂道では、上り坂での発進がむずかしいため、下りの車が、上りの車に道を譲りましよう。しかし、近くに待避所があるときは、上りの車でも、その待避所に入つて待ちましよう。"]}],"section":"G11-3","fixed":true},{"id":"G11-17","subject":"学科","chapter":"G11","text":"\u003cp>片側が転落のおそれのあるがけになっている道路で、安全な行き違いができないときは、がけ側でない車が一時停止して道を譲る。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>安全な行き違いができないときは、がけ側の車が一時停止をして道を譲ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節1（8） 坂道・山道","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66","site":"警察庁の教則の全文（PDF）","lines":["（8）片側が転落のおそれのあるがけになつている道路で、安全な行き違いができないときは、がけ側の車は一時停止をして道を譲りましよう。"]}],"section":"G11-3","fixed":true},{"id":"G11-18","subject":"学科","chapter":"G11","text":"\u003cp>カーブでは、手前の直線部分で十分速度を落とし、ハンドルを切りながらブレーキを掛けることは避ける。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>曲がり角やカーブの手前の直線部分で十分スピードを落とします。高速のままハンドルを切ったり、ハンドルを切りながらブレーキを掛けたりすると、横転や横滑りを起こしやすくなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節2（1） 曲がり角・カーブ","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67","site":"警察庁の教則の全文（PDF）","lines":["（1）曲がり角やカーブに近づくときは、その手前の直線部分で十分スピードを落としましよう。高速のままハンドルを切つたり、ハンドルを切りながらブレーキを掛けたりすると、横転や横滑りを起こしやすくなります。"]}],"section":"G11-4","fixed":true},{"id":"G11-19","subject":"学科","chapter":"G11","text":"\u003cp>曲がり角やカーブを通るときは、内輪差のため、内側の歩行者や自転車を巻き込んだり、後輪が路肩からはみ出したりしないよう注意する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>曲がり角やカーブを通行するときには、内輪差のため、内側にいる歩行者や自転車などを巻き込んだり、後車輪が路肩からはみ出したりするおそれがあるので注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第2節2（4） 曲がり角・カーブ","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67","site":"警察庁の教則の全文（PDF）","lines":["（4）道路の曲がり角やカーブを通行するときには、車の内輪差のため、内側にいる歩行者、特定小型原動機付自転車や自転車などを巻き込んだり、後車輪が路肩からはみ出したりするおそれがありますから注意しましよう。"]}],"section":"G11-4","fixed":true},{"id":"G12-01","subject":"学科","chapter":"G12","text":"\u003cp>ハンドルやブレーキが整備されていないため、交通の危険を生じさせるおそれのある車を運転してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>ハンドル、ブレーキ、マフラーその他の装置が整備されていないため、交通の危険を生じさせたり、有害なガスや騒音でほかの人に迷惑を及ぼしたりするおそれのある車を運転してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第3節 自動車の点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=32","site":"警察庁の教則の全文（PDF）","lines":["自動車については、日常点検、定期点検を行うほか、燃料、冷却水、エンジンオイル、タイヤの溝の深さなどについては適宜点検し、少しでも悪い箇所があつたら、整備しましよう。ハンドル、ブレーキ、マフラーその他の各装置が整備されていないため、交通の危険を生じさせたり、有害なガスや騒音を出してほかの人に迷惑を及ぼしたりするおそれのある車を運転してはいけません。"]},{"label":"道路交通法 第62条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_12-At_62","lines":["（整備不良車両の運転の禁止）","第六十二条　車両等の使用者その他車両等の装置の整備について責任を有する者又は運転者は、その装置が道路運送車両法第三章若しくはこれに基づく命令の規定（同法の規定が適用されない自衛隊の使用する自動車については、自衛隊法（昭和二十九年法律第百六十五号）第百十四条第二項の規定による防衛大臣の定め。以下同じ。）又は軌道法第十四条若しくはこれに基づく命令の規定に定めるところに適合しないため交通の危険を生じさせ、又は他人に迷惑を及ぼすおそれがある車両等（次条第一項及び第七十一条の四の二第二項第一号において「整備不良車両」という。）を運転させ、又は運転してはならない。"]}],"section":"G12-1","fixed":true},{"id":"G12-02","subject":"学科","chapter":"G12","text":"\u003cp>自家用の普通乗用自動車の日常点検は、1 日 1 回、運行の前に必ず行わなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自家用の普通乗用自動車の日常点検は、走行距離や運行時の状態などから判断した適切な時期に行います。1 日 1 回運行前に行わなければならないのは、事業用の自動車やレンタカーなどです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第3節1 日常点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=32","site":"警察庁の教則の全文（PDF）","lines":["日常点検は、自動車の使用者や自動車を運行しようとする者が、日頃自動車を使用していく中で、自分自身の責任において行う点検です。自動車の使用者は、自動車の走行距離や運行時の状態などから判断した適切な時期に、この点検を行わなければなりません。なお、タクシー、ハイヤーなどの事業用の自動車や自家用の大型自動車及び中型自動車、準中型貨物自動車、普通貨物自動車、大型特殊自動車、レンタカーなどの使用者又はこれらの自動車を運行しようとする者は、１日１回、運行する前にこの点検を行わなければなりません。標準的な点検の実施の方法は、次の表のとおりです。点検箇所点検項目点検の実施方法運行中の異常箇所当該箇所の異常前日又は前回の運行中に異常を認めた箇所について、運行に支障がないかを点検します。運転ブレーキペダル踏みしろ、ブレーキのペダルをいつぱいに踏み込んだとき、席で効き床板とのすき間（踏み残りしろ）や踏みの点ごたえが適当であるかを点検します。検なお、床板とのすき間が少なくなつているときや、踏みごたえが柔らかく感じるときは、ブレーキ液の液漏れ、空気の混入によるブレーキの効き不良のおそれがあります。","駐車ブレーキレバー引きしろ（踏みしろ）レバーをいつぱいに引いた（踏んだ）（パーキング・ブレーとき、引きしろ（踏みしろ）が多すぎたキレバー）り、少なすぎたりしないかを点検します。","原動機（エンジン）※掛かり具合、異音エンジンが速やかに始動し、スムーズに回転するかを点検します。また、エンジン始動時及びアイドリング状態で、異音がないかを点検します。","※低速、加速の状態（１）エンジンを暖機させた状態で、アイドリング時の回転がスムーズに続くかを点検します。（２）エンジンを徐々に加速したとき、アクセルペダルに引つ掛かりがないか、また、エンスト、ノッキングなどを起こすことなくスムーズに回転するかを、走行するなどして点検します。","ウインドウ・ウォッシ※噴射状態ウインドウ・ウォッシャ液の噴射の向ャき及び高さが適当かを点検します。","ワイパー※ふき取りの状態（１）ワイパーを作動させ、低速及び高速の作動が不良でないかを点検します。（２）きれいにふき取れるかを点検します。","◎空気圧力計空気圧力の上がり具エンジンを掛けて、空気圧力の上がり合具合が極端に遅くないかを点検します。","また、空気圧力が空気圧力計の表示に示された範囲内にあるかを点検します。","◎ブレーキバルブ排気音ブレーキペダルを踏み込んで放した場合に、ブレーキバルブからの排気音が正常であるかを点検します。エンウインドウ・ウォッシ※液量ウインドウ・ウォッシャ液の量が適当ジンャ・タンクかを点検します。ルーブレーキのリザーバ・液量リザーバ・タンク内の液量が規定の範ムのタンク囲内にあるかを点検します。点検バッテリー※液量バッテリー各槽の液量が規定の範囲内にあるかを車両を揺らすなどして点検します。","ラジエータなどの冷却※水量リザーバ・タンク内の冷却水の量が規装置定の範囲内にあるかを点検します。","なお、冷却水の量が著しく減少しているときは、ラジエータ、ラジエータホースなどからの水漏れのおそれがあります。","潤滑装置※エンジンオイルのオイルの量がオイルレベル・ゲージ量（油量計）で示された範囲内にあるかを点検します。","△ファンベルト※張り具合、損傷（１）ベルトの中央部を手で押し、ベルトが少したわむ程度であるかを点検します。（２）ベルトに損傷がないかを点検します。車の灯火装置、方向指示器点灯・点滅具合、汚れ、（１）エンジンスイッチを入れ、前照周り損傷灯、制動灯などの灯火装置の点灯具合からや方向指示器の点滅具合が不良でなの点いかを点検します。検（２）レンズなどに汚れや損傷がないかを点検します。","タイヤ空気圧タイヤの接地部のたわみの状態により、空気圧が不足していないかを点検します。","□取付けの状態（１）ディスク・ホイールの取付状態について目視により次の点検を行います。","アホイール・ナットの脱落、ホイール・ボルトの折損などの異常はないか。","イホイール・ボルト付近にさび汁が出たこん跡はないか。","ウホイール・ナットから突出しているホイール・ボルトの長さに不ぞろいはないか。（２）ディスク・ホイールの取付状態について、ホイール・ナットの緩みなどがないかを点検ハンマなどを使用して点検します。","きき亀裂、損傷タイヤの全周に著しい亀裂や損傷がないかを点検します。また、タイヤの全周にわたり、くぎ、石、その他の異物が刺さつたり、かみ込んだりしていないかを点検します。","異常な摩耗タイヤの接地面に、極端にすり減つている箇所がないかを点検します。","※溝の深さ溝の深さが十分であるかをウェア・インジケータ（スリップ・サイン）などにより点検します。","◎エア・タンクタンク内のたまり水ドレン・コックを開いて、タンクに水がたまつていないかを点検します。備考１※の点検項目は、事業用の自動車や自家用の大型自動車及び中型自動車、準中型貨物自動車、普通貨物自動車、大型特殊自動車、レンタカーなどについても、自動車の走行距離、運行時の状態等から判断した適切な時期に行えばよいものです。２◎の点検箇所は、エアブレーキが装着されている場合に点検しなければなりません。３△の点検箇所は、自家用の普通乗用自動車などにあつては、定期点検等の際に点検してください。４□の点検項目は、車両総重量８トン以上又は乗車定員30人以上の自動車の場合に点検してください。"]}],"section":"G12-1","fixed":true},{"id":"G12-03","subject":"学科","chapter":"G12","text":"\u003cp>自家用の普通乗用自動車の定期点検は、6 か月ごとに行わなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自家用の普通乗用自動車などの定期点検は、1 年ごとです。6 か月ごとなのは、自家用の普通貨物自動車やレンタカーなどです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第3節3 定期点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=36","site":"警察庁の教則の全文（PDF）","lines":["事業用の自動車、自家用の大型自動車及び中型自動車や準中型貨物自動車、普通貨物自動車などのレンタカーについては３箇月ごとに、自家用の準中型貨物自動車及び普通貨物自動車や普通乗用自動車などのレンタカーなどについては６箇月ごとに、自家用の普通乗用自動車などについては１年ごとに点検し、必要な整備をしなければなりません。"]}],"section":"G12-1","fixed":true},{"id":"G12-04","subject":"学科","chapter":"G12","text":"\u003cp>日常点検は、自動車の使用者や運転しようとする人が、自分自身の責任で行う点検である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>日常点検は、自動車の使用者や自動車を運行しようとする者が、日頃自動車を使用していく中で、自分自身の責任において行う点検です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第3節1 日常点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=32","site":"警察庁の教則の全文（PDF）","lines":["日常点検は、自動車の使用者や自動車を運行しようとする者が、日頃自動車を使用していく中で、自分自身の責任において行う点検です。自動車の使用者は、自動車の走行距離や運行時の状態などから判断した適切な時期に、この点検を行わなければなりません。なお、タクシー、ハイヤーなどの事業用の自動車や自家用の大型自動車及び中型自動車、準中型貨物自動車、普通貨物自動車、大型特殊自動車、レンタカーなどの使用者又はこれらの自動車を運行しようとする者は、１日１回、運行する前にこの点検を行わなければなりません。標準的な点検の実施の方法は、次の表のとおりです。点検箇所点検項目点検の実施方法運行中の異常箇所当該箇所の異常前日又は前回の運行中に異常を認めた箇所について、運行に支障がないかを点検します。運転ブレーキペダル踏みしろ、ブレーキのペダルをいつぱいに踏み込んだとき、席で効き床板とのすき間（踏み残りしろ）や踏みの点ごたえが適当であるかを点検します。検なお、床板とのすき間が少なくなつているときや、踏みごたえが柔らかく感じるときは、ブレーキ液の液漏れ、空気の混入によるブレーキの効き不良のおそれがあります。","駐車ブレーキレバー引きしろ（踏みしろ）レバーをいつぱいに引いた（踏んだ）（パーキング・ブレーとき、引きしろ（踏みしろ）が多すぎたキレバー）り、少なすぎたりしないかを点検します。","原動機（エンジン）※掛かり具合、異音エンジンが速やかに始動し、スムーズに回転するかを点検します。また、エンジン始動時及びアイドリング状態で、異音がないかを点検します。","※低速、加速の状態（１）エンジンを暖機させた状態で、アイドリング時の回転がスムーズに続くかを点検します。（２）エンジンを徐々に加速したとき、アクセルペダルに引つ掛かりがないか、また、エンスト、ノッキングなどを起こすことなくスムーズに回転するかを、走行するなどして点検します。","ウインドウ・ウォッシ※噴射状態ウインドウ・ウォッシャ液の噴射の向ャき及び高さが適当かを点検します。","ワイパー※ふき取りの状態（１）ワイパーを作動させ、低速及び高速の作動が不良でないかを点検します。（２）きれいにふき取れるかを点検します。","◎空気圧力計空気圧力の上がり具エンジンを掛けて、空気圧力の上がり合具合が極端に遅くないかを点検します。","また、空気圧力が空気圧力計の表示に示された範囲内にあるかを点検します。","◎ブレーキバルブ排気音ブレーキペダルを踏み込んで放した場合に、ブレーキバルブからの排気音が正常であるかを点検します。エンウインドウ・ウォッシ※液量ウインドウ・ウォッシャ液の量が適当ジンャ・タンクかを点検します。ルーブレーキのリザーバ・液量リザーバ・タンク内の液量が規定の範ムのタンク囲内にあるかを点検します。点検バッテリー※液量バッテリー各槽の液量が規定の範囲内にあるかを車両を揺らすなどして点検します。","ラジエータなどの冷却※水量リザーバ・タンク内の冷却水の量が規装置定の範囲内にあるかを点検します。","なお、冷却水の量が著しく減少しているときは、ラジエータ、ラジエータホースなどからの水漏れのおそれがあります。","潤滑装置※エンジンオイルのオイルの量がオイルレベル・ゲージ量（油量計）で示された範囲内にあるかを点検します。","△ファンベルト※張り具合、損傷（１）ベルトの中央部を手で押し、ベルトが少したわむ程度であるかを点検します。（２）ベルトに損傷がないかを点検します。車の灯火装置、方向指示器点灯・点滅具合、汚れ、（１）エンジンスイッチを入れ、前照周り損傷灯、制動灯などの灯火装置の点灯具合からや方向指示器の点滅具合が不良でなの点いかを点検します。検（２）レンズなどに汚れや損傷がないかを点検します。","タイヤ空気圧タイヤの接地部のたわみの状態により、空気圧が不足していないかを点検します。","□取付けの状態（１）ディスク・ホイールの取付状態について目視により次の点検を行います。","アホイール・ナットの脱落、ホイール・ボルトの折損などの異常はないか。","イホイール・ボルト付近にさび汁が出たこん跡はないか。","ウホイール・ナットから突出しているホイール・ボルトの長さに不ぞろいはないか。（２）ディスク・ホイールの取付状態について、ホイール・ナットの緩みなどがないかを点検ハンマなどを使用して点検します。","きき亀裂、損傷タイヤの全周に著しい亀裂や損傷がないかを点検します。また、タイヤの全周にわたり、くぎ、石、その他の異物が刺さつたり、かみ込んだりしていないかを点検します。","異常な摩耗タイヤの接地面に、極端にすり減つている箇所がないかを点検します。","※溝の深さ溝の深さが十分であるかをウェア・インジケータ（スリップ・サイン）などにより点検します。","◎エア・タンクタンク内のたまり水ドレン・コックを開いて、タンクに水がたまつていないかを点検します。備考１※の点検項目は、事業用の自動車や自家用の大型自動車及び中型自動車、準中型貨物自動車、普通貨物自動車、大型特殊自動車、レンタカーなどについても、自動車の走行距離、運行時の状態等から判断した適切な時期に行えばよいものです。２◎の点検箇所は、エアブレーキが装着されている場合に点検しなければなりません。３△の点検箇所は、自家用の普通乗用自動車などにあつては、定期点検等の際に点検してください。４□の点検項目は、車両総重量８トン以上又は乗車定員30人以上の自動車の場合に点検してください。"]}],"section":"G12-1","fixed":true},{"id":"G12-05","subject":"学科","chapter":"G12","text":"\u003cp>ファンベルトは、中央部を手で押してもまったくたわまないくらいに、強く張っているのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ファンベルトは、中央部を手で押して、少したわむ程度であるかを点検します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第3節1 日常点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=32","site":"警察庁の教則の全文（PDF）","lines":["日常点検は、自動車の使用者や自動車を運行しようとする者が、日頃自動車を使用していく中で、自分自身の責任において行う点検です。自動車の使用者は、自動車の走行距離や運行時の状態などから判断した適切な時期に、この点検を行わなければなりません。なお、タクシー、ハイヤーなどの事業用の自動車や自家用の大型自動車及び中型自動車、準中型貨物自動車、普通貨物自動車、大型特殊自動車、レンタカーなどの使用者又はこれらの自動車を運行しようとする者は、１日１回、運行する前にこの点検を行わなければなりません。標準的な点検の実施の方法は、次の表のとおりです。点検箇所点検項目点検の実施方法運行中の異常箇所当該箇所の異常前日又は前回の運行中に異常を認めた箇所について、運行に支障がないかを点検します。運転ブレーキペダル踏みしろ、ブレーキのペダルをいつぱいに踏み込んだとき、席で効き床板とのすき間（踏み残りしろ）や踏みの点ごたえが適当であるかを点検します。検なお、床板とのすき間が少なくなつているときや、踏みごたえが柔らかく感じるときは、ブレーキ液の液漏れ、空気の混入によるブレーキの効き不良のおそれがあります。","駐車ブレーキレバー引きしろ（踏みしろ）レバーをいつぱいに引いた（踏んだ）（パーキング・ブレーとき、引きしろ（踏みしろ）が多すぎたキレバー）り、少なすぎたりしないかを点検します。","原動機（エンジン）※掛かり具合、異音エンジンが速やかに始動し、スムーズに回転するかを点検します。また、エンジン始動時及びアイドリング状態で、異音がないかを点検します。","※低速、加速の状態（１）エンジンを暖機させた状態で、アイドリング時の回転がスムーズに続くかを点検します。（２）エンジンを徐々に加速したとき、アクセルペダルに引つ掛かりがないか、また、エンスト、ノッキングなどを起こすことなくスムーズに回転するかを、走行するなどして点検します。","ウインドウ・ウォッシ※噴射状態ウインドウ・ウォッシャ液の噴射の向ャき及び高さが適当かを点検します。","ワイパー※ふき取りの状態（１）ワイパーを作動させ、低速及び高速の作動が不良でないかを点検します。（２）きれいにふき取れるかを点検します。","◎空気圧力計空気圧力の上がり具エンジンを掛けて、空気圧力の上がり合具合が極端に遅くないかを点検します。","また、空気圧力が空気圧力計の表示に示された範囲内にあるかを点検します。","◎ブレーキバルブ排気音ブレーキペダルを踏み込んで放した場合に、ブレーキバルブからの排気音が正常であるかを点検します。エンウインドウ・ウォッシ※液量ウインドウ・ウォッシャ液の量が適当ジンャ・タンクかを点検します。ルーブレーキのリザーバ・液量リザーバ・タンク内の液量が規定の範ムのタンク囲内にあるかを点検します。点検バッテリー※液量バッテリー各槽の液量が規定の範囲内にあるかを車両を揺らすなど ます。","駐車ブレーキレバー引きしろ（踏みしろ）レバーをいつぱいに引いた（踏んだ）（パーキング・ブレーとき、引きしろ（踏みしろ）が多すぎたキレバー）り、少なすぎたりしないかを点検します。","原動機（エンジン）※掛かり具合、異音エンジンが速やかに始動し、スムーズに回転するかを点検します。また、エンジン始動時及びアイドリング状態で、異音がないかを点検します。","※低速、加速の状態（１）エンジンを暖機させた状態で、アイドリング時の回転がスムーズに続くかを点検します。（２）エンジンを徐々に加速したとき、アクセルペダルに引つ掛かりがないか、また、エンスト、ノッキングなどを起こすことなくスムーズに回転するかを、走行するなどして点検します。","ウインドウ・ウォッシ※噴射状態ウインドウ・ウォッシャ液の噴射の向ャき及び高さが適当かを点検します。","ワイパー※ふき取りの状態（１）ワイパーを作動させ、低速及び高速の作動が不良でないかを点検します。（２）きれいにふき取れるかを点検します。","◎空気圧力計空気圧力の上がり具エンジンを掛けて、空気圧力の上がり合具合が極端に遅くないかを点検します。","また、空気圧力が空気圧力計の表示に示された範囲内にあるかを点検します。","◎ブレーキバルブ排気音ブレーキペダルを踏み込んで放した場合に、ブレーキバルブからの排気音が正常であるかを点検します。エンウインドウ・ウォッシ※液量ウインドウ・ウォッシャ液の量が適当ジンャ・タンクかを点検します。ルーブレーキのリザーバ・液量リザーバ・タンク内の液量が規定の範ムのタンク囲内にあるかを点検します。点検バッテリー※液量バッテリー各槽の液量が規定の範囲内にあるかを車両を揺らすなどして点検します。","ラジエータなどの冷却※水量リザーバ・タンク内の冷却水の量が規装置定の範囲内にあるかを点検します。","なお、冷却水の量が著しく減少しているときは、ラジエータ、ラジエータホースなどからの水漏れのおそれがあります。","潤滑装置※エンジンオイルのオイルの量がオイルレベル・ゲージ量（油量計）で示された範囲内にあるかを点検します。","△ファンベルト※張り具合、損傷（１）ベルトの中央部を手で押し、ベルトが少したわむ程度であるかを点検します。（２）ベルトに損傷がないかを点検します。車の灯火装置、方向指示器点灯・点滅具合、汚れ、（１）エンジンスイッチを入れ、前照周り損傷灯、制動灯などの灯火装置の点灯具合からや方向指示器の点滅具合が不良でなの点いかを点検します。検（２）レンズなどに汚れや損傷がないかを点検します。","タイヤ空気圧タイヤの接地部のたわみの状態により、空気圧が不足していないかを点検します。","□取付けの状態（１）ディスク・ホイールの取付状態について目視により次の点検を行います。","アホイール・ナットの脱落、ホイール・ボルトの折損などの異常はないか。","イホイール・ボルト付近にさび汁が出たこん跡はないか。","ウホイール・ナットから突出しているホイール・ボルトの長さに不ぞろいはないか。（２）ディスク・ホイールの取付状態について、ホイール・ナットの緩みなどがないかを点検ハンマなどを使用して点検します。","きき亀裂、損傷タイヤの全周に著しい亀裂や損傷がないかを点検します。また、タイヤの全周にわたり、くぎ、石、その他の異物が刺さつたり、かみ込んだりしていないかを点検します。","異常な摩耗タイヤの接地面に、極端にすり減つている箇所がないかを点検します。","※溝の深さ溝の深さが十分であるかをウェア・インジケータ（スリップ・サイン）などにより点検します。","◎エア・タンクタンク内のたまり水ドレン・コックを開いて、タンクに水がたまつていないかを点検します。備考１※の点検項目は、事業用の自動車や自家用の大型自動車及び中型自動車、準中型貨物自動車、普通貨物自動車、大型特殊自動車、レンタカーなどについても、自動車の走行距離、運行時の状態等から判断した適切な時期に行えばよいものです。２◎の点検箇所は、エアブレーキが装着されている場合に点検しなければなりません。３△の点検箇所は、自家用の普通乗用自動車などにあつては、定期点検等の際に点検してください。４□の点検項目は、車両総重量８トン以上又は乗車定員30人以上の自動車の場合に点検してください。"]}],"section":"G12-1","fixed":true},{"id":"G12-07","subject":"学科","chapter":"G12","text":"\u003cp>自動車には、発炎筒や赤ランプなどの非常信号用具を備えなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>発炎筒、赤ランプなどの非常信号用具を備えなければなりません。高速道路を通行するときは、停止表示器材も備え付けます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第3節2 装備品などの点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=36","site":"警察庁の教則の全文（PDF）","lines":["発炎筒、赤ランプなどの非常信号用具を備えなければなりません。また、高速道路（高速自動車国道又は自動車専用道路）を通行するときは、故障などで停止していることを示すための停止表示器材を備え付けるようにしましよう。"]}],"section":"G12-2","fixed":true},{"id":"G12-08","subject":"学科","chapter":"G12","text":"\u003cp>普通自動車の乗車定員には、運転者は含まれない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>乗車定員には運転者を含みます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第4節1 乗車と積載","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=37","site":"警察庁の教則の全文（PDF）","lines":["座席でないところに人を乗せたり、荷台や座席でないところに荷物を積んだりしてはいけません。","また、定められた乗車定員（運転者を含みます。）や積載の制限を超えて、人を乗車させたり、物を積んだりしてはいけません。次の表は、大型自動車、中型自動車、準中型自動車、普通自動車、大型自動二輪車、普通自動二輪車、一般原動機付自転車について、それぞれの乗車定員と積載の制限を示しています。車の種類乗車定員積載物の重量積載物の大きさ積載の方法大型自動車自動車検査証自動車検査証か長さ…自動車の長さ×前後…車体の前後から中型自動車か軽自動車届軽自動車届出済１.２自動車の長さの１／準中型自動出済証に記載証に記載されて幅…自動車の幅×１.10の長さを超えては車されている乗いる最大積載量２み出さないこと。普通自動車車定員（ミニ（ミニカーにあ高さ…地上３.８メー左右…車体の左右からカー（注６）つては90キログトル（三輪の普通自自動車の幅の１／10と特定の構造ラム、特定の構動車と総排気量の幅を超えてはみ出の農業用薬剤造の農業用薬剤660cc以下の普通自さないこと。","散布車（注７）散布車にあつて動車にあつては２.にあつては１は１,500キログ５メートル、その他人（特定の構ラム）の自動車で公安委員造の農業用薬会が定めるものにあ剤散布車で運つては３.８メート転者用以外のル以上４.１メート座席があるもルを超えない範囲内のは２人））において公安委員会が定める高さ）大型自動二１人（運転者60キログラム長さ…乗車装置や積載前後…乗車装置の前後輪車（側車付用以外の座席装置の長さ＋０.３から０.３メートル大型自動二があるものはメートルを超えてはみ出さな輪車を除２人）幅…乗車装置や積載装いこと。く。）置の幅＋０.３メー左右…乗車装置や積載普通自動二トル装置の左右から輪車（側車付高さ…地上２メートル０.15メートルを超普通自動二えてはみ出さないこ輪車を除と。く。）一般原動機１人30キログラム長さ…積載装置の長さ前後…積載装置の前後付自転車＋０.３メートルから０.３メートル幅…積載装置の幅＋を超えてはみ出さな０.３メートルいこと。","高さ…地上２メートル左右…積載装置の左右から０.15メートルを超えてはみ出さないこと。備考12歳未満の子供は、３人を２人として計算します。"]}],"section":"G12-3","fixed":true},{"id":"G12-09","subject":"学科","chapter":"G12","text":"\u003cp>乗車定員を数えるときは、12 歳未満の子供は 3 人を 2 人として計算する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>12 歳未満の子供は、3 人を 2 人として計算します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第4節1 乗車と積載","url":"https://www.npa.go.jp さ）まで認められている。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>積載物の長さは、自動車の長さにその長さの 10 分の 2 の長さを加えたものを超えてはいけません。\u003c/p>","refs":[{"label":"道路交通法施行令 第22条第3号","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_22-Pr_1-It_3","lines":["自動車の法第五十七条第一項の政令で定める乗車人員又は積載物の重量、大きさ若しくは積載の方法の制限は、次の各号に定めるところによる。","三　積載物の長さ、幅又は高さは、それぞれ次に掲げる長さ、幅又は高さを超えないこと。","　イ　長さ　自動車の長さにその長さの十分の二の長さを加えたもの（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の長さに〇・三メートルを加えたもの）","　ロ　幅　自動車の幅にその幅の十分の二の幅を加えたもの（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の幅に〇・三メートルを加えたもの）","　ハ　高さ　三・八メートル（大型自動二輪車、普通自動二輪車及び小型特殊自動車にあつては二メートル、三輪の普通自動車並びにその他の普通自動車で車体及び原動機の大きさを基準として内閣府令で定めるものにあつては二・五メートル、その他の自動車で公安委員会が道路又は交通の状況により支障がないと認めて定めるものにあつては三・八メートル以上四・一メートルを超えない範囲内において公安委員会が定める高さ）からその自動車の積載をする場所の高さを減じたもの"]}],"section":"G12-3","fixed":true},{"id":"G12-12","subject":"学科","chapter":"G12","text":"\u003cp>普通自動車（三輪のものなどを除く）に積む荷物の高さは、地上から 2 メートルまでに制限されている。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>普通自動車の積載物の高さの制限は、地上 3.8 メートルです（三輪の普通自動車などは 2.5 メートル）。2 メートルは大型・普通自動二輪車などの制限です。\u003c/p>","refs":[{"label":"道路交通法施行令 第22条第3号","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_22-Pr_1-It_3","lines":["自動車の法第五十七条第一項の政令で定める乗車人員又は積載物の重量、大きさ若しくは積載の方法の制限は、次の各号に定めるところによる。","三　積載物の長さ、幅又は高さは、それぞれ次に掲げる長さ、幅又は高さを超えないこと。","　イ　長さ　自動車の長さにその長さの十分の二の長さを加えたもの（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の長さに〇・三メートルを加えたもの）","　ロ　幅　自動車の幅にその幅の十分の二の幅を加えたもの（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の幅に〇・三メートルを加えたもの）","　ハ　高さ　三・八メートル（大型自動二輪車、普通自動二輪車及び小型特殊自動車にあつては二メートル、三輪の普通自動車並びにその他の普通自動車で車体及び原動機の大きさを基準として内閣府令で定めるものにあつては二・五メートル、その他の自動車で公安委員会が道路又は交通の状況により支障がないと認めて定めるものにあつては三・八メートル以上四・一メートルを超えない範囲内において公安委員会が定める高さ）からその自動車の積載をする場所の高さを減じたもの"]}],"section":"G12-3","fixed":true},{"id":"G12-13","subject":"学科","chapter":"G12","text":"\u003cp>荷物は、車体の前後から、自動車の長さの 10 分の 1 の長さを超えてはみ出さないように積まなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>積載物は、自動車の車体の前後から自動車の長さの 10 分の 1 の長さを超えてはみ出さないように積みます。\u003c/p>","refs":[{"label":"道路交通法施行令 第22条第4号","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_22-Pr_1-It_4","lines":["自動車の法第五十七条第一項の政令で定める乗車人員又は積載物の重量、大きさ若しくは積載の方法の制限は、次の各号に定めるところによる。","四　積載物は、次に掲げる制限を超えることとなるような方法で積載しないこと。","　イ　自動車の車体の前後から自動車の長さの十分の一の長さ（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の前後から〇・三メートル）を超えてはみ出さないこと。","　ロ　自動車の車体の左右から自動車の幅の十分の一の幅（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の左右から〇・一五メートル）を超えてはみ出さないこと。"]}],"section":"G12-3","fixed":true},{"id":"G12-14","subject":"学科","chapter":"G12","text":"\u003cp>荷物は、車体の左右から、自動車の幅の 10 分の 2 の幅まではみ出して積んでもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>車体の左右からのはみ出しは、自動車の幅の 10 分の 1 の幅までです。\u003c/p>","refs":[{"label":"道路交通法施行令 第22条第4号","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_22-Pr_1-It_4","lines":["自動車の法第五十七条第一項の政令で定める乗車人員又は積載物の重量、大きさ若しくは積載の方法の制限は、次の各号に定めるところによる。","四　積載物は、次に掲げる制限を超えることとなるような方法で積載しないこと。","　イ　自動車の車体の前後から自動車の長さの十分の一の長さ（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の前後から〇・三メートル）を超えてはみ出さないこと。","　ロ　自動車の車体の左右から自動車の幅の十分の一の幅（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の左右から〇・一五メートル）を超えてはみ出さないこと。"]}],"section":"G12-3","fixed":true},{"id":"G12-15","subject":"学科","chapter":"G12","text":"\u003cp>外から方向指示器やナンバープレート、ブレーキ灯が見えにくくなるような荷物の積み方をしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>運転の妨げになったり、自動車の安定が悪くなったり、外から方向指示器、ナンバープレート、ブレーキ灯、尾灯などが見えにくくなったりするようなのせ方をしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第4節3 乗車と積載","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=38","site":"警察庁の教則の全文（PDF）","lines":["自動車に人や荷物をのせるときには、運転の妨げになつたり、自動車の安定が悪くなつたり、外から方向指示器、ナンバープレート、ブレーキ灯、尾灯などが見えにくくなつたりするようなのせ方をしてはいけません。"]},{"label":"道路交通法 第55条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_11-At_55-Pr_2","lines":["車両の運転者は、運転者の視野若しくはハンドルその他の装置の操作を妨げ、後写鏡の効用を失わせ、車両の安定を害し、又は外部から当該車両の方向指示器、車両の番号標、制動灯、尾灯若しくは後部反射器を確認することができないこととなるような乗車をさせ、又は積載をして車両を運転してはならない。"]}],"section":"G12-4","fixed":true},{"id":"G12-16","subject":"学科","chapter":"G12","text":"\u003cp>走行中に荷物が転落したときは、後続車に十分注意しながら、速やかにその荷物を取り除くなど必要な措置をとる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>荷物が転落、飛散してしまったときは、速やかにその物を除去するなど必要な措置を採らなければなりません。後続車などに十分注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第4節4 乗車と積載","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=38","site":"警察庁の教則の全文（PDF）","lines":["運転者は、人が転落したり、荷物が転落、飛散したりしないようにドアを確実に閉め、ロープやシートを使つて荷物を確実に積まなければなりません。また、荷物が転落、飛散してしまつたときは、速やかにその物を除去するなど必要な措置を採らなければなりません。その場合には後続車などに十分注意しましよう。"]}],"section":"G12-4","fixed":true},{"id":"G12-17","subject":"学科","chapter":"G12","text":"\u003cp>危険物を運搬しているときでも、駐車するときに危険物を見張る必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>危険物を運搬するときは、駐車するときは危険な場所を避け、危険物を見張ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第4節5 乗車と積載","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=38","site":"警察庁の教則の全文（PDF）","lines":["危険物を運搬するときは、包装、積載などを確実にし、危険物を運搬中であることを示す標示板などを掲げるようにし、また、駐車するときは、危険な場所を避け、危険物を見張りましよう。"]}],"section":"G12-4","fixed":true},{"id":"G12-18","subject":"学科","chapter":"G12","text":"\u003cp>座席でないところに荷物を積んでも、乗車定員を超えていなければ差し支えない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>座席でないところに人を乗せたり、荷台や座席でないところに荷物を積んだりしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第4節1 乗車と積載","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=37","site":"警察庁の教則の全文（PDF）","lines":["座席でないところに人を乗せたり、荷台や座席でないところに荷物を積んだりしてはいけません。","また、定められた乗車定員（運転者を含みます。）や積載の制限を超えて、人を乗車させたり、物を積んだりしてはいけません。次の表は、大型自動車、中型自動車、準中型自動車、普通自動車、大型自動二輪車、普通自動二輪車、一般原動機付自転車について、それぞれの乗車定員と積載の制限を示しています。車の種類乗車定員積載物の重量積載物の大きさ積載の方法大型自動車自動車検査証自動車検査証か長さ…自動車の長さ×前後…車体の前後から中型自動車か軽自動車届軽自動車届出済１.２自動車の長さの１／準中型自動出済証に記載証に記載されて幅…自動車の幅×１.10の長さを超えては車されている乗いる最大積載量２み出さないこと。普通自動車車定員（ミニ（ミニカーにあ高さ…地上３.８メー左右…車体の左右からカー（注６）つては90キログトル（三輪の普通自自動車の幅の１／10と特定の構造ラム、特定の構動車と総排気量の幅を超えてはみ出の農業用薬剤造の農業用薬剤660cc以下の普通自さないこと。","散布車（注７）散布車にあつて動車にあつては２.にあつては１は１,500キログ５メートル、その他人（特定の構ラム）の自動車で公安委員造の農業用薬会が定めるものにあ剤散布車で運つては３.８メート転者用以外のル以上４.１メート座席があるもルを超えない範囲内のは２人））において公安委員会が定める高さ）大型自動二１人（運転者60キログラム長さ…乗車装置や積載前後…乗車装置の前後輪車（側車付用以外の座席装置の長さ＋０.３から０.３メートル大型自動二があるものはメートルを超えてはみ出さな輪車を除２人）幅…乗車装置や積載装いこと。く。）置の幅＋０.３メー左右…乗車装置や積載普通自動二トル装置の左右から輪車（側車付高さ…地上２メートル０.15メートルを超普通自動二えてはみ出さないこ輪車を除と。く。）一般原動機１人30キログラム長さ…積載装置の長さ前後…積載装置の前後付自転車＋０.３メートルから０.３メートル幅…積載装置の幅＋を超えてはみ出さな０.３メートルいこと。","高さ…地上２メートル左右…積載装置の左右から０.15メートルを超えてはみ出さないこと。備考12歳未満の子供は、３人を２人として計算します。"]},{"label":"道路交通法 第55条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_11-At_55-Pr_1","lines":["車両の運転者は、当該車両の乗車のために設備された場所以外の場所に乗車させ、又は乗車若しくは積載のために設備された場所以外の場所に積載して車両を運転してはならない。ただし、もつぱら貨物を運搬する構造の自動車（以下次条及び第五十七条において「貨物自動車」という。）で貨物を積載しているものにあつては、当該貨物を看守するため必要な最小限度の人員をその荷台に乗車させて運転することができる。"]}],"section":"G12-3","fixed":true},{"id":"G13-01","subject":"学科","chapter":"G13","text":"\u003cp>運転中は、一点だけを見つめず、絶えず前方に注意するとともに、ミラーなどで周りの交通にも目を配る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>一点だけを注視したり、ぼんやり見ているだけでなく、絶えず前方に注意し、ルームミラーやサイドミラーなどで周囲の交通の状況に目を配ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節1（1） 視覚の特性","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（1）一点だけを注視したり、ぼんやり見ているだけでなく、絶えず前方に注意するとともに、ルームミラーやサイドミラーなどによつて周囲の交通の状況に目を配りましよう。また、高速になると視力が低下し、特に近くのものが見えにくくなるので、注意しましよう。"]}],"section":"G13-1","fixed":true},{"id":"G13-02","subject":"学科","chapter":"G13","text":"\u003cp>速度が上がると視力が低下し、特に遠くのものが見えにくくなる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>高速になると視力が低下し、特に近くのものが見えにくくなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節1（1） 視覚の特性","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（1）一点だけを注視したり、ぼんやり見ているだけでなく、絶えず前方に注意するとともに、ルームミラーやサイドミラーなどによつて周囲の交通の状況に目を配りましよう。また、高速になると視力が低下し、特に近くのものが見えにくくなるので、注意しましよう。"]}],"section":"G13-1","fixed":true},{"id":"G13-03","subject":"学科","chapter":"G13","text":"\u003cp>疲労の影響は、目に最も強く現れる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>疲労の影響は目に最も強く現れ、疲労の度が高まるにつれて、見落としや見間違いが多くなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節1（2） 視覚の特性","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（2）疲労の影響は、目に最も強く現われます。疲労の度が高まるにつれて、見落としや見間違いが多くなるので気を付けましよう。"]}],"section":"G13-1","fixed":true},{"id":"G13-04","subject":"学科","chapter":"G13","text":"\u003cp>明るさが急に変わっても視力は変わらないので、トンネルの出入口で速度を落とす必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>明るさが急に変わると、視力は一時急激に低下します。トンネルに入る前やトンネルから出るときは速度を落とします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節1（3） 視覚の特性","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（3）明るさが急に変わると、視力は、一時急激に低下します。トンネルに入る前やトンネルから出るときは速度を落としましよう。また、夜間は対向車のライトを直視しないようにしましよう。"]}],"section":"G13-1","fixed":true},{"id":"G13-05","subject":"学科","chapter":"G13","text":"\u003cp>ぬれたアスファルトの路面では、摩擦抵抗が大きくなるので、制動距離が短くなる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ぬれたアスファルト路面を走るときなどは、摩擦抵抗が小さくなり、制動距離が長くなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（1） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（1）摩擦の力走行中の車は、クラッチを切つても走り続けようとする性質があるため、すぐには止まりません。この車を止めるためには、ブレーキを掛けて車輪の回転を止め、タイヤと路面の間の摩擦抵抗を利用します。ぬれたアスファルト路面を走るときなどは、摩擦抵抗が小さくなり制動距離が長くなります。また、高速運転中に急ブレーキを掛けると、車輪がロックし路上を滑るので特に注意しましよう。"]}],"section":"G13-2","fixed":true},{"id":"G13-06","subject":"学科","chapter":"G13","text":"\u003cp>カーブで働く遠心力は、カーブの半径が小さいほど大きくなる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>遠心力の大きさは、カーブの半径が小さいほど大きくなり、速度の 2 乗に比例して大きくなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（2） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（2）遠心力自動車がカーブを回ろうとするときには、自動車の重心に遠心力が働き、自動車はカーブの外側に滑り出そうとします。このため、荷物の積み方が悪く重心の位置が高くなつたり、片寄つたりすると自動車は倒れやすくなります。","遠心力の大きさは、カーブの半径が小さいほど大きくなり、速度の２乗に比例して大きくなります。安全にカーブを回るためには、カーブに入る前の直線部分で早目にブレーキを掛け、十分速度を落としておく必要があります。"]}],"section":"G13-2","fixed":true},{"id":"G13-07","subject":"学科","chapter":"G13","text":"\u003cp>カーブで働く遠心力は、速度に比例して大きくなるので、速度が 2 倍になれば遠心力も 2 倍になる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>遠心力は速度の 2 乗に比例します。速度が 2 倍になれば、遠心力は 4 倍になります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（2） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（2）遠心力自動車がカーブを回ろうとするときには、自動車の重心に遠心力が働き、自動車はカーブの外側に滑り出そうとします。このため、荷物の積み方が悪く重心の位置が高くなつたり、片寄つたりすると自動車は倒れやすくなります。","遠心力の大きさは、カーブの半径が小さいほど大きくなり、速度の２乗に比例して大きくなります。安全にカーブを回るためには、カーブに入る前の直線部分で早目にブレーキを掛け、十分速度を落としておく必要があります。"]},{"label":"交通の方法に関する教則 第4章第5節2（4） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（4）速度の影響制動距離、遠心力、衝撃力などは、いずれも速度の２乗に比例して大きくなります。速度が２倍になれば、制動距離、カーブで車の横滑りや転倒をさせようとする力、交通事故の大きさに関係する衝撃力は、２倍になるのではなく、４倍になります。"]}],"section":"G13-2","fixed":true},{"id":"G13-08","subject":"学科","chapter":"G13","text":"\u003cp>速度が 2 倍になると、制動距離はおよそ 4 倍になる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>制動距離、遠心力、衝撃力などは、いずれも速度の 2 乗に比例して大きくなるので、速度が 2 倍になれば 4 倍になります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（4） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（4）速度の影響制動距離、遠心力、衝撃力などは、いずれも速度の２乗に比例して大きくなります。速度が２倍になれば、制動距離、カーブで車の横滑りや転倒をさせようとする力、交通事故の大きさに関係する衝撃力は、２倍になるのではなく、４倍になります。"]}],"section":"G13-2","fixed":true},{"id":"G13-09","subject":"学科","chapter":"G13","text":"\u003cp>荷物の積み方が悪く、重心の位置が高くなったり片寄ったりすると、カーブで車が倒れやすくなる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>カーブでは車の重心に遠心力が働くので、荷物の積み方が悪く重心の位置が高くなったり、片寄ったりすると自動車は倒れやすくなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（2） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（2）遠心力自動車がカーブを回ろうとするときには、自動車の重心に遠心力が働き、自動車はカーブの外側に滑り出そうとします。このため、荷物の積み方が悪く重心の位置が高くなつたり、片寄つたりすると自動車は倒れやすくなります。","遠心力の大きさは、カーブの半径が小さいほど大きくなり、速度の２乗に比例して大きくなります。安全にカーブを回るためには、カーブに入る前の直線部分で早目にブレーキを掛け、十分速度を落としておく必要があります。"]}],"section":"G13-2","fixed":true},{"id":"G13-10","subject":"学科","chapter":"G13","text":"\u003cp>衝突したときの衝撃力は、衝撃が短い時間に加わるほど小さくなる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>固い物にぶつかるときのように、衝撃の作用が短時間に行われるほど、衝撃力は大きくなります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（3） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（3）衝撃力交通事故の大きさは、車が衝突したときに相手に与えたり、自分が受けたりする衝撃力の大きさに関係します。衝撃力は速度と重量に応じて大きくなり、また、固い物にぶつかるときのように、衝撃の作用が短時間に行われるほどその力は大きくなります。例えば、時速60キロメートルでコンクリートの壁に激突した場合は、約14メートルの高さ（ビルの５階程度）から落ちた場合と同じ程度の衝撃力を受けます。高速運転するときには、特に注意しましよう。"]}],"section":"G13-2","fixed":true},{"id":"G13-11","subject":"学科","chapter":"G13","text":"\u003cp>時速 60 キロメートルでコンクリートの壁に衝突したときは、約 14 メートルの高さから落ちたのと同じ程度の衝撃を受ける。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>時速 60 キロメートルでコンクリートの壁に激突した場合は、約 14 メートルの高さ（ビルの 5 階程度）から落ちた場合と同じ程度の衝撃力を受けます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（3） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（3）衝撃力交通事故の大きさは、車が衝突したときに相手に与えたり、自分が受けたりする衝撃力の大きさに関係します。衝撃力は速度と重量に応じて大きくなり、また、固い物にぶつかるときのように、衝撃の作用が短時間に行われるほどその力は大きくなります。例えば、時速60キロメートルでコンクリートの壁に激突した場合は、約14メートルの高さ（ビルの５階程度）から落ちた場合と同じ程度の衝撃力を受けます。高速運転するときには、特に注意しましよう。"]}],"section":"G13-2","fixed":true},{"id":"G13-12","subject":"学科","chapter":"G13","text":"\u003cp>カーブを安全に回るには、カーブに入ってから強くブレーキを掛けて速度を落とすのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>安全にカーブを回るためには、カーブに入る前の直線部分で早めにブレーキを掛け、十分速度を落としておきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節2（2） 自動車に働く自然の力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39","site":"警察庁の教則の全文（PDF）","lines":["（2）遠心力自動車がカーブを回ろうとするときには、自動車の重心に遠心力が働き、自動車はカーブの外側に滑り出そうとします。このため、荷物の積み方が悪く重心の位置が高くなつたり、片寄つたりすると自動車は倒れやすくなります。","遠心力の大きさは、カーブの半径が小さいほど大きくなり、速度の２乗に比例して大きくなります。安全にカーブを回るためには、カーブに入る前の直線部分で早目にブレーキを掛け、十分速度を落としておく必要があります。"]}],"section":"G13-2","fixed":true},{"id":"G13-13","subject":"学科","chapter":"G13","text":"\u003cp>光化学スモッグが発生したときや発生するおそれのあるときは、自動車の使用を控える。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>大気汚染により、光化学スモッグが発生したときや発生するおそれのあるときは、自動車の使用を控えます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節3（2） 交通公害、地球温暖化の防止など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=40","site":"警察庁の教則の全文（PDF）","lines":["（2）自動車の排出ガスの中には、一酸化炭素、炭化水素、窒素酸化物など人体に有害な物質が含まれており、これらの排出ガスが大気を汚染する原因のひとつとなつています。大気汚染により、光化学スモッグが発生したときや発生するおそれのあるときは、自動車の使用を控えましよう。"]}],"section":"G13-3","fixed":true},{"id":"G13-14","subject":"学科","chapter":"G13","text":"\u003cp>自動車の排出ガスに含まれる一酸化炭素や窒素酸化物は、人体には害がない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>排出ガスの中には、一酸化炭素、炭化水素、窒素酸化物など人体に有害な物質が含まれています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節3（2） 交通公害、地球温暖化の防止など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=40","site":"警察庁の教則の全文（PDF）","lines":["（2）自動車の排出ガスの中には、一酸化炭素、炭化水素、窒素酸化物など人体に有害な物質が含まれており、これらの排出ガスが大気を汚染する原因のひとつとなつています。大気汚染により、光化学スモッグが発生したときや発生するおそれのあるときは、自動車の使用を控えましよう。"]}],"section":"G13-3","fixed":true},{"id":"G13-15","subject":"学科","chapter":"G13","text":"\u003cp>駐停車中のアイドリングストップや、やさしい発進などのエコドライブに努める。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>二酸化炭素や窒素酸化物などの排出削減のため、やさしい発進、加速度の少ない運転、駐停車時のアイドリングストップなどのエコドライブに努めます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節3（3） 交通公害、地球温暖化の防止など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=40","site":"警察庁の教則の全文（PDF）","lines":["（3）地球温暖化の一因となつている二酸化炭素や人体に有害な物質である窒素酸化物等の排出削減のために、やさしい発進、加速度の少ない運転、駐停車時のアイドリングストップなどの環境負荷の軽減に配慮した自動車の使用（エコドライブ）に努めましよう。"]}],"section":"G13-3","fixed":true},{"id":"G13-16","subject":"学科","chapter":"G13","text":"\u003cp>運転適性についての指導は、各都道府県の交通安全活動推進センターなどで受けることができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>運転についての適性を自覚することは大切です。運転適性についての指導は、各都道府県の交通安全活動推進センターなどで行っています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第4章第5節4 運転適性","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=40","site":"警察庁の教則の全文（PDF）","lines":["運転についての適性を自覚することは、安全な運転のために大切なことです。運転適性についての指導は、各都道府県の交通安全活動推進センターなどで行つていますので、利用しましよう。"]}],"section":"G13-4","fixed":true},{"id":"G14-01","subject":"学科","chapter":"G14","text":"\u003cp>5 分以内の荷物の積卸しのための停止は、駐車にはならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>貨物の積卸しのための停止で 5 分を超えないものと、人の乗降のための停止は、駐車に当たりません。\u003c/p>","refs":[{"label":"道路交通法 第2条第1項第18号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_2-Pr_1-It_18","lines":["この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。","十八　駐車　車両等が客待ち、荷待ち、貨物の積卸し、故障その他の理由により継続的に停止すること（貨物の積卸しのための停止で五分を超えない時間内のもの及び人の乗降のための停止を除く。）、又は車両等が停止（特定自動運行中の停止を除く。）をし、かつ、当該車両等の運転をする者（以下「運転者」という。）がその車両等を離れて直ちに運転することができない状態にあることをいう。"]},{"label":"交通の方法に関する教則 第5章第8節1 駐車と停車の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=58","site":"警察庁の教則の全文（PDF）","lines":["駐車とは、車が継続的に停止することや運転者が車から離れていてすぐに運転できない状態で停止することをいいます。人の乗り降りや、５分以内の荷物の積卸しのための停止の場合は駐車になりません。","停車とは、駐車にあたらない短時間の車の停止をいいます。"]}],"section":"G14-1","fixed":true},{"id":"G14-02","subject":"学科","chapter":"G14","text":"\u003cp>人の乗り降りのための停止でも、10 分を超えると駐車になる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>人の乗降のための停止は、時間に関係なく駐車に当たりません（荷物の積卸しは 5 分以内に限ります）。\u003c/p>","refs":[{"label":"道路交通法 第2条第1項第18号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_2-Pr_1-It_18","lines":["この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。","十八　駐車　車両等が客待ち、荷待ち、貨物の積卸し、故障その他の理由により継続的に停止すること（貨物の積卸しのための停止で五分を超えない時間内のもの及び人の乗降のための停止を除く。）、又は車両等が停止（特定自動運行中の停止を除く。）をし、かつ、当該車両等の運転をする者（以下「運転者」という。）がその車両等を離れて直ちに運転することができない状態にあることをいう。"]}],"section":"G14-1","fixed":true},{"id":"G14-03","subject":"学科","chapter":"G14","text":"\u003cp>運転者が車から離れていてすぐに運転できない状態で停止することは、短い時間であっても駐車になる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車両等が停止し、運転する人がその車両等を離れて直ちに運転することができない状態にあることは、駐車です。\u003c/p>","refs":[{"label":"道路交通法 第2条第1項第18号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_2-Pr_1-It_18","lines":["この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。","十八
