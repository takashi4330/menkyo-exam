  @media (max-width: 560px) {

  }

路を安全、円滑に通行するために守る、共通の約束事です。交通規則を守ることは、社会人としての基本的な責務です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=5\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第1章第1節1 交通規則を守ること\u003c/a>\u003c/figcaption>\u003cblockquote>道路は、多数の人や車が通行するところです。運転者や歩行者が一人でも自分勝手に通行すると、交通が混乱したり、交通事故が起きたりします。また、自分だけはよくても、ほかの人に迷惑を掛けたりすることがあります。\u003cbr>交通規則は、このようなことから、みんなが道路を安全、円滑に通行する上で守るべき共通の約束事として決められているものです。言い換えれば、交通規則を守ることは、社会人としての基本的な責務なのです。\u003cbr>交通規則の内容は、この教則で述べられていますが、具体的には、信号機や標識などによつて個々に示されていますので、それらの意味をよく理解し、決められた交通規則をお互いに守るようにしましよう。\u003c/blockquote>\u003c/figure>\n\u003cp>規則を守るだけでなく、次のような心構えも大切です。\u003c/p>\n\u003cul>\u003cli>周りの歩行者や車の動きに注意し、相手の立場を思いやって通行する\u003c/li>\u003cli>沿道に住む人に、騒音などの迷惑を掛けない\u003c/li>\u003cli>万一に備えて、自動車保険に入り、応急救護処置の知識を身に付け、救急用具を車に積んでおく\u003c/li>\u003cli>交通事故や故障で困っている人を見たら、連絡や救護に協力する\u003c/li>\u003cli>運転者だけでなく、歩行者や自転車に乗る人も、自動車の死角や内輪差などの特性を知っておく\u003c/li>\u003c/ul>\n\u003ch3 id=\"G01-2\">信号機の信号\u003c/h3>\n\u003cp>道路を通行する人や車は、信号機の信号に従わなければなりません（道路交通法第 7 条）。信号の意味は、道路交通法施行令第 2 条の表で決まっています。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>信号\u003c/th>\u003cth>車（自動車）の意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>青色の灯火\u003c/td>\u003ctd>直進、左折、右折ができる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>黄色の灯火\u003c/td>\u003ctd>停止位置から先へ進んではいけない。ただし、黄色に変わったときに停止位置に近づいていて、安全に停止できないときは、そのまま進める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>赤色の灯火\u003c/td>\u003ctd>停止位置を越えて進んではいけない。交差点で既に左折や右折をしている車は、そのまま進める（右折している車は、青信号で進んで来る車の進行を妨げてはいけない）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>青色の灯火の矢印\u003c/td>\u003ctd>黄や赤の信号でも、矢印の方向に進める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>黄色の灯火の点滅\u003c/td>\u003ctd>ほかの交通に注意して進める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>赤色の灯火の点滅\u003c/td>\u003ctd>停止位置で一時停止しなければならない\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>道路交通法施行令 第2条第1項（表の一部）（条文を開く）\u003c/summary>\u003cblockquote>法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。\u003cbr>信号の種類｜信号の意味\u003cbr>黄色の灯火｜一　歩行者等は、道路の横断を始めてはならず、また、道路を横断している歩行者等は、速やかに、その横断を終わるか、又は横断をやめて引き返さなければならないこと。二　車両及び路面電車（以下この表において「車両等」という。）は、停止位置を越えて進行してはならないこと。ただし、黄色の灯火の信号が表示された時において当該停止位置に近接しているため安全に停止することができない場合を除く。\u003cbr>赤色の灯火の点滅｜一　歩行者等は、他の交通に注意して進行することができること。二　車両等は、停止位置において一時停止しなければならないこと。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cul>\u003cli>黄色の灯火は「注意して進め」ではありません。止まるのが原則で、安全に止まれないときだけ進めます\u003c/li>\u003cli>二段階の右折方法で右折する一般原動機付自転車は、青色の灯火の右向きの矢印では右折できません（右折の矢印の信号では、直進する原付とみなされます）\u003c/li>\u003c/ul>\n\u003ch3 id=\"G01-3\">停止位置\u003c/h3>\n\u003cp>信号で止まるときの「停止位置」は、停止線があれば停止線の直前です。停止線がないときは、次の場所です（道路交通法施行令第 2 条第 1 項の表の備考）。\u003c/p>\n\u003cul>\u003cli>交差点の手前では、交差点の直前。交差点のすぐ手前に横断歩道や自転車横断帯があるときは、その手前\u003c/li>\u003cli>交差点以外で、横断歩道、自転車横断帯や踏切があるところでは、その直前\u003c/li>\u003cli>交差点以外で、横断歩道、自転車横断帯も踏切もないところでは、信号機の直前\u003c/li>\u003c/ul>\n\u003ch3 id=\"G01-4\">信号の見方と標示板\u003c/h3>\n\u003cul>\u003cli>信号は、前方の信号を見ます。横の信号が赤でも、前方の信号が青とは限りません（全方向が一時的に赤になる信号や、時差式の信号があります）\u003c/li>\u003cli>人の形の記号のある信号は、歩行者などに対するものです。「歩行者・自転車専用」の標示板があれば、自転車もその信号に従います\u003c/li>\u003cli>「バス専用」などの標示板のある信号機は、示された車だけを対象にした信号です\u003c/li>\u003cli>白地に青の左向きの矢印の標示板（左折可）があるときは、前方の信号が赤や黄でも、周りの交通に注意して左折できます。ただし、信号に従って横断している歩行者や自転車などの通行を妨げてはいけません\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第1章第2節1（4） 信号の意味\u003c/a>\u003c/figcaption>\u003cblockquote>（4）道路の左端や信号機に、白地に青の左向きの矢印の標示板（付表２（２））のあるときは、車は、前方の信号が赤や黄であつても、歩行者など周りの交通に注意しながら左折できます。この場合、信号機の信号に従つて横断している歩行者、特定小型原動機付自転車や自転車の通行を妨げてはいけません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G01-5\">警察官の手信号と指示\u003c/h3>\n\u003cp>警察官や交通巡視員は、手信号や灯火による信号で交通整理をすることがあります。手信号が信号機の信号と違うときは、\u003cstrong>手信号の方が優先\u003c/strong>します。また、警察官などの指示が標識や標示の規制と違うときは、\u003cstrong>指示の方が優先\u003c/strong>します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=8\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第1章第3節1 警察官などの指示に従うこと\u003c/a>\u003c/figcaption>\u003cblockquote>警察官や交通巡視員が手信号や灯火による信号（付表１（３））により交通整理を行つている場合は、この手信号や信号に従わなければなりません。この場合、手信号や灯火による信号が信号機の信号と違つていても、その警察官や交通巡視員の信号の方が優先します。\u003c/blockquote>\u003c/figure>\n\u003cp>手信号の意味は、道路交通法施行令第 4 条で決まっています。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>手信号\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>腕を横に水平に上げる\u003c/td>\u003ctd>腕に平行する交通は青色の灯火、腕に対面する交通（警察官の正面と背面の方向）は赤色の灯火と同じ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>腕を垂直に上げる\u003c/td>\u003ctd>腕を上げる前に腕に平行していた交通は黄色の灯火、対面していた交通は赤色の灯火と同じ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>灯火を使う信号（道路交通法施行令第 5 条）では、灯火を横に振っているとき、振られている方向に進む交通は青色の灯火、これと交差する交通は赤色の灯火と同じです。灯火を頭上に上げているときは、それまで振られていた方向の交通は黄色の灯火、交差する交通は赤色の灯火と同じです。\u003c/p>\n\u003cul>\u003cli>手信号や灯火による信号で止まるとき、交差点以外で、横断歩道、自転車横断帯も踏切もない場所では、警察官などの 1 メートル手前が停止位置です\u003c/li>\u003c/ul>","sections":[{"id":"G01-1","title":"交通規則と心構え"},{"id":"G01-2","title":"信号機の信号"},{"id":"G01-3","title":"停止位置"},{"id":"G01-4","title":"信号の見方と標示板"},{"id":"G01-5","title":"警察官の手信号と指示"}],"search":[{"id":"","title":"","text":"学科試験の問題は、国家公安委員会が作った「交通の方法に関する教則」（この問題集では「教則」と呼びます）と、道路交通法などの法令から出ます。この章では、交通規則を守る心構えと、信号機や警察官の手信号の意味を覚えます。"},{"id":"G01-1","title":"交通規則と心構え","text":"交通規則と心構え 交通規則は、みんなが道路を安全、円滑に通行するために守る、共通の約束事です。交通規則を守ることは、社会人としての基本的な責務です。 交通の方法に関する教則 第1章第1節1 交通規則を守ること道路は、多数の人や車が通行するところです。運転者や歩行者が一人でも自分勝手に通行すると、交通が混乱したり、交通事故が起きたりします。また、自分だけはよくても、ほかの人に迷惑を掛けたりすることがあります。 交通規則は、このようなことから、みんなが道路を安全、円滑に通行する上で守るべき共通の約束事として決められているものです。言い換えれば、交通規則を守ることは、社会人としての基本的な責務なのです。 交通規則の内容は、この教則で述べられていますが、具体的には、信号機や標識などによつて個々に示されていますので、それらの意味をよく理解し、決められた交通規則をお互いに守るようにしましよう。 規則を守るだけでなく、次のような心構えも大切です。 周りの歩行者や車の動きに注意し、相手の立場を思いやって通行する沿道に住む人に、騒音などの迷惑を掛けない万一に備えて、自動車保険に入り、応急救護処置の知識を身に付け、救急用具を車に積んでおく交通事故や故障で困っている人を見たら、連絡や救護に協力する運転者だけでなく、歩行者や自転車に乗る人も、自動車の死角や内輪差などの特性を知っておく"},{"id":"G01-2","title":"信号機の信号","text":"信号機の信号 道路を通行する人や車は、信号機の信号に従わなければなりません（道路交通法第 7 条）。信号の意味は、道路交通法施行令第 2 条の表で決まっています。 信号車（自動車）の意味青色の灯火直進、左折、右折ができる黄色の灯火停止位置から先へ進んではいけない。ただし、黄色に変わったときに停止位置に近づいていて、安全に停止できないときは、そのまま進める赤色の灯火停止位置を越えて進んではいけない。交差点で既に左折や右折をしている車は、そのまま進める（右折している車は、青信号で進んで来る車の進行を妨げてはいけない）青色の灯火の矢印黄や赤の信号でも、矢印の方向に進める黄色の灯火の点滅ほかの交通に注意して進める赤色の灯火の点滅停止位置で一時停止しなければならない 道路交通法施行令 第2条第1項（表の一部）（条文を開く）法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。 信号の種類｜信号の意味 黄色の灯火｜一 歩行者等は、道路の横断を始めてはならず、また、道路を横断している歩行者等は、速やかに、その横断を終わるか、又は横断をやめて引き返さなければならないこと。二 車両及び路面電車（以下この表において「車両等」という。）は、停止位置を越えて進行してはならないこと。ただし、黄色の灯火の信号が表示された時において当該停止位置に近接しているため安全に停止することができない場合を除く。 赤色の灯火の点滅｜一 歩行者等は、他の交通に注意して進行することができること。二 車両等は、停止位置において一時停止しなければならないこと。e-Gov 法令検索で読む 黄色の灯火は「注意して進め」ではありません。止まるのが原則で、安全に止まれないときだけ進めます二段階の右折方法で右折する一般原動機付自転車は、青色の灯火の右向きの矢印では右折できません（右折の矢印の信号では、直進する原付とみなされます）"},{"id":"G01-3","title":"停止位置","text":"停止位置 信号で止まるときの「停止位置」は、停止線があれば停止線の直前です。停止線がないときは、次の場所です（道路交通法施行令第 2 条第 1 項の表の備考）。 交差点の手前では、交差点の直前。交差点のすぐ手前に横断歩道や自転車横断帯があるときは、その手前交差点以外で、横断歩道、自転車横断帯や踏切があるところでは、その直前交差点以外で、横断歩道、自転車横断帯も踏切もないところでは、信号機の直前"},{"id":"G01-4","title":"信号の見方と標示板","text":"信号の見方と標示板 信号は、前方の信号を見ます。横の信号が赤でも、前方の信号が青とは限りません（全方向が一時的に赤になる信号や、時差式の信号があります）人の形の記号のある信号は、歩行者などに対するものです。「歩行者・自転車専用」の標示板があれば、自転車もその信号に従います「バス専用」などの標示板のある信号機は、示された車だけを対象にした信号です白地に青の左向きの矢印の標示板（左折可）があるときは、前方の信号が赤や黄でも、周りの交通に注意して左折できます。ただし、信号に従って横断している歩行者や自転車などの通行を妨げてはいけません 交通の方法に関する教則 第1章第2節1（4） 信号の意味（4）道路の左端や信号機に、白地に青の左向きの矢印の標示板（付表２（２））のあるときは、車は、前方の信号が赤や黄であつても、歩行者など周りの交通に注意しながら左折できます。この場合、信号機の信号に従つて横断している歩行者、特定小型原動機付自転車や自転車の通行を妨げてはいけません。"},{"id":"G01-5","title":"警察官の手信号と指示","text":"警察官の手信号と指示 警察官や交通巡視員は、手信号や灯火による信号で交通整理をすることがあります。手信号が信号機の信号と違うときは、手信号の方が優先します。また、警察官などの指示が標識や標示の規制と違うときは、指示の方が優先します。 交通の方法に関する教則 第1章第3節1 警察官などの指示に従うこと警察官や交通巡視員が手信号や灯火による信号（付表１（３））により交通整理を行つている場合は、この手信号や信号に従わなければなりません。この場合、手信号や灯火による信号が信号機の信号と違つていても、その警察官や交通巡視員の信号の方が優先します。 手信号の意味は、道路交通法施行令第 4 条で決まっています。 手信号意味腕を横に水平に上げる腕に平行する交通は青色の灯火、腕に対面する交通（警察官の正面と背面の方向）は赤色の灯火と同じ腕を垂直に上げる腕を上げる前に腕に平行していた交通は黄色の灯火、対面していた交通は赤色の灯火と同じ 灯火を使う信号（道路交通法施行令第 5 条）では、灯火を横に振っているとき、振られている方向に進む交通は青色の灯火、これと交差する交通は赤色の灯火と同じです。灯火を頭上に上げているときは、それまで振られていた方向の交通は黄色の灯火、交差する交通は赤色の灯火と同じです。 手信号や灯火による信号で止まるとき、交差点以外で、横断歩道、自転車横断帯も踏切もない場所では、警察官などの 1 メートル手前が停止位置です"}],"only":""},{"id":"G02","subject":"学科","num":2,"title":"標識・標示と道路でしてはいけないこと","html":"\u003cp>信号のほかに、標識と標示も交通の規制を示します。この章では、標識と標示の種類と、道路でしてはいけないこと、運転者のまわりの人がしてはいけないことを覚えます。一つ一つの標識の意味は、その規制が出てくる章（交差点、駐車など）で覚えます。\u003c/p>\n\u003ch3 id=\"G02-1\">標識\u003c/h3>\n\u003cp>標識は、交通規制などを示す標示板です。\u003cstrong>本標識\u003c/strong>と\u003cstrong>補助標識\u003c/strong>があり、本標識は次の 4 種類です。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>本標識\u003c/th>\u003cth>役目\u003c/th>\u003cth>例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>規制標識\u003c/td>\u003ctd>特定の交通方法を禁止したり、指定したりする\u003c/td>\u003ctd>自動車の通行止め、最高速度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>指示標識\u003c/td>\u003ctd>特定の交通方法ができることや、決められた場所を示す\u003c/td>\u003ctd>駐車可、横断歩道、安全地帯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>警戒標識\u003c/td>\u003ctd>道路上の危険や注意すべき状況を、前もって知らせる\u003c/td>\u003ctd>踏切あり、道路工事中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>案内標識\u003c/td>\u003ctd>地点の名称、方面、距離などを示す\u003c/td>\u003ctd>方面と距離\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第1章第2節2（1） 標識の意味\u003c/a>\u003c/figcaption>\u003cblockquote>（1）標識とは、交通規制などを示す標示板のことをいい、本標識と補助標識があります。本標識には、規制標識、指示標識、警戒標識、案内標識の４種類があります。標識の種類とその意味は付表３（１）のとおりです。\u003c/blockquote>\u003c/figure>\n\u003cp>補助標識は、本標識の意味を補うもので、普通は\u003cstrong>本標識の下\u003c/strong>に取り付けられています。規制の理由や、規制が適用される時間、曜日、自動車の種類などを示します。\u003c/p>\n\u003ch3 id=\"G02-2\">標示\u003c/h3>\n\u003cp>標示は、ペイントや道路びょうなどで路面に示された線、記号や文字です。\u003cstrong>規制標示\u003c/strong>と\u003cstrong>指示標示\u003c/strong>の 2 種類があります。\u003c/p>\n\u003cul>\u003cli>規制標示：特定の交通方法を禁止したり、指定したりする（例：駐車禁止の標示、バスの専用通行帯の標示）\u003c/li>\u003cli>指示標示：特定の交通方法ができることや、決められた場所などを示す（例：斜め横断ができることを示す標示、停止位置を示す標示）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=8\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第1章第2節3（2） 標示の意味\u003c/a>\u003c/figcaption>\u003cblockquote>（2）規制標示とは、特定の交通方法を禁止又は指定するもので、例えば、駐車を禁止する標示（付表３（２）５）やバスの専用通行帯を指示する標示（付表３（２）15）などがあります。指示標示とは特定の交通方法ができることや道路交通上決められた場所などを指示するもので、斜め横断ができることを示す標示（付表３（２）26）や車両の停止位置を示す標示（付表３（２）29、30）などがあります。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G02-3\">道路でしてはいけないこと\u003c/h3>\n\u003cp>道路上で、次のような危険なことをしてはいけません（道路交通法第 76 条にも決まりがあります）。\u003c/p>\n\u003cul>\u003cli>酒に酔ってふらついたり、座ったり寝そべったりして交通の妨げになること\u003c/li>\u003cli>交通量の多いところで、キャッチボールやローラースケートなどをすること\u003c/li>\u003cli>道路に向けて物を投げたり、発射したりすること。車からたばこの吸い殻や空き缶などを投げ捨てること\u003c/li>\u003cli>走っている車や路面電車に、外からつかまること\u003c/li>\u003cli>運転者の目をくらませるような光を、道路に向けること\u003c/li>\u003cli>凍り付くおそれのあるときに、水をまくこと\u003c/li>\u003cli>道路上に商品を並べたり、交通の妨げになる物を置いたりすること\u003c/li>\u003cli>信号機の近くに信号と似た色のネオンサインを設けたり、標識の近くに広告看板を設けたりすること。信号機や標識・標示を勝手に操作したり、移したり、壊したりすること\u003c/li>\u003c/ul>\n\u003ch3 id=\"G02-4\">運転者のまわりの人の責任\u003c/h3>\n\u003cp>運転しない人も、次のことをしてはいけません。\u003c/p>\n\u003cul>\u003cli>免許を持たない人や、酒気を帯びた人に運転を頼むこと\u003c/li>\u003cli>これから車を運転しようとする人に、酒を出したり、勧めたりすること\u003c/li>\u003cli>酒気を帯びていて運転するおそれのある人に、車を貸すこと（道路交通法第 65 条第 2 項）\u003c/li>\u003cli>運転者に、過積載（積む物の重さの制限を超えて積むこと）をして運転するよう求めること\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_65-Pr_3\" target=\"_blank\" rel=\"noopener\">道路交通法 第65条第3項\u003c/a>\u003c/figcaption>\u003cblockquote>何人も、第一項の規定に違反して車両等を運転することとなるおそれがある者に対し、酒類を提供し、又は飲酒をすすめてはならない。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G02-1","title":"標識"},{"id":"G02-2","title":"標示"},{"id":"G02-3","title":"道路でしてはいけないこと"},{"id":"G02-4","title":"運転者のまわりの人の責任"}],"search":[{"id":"","title":"","text":"信号のほかに、標識と標示も交通の規制を示します。この章では、標識と標示の種類と、道路でしてはいけないこと、運転者のまわりの人がしてはいけないことを覚えます。一つ一つの標識の意味は、その規制が出てくる章（交差点、駐車など）で覚えます。"},{"id":"G02-1","title":"標識","text":"標識 標識は、交通規制などを示す標示板です。本標識と補助標識があり、本標識は次の 4 種類です。 本標識役目例規制標識特定の交通方法を禁止したり、指定したりする自動車の通行止め、最高速度指示標識特定の交通方法ができることや、決められた場所を示す駐車可、横断歩道、安全地帯警戒標識道路上の危険や注意すべき状況を、前もって知らせる踏切あり、道路工事中案内標識地点の名称、方面、距離などを示す方面と距離 交通の方法に関する教則 第1章第2節2（1） 標識の意味（1）標識とは、交通規制などを示す標示板のことをいい、本標識と補助標識があります。本標識には、規制標識、指示標識、警戒標識、案内標識の４種類があります。標識の種類とその意味は付表３（１）のとおりです。 補助標識は、本標識の意味を補うもので、普通は本標識の下に取り付けられています。規制の理由や、規制が適用される時間、曜日、自動車の種類などを示します。"},{"id":"G02-2","title":"標示","text":"標示 標示は、ペイントや道路びょうなどで路面に示された線、記号や文字です。規制標示と指示標示の 2 種類があります。 規制標示：特定の交通方法を禁止したり、指定したりする（例：駐車禁止の標示、バスの専用通行帯の標示）指示標示：特定の交通方法ができることや、決められた場所などを示す（例：斜め横断ができることを示す標示、停止位置を示す標示） 交通の方法に関する教則 第1章第2節3（2） 標示の意味（2）規制標示とは、特定の交通方法を禁止又は指定するもので、例えば、駐車を禁止する標示（付表３（２）５）やバスの専用通行帯を指示する標示（付表３（２）15）などがあります。指示標示とは特定の交通方法ができることや道路交通上決められた場所などを指示するもので、斜め横断ができることを示す標示（付表３（２）26）や車両の停止位置を示す標示（付表３（２）29、30）などがあります。"},{"id":"G02-3","title":"道路でしてはいけないこと","text":"道路でしてはいけないこと 道路上で、次のような危険なことをしてはいけません（道路交通法第 76 条にも決まりがあります）。 酒に酔ってふらついたり、座ったり寝そべったりして交通の妨げになること交通量の多いところで、キャッチボールやローラースケートなどをすること道路に向けて物を投げたり、発射したりすること。車からたばこの吸い殻や空き缶などを投げ捨てること走っている車や路面電車に、外からつかまること運転者の目をくらませるような光を、道路に向けること凍り付くおそれのあるときに、水をまくこと道路上に商品を並べたり、交通の妨げになる物を置いたりすること信号機の近くに信号と似た色のネオンサインを設けたり、標識の近くに広告看板を設けたりすること。信号機や標識・標示を勝手に操作したり、移したり、壊したりすること"},{"id":"G02-4","title":"運転者のまわりの人の責任","text":"運転者のまわりの人の責任 運転しない人も、次のことをしてはいけません。 免許を持たない人や、酒気を帯びた人に運転を頼むことこれから車を運転しようとする人に、酒を出したり、勧めたりすること酒気を帯びていて運転するおそれのある人に、車を貸すこと（道路交通法第 65 条第 2 項）運転者に、過積載（積む物の重さの制限を超えて積むこと）をして運転するよう求めること 道路交通法 第65条第3項何人も、第一項の規定に違反して車両等を運転することとなるおそれがある者に対し、酒類を提供し、又は飲酒をすすめてはならない。"}],"only":""},{"id":"G03","subject":"学科","num":3,"title":"運転免許と運転の前に","html":"\u003cp>この章では、運転免許の種類と仮免許のきまり、初心者マークなどの標識、運転の前に確かめることと体調の整え方を覚えます。\u003c/p>\n\u003ch3 id=\"G03-1\">運転免許の種類\u003c/h3>\n\u003cp>自動車や一般原動機付自転車を運転するには、公安委員会の運転免許が必要です。免許は、次の 3 つに分かれます（道路交通法第 84 条）。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>免許\u003c/th>\u003cth>どんなときの免許か\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>第一種運転免許\u003c/td>\u003ctd>自動車や一般原動機付自転車を運転するとき（第二種の場合を除く）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第二種運転免許\u003c/td>\u003ctd>乗合バスやタクシーなどの旅客自動車を、旅客を運ぶために運転するときや、代行運転の普通自動車を運転するとき\u003c/td>\u003c/tr>\u003ctr>\u003ctd>仮運転免許\u003c/td>\u003ctd>第一種免許を受けようとする人が、練習などのために大型・中型・準中型・普通自動車を運転するとき\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=31\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第2節1（2） 運転免許の区分\u003c/a>\u003c/figcaption>\u003cblockquote>（2）第二種運転免許乗合バス、タクシーなどの旅客自動車を旅客運送のため運転しようとする場合や代行運転自動車（自動車運転代行業（注５）に従事する運転者が客に代わつて運転する自動車をいいます。）である普通自動車を運転しようとする場合の免許をいいます。\u003c/blockquote>\u003c/figure>\n\u003cp>普通免許で運転できるのは、\u003cstrong>普通自動車、小型特殊自動車、一般原動機付自転車\u003c/strong>です。自動二輪車（バイク）は運転できません。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_85-Pr_2\" target=\"_blank\" rel=\"noopener\">道路交通法 第85条第2項（表の一部）\u003c/a>\u003c/figcaption>\u003cblockquote>前項の表の下欄に掲げる第一種免許を受けた者は、同表の区分に従い当該自動車等を運転することができるほか、次の表の上欄に掲げる免許の種類に応じ、それぞれ同表の下欄に掲げる種類の自動車等を運転することができる。\u003cbr>第一種免許の種類｜運転することができる自動車等の種類\u003cbr>普通免許｜小型特殊自動車及び一般原動機付自転車\u003c/blockquote>\u003c/figure>\n\u003cul>\u003cli>運転するときは、免許証（または免許情報を記録したマイナンバーカード）を携帯し、警察官から求められたら提示します（道路交通法第 95 条）\u003c/li>\u003cli>総重量が 750 キログラムを超える車をけん引するときは、けん引する自動車の免許のほかに、けん引免許が必要です。750 キログラム以下の車や、故障車をロープやクレーンなどでけん引するときは要りません\u003c/li>\u003c/ul>\n\u003ch3 id=\"G03-2\">仮免許\u003c/h3>\n\u003cp>普通仮免許で運転できるのは、普通自動車を、練習や試験などのために運転するときだけです。\u003c/p>\n\u003cul>\u003cli>練習のときは、その車を運転できる第一種免許を通算 3 年以上受けている人や、第二種免許を受けている人（21 歳以上）などを\u003cstrong>助手席に乗せ、その指導を受けながら\u003c/strong>運転します\u003c/li>\u003cli>練習のときは、車の前と後ろに、仮免許で練習中であることを示す標識を付けます\u003c/li>\u003cli>仮免許の有効期間は、適性試験を受けた日から \u003cstrong>6 か月\u003c/strong>です\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第87条第2項（条文を開く）\u003c/summary>\u003cblockquote>大型仮免許を受けた者は大型自動車、中型自動車、準中型自動車又は普通自動車を、中型仮免許を受けた者は中型自動車、準中型自動車又は普通自動車を、準中型仮免許を受けた者は準中型自動車又は普通自動車を、普通仮免許を受けた者は普通自動車を、練習のため又は試験等において運転することができる。この場合において、仮免許を受けた者は、練習のため自動車を運転しようとするときは、その運転者席の横の乗車装置に、当該自動車を運転することができる第一種免許を受けている者（免許の効力が停止されている者を除く。）で当該免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して三年以上のもの、当該自動車を運転することができる第二種免許を受けている者（免許の効力が停止されている者及び二十一歳に満たない者を除く。）その他政令で定める者を同乗させ、かつ、その指導の下に、当該自動車を運転しなければならない。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_6-Se_1-At_87-Pr_2\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"G03-3\">初心者マークなど\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>マーク\u003c/th>\u003cth>付ける人\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>初心者マーク\u003c/td>\u003ctd>準中型免許か普通免許を受けて 1 年たっていない人が普通自動車を運転するとき（付けなければならない）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高齢者マーク\u003c/td>\u003ctd>70 歳以上の人が普通自動車を運転するとき（付けるようにする）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>聴覚障害者マーク\u003c/td>\u003ctd>聴覚障害を理由に免許に条件が付いている人が、準中型自動車か普通自動車を運転するとき（付けなければならない）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>身体障害者マーク\u003c/td>\u003ctd>肢体不自由を理由に免許に条件が付いている人が、普通自動車を運転するとき（付けるようにする）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>マークは、車の\u003cstrong>前と後ろ\u003c/strong>の決められた位置に付けます。\u003c/p>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第71条の5第2項（条文を開く）\u003c/summary>\u003cblockquote>第八十四条第三項の準中型自動車免許又は普通自動車免許を受けた者で、当該準中型自動車免許又は普通自動車免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して一年に達しないもの（当該免許を受けた日前六月以内に準中型自動車免許又は普通自動車免許を受けていたことがある者、現に受けている準中型自動車免許又は普通自動車免許を受けた日以後に当該免許に係る上位免許（第八十五条第二項の規定により一の種類の運転免許について同条第一項の表の区分に従い運転することができる自動車等（以下「免許自動車等」という。）を運転することができる他の種類の運転免許（第八十四条第二項の仮運転免許を除く。）をいう。第百条の二第一項第一号及び第三号において同じ。）を受けた者その他の者で政令で定めるものを除く。）は、内閣府令で定めるところにより普通自動車の前面及び後面に内閣府令で定める様式の標識を付けないで普通自動車を運転してはならない。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71_5-Pr_2\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"G03-4\">運転の前に確かめること\u003c/h3>\n\u003cp>自動車を運転する前には、次のことを確かめます。\u003c/p>\n\u003cul>\u003cli>運転する自動車に応じた免許証を持っていること。免許証の条件（眼鏡等使用など）を守っていること\u003c/li>\u003cli>有効な自動車検査証（車検証）と、自動車損害賠償責任保険（自賠責保険）の証明書か責任共済の証明書を、車に備えていること\u003c/li>\u003cli>非常信号用具や停止表示器材（停止表示板か停止表示灯）などを、車に積んでいること\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること（条文を開く）\u003c/summary>\u003cblockquote>（1）自動車を運転する前には、必ず次のことを確かめましよう。\u003cbr>ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。\u003cbr>イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。\u003cbr>ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。\u003cbr>エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。\u003cbr>オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））\u003cbr>を付けていること。\u003cbr>カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。\u003cbr>キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。\u003c/blockquote>\u003cp>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=29\" target=\"_blank\" rel=\"noopener\">警察庁の教則の全文（PDF）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>長い距離はもちろん、短い区間でも、運転コース、所要時間、休息場所などの運転計画を立てます。長い時間運転するときは、\u003cstrong>2 時間に 1 回\u003c/strong>は休息をとり、眠気を感じたら速やかに休みます。\u003c/p>\n\u003ch3 id=\"G03-5\">体調と酒\u003c/h3>\n\u003cul>\u003cli>疲れているとき、病気のとき、心配ごとのあるときは、運転を控えるか、体調を整えてから運転する\u003c/li>\u003cli>眠くなる作用のある風邪薬や頭痛薬などを飲んだときは、運転しない\u003c/li>\u003cli>過労や病気、薬の影響などで正常な運転ができないおそれがあるときは、運転してはいけない（道路交通法第 66 条）\u003c/li>\u003cli>酒気を帯びているときは、運転してはいけない（道路交通法第 65 条）。前の晩に飲んだ酒でも、翌朝まで影響が残っていることがある\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=30\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第1節4 酒気を帯びた状態などで運転をしないこと\u003c/a>\u003c/figcaption>\u003cblockquote>酒気を帯びているときや麻薬、覚せい剤、シンナーなどの影響を受けているときは、運転してはいけません。また、酒を飲んだのが前夜であつても、翌朝の運転時まで酒の影響を受けていることがあることに注意しましよう。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G03-1","title":"運転免許の種類"},{"id":"G03-2","title":"仮免許"},{"id":"G03-3","title":"初心者マークなど"},{"id":"G03-4","title":"運転の前に確かめること"},{"id":"G03-5","title":"体調と酒"}],"search":[{"id":"","title":"","text":"この章では、運転免許の種類と仮免許のきまり、初心者マークなどの標識、運転の前に確かめることと体調の整え方を覚えます。"},{"id":"G03-1","title":"運転免許の種類","text":"運転免許の種類 自動車や一般原動機付自転車を運転するには、公安委員会の運転免許が必要です。免許は、次の 3 つに分かれます（道路交通法第 84 条）。 免許どんなときの免許か第一種運転免許自動車や一般原動機付自転車を運転するとき（第二種の場合を除く）第二種運転免許乗合バスやタクシーなどの旅客自動車を、旅客を運ぶために運転するときや、代行運転の普通自動車を運転するとき仮運転免許第一種免許を受けようとする人が、練習などのために大型・中型・準中型・普通自動車を運転するとき 交通の方法に関する教則 第4章第2節1（2） 運転免許の区分（2）第二種運転免許乗合バス、タクシーなどの旅客自動車を旅客運送のため運転しようとする場合や代行運転自動車（自動車運転代行業（注５）に従事する運転者が客に代わつて運転する自動車をいいます。）である普通自動車を運転しようとする場合の免許をいいます。 普通免許で運転できるのは、普通自動車、小型特殊自動車、一般原動機付自転車です。自動二輪車（バイク）は運転できません。 道路交通法 第85条第2項（表の一部）前項の表の下欄に掲げる第一種免許を受けた者は、同表の区分に従い当該自動車等を運転することができるほか、次の表の上欄に掲げる免許の種類に応じ、それぞれ同表の下欄に掲げる種類の自動車等を運転することができる。 第一種免許の種類｜運転することができる自動車等の種類 普通免許｜小型特殊自動車及び一般原動機付自転車 運転するときは、免許証（または免許情報を記録したマイナンバーカード）を携帯し、警察官から求められたら提示します（道路交通法第 95 条）総重量が 750 キログラムを超える車をけん引するときは、けん引する自動車の免許のほかに、けん引免許が必要です。750 キログラム以下の車や、故障車をロープやクレーンなどでけん引するときは要りません"},{"id":"G03-2","title":"仮免許","text":"仮免許 普通仮免許で運転できるのは、普通自動車を、練習や試験などのために運転するときだけです。 練習のときは、その車を運転できる第一種免許を通算 3 年以上受けている人や、第二種免許を受けている人（21 歳以上）などを助手席に乗せ、その指導を受けながら運転します練習のときは、車の前と後ろに、仮免許で練習中であることを示す標識を付けます仮免許の有効期間は、適性試験を受けた日から 6 か月です 道路交通法 第87条第2項（条文を開く）大型仮免許を受けた者は大型自動車、中型自動車、準中型自動車又は普通自動車を、中型仮免許を受けた者は中型自動車、準中型自動車又は普通自動車を、準中型仮免許を受けた者は準中型自動車又は普通自動車を、普通仮免許を受けた者は普通自動車を、練習のため又は試験等において運転することができる。この場合において、仮免許を受けた者は、練習のため自動車を運転しようとするときは、その運転者席の横の乗車装置に、当該自動車を運転することができる第一種免許を受けている者（免許の効力が停止されている者を除く。）で当該免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して三年以上のもの、当該自動車を運転することができる第二種免許を受けている者（免許の効力が停止されている者及び二十一歳に満たない者を除く。）その他政令で定める者を同乗させ、かつ、その指導の下に、当該自動車を運転しなければならない。e-Gov 法令検索で読む"},{"id":"G03-3","title":"初心者マークなど","text":"初心者マークなど マーク付ける人初心者マーク準中型免許か普通免許を受けて 1 年たっていない人が普通自動車を運転するとき（付けなければならない）高齢者マーク70 歳以上の人が普通自動車を運転するとき（付けるようにする）聴覚障害者マーク聴覚障害を理由に免許に条件が付いている人が、準中型自動車か普通自動車を運転するとき（付けなければならない）身体障害者マーク肢体不自由を理由に免許に条件が付いている人が、普通自動車を運転するとき（付けるようにする） マークは、車の前と後ろの決められた位置に付けます。 道路交通法 第71条の5第2項（条文を開く）第八十四条第三項の準中型自動車免許又は普通自動車免許を受けた者で、当該準中型自動車免許又は普通自動車免許を受けていた期間（当該免許の効力が停止されていた期間を除く。）が通算して一年に達しないもの（当該免許を受けた日前六月以内に準中型自動車免許又は普通自動車免許を受けていたことがある者、現に受けている準中型自動車免許又は普通自動車免許を受けた日以後に当該免許に係る上位免許（第八十五条第二項の規定により一の種類の運転免許について同条第一項の表の区分に従い運転することができる自動車等（以下「免許自動車等」という。）を運転することができる他の種類の運転免許（第八十四条第二項の仮運転免許を除く。）をいう。第百条の二第一項第一号及び第三号において同じ。）を受けた者その他の者で政令で定めるものを除く。）は、内閣府令で定めるところにより普通自動車の前面及び後面に内閣府令で定める様式の標識を付けないで普通自動車を運転してはならない。e-Gov 法令検索で読む"},{"id":"G03-4","title":"運転の前に確かめること","text":"運転の前に確かめること 自動車を運転する前には、次のことを確かめます。 運転する自動車に応じた免許証を持っていること。免許証の条件（眼鏡等使用など）を守っていること有効な自動車検査証（車検証）と、自動車損害賠償責任保険（自賠責保険）の証明書か責任共済の証明書を、車に備えていること非常信号用具や停止表示器材（停止表示板か停止表示灯）などを、車に積んでいること 交通の方法に関する教則 第4章第1節1（1） 運転免許証などを確かめるなどすること（条文を開く）（1）自動車を運転する前には、必ず次のことを確かめましよう。 ア運転しようとする自動車に応じた運転免許証又は免許情報記録個人番号カード（以下「免許証等」といいます。）を持つていること。 イ有効な自動車検査証と自動車損害賠償責任保険証明書又は責任共済証明書を自動車に備えていること。 ウ運転免許証に記載され、又は免許情報記録個人番号カードに記録されている条件（眼鏡等使用など）を守つていること。 エ準中型免許を受けて１年を経過していない初心運転者が準中型自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３））を付けていること。 オ準中型免許又は普通免許を受けて１年を経過していない初心運転者が普通自動車を運転するときは、その車の前と後ろの定められた位置に初心者マーク（付表５（３）） を付けていること。 カ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者が準中型自動車又は普通自動車を運転するときは、その車の前と後ろの定められた位置に聴覚障害者マーク（付表５（５））を付けていること。 キ非常信号用具や停止表示器材（停止表示板又は停止表示灯をいいます。）などを車に積んでいること。警察庁の教則の全文（PDF）で読む 長い距離はもちろん、短い区間でも、運転コース、所要時間、休息場所などの運転計画を立てます。長い時間運転するときは、2 時間に 1 回は休息をとり、眠気を感じたら速やかに休みます。"},{"id":"G03-5","title":"体調と酒","text":"体調と酒 疲れているとき、病気のとき、心配ごとのあるときは、運転を控えるか、体調を整えてから運転する眠くなる作用のある風邪薬や頭痛薬などを飲んだときは、運転しない過労や病気、薬の影響などで正常な運転ができないおそれがあるときは、運転してはいけない（道路交通法第 66 条）酒気を帯びているときは、運転してはいけない（道路交通法第 65 条）。前の晩に飲んだ酒でも、翌朝まで影響が残っていることがある 交通の方法に関する教則 第4章第1節4 酒気を帯びた状態などで運転をしないこと酒気を帯びているときや麻薬、覚せい剤、シンナーなどの影響を受けているときは、運転してはいけません。また、酒を飲んだのが前夜であつても、翌朝の運転時まで酒の影響を受けていることがあることに注意しましよう。"}],"only":""},{"id":"G04","subject":"学科","num":4,"title":"安全な発進と通行するところ","html":"\u003cp>この章では、乗り降りと運転姿勢、シートベルトとチャイルドシート、発進するときの安全確認と、道路のどこを通行するか（左側通行、車両通行帯、緊急自動車や路線バスの優先、通行してはいけないところ）を覚えます。\u003c/p>\n\u003ch3 id=\"G04-1\">乗り降りと運転姿勢\u003c/h3>\n\u003cul>\u003cli>乗り降りするときは、後方からの車を確かめ、交通量の多いところでは\u003cstrong>左側のドア\u003c/strong>から乗り降りする\u003c/li>\u003cli>降りるときは、ドアを少し開けて一度止め、安全を確かめてから降りる（少し開ける動作は、ほかの交通への合図にもなる）\u003c/li>\u003cli>シートの前後の位置は、クラッチを踏み込んだとき\u003cstrong>ひざがわずかに曲がる\u003c/strong>ように、シートの背は、ハンドルに両手を掛けたとき\u003cstrong>ひじがわずかに曲がる\u003c/strong>ように合わせる\u003c/li>\u003cli>げたやハイヒールなどを履いて運転してはいけない。ひじを窓わくに載せて運転しない\u003c/li>\u003cli>走行中に、携帯電話を手に持って通話したり、画面やカーナビの画像を注視したりしてはいけない（道路交通法第 71 条第 5 号の 5）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=41\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第1節2（1） 運転姿勢など\u003c/a>\u003c/figcaption>\u003cblockquote>（1）ゆとりのある正しい運転姿勢は、安全運転の第一歩です。シートの前後の位置は、クラッチを踏み込んだとき、ひざがわずかに曲がる状態に合わせ、シートの背は、ハンドルに両手を掛けたとき、ひじがわずかに曲がる状態に合わせることが大切です。体を斜めにして運転するのはやめましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G04-2\">シートベルトとチャイルドシート\u003c/h3>\n\u003cp>運転者はシートベルトを着用し、助手席や後部座席の同乗者にも着用させなければなりません。エアバッグのある車でも同じです。病気などやむを得ない理由があるときは別です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71_3-Pr_2\" target=\"_blank\" rel=\"noopener\">道路交通法 第71条の3第2項\u003c/a>\u003c/figcaption>\u003cblockquote>自動車の運転者は、座席ベルトを装着しない者を運転者席以外の乗車装置（当該乗車装置につき座席ベルトを備えなければならないこととされているものに限る。以下この項において同じ。）に乗車させて自動車を運転してはならない。ただし、幼児（適切に座席ベルトを装着させるに足りる座高を有するものを除く。以下この条において同じ。）を当該乗車装置に乗車させるとき、疾病のため座席ベルトを装着させることが療養上適当でない者を当該乗車装置に乗車させるとき、その他政令で定めるやむを得ない理由があるときは、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003cp>正しい着用の方法は、次のとおりです。\u003c/p>\n\u003cul>\u003cli>シートの背を倒さずに、深く腰掛ける\u003c/li>\u003cli>腰ベルトは骨盤を巻くようにしっかり締め、肩ベルトは首にかからないようにする\u003c/li>\u003cli>妊娠中も、腰ベルトだけでなく、腰ベルトと肩ベルトを共に着用する（大きくなった腹部をベルトが横切らないようにする）\u003c/li>\u003c/ul>\n\u003cp>幼児を乗せるときは、発育の程度に応じた形のチャイルドシート（幼児用補助装置）を使わせなければなりません（道路交通法第 71 条の 3 第 3 項）。\u003c/p>\n\u003ch3 id=\"G04-3\">発進の前に\u003c/h3>\n\u003cul>\u003cli>車に乗る前に、車の前後に人がいないか、車の下に子供がいないかを確かめる\u003c/li>\u003cli>方向指示器などで発進の合図をし、もう一度バックミラーなどで前後左右の安全を確かめてから発進する\u003c/li>\u003cli>バックで発進するのは危険なので、車庫などには、あらかじめバックで入れておく\u003c/li>\u003cli>運転席からは、車の構造によって、車や歩行者が見えなくなる範囲（死角）がある\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=43\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第1節5（3） 発進に当たつての安全確認\u003c/a>\u003c/figcaption>\u003cblockquote>（3）バックで発進することは危険ですから、車庫などに入れるときは、あらかじめ発進しやすいようにバックで入れておきましよう。やむを得ずバックで発進する場合で、後方の見通しがよくない場合や狭い道路から広い道路に出るときは、同乗者などに後方の確認を手伝つてもらいましよう。（平11公安告18・旧４繰下）\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G04-4\">道路の左側を通る\u003c/h3>\n\u003cp>車は、道路の中央（中央線があれば中央線）から\u003cstrong>左の部分\u003c/strong>を通行します。次のときは、右の部分にはみ出して通行できますが、一方通行のとき以外は、はみ出し方をできるだけ少なくします。\u003c/p>\n\u003cul>\u003cli>一方通行になっているとき\u003c/li>\u003cli>工事などのため、左側部分だけでは通行するのに十分な幅がないとき\u003c/li>\u003cli>左側部分の幅が \u003cstrong>6 メートル未満\u003c/strong>の見通しのよい道路で、ほかの車を追い越そうとするとき（標識や標示で、はみ出しが禁止されているときを除く）\u003c/li>\u003cli>勾配の急な道路の曲がり角付近で、「右側通行」の標示があるとき\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第17条第5項（条文を開く）\u003c/summary>\u003cblockquote>車両は、次の各号に掲げる場合においては、前項の規定にかかわらず、道路の中央から右の部分（以下「右側部分」という。）にその全部又は一部をはみ出して通行することができる。この場合において、車両は、第一号に掲げる場合を除き、そのはみ出し方ができるだけ少なくなるようにしなければならない。\u003cbr>一　当該道路が一方通行（道路における車両の通行につき一定の方向にする通行が禁止されていることをいう。以下同じ。）となつているとき。\u003cbr>二　当該道路の左側部分の幅員が当該車両の通行のため十分なものでないとき。\u003cbr>三　当該車両が道路の損壊、道路工事その他の障害のため当該道路の左側部分を通行することができないとき。\u003cbr>四　当該道路の左側部分の幅員が六メートルに満たない道路において、他の車両を追い越そうとするとき（当該道路の右側部分を見とおすことができ、かつ、反対の方向からの交通を妨げるおそれがない場合に限るものとし、道路標識等により追越しのため右側部分にはみ出して通行することが禁止されている場合を除く。）。\u003cbr>五　勾配の急な道路のまがりかど附近について、道路標識等により通行の方法が指定されている場合において、当該車両が当該指定に従い通行するとき。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_5\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"G04-5\">車両通行帯\u003c/h3>\n\u003cul>\u003cli>車両通行帯（車線）のない道路では、追越しなどのほかは、道路の\u003cstrong>左に寄って\u003c/strong>通行する\u003c/li>\u003cli>片側に車両通行帯が 2 つのときは、\u003cstrong>左側\u003c/strong>の車両通行帯を通行する\u003c/li>\u003cli>片側に 3 つ以上のときは、\u003cstrong>最も右側の車両通行帯は追越しのために空けて\u003c/strong>おき、それ以外を通行する。遅い車ほど左側を通る\u003c/li>\u003cli>追越しのため最も右側の車両通行帯を通ったときは、追い越し終わったら速やかに戻る\u003c/li>\u003cli>車両通行帯をみだりに変えず、同じ車両通行帯を通行する。2 つの車両通行帯にまたがって通行しない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=44\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第2節2（2） 道路の左寄りに走ること\u003c/a>\u003c/figcaption>\u003cblockquote>（2）同一の方向に二つの車両通行帯があるときは、左側の車両通行帯を通行しなければなりません。また、三つ以上の車両通行帯があるときは、最も右側の車両通行帯は追越しのために空けておき、それ以外の車両通行帯を通行することができます。この場合には、速度の遅い車が左側、速度が速くなるにつれて順次右側寄りの車両通行帯を通行しましよう。しかし、標識（付表３（１）32、32の２、32の３、33、33の２、34の２）や標示（付表３（２）14、14の２、14の３、15、16の２）によつて通行区分が示されているときは、それに従わなければなりません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G04-6\">緊急自動車と路線バス\u003c/h3>\n\u003cp>緊急自動車が近づいてきたときは、次のようにします（道路交通法第 40 条）。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場所\u003c/th>\u003cth>すること\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>交差点やその付近\u003c/td>\u003ctd>交差点を避け、道路の左側に寄って\u003cstrong>一時停止\u003c/strong>する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>それ以外\u003c/td>\u003ctd>道路の左側に寄って、\u003cstrong>進路を譲る\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>一方通行の道路で、左側に寄るとかえって緊急自動車の妨げになるときは、右側に寄ります。\u003c/p>\n\u003cp>路線バスなどについては、次のことを守ります。\u003c/p>\n\u003cul>\u003cli>停留所で止まっている路線バスなどが、発進の合図をしたときは、後ろの車はその発進を妨げてはいけない（急ブレーキや急ハンドルで避けなければならないときは別）\u003c/li>\u003cli>路線バスなどの専用通行帯は、普通自動車は原則として通行できない（右左折のためや、工事などでやむを得ないときは別）\u003c/li>\u003cli>路線バスなどの優先通行帯を通行していて、路線バスなどが近づいてきたときは、速やかにそこから出る。混雑していて出られなくなるおそれがあるときは、はじめから通行しない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=45\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第2節6（3） 路線バスなどの優先\u003c/a>\u003c/figcaption>\u003cblockquote>（3）標識（付表３（１）34）や標示（付表３（２）16）によつて路線バスなどの優先通行帯が指定されている道路では、優先通行帯を通行している自動車は、路線バスなどが近づいてきたときは、速やかにそこから出なければなりません。また、交通が混雑していて、路線バスなどが近づいてきてもそこから出られなくなるおそれがあるときは、はじめからその通行帯を通行してはいけません。しかし、右左折をするため道路の右端、中央や左端に寄る場合などや工事などでやむを得ない場合は別です。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G04-7\">通行してはいけないところ\u003c/h3>\n\u003cul>\u003cli>「通行止め」「車両通行止め」「歩行者等専用」などの標識のある道路\u003c/li>\u003cli>歩道、路側帯、自転車道（道路に面した場所に出入りするために横切るときは別。そのときは、歩道などに入る直前で一時停止し、歩行者の通行を妨げない）\u003c/li>\u003cli>安全地帯や、「立入り禁止部分」の標示のある場所\u003c/li>\u003cli>歩道や路側帯のない道路の路肩（路端から 0.5 メートルの部分）\u003c/li>\u003cli>軌道敷内（「軌道敷内通行可」の標識で認められた車や、右折するときなどは別）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_1-At_17-Pr_2\" target=\"_blank\" rel=\"noopener\">道路交通法 第17条第2項\u003c/a>\u003c/figcaption>\u003cblockquote>前項ただし書の場合において、車両は、歩道等に入る直前で一時停止し、かつ、歩行者の通行を妨げないようにしなければならない。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G04-1","title":"乗り降りと運転姿勢"},{"id":"G04-2","title":"シートベルトとチャイルドシート"},{"id":"G04-3","title":"発進の前に"},{"id":"G04-4","title":"道路の左側を通る"},{"id":"G04-5","title":"車両通行帯"},{"id":"G04-6","title":"緊急自動車と路線バス"},{"id":"G04-7","title":"通行してはいけないところ"}],"search":[{"id":"","title":"","text":"この章では、乗り降りと運転姿勢、シートベルトとチャイルドシート、発進するときの安全確認と、道路のどこを通行するか（左側通行、車両通行帯、緊急自動車や路線バスの優先、通行してはいけないところ）を覚えます。"},{"id":"G04-1","title":"乗り降りと運転姿勢","text":"乗り降りと運転姿勢 乗り降りするときは、後方からの車を確かめ、交通量の多いところでは左側のドアから乗り降りする降りるときは、ドアを少し開けて一度止め、安全を確かめてから降りる（少し開ける動作は、ほかの交通への合図にもなる）シートの前後の位置は、クラッチを踏み込んだときひざがわずかに曲がるように、シートの背は、ハンドルに両手を掛けたときひじがわずかに曲がるように合わせるげたやハイヒールなどを履いて運転してはいけない。ひじを窓わくに載せて運転しない走行中に、携帯電話を手に持って通話したり、画面やカーナビの画像を注視したりしてはいけない（道路交通法第 71 条第 5 号の 5） 交通の方法に関する教則 第5章第1節2（1） 運転姿勢など（1）ゆとりのある正しい運転姿勢は、安全運転の第一歩です。シートの前後の位置は、クラッチを踏み込んだとき、ひざがわずかに曲がる状態に合わせ、シートの背は、ハンドルに両手を掛けたとき、ひじがわずかに曲がる状態に合わせることが大切です。体を斜めにして運転するのはやめましよう。"},{"id":"G04-2","title":"シートベルトとチャイルドシート","text":"シートベルトとチャイルドシート 運転者はシートベルトを着用し、助手席や後部座席の同乗者にも着用させなければなりません。エアバッグのある車でも同じです。病気などやむを得ない理由があるときは別です。 道路交通法 第71条の3第2項自動車の運転者は、座席ベルトを装着しない者を運転者席以外の乗車装置（当該乗車装置につき座席ベルトを備えなければならないこととされているものに限る。以下この項において同じ。）に乗車させて自動車を運転してはならない。ただし、幼児（適切に座席ベルトを装着させるに足りる座高を有するものを除く。以下この条において同じ。）を当該乗車装置に乗車させるとき、疾病のため座席ベルトを装着させることが療養上適当でない者を当該乗車装置に乗車させるとき、その他政令で定めるやむを得ない理由があるときは、この限りでない。 正しい着用の方法は、次のとおりです。 シートの背を倒さずに、深く腰掛ける腰ベルトは骨盤を巻くようにしっかり締め、肩ベルトは首にかからないようにする妊娠中も、腰ベルトだけでなく、腰ベルトと肩ベルトを共に着用する（大きくなった腹部をベルトが横切らないようにする） 幼児を乗せるときは、発育の程度に応じた形のチャイルドシート（幼児用補助装置）を使わせなければなりません（道路交通法第 71 条の 3 第 3 項）。"},{"id":"G04-3","title":"発進の前に","text":"発進の前に 車に乗る前に、車の前後に人がいないか、車の下に子供がいないかを確かめる方向指示器などで発進の合図をし、もう一度バックミラーなどで前後左右の安全を確かめてから発進するバックで発進するのは危険なので、車庫などには、あらかじめバックで入れておく運転席からは、車の構造によって、車や歩行者が見えなくなる範囲（死角）がある 交通の方法に関する教則 第5章第1節5（3） 発進に当たつての安全確認（3）バックで発進することは危険ですから、車庫などに入れるときは、あらかじめ発進しやすいようにバックで入れておきましよう。やむを得ずバックで発進する場合で、後方の見通しがよくない場合や狭い道路から広い道路に出るときは、同乗者などに後方の確認を手伝つてもらいましよう。（平11公安告18・旧４繰下）"},{"id":"G04-4","title":"道路の左側を通る","text":"道路の左側を通る 車は、道路の中央（中央線があれば中央線）から左の部分を通行します。次のときは、右の部分にはみ出して通行できますが、一方通行のとき以外は、はみ出し方をできるだけ少なくします。 一方通行になっているとき工事などのため、左側部分だけでは通行するのに十分な幅がないとき左側部分の幅が 6 メートル未満の見通しのよい道路で、ほかの車を追い越そうとするとき（標識や標示で、はみ出しが禁止されているときを除く）勾配の急な道路の曲がり角付近で、「右側通行」の標示があるとき 道路交通法 第17条第5項（条文を開く）車両は、次の各号に掲げる場合においては、前項の規定にかかわらず、道路の中央から右の部分（以下「右側部分」という。）にその全部又は一部をはみ出して通行することができる。この場合において、車両は、第一号に掲げる場合を除き、そのはみ出し方ができるだけ少なくなるようにしなければならない。 一 当該道路が一方通行（道路における車両の通行につき一定の方向にする通行が禁止されていることをいう。以下同じ。）となつているとき。 二 当該道路の左側部分の幅員が当該車両の通行のため十分なものでないとき。 三 当該車両が道路の損壊、道路工事その他の障害のため当該道路の左側部分を通行することができないとき。 四 当該道路の左側部分の幅員が六メートルに満たない道路において、他の車両を追い越そうとするとき（当該道路の右側部分を見とおすことができ、かつ、反対の方向からの交通を妨げるおそれがない場合に限るものとし、道路標識等により追越しのため右側部分にはみ出して通行することが禁止されている場合を除く。）。 五 勾配の急な道路のまがりかど附近について、道路標識等により通行の方法が指定されている場合において、当該車両が当該指定に従い通行するとき。e-Gov 法令検索で読む"},{"id":"G04-5","title":"車両通行帯","text":"車両通行帯 車両通行帯（車線）のない道路では、追越しなどのほかは、道路の左に寄って通行する片側に車両通行帯が 2 つのときは、左側の車両通行帯を通行する片側に 3 つ以上のときは、最も右側の車両通行帯は追越しのために空けておき、それ以外を通行する。遅い車ほど左側を通る追越しのため最も右側の車両通行帯を通ったときは、追い越し終わったら速やかに戻る車両通行帯をみだりに変えず、同じ車両通行帯を通行する。2 つの車両通行帯にまたがって通行しない 交通の方法に関する教則 第5章第2節2（2） 道路の左寄りに走ること（2）同一の方向に二つの車両通行帯があるときは、左側の車両通行帯を通行しなければなりません。また、三つ以上の車両通行帯があるときは、最も右側の車両通行帯は追越しのために空けておき、それ以外の車両通行帯を通行することができます。この場合には、速度の遅い車が左側、速度が速くなるにつれて順次右側寄りの車両通行帯を通行しましよう。しかし、標識（付表３（１）32、32の２、32の３、33、33の２、34の２）や標示（付表３（２）14、14の２、14の３、15、16の２）によつて通行区分が示されているときは、それに従わなければなりません。"},{"id":"G04-6","title":"緊急自動車と路線バス","text":"緊急自動車と路線バス 緊急自動車が近づいてきたときは、次のようにします（道路交通法第 40 条）。 場所すること交差点やその付近交差点を避け、道路の左側に寄って一時停止するそれ以外道路の左側に寄って、進路を譲る 一方通行の道路で、左側に寄るとかえって緊急自動車の妨げになるときは、右側に寄ります。 路線バスなどについては、次のことを守ります。 停留所で止まっている路線バスなどが、発進の合図をしたときは、後ろの車はその発進を妨げてはいけない（急ブレーキや急ハンドルで避けなければならないときは別）路線バスなどの専用通行帯は、普通自動車は原則として通行できない（右左折のためや、工事などでやむを得ないときは別）路線バスなどの優先通行帯を通行していて、路線バスなどが近づいてきたときは、速やかにそこから出る。混雑していて出られなくなるおそれがあるときは、はじめから通行しない 交通の方法に関する教則 第5章第2節6（3） 路線バスなどの優先（3）標識（付表３（１）34）や標示（付表３（２）16）によつて路線バスなどの優先通行帯が指定されている道路では、優先通行帯を通行している自動車は、路線バスなどが近づいてきたときは、速やかにそこから出なければなりません。また、交通が混雑していて、路線バスなどが近づいてきてもそこから出られなくなるおそれがあるときは、はじめからその通行帯を通行してはいけません。しかし、右左折をするため道路の右端、中央や左端に寄る場合などや工事などでやむを得ない場合は別です。"},{"id":"G04-7","title":"通行してはいけないところ","text":"通行してはいけないところ 「通行止め」「車両通行止め」「歩行者等専用」などの標識のある道路歩道、路側帯、自転車道（道路に面した場所に出入りするために横切るときは別。そのときは、歩道などに入る直前で一時停止し、歩行者の通行を妨げない）安全地帯や、「立入り禁止部分」の標示のある場所歩道や路側帯のない道路の路肩（路端から 0.5 メートルの部分）軌道敷内（「軌道敷内通行可」の標識で認められた車や、右折するときなどは別） 道路交通法 第17条第2項前項ただし書の場合において、車両は、歩道等に入る直前で一時停止し、かつ、歩行者の通行を妨げないようにしなければならない。"}],"only":""},{"id":"G05","subject":"学科","num":5,"title":"歩行者などの保護","html":"\u003cp>自動車の運転者は、歩行者や自転車、子供、高齢者、身体の不自由な人、初心運転者などを守る運転をしなければなりません。この章では、そのきまりを覚えます。「徐行」は、車がすぐ停止できるような速度で進むことです。\u003c/p>\n\u003ch3 id=\"G05-1\">歩行者のそばを通るとき\u003c/h3>\n\u003cul>\u003cli>歩行者のそばを通るときは、歩行者との間に\u003cstrong>安全な間隔を空けるか、徐行\u003c/strong>する\u003c/li>\u003cli>歩行者がいる\u003cstrong>安全地帯\u003c/strong>のそばを通るときは、\u003cstrong>徐行\u003c/strong>する\u003c/li>\u003cli>停留所で止まっている路面電車の後ろでは\u003cstrong>停止\u003c/strong>し、乗り降りする人や横断する人がいなくなるまで待つ。乗り降りする人がいなくて、路面電車との間に \u003cstrong>1.5 メートル以上\u003c/strong>空けられるときや、安全地帯があるときは、徐行して進める\u003c/li>\u003cli>ぬかるみや水たまりのあるところでは、泥や水をはねて迷惑を掛けないように、徐行するなどして通る\u003c/li>\u003cli>止まっている車のそばを通るときは、急にドアが開いたり、陰から人が飛び出したりすることに注意する\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_31\" target=\"_blank\" rel=\"noopener\">道路交通法 第31条\u003c/a>\u003c/figcaption>\u003cblockquote>（停車中の路面電車がある場合の停止又は徐行）\u003cbr>第三十一条　車両は、乗客の乗降のため停車中の路面電車に追いついたときは、当該路面電車の乗客が乗降を終わり、又は当該路面電車から降りた者で当該車両の前方において当該路面電車の左側を横断し、若しくは横断しようとしているものがいなくなるまで、当該路面電車の後方で停止しなければならない。ただし、路面電車に乗降する者の安全を図るため設けられた安全地帯があるとき、又は当該路面電車に乗降する者がいない場合において当該路面電車の左側に当該路面電車から一・五メートル以上の間隔を保つことができるときは、徐行して当該路面電車の左側を通過することができる。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G05-2\">横断歩道と自転車横断帯\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場面\u003c/th>\u003cth>すること\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>横断歩道や自転車横断帯に近づいたとき\u003c/td>\u003ctd>横断する人がいないことが明らかなときのほかは、手前で停止できるような速度で進む\u003c/td>\u003c/tr>\u003ctr>\u003ctd>横断している人や、横断しようとしている人がいるとき\u003c/td>\u003ctd>横断歩道などの手前（停止線があればその手前）で\u003cstrong>一時停止\u003c/strong>し、道を譲る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>横断歩道などやその手前で止まっている車があるとき\u003c/td>\u003ctd>そのそばを通って前に出る前に\u003cstrong>一時停止\u003c/strong>する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>横断歩道などとその手前から \u003cstrong>30 メートル以内\u003c/strong>\u003c/td>\u003ctd>ほかの車を\u003cstrong>追い越したり、追い抜いたりしてはいけない\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6_2-At_38-Pr_1\" target=\"_blank\" rel=\"noopener\">道路交通法 第38条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>車両等は、横断歩道又は自転車横断帯（以下この条において「横断歩道等」という。）に接近する場合には、当該横断歩道等を通過する際に当該横断歩道等によりその進路の前方を横断しようとする歩行者又は自転車（以下この条において「歩行者等」という。）がないことが明らかな場合を除き、当該横断歩道等の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止することができるような速度で進行しなければならない。この場合において、横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、当該横断歩道等の直前で一時停止し、かつ、その通行を妨げないようにしなければならない。\u003c/blockquote>\u003c/figure>\n\u003cul>\u003cli>横断歩道のない交差点やその近くを歩行者が横断しているときも、その通行を妨げてはいけない\u003c/li>\u003cli>横断歩道などのない場所でも、歩行者が横断することがあるので注意する\u003c/li>\u003c/ul>\n\u003ch3 id=\"G05-3\">子供・高齢者・身体の不自由な人\u003c/h3>\n\u003cp>次の人が通行しているときは、\u003cstrong>一時停止か徐行\u003c/strong>をして、安全に通れるようにします。\u003c/p>\n\u003cul>\u003cli>身体障害者用の車で通行している人\u003c/li>\u003cli>白か黄のつえを持った人、盲導犬を連れた人\u003c/li>\u003cli>独りで歩いている子供\u003c/li>\u003cli>つえを持っていたり、歩行補助車を使っていたりする高齢者など、通行に支障のある高齢者\u003c/li>\u003c/ul>\n\u003cp>止まっている\u003cstrong>通学通園バス\u003c/strong>のそばを通るときは、\u003cstrong>徐行\u003c/strong>して安全を確かめます。学校、幼稚園、遊園地などの付近や、通学路の標識のあるところでは、子供の飛び出しに特に注意します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_1-At_71-Pr_1-It_2_3\" target=\"_blank\" rel=\"noopener\">道路交通法 第71条第2号の3\u003c/a>\u003c/figcaption>\u003cblockquote>車両等の運転者は、次に掲げる事項を守らなければならない。\u003cbr>二の三　児童、幼児等の乗降のため、政令で定めるところにより停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、徐行して安全を確認すること。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G05-4\">歩行者用道路と自転車\u003c/h3>\n\u003cul>\u003cli>歩行者用道路は、沿道に車庫を持つ車など、特に通行を認められた車だけが通行できる。その場合も、歩行者に注意して\u003cstrong>徐行\u003c/strong>する\u003c/li>\u003cli>自転車や特定小型原動機付自転車（電動キックボードなど）は、原則として車道を通る車両の一種で、不安定で体を守る機能がないので、安全に十分配慮する\u003c/li>\u003cli>追越しのため自転車などのそばを通るときは、ふらつきを予想して、\u003cstrong>安全な間隔を空けるか、徐行\u003c/strong>する\u003c/li>\u003cli>追抜きのため自転車などの右側を通るときに、十分な間隔がないときは、間隔に応じた安全な速度で進む\u003c/li>\u003cli>交差点では、自転車などとの衝突や、左側の自転車などの巻き込みに十分注意する\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=48\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第3節7（2） 特定小型原動機付自転車や自転車の保護\u003c/a>\u003c/figcaption>\u003cblockquote>（2）追越しのため特定小型原動機付自転車や自転車のそばを通るときは、特定小型原動機付自転車や自転車のふらつきなどを予想し、特定小型原動機付自転車や自転車との間に安全な間隔を空けるか、徐行しなければなりません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G05-5\">初心運転者などの保護と迷惑な運転\u003c/h3>\n\u003cp>危険を避けるためやむを得ない場合のほか、次の車に\u003cstrong>幅寄せをしたり、前に無理に割り込んだりしてはいけません\u003c/strong>。\u003c/p>\n\u003cul>\u003cli>初心者マーク、高齢者マーク、聴覚障害者マーク、身体障害者マークを付けた車（それぞれ、マークを付けるべき人が運転しているもの）\u003c/li>\u003cli>仮免許で練習中の人が運転している自動車\u003c/li>\u003c/ul>\n\u003cp>聴覚障害者マークの車の運転者は、警音器の音が聞こえないことがあるので、安全に通行できるように配慮します。\u003c/p>\n\u003cul>\u003cli>集団で走行するときに、ジグザグ運転や巻き込み運転など、ほかの車に危険を生じさせたり迷惑を掛けたりする行為をしてはいけない\u003c/li>\u003cli>著しく迷惑な騒音を生じさせるような急発進、急加速や空ぶかしをしてはいけない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=49\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第3節8（1） 初心運転者などの保護\u003c/a>\u003c/figcaption>\u003cblockquote>（1）危険を避けるためやむを得ない場合のほか、次の車の側方に幅寄せをしたり、前方に無理に割り込んではいけません。\u003cbr>ア準中型免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた準中型自動車\u003cbr>イ準中型免許又は普通免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた普通自動車\u003cbr>ウ70歳以上の高齢者が運転している高齢者マークを付けた普通自動車\u003cbr>エ聴覚障害のある運転者が運転している聴覚障害者マークを付けた準中型自動車又は普通自動車\u003cbr>オ身体の不自由な運転者が運転している身体障害者マークを付けた普通自動車\u003cbr>カ仮免許で練習中の者が運転している自動車\u003c/blockquote>\u003c/figure>","sections":[{"id":"G05-1","title":"歩行者のそばを通るとき"},{"id":"G05-2","title":"横断歩道と自転車横断帯"},{"id":"G05-3","title":"子供・高齢者・身体の不自由な人"},{"id":"G05-4","title":"歩行者用道路と自転車"},{"id":"G05-5","title":"初心運転者などの保護と迷惑な運転"}],"search":[{"id":"","title":"","text":"自動車の運転者は、歩行者や自転車、子供、高齢者、身体の不自由な人、初心運転者などを守る運転をしなければなりません。この章では、そのきまりを覚えます。「徐行」は、車がすぐ停止できるような速度で進むことです。"},{"id":"G05-1","title":"歩行者のそばを通るとき","text":"歩行者のそばを通るとき 歩行者のそばを通るときは、歩行者との間に安全な間隔を空けるか、徐行する歩行者がいる安全地帯のそばを通るときは、徐行する停留所で止まっている路面電車の後ろでは停止し、乗り降りする人や横断する人がいなくなるまで待つ。乗り降りする人がいなくて、路面電車との間に 1.5 メートル以上空けられるときや、安全地帯があるときは、徐行して進めるぬかるみや水たまりのあるところでは、泥や水をはねて迷惑を掛けないように、徐行するなどして通る止まっている車のそばを通るときは、急にドアが開いたり、陰から人が飛び出したりすることに注意する 道路交通法 第31条（停車中の路面電車がある場合の停止又は徐行） 第三十一条 車両は、乗客の乗降のため停車中の路面電車に追いついたときは、当該路面電車の乗客が乗降を終わり、又は当該路面電車から降りた者で当該車両の前方において当該路面電車の左側を横断し、若しくは横断しようとしているものがいなくなるまで、当該路面電車の後方で停止しなければならない。ただし、路面電車に乗降する者の安全を図るため設けられた安全地帯があるとき、又は当該路面電車に乗降する者がいない場合において当該路面電車の左側に当該路面電車から一・五メートル以上の間隔を保つことができるときは、徐行して当該路面電車の左側を通過することができる。"},{"id":"G05-2","title":"横断歩道と自転車横断帯","text":"横断歩道と自転車横断帯 場面すること横断歩道や自転車横断帯に近づいたとき横断する人がいないことが明らかなときのほかは、手前で停止できるような速度で進む横断している人や、横断しようとしている人がいるとき横断歩道などの手前（停止線があればその手前）で一時停止し、道を譲る横断歩道などやその手前で止まっている車があるときそのそばを通って前に出る前に一時停止する横断歩道などとその手前から 30 メートル以内ほかの車を追い越したり、追い抜いたりしてはいけない 道路交通法 第38条第1項車両等は、横断歩道又は自転車横断帯（以下この条において「横断歩道等」という。）に接近する場合には、当該横断歩道等を通過する際に当該横断歩道等によりその進路の前方を横断しようとする歩行者又は自転車（以下この条において「歩行者等」という。）がないことが明らかな場合を除き、当該横断歩道等の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止することができるような速度で進行しなければならない。この場合において、横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、当該横断歩道等の直前で一時停止し、かつ、その通行を妨げないようにしなければならない。 横断歩道のない交差点やその近くを歩行者が横断しているときも、その通行を妨げてはいけない横断歩道などのない場所でも、歩行者が横断することがあるので注意する"},{"id":"G05-3","title":"子供・高齢者・身体の不自由な人","text":"子供・高齢者・身体の不自由な人 次の人が通行しているときは、一時停止か徐行をして、安全に通れるようにします。 身体障害者用の車で通行している人白か黄のつえを持った人、盲導犬を連れた人独りで歩いている子供つえを持っていたり、歩行補助車を使っていたりする高齢者など、通行に支障のある高齢者 止まっている通学通園バスのそばを通るときは、徐行して安全を確かめます。学校、幼稚園、遊園地などの付近や、通学路の標識のあるところでは、子供の飛び出しに特に注意します。 道路交通法 第71条第2号の3車両等の運転者は、次に掲げる事項を守らなければならない。 二の三 児童、幼児等の乗降のため、政令で定めるところにより停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、徐行して安全を確認すること。"},{"id":"G05-4","title":"歩行者用道路と自転車","text":"歩行者用道路と自転車 歩行者用道路は、沿道に車庫を持つ車など、特に通行を認められた車だけが通行できる。その場合も、歩行者に注意して徐行する自転車や特定小型原動機付自転車（電動キックボードなど）は、原則として車道を通る車両の一種で、不安定で体を守る機能がないので、安全に十分配慮する追越しのため自転車などのそばを通るときは、ふらつきを予想して、安全な間隔を空けるか、徐行する追抜きのため自転車などの右側を通るときに、十分な間隔がないときは、間隔に応じた安全な速度で進む交差点では、自転車などとの衝突や、左側の自転車などの巻き込みに十分注意する 交通の方法に関する教則 第5章第3節7（2） 特定小型原動機付自転車や自転車の保護（2）追越しのため特定小型原動機付自転車や自転車のそばを通るときは、特定小型原動機付自転車や自転車のふらつきなどを予想し、特定小型原動機付自転車や自転車との間に安全な間隔を空けるか、徐行しなければなりません。"},{"id":"G05-5","title":"初心運転者などの保護と迷惑な運転","text":"初心運転者などの保護と迷惑な運転 危険を避けるためやむを得ない場合のほか、次の車に幅寄せをしたり、前に無理に割り込んだりしてはいけません。 初心者マーク、高齢者マーク、聴覚障害者マーク、身体障害者マークを付けた車（それぞれ、マークを付けるべき人が運転しているもの）仮免許で練習中の人が運転している自動車 聴覚障害者マークの車の運転者は、警音器の音が聞こえないことがあるので、安全に通行できるように配慮します。 集団で走行するときに、ジグザグ運転や巻き込み運転など、ほかの車に危険を生じさせたり迷惑を掛けたりする行為をしてはいけない著しく迷惑な騒音を生じさせるような急発進、急加速や空ぶかしをしてはいけない 交通の方法に関する教則 第5章第3節8（1） 初心運転者などの保護（1）危険を避けるためやむを得ない場合のほか、次の車の側方に幅寄せをしたり、前方に無理に割り込んではいけません。 ア準中型免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた準中型自動車 イ準中型免許又は普通免許を受けて１年を経過していない初心運転者が運転している初心者マークを付けた普通自動車 ウ70歳以上の高齢者が運転している高齢者マークを付けた普通自動車 エ聴覚障害のある運転者が運転している聴覚障害者マークを付けた準中型自動車又は普通自動車 オ身体の不自由な運転者が運転している身体障害者マークを付けた普通自動車 カ仮免許で練習中の者が運転している自動車"}],"only":""},{"id":"G06","subject":"学科","num":6,"title":"速度と車間距離・徐行","html":"\u003cp>この章では、最高速度、停止距離と車間距離、ブレーキの掛け方、徐行しなければならない場所を覚えます。\u003c/p>\n\u003ch3 id=\"G06-1\">最高速度\u003c/h3>\n\u003cp>標識や標示で最高速度が示されているときは、その速度を超えてはいけません。示されていないとき（法定速度）は、次のとおりです（道路交通法施行令第 11 条）。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>車と道路\u003c/th>\u003cth>最高速度\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>自動車：中央線や車両通行帯がある一般道路、往復の方向が分離された一般道路、自動車専用道路など\u003c/td>\u003ctd>時速 60 キロメートル\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自動車：中央線などがない一般道路（生活道路など）\u003c/td>\u003ctd>時速 30 キロメートル\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般原動機付自転車\u003c/td>\u003ctd>時速 30 キロメートル\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>中央線などがない一般道路の時速 30 キロメートルは、2026 年 9 月 1 日からのきまりです（それまでは、標識などがなければ時速 60 キロメートルでした）\u003c/li>\u003cli>決められた速度の範囲内でも、道路や交通の状況、天候や視界などをよく考え、特に生活道路では歩行者が優先という意識を持って、安全な速度で走る\u003c/li>\u003cli>高速自動車国道の最高速度は、高速道路の章で覚えます\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>道路交通法施行令 第11条（条文を開く）\u003c/summary>\u003cblockquote>（最高速度）\u003cbr>第十一条　法第二十二条第一項の政令で定める最高速度（以下この条、次条及び第二十七条において「最高速度」という。）のうち、自動車及び原動機付自転車が高速自動車国道の本線車道（第二十七条の二に規定する本線車道を除く。第一号イ及び第二十七条において同じ。）並びにこれに接する加速車線及び減速車線以外の道路（以下この条及び次条において「一般道路」という。）を通行する場合の最高速度は、自動車にあつては次の各号に掲げる一般道路の区分に応じ当該各号に定める速度、原動機付自転車にあつては三十キロメートル毎時とする。\u003cbr>一　次に掲げる一般道路　六十キロメートル毎時\u003cbr>　イ　高速自動車国道のうち、本線車道並びにこれに接する加速車線及び減速車線以外のもの\u003cbr>　ロ　自動車専用道路\u003cbr>　ハ　道路標識等による中央線又は車両通行帯が設けられている一般道路\u003cbr>　ニ　道路の構造上又は柵その他の内閣府令で定める工作物により自動車の通行が往復の方向別に分離されている一般道路\u003cbr>二　前号に掲げる一般道路以外の一般道路　三十キロメートル毎時\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_11\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"G06-2\">停止距離と車間距離\u003c/h3>\n\u003cp>車は急には止まれません。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>空走距離\u003c/strong>：運転者が危険を感じてからブレーキを踏み、ブレーキが実際に効き始めるまでに車が走る距離\u003c/li>\u003cli>\u003cstrong>制動距離\u003c/strong>：ブレーキが効き始めてから車が止まるまでの距離\u003c/li>\u003cli>\u003cstrong>停止距離\u003c/strong> ＝ 空走距離 ＋ 制動距離\u003c/li>\u003c/ul>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状態\u003c/th>\u003cth>長くなる距離\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>運転者が疲れている（危険を認知して判断するまでに時間がかかる）\u003c/td>\u003ctd>空走距離\u003c/td>\u003c/tr>\u003ctr>\u003ctd>雨にぬれた道路、重い荷物を積んでいる\u003c/td>\u003ctd>制動距離\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>路面が雨にぬれ、タイヤがすり減っているときの停止距離は、乾燥した路面でタイヤの状態が良いときの \u003cstrong>2 倍程度\u003c/strong>に延びることがあります。前の車が急に止まっても追突しないような、安全な車間距離をとります（道路交通法第 26 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=50\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第4節2（2） 停止距離と車間距離\u003c/a>\u003c/figcaption>\u003cblockquote>（2）運転者が疲れているときは、危険を認知して判断するまでに時間がかかるので、空走距離は長くなります。また雨にぬれた道路を走る場合や重い荷物を積んでいる場合などは制動距離が長くなります。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G06-3\">ブレーキの掛け方\u003c/h3>\n\u003cul>\u003cli>最初はできるだけ軽く踏み込み、それから必要な強さまで徐々に踏み込む\u003c/li>\u003cli>ブレーキは\u003cstrong>数回に分けて\u003c/strong>使う。滑りやすい道路でとりわけ効果があり、ブレーキ灯が点滅して後ろの車への合図にもなる\u003c/li>\u003cli>危険を避けるためやむを得ない場合のほかは、\u003cstrong>急ブレーキを掛けてはいけない\u003c/strong>（道路交通法第 24 条）\u003c/li>\u003cli>アンチロックブレーキシステム（ABS）の付いた車で急ブレーキを掛けるときは、\u003cstrong>一気に強く踏み込み、そのまま踏み込み続ける\u003c/strong>\u003c/li>\u003cli>むやみにブレーキを使わず、なるべくアクセルの操作で速度を落としてから止まる\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=51\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第4節3（3） ブレーキの掛け方\u003c/a>\u003c/figcaption>\u003cblockquote>（3）危険を避けるためにやむを得ない場合のほかは、急ブレーキを掛けてはいけません。なお、アンチロックブレーキシステム（走行中の自動車の制御に著しい支障を及ぼす車輪の回転運動の停止を有効に防止できる装置をいいます。）を備えた自動車で急ブレーキを掛ける場合には、システムを作動させるために、一気に強く踏み込み、そのまま踏み込み続けることが必要です。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G06-4\">徐行しなければならない場所\u003c/h3>\n\u003cp>\u003cstrong>徐行\u003c/strong>とは、車が\u003cstrong>直ちに停止することができるような速度\u003c/strong>で進むことです（道路交通法第 2 条）。速度の数字は決まっていません。次の場所では、徐行しなければなりません。\u003c/p>\n\u003cul>\u003cli>「徐行」の標識があるところ\u003c/li>\u003cli>左右の見通しがきかない交差点（信号機などで交通整理が行われているときや、優先道路を通行しているときは除く）\u003c/li>\u003cli>道路の曲がり角付近\u003c/li>\u003cli>上り坂の頂上付近と、勾配の急な下り坂（勾配の急な\u003cstrong>上り坂\u003c/strong>は含まれない）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_8-At_42\" target=\"_blank\" rel=\"noopener\">道路交通法 第42条\u003c/a>\u003c/figcaption>\u003cblockquote>（徐行すべき場所）\u003cbr>第四十二条　車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。\u003cbr>一　左右の見とおしがきかない交差点に入ろうとし、又は交差点内で左右の見とおしがきかない部分を通行しようとするとき（当該交差点において交通整理が行なわれている場合及び優先道路を通行している場合を除く。）。\u003cbr>二　道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するとき。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G06-1","title":"最高速度"},{"id":"G06-2","title":"停止距離と車間距離"},{"id":"G06-3","title":"ブレーキの掛け方"},{"id":"G06-4","title":"徐行しなければならない場所"}],"search":[{"id":"","title":"","text":"この章では、最高速度、停止距離と車間距離、ブレーキの掛け方、徐行しなければならない場所を覚えます。"},{"id":"G06-1","title":"最高速度","text":"最高速度 標識や標示で最高速度が示されているときは、その速度を超えてはいけません。示されていないとき（法定速度）は、次のとおりです（道路交通法施行令第 11 条）。 車と道路最高速度自動車：中央線や車両通行帯がある一般道路、往復の方向が分離された一般道路、自動車専用道路など時速 60 キロメートル自動車：中央線などがない一般道路（生活道路など）時速 30 キロメートル一般原動機付自転車時速 30 キロメートル 中央線などがない一般道路の時速 30 キロメートルは、2026 年 9 月 1 日からのきまりです（それまでは、標識などがなければ時速 60 キロメートルでした）決められた速度の範囲内でも、道路や交通の状況、天候や視界などをよく考え、特に生活道路では歩行者が優先という意識を持って、安全な速度で走る高速自動車国道の最高速度は、高速道路の章で覚えます 道路交通法施行令 第11条（条文を開く）（最高速度） 第十一条 法第二十二条第一項の政令で定める最高速度（以下この条、次条及び第二十七条において「最高速度」という。）のうち、自動車及び原動機付自転車が高速自動車国道の本線車道（第二十七条の二に規定する本線車道を除く。第一号イ及び第二十七条において同じ。）並びにこれに接する加速車線及び減速車線以外の道路（以下この条及び次条において「一般道路」という。）を通行する場合の最高速度は、自動車にあつては次の各号に掲げる一般道路の区分に応じ当該各号に定める速度、原動機付自転車にあつては三十キロメートル毎時とする。 一 次に掲げる一般道路 六十キロメートル毎時 イ 高速自動車国道のうち、本線車道並びにこれに接する加速車線及び減速車線以外のもの ロ 自動車専用道路 ハ 道路標識等による中央線又は車両通行帯が設けられている一般道路 ニ 道路の構造上又は柵その他の内閣府令で定める工作物により自動車の通行が往復の方向別に分離されている一般道路 二 前号に掲げる一般道路以外の一般道路 三十キロメートル毎時e-Gov 法令検索で読む"},{"id":"G06-2","title":"停止距離と車間距離","text":"停止距離と車間距離 車は急には止まれません。 空走距離：運転者が危険を感じてからブレーキを踏み、ブレーキが実際に効き始めるまでに車が走る距離制動距離：ブレーキが効き始めてから車が止まるまでの距離停止距離 ＝ 空走距離 ＋ 制動距離 状態長くなる距離運転者が疲れている（危険を認知して判断するまでに時間がかかる）空走距離雨にぬれた道路、重い荷物を積んでいる制動距離 路面が雨にぬれ、タイヤがすり減っているときの停止距離は、乾燥した路面でタイヤの状態が良いときの 2 倍程度に延びることがあります。前の車が急に止まっても追突しないような、安全な車間距離をとります（道路交通法第 26 条）。 交通の方法に関する教則 第5章第4節2（2） 停止距離と車間距離（2）運転者が疲れているときは、危険を認知して判断するまでに時間がかかるので、空走距離は長くなります。また雨にぬれた道路を走る場合や重い荷物を積んでいる場合などは制動距離が長くなります。"},{"id":"G06-3","title":"ブレーキの掛け方","text":"ブレーキの掛け方 最初はできるだけ軽く踏み込み、それから必要な強さまで徐々に踏み込むブレーキは数回に分けて使う。滑りやすい道路でとりわけ効果があり、ブレーキ灯が点滅して後ろの車への合図にもなる危険を避けるためやむを得ない場合のほかは、急ブレーキを掛けてはいけない（道路交通法第 24 条）アンチロックブレーキシステム（ABS）の付いた車で急ブレーキを掛けるときは、一気に強く踏み込み、そのまま踏み込み続けるむやみにブレーキを使わず、なるべくアクセルの操作で速度を落としてから止まる 交通の方法に関する教則 第5章第4節3（3） ブレーキの掛け方（3）危険を避けるためにやむを得ない場合のほかは、急ブレーキを掛けてはいけません。なお、アンチロックブレーキシステム（走行中の自動車の制御に著しい支障を及ぼす車輪の回転運動の停止を有効に防止できる装置をいいます。）を備えた自動車で急ブレーキを掛ける場合には、システムを作動させるために、一気に強く踏み込み、そのまま踏み込み続けることが必要です。"},{"id":"G06-4","title":"徐行しなければならない場所","text":"徐行しなければならない場所 徐行とは、車が直ちに停止することができるような速度で進むことです（道路交通法第 2 条）。速度の数字は決まっていません。次の場所では、徐行しなければなりません。 「徐行」の標識があるところ左右の見通しがきかない交差点（信号機などで交通整理が行われているときや、優先道路を通行しているときは除く）道路の曲がり角付近上り坂の頂上付近と、勾配の急な下り坂（勾配の急な上り坂は含まれない） 道路交通法 第42条（徐行すべき場所） 第四十二条 車両等は、道路標識等により徐行すべきことが指定されている道路の部分を通行する場合及び次に掲げるその他の場合においては、徐行しなければならない。 一 左右の見とおしがきかない交差点に入ろうとし、又は交差点内で左右の見とおしがきかない部分を通行しようとするとき（当該交差点において交通整理が行なわれている場合及び優先道路を通行している場合を除く。）。 二 道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するとき。"}],"only":""},{"id":"G07","subject":"学科","num":7,"title":"合図と進路変更","html":"\u003cp>この章では、右左折や進路変更などの合図の時期と方法、警音器を鳴らす場合、進路変更と横断・転回のきまりを覚えます。\u003c/p>\n\u003ch3 id=\"G07-1\">合図の時期と方法\u003c/h3>\n\u003cp>左折、右折、転回、進路変更、徐行、停止、後退をするときは、手、方向指示器か灯火で合図をし、その行為が終わるまで続けます。合図の前には、バックミラーなどで安全を確かめます（環状交差点の合図は、交差点の章で覚えます）。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>合図を行う場合\u003c/th>\u003cth>合図を行う時期\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>左折・右折・転回\u003c/td>\u003ctd>その地点（交差点では交差点の手前の側端）から \u003cstrong>30 メートル手前\u003c/strong>に達したとき\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同じ方向に進みながら進路を変える\u003c/td>\u003ctd>進路を変えようとするときの \u003cstrong>3 秒前\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>徐行・停止・後退\u003c/td>\u003ctd>その行為をしようとするとき\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_21-Pr_1\" target=\"_blank\" rel=\"noopener\">道路交通法施行令 第21条第1項（表の一部）\u003c/a>\u003c/figcaption>\u003cblockquote>法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。\u003cbr>合図を行う場合｜合図を行う時期｜合図の方法\u003cbr>左折するとき。｜その行為をしようとする地点（交差点においてその行為をする場合にあつては、当該交差点の手前の側端）から三十メートル手前の地点に達したとき。｜左腕を車体の左側の外に出して水平に伸ばし、若しくは右腕を車体の右側の外に出して肘を垂直に上に曲げること、又は左側の方向指示器を操作すること。\u003cbr>同一方向に進行しながら進路を左方に変えるとき。｜その行為をしようとする時の三秒前のとき。\u003c/blockquote>\u003c/figure>\n\u003cp>手による合図の方法は、次のとおりです。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>合図\u003c/th>\u003cth>手による方法（方向指示器や灯火の代わり）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>左折・左への進路変更\u003c/td>\u003ctd>左腕を車の左側の外に出して水平に伸ばすか、右腕を車の右側の外に出して肘を垂直に上に曲げる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右折・転回・右への進路変更\u003c/td>\u003ctd>右腕を車の右側の外に出して水平に伸ばすか、左腕を車の左側の外に出して肘を垂直に上に曲げる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>徐行・停止\u003c/td>\u003ctd>腕を車の外に出して斜め下に伸ばす（ブレーキ灯をつけてもよい）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>後退\u003c/td>\u003ctd>腕を車の外に出して斜め下に伸ばし、手のひらを後ろに向けて腕を前後に動かす（後退灯をつけてもよい）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>行為が終わったら、速やかに合図をやめる。必要がないのに合図をしてはいけない\u003c/li>\u003cli>夕日の反射などで方向指示器が見えにくいときは、手による合図も併せて行う\u003c/li>\u003c/ul>\n\u003ch3 id=\"G07-2\">警音器\u003c/h3>\n\u003cp>警音器を\u003cstrong>鳴らさなければならない\u003c/strong>のは、次のときです（道路交通法第 54 条）。\u003c/p>\n\u003cul>\u003cli>「警笛鳴らせ」の標識がある場所を通るとき\u003c/li>\u003cli>「警笛区間」の標識がある区間内で、\u003cstrong>見通しのきかない\u003c/strong>交差点、曲がり角、上り坂の頂上を通るとき\u003c/li>\u003c/ul>\n\u003cp>これ以外は、危険を避けるためやむを得ないときのほかは、警音器を\u003cstrong>鳴らしてはいけません\u003c/strong>。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_54-Pr_2\" target=\"_blank\" rel=\"noopener\">道路交通法 第54条第2項\u003c/a>\u003c/figcaption>\u003cblockquote>車両等の運転者は、法令の規定により警音器を鳴らさなければならないこととされている場合を除き、警音器を鳴らしてはならない。ただし、危険を防止するためやむを得ないときは、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G07-3\">進路変更\u003c/h3>\n\u003cul>\u003cli>みだりに進路を変更してはいけない\u003c/li>\u003cli>進路を変えると、後ろから来る車が急ブレーキや急ハンドルで避けなければならないようなときは、進路を変えてはいけない（道路交通法第 26 条の 2）\u003c/li>\u003cli>車両通行帯が\u003cstrong>黄色の線\u003c/strong>で区画されているときは、その線を越えて進路を変えてはいけない。白の線で区画されていても、自分の側に黄色の線が平行して引かれているときは同じ\u003c/li>\u003cli>やむを得ず進路を変えるときは、バックミラーや目視で安全を確かめる\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=53\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第5節2（2） 進路変更\u003c/a>\u003c/figcaption>\u003cblockquote>（2）車両通行帯が黄の線で区画されている場合は、この黄の線を越えて進路を変更してはいけません。また、白の線で区画されている場合でも、自分が通行している車両通行帯の側に平行して黄の線が引かれているときは同じです。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G07-4\">横断・転回と道路外に出るとき\u003c/h3>\n\u003cul>\u003cli>歩行者やほかの車の正常な通行を妨げるおそれがあるときは、横断、転回、後退や、道路外に出入りするための右左折をしてはいけない\u003c/li>\u003cli>標識や標示で横断や転回が禁止されているところでは、横断や転回をしてはいけない\u003c/li>\u003cli>道路外に出るため左折するときは、あらかじめできるだけ道路の\u003cstrong>左端\u003c/strong>に寄って徐行する\u003c/li>\u003cli>道路外に出るため右折するときは、あらかじめできるだけ道路の\u003cstrong>中央\u003c/strong>（一方通行の道路では\u003cstrong>右端\u003c/strong>）に寄って徐行する\u003c/li>\u003cli>前の車が道路外に出るため、道路の端や中央に寄ろうとして合図をしているときは、急ブレーキや急ハンドルで避けなければならない場合のほかは、その進路の変更を妨げてはいけない\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第25条（条文を開く）\u003c/summary>\u003cblockquote>（道路外に出る場合の方法）\u003cbr>第二十五条　車両は、道路外に出るため左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、徐行しなければならない。\u003cbr>２　車両（特定小型原動機付自転車等及びトロリーバスを除く。）は、道路外に出るため右折するときは、あらかじめその前からできる限り道路の中央（当該道路が一方通行となつているときは、当該道路の右側端）に寄り、かつ、徐行しなければならない。\u003cbr>３　道路外に出るため左折又は右折をしようとする車両が、前二項の規定により、それぞれ道路の左側端、中央又は右側端に寄ろうとして手又は方向指示器による合図をした場合においては、その後方にある車両は、その速度又は方向を急に変更しなければならないこととなる場合を除き、当該合図をした車両の進路の変更を妨げてはならない。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_3-At_25\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>","sections":[{"id":"G07-1","title":"合図の時期と方法"},{"id":"G07-2","title":"警音器"},{"id":"G07-3","title":"進路変更"},{"id":"G07-4","title":"横断・転回と道路外に出るとき"}],"search":[{"id":"","title":"","text":"この章では、右左折や進路変更などの合図の時期と方法、警音器を鳴らす場合、進路変更と横断・転回のきまりを覚えます。"},{"id":"G07-1","title":"合図の時期と方法","text":"合図の時期と方法 左折、右折、転回、進路変更、徐行、停止、後退をするときは、手、方向指示器か灯火で合図をし、その行為が終わるまで続けます。合図の前には、バックミラーなどで安全を確かめます（環状交差点の合図は、交差点の章で覚えます）。 合図を行う場合合図を行う時期左折・右折・転回その地点（交差点では交差点の手前の側端）から 30 メートル手前に達したとき同じ方向に進みながら進路を変える進路を変えようとするときの 3 秒前徐行・停止・後退その行為をしようとするとき 道路交通法施行令 第21条第1項（表の一部）法第五十三条第一項に規定する合図を行う時期及び合図の方法は、次の表に掲げるとおりとする。 合図を行う場合｜合図を行う時期｜合図の方法 左折するとき。｜その行為をしようとする地点（交差点においてその行為をする場合にあつては、当該交差点の手前の側端）から三十メートル手前の地点に達したとき。｜左腕を車体の左側の外に出して水平に伸ばし、若しくは右腕を車体の右側の外に出して肘を垂直に上に曲げること、又は左側の方向指示器を操作すること。 同一方向に進行しながら進路を左方に変えるとき。｜その行為をしようとする時の三秒前のとき。 手による合図の方法は、次のとおりです。 合図手による方法（方向指示器や灯火の代わり）左折・左への進路変更左腕を車の左側の外に出して水平に伸ばすか、右腕を車の右側の外に出して肘を垂直に上に曲げる右折・転回・右への進路変更右腕を車の右側の外に出して水平に伸ばすか、左腕を車の左側の外に出して肘を垂直に上に曲げる徐行・停止腕を車の外に出して斜め下に伸ばす（ブレーキ灯をつけてもよい）後退腕を車の外に出して斜め下に伸ばし、手のひらを後ろに向けて腕を前後に動かす（後退灯をつけてもよい） 行為が終わったら、速やかに合図をやめる。必要がないのに合図をしてはいけない夕日の反射などで方向指示器が見えにくいときは、手による合図も併せて行う"},{"id":"G07-2","title":"警音器","text":"警音器 警音器を鳴らさなければならないのは、次のときです（道路交通法第 54 条）。 「警笛鳴らせ」の標識がある場所を通るとき「警笛区間」の標識がある区間内で、見通しのきかない交差点、曲がり角、上り坂の頂上を通るとき これ以外は、危険を避けるためやむを得ないときのほかは、警音器を鳴らしてはいけません。 道路交通法 第54条第2項車両等の運転者は、法令の規定により警音器を鳴らさなければならないこととされている場合を除き、警音器を鳴らしてはならない。ただし、危険を防止するためやむを得ないときは、この限りでない。"},{"id":"G07-3","title":"進路変更","text":"進路変更 みだりに進路を変更してはいけない進路を変えると、後ろから来る車が急ブレーキや急ハンドルで避けなければならないようなときは、進路を変えてはいけない（道路交通法第 26 条の 2）車両通行帯が黄色の線で区画されているときは、その線を越えて進路を変えてはいけない。白の線で区画されていても、自分の側に黄色の線が平行して引かれているときは同じやむを得ず進路を変えるときは、バックミラーや目視で安全を確かめる 交通の方法に関する教則 第5章第5節2（2） 進路変更（2）車両通行帯が黄の線で区画されている場合は、この黄の線を越えて進路を変更してはいけません。また、白の線で区画されている場合でも、自分が通行している車両通行帯の側に平行して黄の線が引かれているときは同じです。"},{"id":"G07-4","title":"横断・転回と道路外に出るとき","text":"横断・転回と道路外に出るとき 歩行者やほかの車の正常な通行を妨げるおそれがあるときは、横断、転回、後退や、道路外に出入りするための右左折をしてはいけない標識や標示で横断や転回が禁止されているところでは、横断や転回をしてはいけない道路外に出るため左折するときは、あらかじめできるだけ道路の左端に寄って徐行する道路外に出るため右折するときは、あらかじめできるだけ道路の中央（一方通行の道路では右端）に寄って徐行する前の車が道路外に出るため、道路の端や中央に寄ろうとして合図をしているときは、急ブレーキや急ハンドルで避けなければならない場合のほかは、その進路の変更を妨げてはいけない 道路交通法 第25条（条文を開く）（道路外に出る場合の方法） 第二十五条 車両は、道路外に出るため左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、徐行しなければならない。 ２ 車両（特定小型原動機付自転車等及びトロリーバスを除く。）は、道路外に出るため右折するときは、あらかじめその前からできる限り道路の中央（当該道路が一方通行となつているときは、当該道路の右側端）に寄り、かつ、徐行しなければならない。 ３ 道路外に出るため左折又は右折をしようとする車両が、前二項の規定により、それぞれ道路の左側端、中央又は右側端に寄ろうとして手又は方向指示器による合図をした場合においては、その後方にある車両は、その速度又は方向を急に変更しなければならないこととなる場合を除き、当該合図をした車両の進路の変更を妨げてはならない。e-Gov 法令検索で読む"}],"only":""},{"id":"G08","subject":"学科","num":8,"title":"追越しと割込み","html":"\u003cp>\u003cstrong>追越し\u003c/strong>とは、車が進路を変えて、進行中の前の車の前方に出ることです。進路を変え、加速して、再び進路を戻すという複雑な操作が要るので、禁止される場合と場所が細かく決まっています。この章では、それと追越しの方法、割込みの禁止を覚えます。\u003c/p>\n\u003ch3 id=\"G08-1\">追越しをしてはいけない場合\u003c/h3>\n\u003cul>\u003cli>前の車が、ほかの自動車を追い越そうとしているとき（\u003cstrong>二重追越し\u003c/strong>。道路交通法第 29 条）\u003c/li>\u003cli>前の車が、右折などのため右側に進路を変えようとしているとき\u003c/li>\u003cli>右側部分に入って追い越すときに、対向車の進行を妨げるようなときや、前の車の進行を妨げなければ左側部分に戻れないようなとき\u003c/li>\u003cli>後ろの車が、自分の車を追い越そうとしているとき\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=54\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第6節1（2） 追越しの禁止\u003c/a>\u003c/figcaption>\u003cblockquote>（2）次の場合は危険ですから追越しをしてはいけません。\u003cbr>ア前の車が自動車を追い越そうとしているとき（二重追越し）。\u003cbr>イ前の車が右折などのため右側に進路を変えようとしているとき。\u003cbr>ウ道路の右側部分に入つて追越しをしようとする場合に、反対方向からの車や路面電車の進行を妨げるようなときや前の車の進行を妨げなければ道路の左側部分に戻ることができないようなとき。\u003cbr>エ後ろの車が自分の車を追い越そうとしているとき。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G08-2\">追越しが禁止されている場所\u003c/h3>\n\u003cp>次の場所では、自動車や一般原動機付自転車を追い越すため、\u003cstrong>進路を変えることも、前の車の横を通り過ぎることも\u003c/strong>してはいけません（自転車などを追い越すときは別）。\u003c/p>\n\u003cul>\u003cli>追越し禁止の標識がある場所\u003c/li>\u003cli>道路の曲がり角付近\u003c/li>\u003cli>上り坂の頂上付近、勾配の急な下り坂\u003c/li>\u003cli>トンネル（車両通行帯がある場合を除く）\u003c/li>\u003cli>交差点とその手前から 30 メートル以内（優先道路を通行している場合を除く）\u003c/li>\u003cli>踏切、横断歩道、自転車横断帯とその手前から 30 メートル以内\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_30\" target=\"_blank\" rel=\"noopener\">道路交通法 第30条\u003c/a>\u003c/figcaption>\u003cblockquote>（追越しを禁止する場所）\u003cbr>第三十条　車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。\u003cbr>一　道路の曲がり角付近、上り坂の頂上付近又は勾配の急な下り坂\u003cbr>二　トンネル（車両通行帯の設けられた道路以外の道路の部分に限る。）\u003cbr>三　交差点（当該車両が第三十六条第二項に規定する優先道路を通行している場合における当該優先道路にある交差点を除く。）、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に三十メートル以内の部分\u003c/blockquote>\u003c/figure>\n\u003cp>標識や標示で示されているときは、追越しのために道路の右側部分にはみ出して通行してはいけません。\u003c/p>\n\u003ch3 id=\"G08-3\">追越しの方法\u003c/h3>\n\u003cul>\u003cli>ほかの車を追い越すときは、その\u003cstrong>右側\u003c/strong>を通る\u003c/li>\u003cli>前の車が右折するため道路の中央（一方通行の道路では右端）に寄って通行しているときは、その\u003cstrong>左側\u003c/strong>を通る\u003c/li>\u003cli>路面電車を追い越すときは、その\u003cstrong>左側\u003c/strong>を通る（軌道が道路の左側端に寄っているときは別）\u003c/li>\u003cli>追越し中は、追い越す車との間に安全な間隔を保つ\u003c/li>\u003cli>追い越されるときは、追越しが終わるまで\u003cstrong>速度を上げてはいけない\u003c/strong>。追越しに十分な余地がないときは、できるだけ左に寄って進路を譲る\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第28条（条文を開く）\u003c/summary>\u003cblockquote>（追越しの方法）\u003cbr>第二十八条　車両は、他の車両を追い越そうとするときは、その追い越されようとする車両（以下この節において「前車」という。）の右側を通行しなければならない。\u003cbr>２　車両は、他の車両を追い越そうとする場合において、前車が第二十五条第二項又は第三十四条第二項若しくは第四項の規定により道路の中央又は右側端に寄つて通行しているときは、前項の規定にかかわらず、その左側を通行しなければならない。\u003cbr>３　車両は、路面電車を追い越そうとするときは、当該車両が追いついた路面電車の左側を通行しなければならない。ただし、軌道が道路の左側端に寄つて設けられているときは、この限りでない。\u003cbr>４　前三項の場合においては、追越しをしようとする車両（次条において「後車」という。）は、反対の方向又は後方からの交通及び前車又は路面電車の前方の交通にも十分に注意し、かつ、前車又は路面電車の速度及び進路並びに道路の状況に応じて、できる限り安全な速度と方法で進行しなければならない。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_4-At_28\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>追越しは、次の順にします。\u003c/p>\n\u003col>\u003cli>追越し禁止の場所でないことを確かめる\u003c/li>\u003cli>前方と、バックミラーなどで右側や右斜め後方の安全を確かめる（右側部分にはみ出すときは、反対方向の安全も必ず確かめる）\u003c/li>\u003cli>右側の方向指示器を出す\u003c/li>\u003cli>\u003cstrong>約 3 秒後\u003c/strong>、最高速度の範囲内で加速しながら、進路を緩やかに右にとり、前の車の右側を安全な間隔を保って通る\u003c/li>\u003cli>左側の方向指示器を出す\u003c/li>\u003cli>追い越した車が\u003cstrong>ルームミラーで見えるくらい\u003c/strong>の距離まで進んでから、進路を緩やかに左にとる\u003c/li>\u003cli>合図をやめる\u003c/li>\u003c/ol>\n\u003ch3 id=\"G08-4\">割込みと行き違い\u003c/h3>\n\u003cul>\u003cli>前の車が交差点や踏切などで停止や徐行をしているときは、その前に\u003cstrong>割り込んだり、前を横切ったりしてはいけない\u003c/strong>（道路交通法第 32 条）\u003c/li>\u003cli>ほかの車の前に急に割り込んだり、並んで走っている車に幅寄せをしたりしてはいけない\u003c/li>\u003cli>対向車と行き違うときは、安全な間隔を保つ\u003c/li>\u003cli>進路の前方に障害物があるときは、あらかじめ一時停止か減速をして、対向車に道を譲る\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=55\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第6節4 割込みなど\u003c/a>\u003c/figcaption>\u003cblockquote>前の車が交差点や踏切などで停止や徐行しているときは、その前に割り込んだり、その前を横切つたりしてはいけません。また、そのほかの場合でも、ほかの車の前方に急に割り込んだり、並進している車に幅寄せをしたりしてはいけません。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G08-1","title":"追越しをしてはいけない場合"},{"id":"G08-2","title":"追越しが禁止されている場所"},{"id":"G08-3","title":"追越しの方法"},{"id":"G08-4","title":"割込みと行き違い"}],"search":[{"id":"","title":"","text":"追越しとは、車が進路を変えて、進行中の前の車の前方に出ることです。進路を変え、加速して、再び進路を戻すという複雑な操作が要るので、禁止される場合と場所が細かく決まっています。この章では、それと追越しの方法、割込みの禁止を覚えます。"},{"id":"G08-1","title":"追越しをしてはいけない場合","text":"追越しをしてはいけない場合 前の車が、ほかの自動車を追い越そうとしているとき（二重追越し。道路交通法第 29 条）前の車が、右折などのため右側に進路を変えようとしているとき右側部分に入って追い越すときに、対向車の進行を妨げるようなときや、前の車の進行を妨げなければ左側部分に戻れないようなとき後ろの車が、自分の車を追い越そうとしているとき 交通の方法に関する教則 第5章第6節1（2） 追越しの禁止（2）次の場合は危険ですから追越しをしてはいけません。 ア前の車が自動車を追い越そうとしているとき（二重追越し）。 イ前の車が右折などのため右側に進路を変えようとしているとき。 ウ道路の右側部分に入つて追越しをしようとする場合に、反対方向からの車や路面電車の進行を妨げるようなときや前の車の進行を妨げなければ道路の左側部分に戻ることができないようなとき。 エ後ろの車が自分の車を追い越そうとしているとき。"},{"id":"G08-2","title":"追越しが禁止されている場所","text":"追越しが禁止されている場所 次の場所では、自動車や一般原動機付自転車を追い越すため、進路を変えることも、前の車の横を通り過ぎることもしてはいけません（自転車などを追い越すときは別）。 追越し禁止の標識がある場所道路の曲がり角付近上り坂の頂上付近、勾配の急な下り坂トンネル（車両通行帯がある場合を除く）交差点とその手前から 30 メートル以内（優先道路を通行している場合を除く）踏切、横断歩道、自転車横断帯とその手前から 30 メートル以内 道路交通法 第30条（追越しを禁止する場所） 第三十条 車両は、道路標識等により追越しが禁止されている道路の部分及び次に掲げるその他の道路の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。 一 道路の曲がり角付近、上り坂の頂上付近又は勾配の急な下り坂 二 トンネル（車両通行帯の設けられた道路以外の道路の部分に限る。） 三 交差点（当該車両が第三十六条第二項に規定する優先道路を通行している場合における当該優先道路にある交差点を除く。）、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に三十メートル以内の部分 標識や標示で示されているときは、追越しのために道路の右側部分にはみ出して通行してはいけません。"},{"id":"G08-3","title":"追越しの方法","text":"追越しの方法 ほかの車を追い越すときは、その右側を通る前の車が右折するため道路の中央（一方通行の道路では右端）に寄って通行しているときは、その左側を通る路面電車を追い越すときは、その左側を通る（軌道が道路の左側端に寄っているときは別）追越し中は、追い越す車との間に安全な間隔を保つ追い越されるときは、追越しが終わるまで速度を上げてはいけない。追越しに十分な余地がないときは、できるだけ左に寄って進路を譲る 道路交通法 第28条（条文を開く）（追越しの方法） 第二十八条 車両は、他の車両を追い越そうとするときは、その追い越されようとする車両（以下この節において「前車」という。）の右側を通行しなければならない。 ２ 車両は、他の車両を追い越そうとする場合において、前車が第二十五条第二項又は第三十四条第二項若しくは第四項の規定により道路の中央又は右側端に寄つて通行しているときは、前項の規定にかかわらず、その左側を通行しなければならない。 ３ 車両は、路面電車を追い越そうとするときは、当該車両が追いついた路面電車の左側を通行しなければならない。ただし、軌道が道路の左側端に寄つて設けられているときは、この限りでない。 ４ 前三項の場合においては、追越しをしようとする車両（次条において「後車」という。）は、反対の方向又は後方からの交通及び前車又は路面電車の前方の交通にも十分に注意し、かつ、前車又は路面電車の速度及び進路並びに道路の状況に応じて、できる限り安全な速度と方法で進行しなければならない。e-Gov 法令検索で読む 追越しは、次の順にします。 追越し禁止の場所でないことを確かめる前方と、バックミラーなどで右側や右斜め後方の安全を確かめる（右側部分にはみ出すときは、反対方向の安全も必ず確かめる）右側の方向指示器を出す約 3 秒後、最高速度の範囲内で加速しながら、進路を緩やかに右にとり、前の車の右側を安全な間隔を保って通る左側の方向指示器を出す追い越した車がルームミラーで見えるくらいの距離まで進んでから、進路を緩やかに左にとる合図をやめる"},{"id":"G08-4","title":"割込みと行き違い","text":"割込みと行き違い 前の車が交差点や踏切などで停止や徐行をしているときは、その前に割り込んだり、前を横切ったりしてはいけない（道路交通法第 32 条）ほかの車の前に急に割り込んだり、並んで走っている車に幅寄せをしたりしてはいけない対向車と行き違うときは、安全な間隔を保つ進路の前方に障害物があるときは、あらかじめ一時停止か減速をして、対向車に道を譲る 交通の方法に関する教則 第5章第6節4 割込みなど前の車が交差点や踏切などで停止や徐行しているときは、その前に割り込んだり、その前を横切つたりしてはいけません。また、そのほかの場合でも、ほかの車の前方に急に割り込んだり、並進している車に幅寄せをしたりしてはいけません。"}],"only":""},{"id":"G09","subject":"学科","num":9,"title":"交差点","html":"\u003cp>交差点とその付近は、最も事故が多い場所です。この章では、右左折の方法、交差点で優先する車、交通整理の行われていない交差点の通り方、環状交差点の通り方を覚えます。\u003c/p>\n\u003ch3 id=\"G09-1\">交差点を通るときの注意\u003c/h3>\n\u003cul>\u003cli>交差点に入ろうとするときや交差点内を通るときは、右折車や歩行者などに気を配り、交差点の状況に応じてできる限り安全な速度と方法で進む\u003c/li>\u003cli>右折しようとするときは、対向車線を直進する\u003cstrong>二輪車が見えにくくなる\u003c/strong>ことがあるので、十分注意する\u003c/li>\u003cli>右左折のときは\u003cstrong>内輪差\u003c/strong>（曲がるとき、後輪が前輪より内側を通ること）が生じる。左側を通る歩行者や自転車などを巻き込まないよう注意する\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=56\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第7節1（3） 交差点を通行するときの注意\u003c/a>\u003c/figcaption>\u003cblockquote>（3）車が右左折するときは、内輪差（曲がるとき後輪が前輪より内側を通ることによる前後輪の軌跡の差をいいます。）が生じます。特に大型車は内輪差が大きく、左後方が見えにくいので左側を通行している歩行者、特定小型原動機付自転車や自転車などを巻き込まないよう注意しましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G09-2\">右左折の方法\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>曲がり方\u003c/th>\u003cth>方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>左折\u003c/td>\u003ctd>あらかじめできるだけ道路の\u003cstrong>左端\u003c/strong>に寄り、交差点の側端に沿って\u003cstrong>徐行\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右折\u003c/td>\u003ctd>あらかじめできるだけ道路の\u003cstrong>中央\u003c/strong>に寄り、交差点の\u003cstrong>中心のすぐ内側\u003c/strong>を\u003cstrong>徐行\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一方通行の道路から右折\u003c/td>\u003ctd>あらかじめ道路の\u003cstrong>右端\u003c/strong>に寄り、交差点の中心の内側を\u003cstrong>徐行\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_34-Pr_2\" target=\"_blank\" rel=\"noopener\">道路交通法 第34条第2項\u003c/a>\u003c/figcaption>\u003cblockquote>自動車、一般原動機付自転車又はトロリーバスは、右折するときは、あらかじめその前からできる限り道路の中央に寄り、かつ、交差点の中心の直近の内側（道路標識等により通行すべき部分が指定されているときは、その指定された部分）を徐行しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cul>\u003cli>矢印などの標示で通行方法が指定されているときは、それに従う\u003c/li>\u003cli>標識や標示で、進む方向ごとに車両通行帯の区分が指定されているときは、緊急自動車が来たときや工事のときなどのほかは、その区分に従う\u003c/li>\u003cli>標識で進む方向が指定されている交差点では、指定された方向にしか進めない\u003c/li>\u003cli>前の車が右左折のために進路を変えようとして合図をしたときは、急ブレーキや急ハンドルで避けなければならない場合のほかは、その進路変更を妨げない\u003c/li>\u003c/ul>\n\u003ch3 id=\"G09-3\">右折車と直進車\u003c/h3>\n\u003cp>右折しようとするとき、その交差点で\u003cstrong>直進か左折をする車\u003c/strong>や路面電車があるときは、\u003cstrong>自分の車が先に交差点に入っていても\u003c/strong>、その進行を妨げてはいけません。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_37\" target=\"_blank\" rel=\"noopener\">道路交通法 第37条\u003c/a>\u003c/figcaption>\u003cblockquote>第三十七条　車両等は、交差点で右折する場合において、当該交差点において直進し、又は左折しようとする車両等があるときは、当該車両等の進行妨害をしてはならない。\u003c/blockquote>\u003c/figure>\n\u003cp>前方が混雑していて、交差点内で止まってしまい交差する方向の車の通行を妨げるおそれがあるときは、\u003cstrong>信号が青でも交差点に入ってはいけません\u003c/strong>。「停止禁止部分」の標示のある場所や、横断歩道、踏切で動けなくなるおそれがあるときも同じです（道路交通法第 50 条）。\u003c/p>\n\u003ch3 id=\"G09-4\">交通整理の行われていない交差点\u003c/h3>\n\u003cp>信号機や警察官による交通整理が行われていない交差点では、次のようにします。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場面\u003c/th>\u003cth>すること\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>交差する道路が\u003cstrong>優先道路\u003c/strong>か、\u003cstrong>道幅が明らかに広い\u003c/strong>とき\u003c/td>\u003ctd>\u003cstrong>徐行\u003c/strong>し、交差する道路の車や路面電車の進行を妨げない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>道幅が同じような道路の交差点\u003c/td>\u003ctd>\u003cstrong>左方\u003c/strong>から来る車や、路面電車の進行を妨げない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>「一時停止」の標識があるとき、赤の点滅信号のとき\u003c/td>\u003ctd>停止線の直前（停止線がなければ交差点の直前）で\u003cstrong>一時停止\u003c/strong>し、交差する道路の車の進行を妨げない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>黄の点滅信号のとき\u003c/td>\u003ctd>ほかの交通に注意して進める\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=57\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第7節3（2） 交通整理の行われていない交差点（環状交差点を除きます。）の通行方法\u003c/a>\u003c/figcaption>\u003cblockquote>（2）道幅が同じような道路の交差点では、路面電車や左方から来る車があるときは、その路面電車や車の進行を妨げてはいけません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G09-5\">環状交差点\u003c/h3>\n\u003cp>環状交差点は、車が右回り（時計回り）に通行する、円形の交差点です。\u003c/p>\n\u003cul>\u003cli>左折、右折、直進、転回のどれでも、あらかじめできるだけ道路の\u003cstrong>左端\u003c/strong>に寄り、環状交差点の側端に沿って\u003cstrong>徐行\u003c/strong>する\u003c/li>\u003cli>環状交差点に入ろうとするときは、\u003cstrong>徐行\u003c/strong>し、環状交差点内を通行する車の進行を妨げない\u003c/li>\u003cli>環状交差点に入るときは合図は要らない。\u003cstrong>出るとき\u003c/strong>は、出ようとする出口の直前の出口の側方を通過したとき（入った直後の出口を出るときは、入ったとき）に、\u003cstrong>左側\u003c/strong>の合図をする\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_6-At_37_2-Pr_1\" target=\"_blank\" rel=\"noopener\">道路交通法 第37条の2第1項\u003c/a>\u003c/figcaption>\u003cblockquote>車両等は、環状交差点においては、第三十六条第一項及び第二項並びに前条の規定にかかわらず、当該環状交差点内を通行する車両等の進行妨害をしてはならない。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G09-1","title":"交差点を通るときの注意"},{"id":"G09-2","title":"右左折の方法"},{"id":"G09-3","title":"右折車と直進車"},{"id":"G09-4","title":"交通整理の行われていない交差点"},{"id":"G09-5","title":"環状交差点"}],"search":[{"id":"","title":"","text":"交差点とその付近は、最も事故が多い場所です。この章では、右左折の方法、交差点で優先する車、交通整理の行われていない交差点の通り方、環状交差点の通り方を覚えます。"},{"id":"G09-1","title":"交差点を通るときの注意","text":"交差点を通るときの注意 交差点に入ろうとするときや交差点内を通るときは、右折車や歩行者などに気を配り、交差点の状況に応じてできる限り安全な速度と方法で進む右折しようとするときは、対向車線を直進する二輪車が見えにくくなることがあるので、十分注意する右左折のときは内輪差（曲がるとき、後輪が前輪より内側を通ること）が生じる。左側を通る歩行者や自転車などを巻き込まないよう注意する 交通の方法に関する教則 第5章第7節1（3） 交差点を通行するときの注意（3）車が右左折するときは、内輪差（曲がるとき後輪が前輪より内側を通ることによる前後輪の軌跡の差をいいます。）が生じます。特に大型車は内輪差が大きく、左後方が見えにくいので左側を通行している歩行者、特定小型原動機付自転車や自転車などを巻き込まないよう注意しましよう。"},{"id":"G09-2","title":"右左折の方法","text":"右左折の方法 曲がり方方法左折あらかじめできるだけ道路の左端に寄り、交差点の側端に沿って徐行右折あらかじめできるだけ道路の中央に寄り、交差点の中心のすぐ内側を徐行一方通行の道路から右折あらかじめ道路の右端に寄り、交差点の中心の内側を徐行 道路交通法 第34条第2項自動車、一般原動機付自転車又はトロリーバスは、右折するときは、あらかじめその前からできる限り道路の中央に寄り、かつ、交差点の中心の直近の内側（道路標識等により通行すべき部分が指定されているときは、その指定された部分）を徐行しなければならない。 矢印などの標示で通行方法が指定されているときは、それに従う標識や標示で、進む方向ごとに車両通行帯の区分が指定されているときは、緊急自動車が来たときや工事のときなどのほかは、その区分に従う標識で進む方向が指定されている交差点では、指定された方向にしか進めない前の車が右左折のために進路を変えようとして合図をしたときは、急ブレーキや急ハンドルで避けなければならない場合のほかは、その進路変更を妨げない"},{"id":"G09-3","title":"右折車と直進車","text":"右折車と直進車 右折しようとするとき、その交差点で直進か左折をする車や路面電車があるときは、自分の車が先に交差点に入っていても、その進行を妨げてはいけません。 道路交通法 第37条第三十七条 車両等は、交差点で右折する場合において、当該交差点において直進し、又は左折しようとする車両等があるときは、当該車両等の進行妨害をしてはならない。 前方が混雑していて、交差点内で止まってしまい交差する方向の車の通行を妨げるおそれがあるときは、信号が青でも交差点に入ってはいけません。「停止禁止部分」の標示のある場所や、横断歩道、踏切で動けなくなるおそれがあるときも同じです（道路交通法第 50 条）。"},{"id":"G09-4","title":"交通整理の行われていない交差点","text":"交通整理の行われていない交差点 信号機や警察官による交通整理が行われていない交差点では、次のようにします。 場面すること交差する道路が優先道路か、道幅が明らかに広いとき徐行し、交差する道路の車や路面電車の進行を妨げない道幅が同じような道路の交差点左方から来る車や、路面電車の進行を妨げない「一時停止」の標識があるとき、赤の点滅信号のとき停止線の直前（停止線がなければ交差点の直前）で一時停止し、交差する道路の車の進行を妨げない黄の点滅信号のときほかの交通に注意して進める 交通の方法に関する教則 第5章第7節3（2） 交通整理の行われていない交差点（環状交差点を除きます。）の通行方法（2）道幅が同じような道路の交差点では、路面電車や左方から来る車があるときは、その路面電車や車の進行を妨げてはいけません。"},{"id":"G09-5","title":"環状交差点","text":"環状交差点 環状交差点は、車が右回り（時計回り）に通行する、円形の交差点です。 左折、右折、直進、転回のどれでも、あらかじめできるだけ道路の左端に寄り、環状交差点の側端に沿って徐行する環状交差点に入ろうとするときは、徐行し、環状交差点内を通行する車の進行を妨げない環状交差点に入るときは合図は要らない。出るときは、出ようとする出口の直前の出口の側方を通過したとき（入った直後の出口を出るときは、入ったとき）に、左側の合図をする 道路交通法 第37条の2第1項車両等は、環状交差点においては、第三十六条第一項及び第二項並びに前条の規定にかかわらず、当該環状交差点内を通行する車両等の進行妨害をしてはならない。"}],"only":""},{"id":"G10","subject":"学科","num":10,"title":"オートマチック車と運転支援","html":"\u003cp>この章では、オートマチック車（AT 車）の正しい操作と、先進安全自動車（ASV）や自動運転車を運転するときの注意を覚えます。\u003c/p>\n\u003ch3 id=\"G10-1\">オートマチック車の操作\u003c/h3>\n\u003cp>AT 車はクラッチ操作が要らないので運転が楽になりますが、安易な気持ちで扱ってはいけません。操作の基本は次のとおりです。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場面\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>エンジンを掛ける前\u003c/td>\u003ctd>ブレーキペダルを踏んで位置を確かめ、アクセルペダルの位置を目で見て確かめる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>エンジンの始動\u003c/td>\u003ctd>ハンドブレーキが掛かり、チェンジレバーが \u003cstrong>P\u003c/strong> にあることを確かめ、ブレーキペダルを踏んで始動する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>発進\u003c/td>\u003ctd>\u003cstrong>ブレーキペダルをしっかり踏んだまま\u003c/strong>、チェンジレバーを D（後退は R）に入れ、位置を目で見て確かめてから、ハンドブレーキを戻し、ブレーキを徐々に放してアクセルを静かに踏む\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交差点などで停止\u003c/td>\u003ctd>ブレーキペダルをしっかり踏み、念のためハンドブレーキも掛ける。停止が長くなりそうなときは \u003cstrong>N\u003c/strong> に入れる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>駐車\u003c/td>\u003ctd>ブレーキペダルを踏んだまま、ハンドブレーキを確実に掛けてから \u003cstrong>P\u003c/strong> に入れる（完全に止まる前に P に入れない）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=63\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第9節1（3） オートマチック車の運転\u003c/a>\u003c/figcaption>\u003cblockquote>（3）発進ブレーキペダルをしつかりと踏んだまま、チェンジレバーを前進のときはDに、後退のときはRに入れ、その位置が間違つていないことを目で見て確認した上で、ハンドブレーキを戻して、ブレーキペダルを徐々に放し、アクセルペダルを静かに踏んで発進しましよう。\u003cbr>ブレーキペダルをしつかり踏んでチェンジレバーを操作しないと、急発進したり、突然後退したりすることがあります。\u003cbr>なお、エンジン始動直後やエアコン作動時は、エンジンの回転数が高くなり、急発進する危険がありますので、ブレーキペダルを特にしつかりと踏みましよう。\u003c/blockquote>\u003c/figure>\n\u003cul>\u003cli>ブレーキペダルをしっかり踏まずにチェンジレバーを操作すると、急発進したり、突然後退したりすることがある\u003c/li>\u003cli>エンジン始動直後やエアコンが動いているときは、エンジンの回転数が高くなり急発進の危険があるので、ブレーキペダルを特にしっかり踏む\u003c/li>\u003cli>ブレーキペダルを踏んでいないと、アクセルを踏まなくても車がゆっくり動き出す（\u003cstrong>クリープ現象\u003c/strong>）\u003c/li>\u003c/ul>\n\u003ch3 id=\"G10-2\">先進安全自動車と自動運転車\u003c/h3>\n\u003cp>先進安全自動車（ASV）は、衝突被害軽減ブレーキなど、運転者の安全運転を支援するシステムを積んだ自動車です。システムには、一定以上の速度では適切に作動しないことがあるなどの\u003cstrong>限界\u003c/strong>があります。運転者が絶えず周囲を確かめながら運転することが前提の技術なので、\u003cstrong>過信せずに\u003c/strong>運転します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=64\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第9節2 先進安全自動車（ASV）の運転\u003c/a>\u003c/figcaption>\u003cblockquote>先進安全自動車（ASV）（注９）は、先進技術を利用して運転者の安全運転を支援するシステムが搭載された自動車ですが、このシステムは、例えば、一定以上の速度で走行している場合には、適切に作動しない場合があるなどの限界があります。自動運行装置とは異なり、運転者が絶えず周囲の状況を確認しながら必要な運転操作を行うことを前提とした運転支援技術ですので、その限界や注意点を正しく理解し、その技術を過信せずに運転しましよう。\u003c/blockquote>\u003c/figure>\n\u003cp>自動運転車（自動運行装置を積んだ自動車）を運転するときは、次のことを守ります。\u003c/p>\n\u003cul>\u003cli>自動運行装置を使っていても、運転者として責任を持って安全運転をする\u003c/li>\u003cli>自動運行装置は、\u003cstrong>使用条件の外では使ってはいけない\u003c/strong>（道路交通法第 71 条の 4 の 2）\u003c/li>\u003cli>自動運行装置を使っている間も、装置からの運転操作の\u003cstrong>引継ぎ要請\u003c/strong>や車の異常を直ちに認知し、運転操作を引き継げる状態でいる\u003c/li>\u003cli>引継ぎ要請や異常に気付いたら、直ちに周囲を確かめて必要な運転操作を始める\u003c/li>\u003c/ul>","sections":[{"id":"G10-1","title":"オートマチック車の操作"},{"id":"G10-2","title":"先進安全自動車と自動運転車"}],"search":[{"id":"","title":"","text":"この章では、オートマチック車（AT 車）の正しい操作と、先進安全自動車（ASV）や自動運転車を運転するときの注意を覚えます。"},{"id":"G10-1","title":"オートマチック車の操作","text":"オートマチック車の操作 AT 車はクラッチ操作が要らないので運転が楽になりますが、安易な気持ちで扱ってはいけません。操作の基本は次のとおりです。 場面操作エンジンを掛ける前ブレーキペダルを踏んで位置を確かめ、アクセルペダルの位置を目で見て確かめるエンジンの始動ハンドブレーキが掛かり、チェンジレバーが P にあることを確かめ、ブレーキペダルを踏んで始動する発進ブレーキペダルをしっかり踏んだまま、チェンジレバーを D（後退は R）に入れ、位置を目で見て確かめてから、ハンドブレーキを戻し、ブレーキを徐々に放してアクセルを静かに踏む交差点などで停止ブレーキペダルをしっかり踏み、念のためハンドブレーキも掛ける。停止が長くなりそうなときは N に入れる駐車ブレーキペダルを踏んだまま、ハンドブレーキを確実に掛けてから P に入れる（完全に止まる前に P に入れない） 交通の方法に関する教則 第5章第9節1（3） オートマチック車の運転（3）発進ブレーキペダルをしつかりと踏んだまま、チェンジレバーを前進のときはDに、後退のときはRに入れ、その位置が間違つていないことを目で見て確認した上で、ハンドブレーキを戻して、ブレーキペダルを徐々に放し、アクセルペダルを静かに踏んで発進しましよう。 ブレーキペダルをしつかり踏んでチェンジレバーを操作しないと、急発進したり、突然後退したりすることがあります。 なお、エンジン始動直後やエアコン作動時は、エンジンの回転数が高くなり、急発進する危険がありますので、ブレーキペダルを特にしつかりと踏みましよう。 ブレーキペダルをしっかり踏まずにチェンジレバーを操作すると、急発進したり、突然後退したりすることがあるエンジン始動直後やエアコンが動いているときは、エンジンの回転数が高くなり急発進の危険があるので、ブレーキペダルを特にしっかり踏むブレーキペダルを踏んでいないと、アクセルを踏まなくても車がゆっくり動き出す（クリープ現象）"},{"id":"G10-2","title":"先進安全自動車と自動運転車","text":"先進安全自動車と自動運転車 先進安全自動車（ASV）は、衝突被害軽減ブレーキなど、運転者の安全運転を支援するシステムを積んだ自動車です。システムには、一定以上の速度では適切に作動しないことがあるなどの限界があります。運転者が絶えず周囲を確かめながら運転することが前提の技術なので、過信せずに運転します。 交通の方法に関する教則 第5章第9節2 先進安全自動車（ASV）の運転先進安全自
