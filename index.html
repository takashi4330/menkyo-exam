動車（ASV）（注９）は、先進技術を利用して運転者の安全運転を支援するシステムが搭載された自動車ですが、このシステムは、例えば、一定以上の速度で走行している場合には、適切に作動しない場合があるなどの限界があります。自動運行装置とは異なり、運転者が絶えず周囲の状況を確認しながら必要な運転操作を行うことを前提とした運転支援技術ですので、その限界や注意点を正しく理解し、その技術を過信せずに運転しましよう。 自動運転車（自動運行装置を積んだ自動車）を運転するときは、次のことを守ります。 自動運行装置を使っていても、運転者として責任を持って安全運転をする自動運行装置は、使用条件の外では使ってはいけない（道路交通法第 71 条の 4 の 2）自動運行装置を使っている間も、装置からの運転操作の引継ぎ要請や車の異常を直ちに認知し、運転操作を引き継げる状態でいる引継ぎ要請や異常に気付いたら、直ちに周囲を確かめて必要な運転操作を始める"}],"only":""},{"id":"G11","subject":"学科","num":11,"title":"踏切・坂道・カーブ","html":"\u003cp>この章では、踏切の通り方と踏切で動けなくなったときの措置、坂道や山道、曲がり角やカーブでの運転を覚えます。\u003c/p>\n\u003ch3 id=\"G11-1\">踏切の通り方\u003c/h3>\n\u003cp>踏切では、死亡や重傷の大きな事故が起こりがちです。\u003c/p>\n\u003cul>\u003cli>踏切の直前（停止線があればその直前）で\u003cstrong>一時停止\u003c/strong>し、窓を開けるなどして、\u003cstrong>自分の目と耳で\u003c/strong>左右の安全を確かめる（踏切に信号機があるときは、信号に従って一時停止せずに通過できる）\u003c/li>\u003cli>一方から列車が通過しても、その直後に反対方向から列車が来ることがある\u003c/li>\u003cli>警報機が鳴っているとき、遮断機が降りているときや\u003cstrong>降り始めているとき\u003c/strong>は、踏切に入ってはいけない\u003c/li>\u003cli>前の車に続いて通過するときも、一時停止して安全を確かめる\u003c/li>\u003cli>踏切の向こう側が混雑していて、踏切内で動けなくなるおそれがあるときは、踏切に入ってはいけない\u003c/li>\u003cli>踏切内では、エンストを防ぐため、\u003cstrong>変速しないで\u003c/strong>発進したときの低速ギアのまま一気に通過する。落輪しないよう、\u003cstrong>やや中央寄り\u003c/strong>を通る\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_5-At_33-Pr_1\" target=\"_blank\" rel=\"noopener\">道路交通法 第33条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>車両等は、踏切を通過しようとするときは、踏切の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止し、かつ、安全であることを確認した後でなければ進行してはならない。ただし、信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができる。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G11-2\">踏切で動けなくなったとき\u003c/h3>\n\u003cp>一刻も早く列車の運転士などに知らせ、車を踏切の外に移動させます。\u003c/p>\n\u003col>\u003cli>警報機のある踏切では、警報機の柱などにある押しボタン式の\u003cstrong>踏切支障報知装置\u003c/strong>を使う\u003c/li>\u003cli>報知装置がないところでは、\u003cstrong>発炎筒\u003c/strong>などで列車に分かるよう合図する\u003c/li>\u003cli>発炎筒などがないときは、煙の出やすいものを燃やすなどして合図する\u003c/li>\u003c/ol>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第1節2 踏切で故障したとき\u003c/a>\u003c/figcaption>\u003cblockquote>踏切で動かなくなつたときは、次の要領で一刻も早く列車の運転士などに知らせるとともに、車を踏切の外に移動させなければなりません。\u003cbr>（1）警報機のある踏切では、警報機の柱などに取り付けられている押しボタン式の踏切支障報知装置を活用する。\u003cbr>（2）踏切支障報知装置のないところでは、携帯している発炎筒などを使い列車に分かるようにできるだけ早く合図をする。\u003cbr>（3）発炎筒などがなかつたり、使い切つてしまつたりしたときは、煙の出やすいものを付近で燃やすなどして合図をする。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G11-3\">坂道と山道\u003c/h3>\n\u003cul>\u003cli>上り坂で前の車に続いて止まるときは、前の車が後退してくることがあるので、接近し過ぎない\u003c/li>\u003cli>上り坂で発進するときは、できるだけハンドブレーキを使う\u003c/li>\u003cli>上り坂の頂上付近は見通しが悪いので徐行し、追越しをしない。勾配の急な下り坂でも追越しをしない\u003c/li>\u003cli>下り坂では、低速のギア（AT 車ではチェンジレバーを 2 か L（又は 1））に入れて\u003cstrong>エンジンブレーキ\u003c/strong>を使う。長い下り坂でフットブレーキを使い過ぎると、急にブレーキが効かなくなることがある\u003c/li>\u003cli>下り坂では、加速がついて停止距離が長くなるので、車間距離を広くとる\u003c/li>\u003cli>坂道で行き違うときは、\u003cstrong>下りの車が上りの車に道を譲る\u003c/strong>（近くに待避所があれば、上りの車でも待避所に入って待つ）\u003c/li>\u003cli>片側ががけの道路で安全に行き違えないときは、\u003cstrong>がけ側の車\u003c/strong>が一時停止して道を譲る\u003c/li>\u003cli>山道では路肩が崩れやすいことがあるので、行き違いで路肩に寄り過ぎない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=66\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第2節1（6） 坂道・山道\u003c/a>\u003c/figcaption>\u003cblockquote>（6）坂道では、上り坂での発進がむずかしいため、下りの車が、上りの車に道を譲りましよう。しかし、近くに待避所があるときは、上りの車でも、その待避所に入つて待ちましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G11-4\">曲がり角とカーブ\u003c/h3>\n\u003cul>\u003cli>曲がり角やカーブの\u003cstrong>手前の直線部分\u003c/strong>で十分速度を落とす。高速のままハンドルを切ったり、ハンドルを切りながらブレーキを掛けたりすると、横転や横滑りを起こしやすい\u003c/li>\u003cli>ハンドルは、急ハンドルにならないよう緩やかに操作する\u003c/li>\u003cli>道路の中央からはみ出さない。対向車がはみ出してくることにも注意する\u003c/li>\u003cli>内輪差のため、内側の歩行者や自転車などを巻き込んだり、後輪が路肩からはみ出したりしないよう注意する\u003c/li>\u003cli>曲がり角やカーブでは、前の車を追い越してはいけない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第2節2（1） 曲がり角・カーブ\u003c/a>\u003c/figcaption>\u003cblockquote>（1）曲がり角やカーブに近づくときは、その手前の直線部分で十分スピードを落としましよう。高速のままハンドルを切つたり、ハンドルを切りながらブレーキを掛けたりすると、横転や横滑りを起こしやすくなります。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G11-1","title":"踏切の通り方"},{"id":"G11-2","title":"踏切で動けなくなったとき"},{"id":"G11-3","title":"坂道と山道"},{"id":"G11-4","title":"曲がり角とカーブ"}],"search":[{"id":"","title":"","text":"この章では、踏切の通り方と踏切で動けなくなったときの措置、坂道や山道、曲がり角やカーブでの運転を覚えます。"},{"id":"G11-1","title":"踏切の通り方","text":"踏切の通り方 踏切では、死亡や重傷の大きな事故が起こりがちです。 踏切の直前（停止線があればその直前）で一時停止し、窓を開けるなどして、自分の目と耳で左右の安全を確かめる（踏切に信号機があるときは、信号に従って一時停止せずに通過できる）一方から列車が通過しても、その直後に反対方向から列車が来ることがある警報機が鳴っているとき、遮断機が降りているときや降り始めているときは、踏切に入ってはいけない前の車に続いて通過するときも、一時停止して安全を確かめる踏切の向こう側が混雑していて、踏切内で動けなくなるおそれがあるときは、踏切に入ってはいけない踏切内では、エンストを防ぐため、変速しないで発進したときの低速ギアのまま一気に通過する。落輪しないよう、やや中央寄りを通る 道路交通法 第33条第1項車両等は、踏切を通過しようとするときは、踏切の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下この項において同じ。）で停止し、かつ、安全であることを確認した後でなければ進行してはならない。ただし、信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができる。"},{"id":"G11-2","title":"踏切で動けなくなったとき","text":"踏切で動けなくなったとき 一刻も早く列車の運転士などに知らせ、車を踏切の外に移動させます。 警報機のある踏切では、警報機の柱などにある押しボタン式の踏切支障報知装置を使う報知装置がないところでは、発炎筒などで列車に分かるよう合図する発炎筒などがないときは、煙の出やすいものを燃やすなどして合図する 交通の方法に関する教則 第6章第1節2 踏切で故障したとき踏切で動かなくなつたときは、次の要領で一刻も早く列車の運転士などに知らせるとともに、車を踏切の外に移動させなければなりません。 （1）警報機のある踏切では、警報機の柱などに取り付けられている押しボタン式の踏切支障報知装置を活用する。 （2）踏切支障報知装置のないところでは、携帯している発炎筒などを使い列車に分かるようにできるだけ早く合図をする。 （3）発炎筒などがなかつたり、使い切つてしまつたりしたときは、煙の出やすいものを付近で燃やすなどして合図をする。"},{"id":"G11-3","title":"坂道と山道","text":"坂道と山道 上り坂で前の車に続いて止まるときは、前の車が後退してくることがあるので、接近し過ぎない上り坂で発進するときは、できるだけハンドブレーキを使う上り坂の頂上付近は見通しが悪いので徐行し、追越しをしない。勾配の急な下り坂でも追越しをしない下り坂では、低速のギア（AT 車ではチェンジレバーを 2 か L（又は 1））に入れてエンジンブレーキを使う。長い下り坂でフットブレーキを使い過ぎると、急にブレーキが効かなくなることがある下り坂では、加速がついて停止距離が長くなるので、車間距離を広くとる坂道で行き違うときは、下りの車が上りの車に道を譲る（近くに待避所があれば、上りの車でも待避所に入って待つ）片側ががけの道路で安全に行き違えないときは、がけ側の車が一時停止して道を譲る山道では路肩が崩れやすいことがあるので、行き違いで路肩に寄り過ぎない 交通の方法に関する教則 第6章第2節1（6） 坂道・山道（6）坂道では、上り坂での発進がむずかしいため、下りの車が、上りの車に道を譲りましよう。しかし、近くに待避所があるときは、上りの車でも、その待避所に入つて待ちましよう。"},{"id":"G11-4","title":"曲がり角とカーブ","text":"曲がり角とカーブ 曲がり角やカーブの手前の直線部分で十分速度を落とす。高速のままハンドルを切ったり、ハンドルを切りながらブレーキを掛けたりすると、横転や横滑りを起こしやすいハンドルは、急ハンドルにならないよう緩やかに操作する道路の中央からはみ出さない。対向車がはみ出してくることにも注意する内輪差のため、内側の歩行者や自転車などを巻き込んだり、後輪が路肩からはみ出したりしないよう注意する曲がり角やカーブでは、前の車を追い越してはいけない 交通の方法に関する教則 第6章第2節2（1） 曲がり角・カーブ（1）曲がり角やカーブに近づくときは、その手前の直線部分で十分スピードを落としましよう。高速のままハンドルを切つたり、ハンドルを切りながらブレーキを掛けたりすると、横転や横滑りを起こしやすくなります。"}],"only":""},{"id":"G12","subject":"学科","num":12,"title":"点検と乗車・積載","html":"\u003cp>この章から、本免許で増える範囲です。ここでは、自動車の点検と、人の乗せ方・荷物の積み方の制限を覚えます。\u003c/p>\n\u003ch3 id=\"G12-1\">点検\u003c/h3>\n\u003cp>ハンドル、ブレーキ、マフラーなどが整備されていないため、交通の危険を生じさせたり、有害なガスや騒音でほかの人に迷惑を掛けたりするおそれのある車を運転してはいけません（道路交通法第 62 条）。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>点検\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日常点検\u003c/td>\u003ctd>使用者や運転しようとする人が、自分の責任で行う。自家用の普通乗用自動車は、走行距離や運行時の状態などから判断した\u003cstrong>適切な時期\u003c/strong>に行う（事業用の自動車やレンタカーなどは 1 日 1 回、運行の前）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>定期点検\u003c/td>\u003ctd>自家用の普通乗用自動車は \u003cstrong>1 年ごと\u003c/strong>（自家用の普通貨物自動車やレンタカーなどは 6 か月ごと、事業用の自動車などは 3 か月ごと）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=36\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第3節3 定期点検\u003c/a>\u003c/figcaption>\u003cblockquote>事業用の自動車、自家用の大型自動車及び中型自動車や準中型貨物自動車、普通貨物自動車などのレンタカーについては３箇月ごとに、自家用の準中型貨物自動車及び普通貨物自動車や普通乗用自動車などのレンタカーなどについては６箇月ごとに、自家用の普通乗用自動車などについては１年ごとに点検し、必要な整備をしなければなりません。\u003c/blockquote>\u003c/figure>\n\u003cp>日常点検の例です。\u003c/p>\n\u003cul>\u003cli>ブレーキペダル：踏みしろや、いっぱいに踏み込んだときの床板とのすき間、踏みごたえが適当か\u003c/li>\u003cli>エンジンオイル：量がオイルレベル・ゲージの範囲内か\u003c/li>\u003cli>ファンベルト：中央部を手で押して、\u003cstrong>少したわむ程度\u003c/strong>か。損傷がないか\u003c/li>\u003cli>タイヤ：空気圧、亀裂や損傷、異常な摩耗、溝の深さ（ウェア・インジケータ（スリップ・サイン）で見る）\u003c/li>\u003cli>灯火装置と方向指示器：点灯・点滅の具合、レンズの汚れや損傷\u003c/li>\u003c/ul>\n\u003ch3 id=\"G12-2\">装備品\u003c/h3>\n\u003cul>\u003cli>発炎筒、赤ランプなどの\u003cstrong>非常信号用具\u003c/strong>を備えなければならない\u003c/li>\u003cli>高速道路を通行するときは、故障などで止まっていることを示す\u003cstrong>停止表示器材\u003c/strong>を備え付ける\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=36\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第3節2 装備品などの点検\u003c/a>\u003c/figcaption>\u003cblockquote>発炎筒、赤ランプなどの非常信号用具を備えなければなりません。また、高速道路（高速自動車国道又は自動車専用道路）を通行するときは、故障などで停止していることを示すための停止表示器材を備え付けるようにしましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G12-3\">乗車と積載の制限\u003c/h3>\n\u003cul>\u003cli>座席でないところに人を乗せたり、荷台や座席でないところに荷物を積んだりしてはいけない。ただし、貨物自動車の荷台に、荷物の見張りのため必要最小限度の人を乗せるときや、出発地の警察署長の許可を受けたときは別\u003c/li>\u003cli>乗車定員（\u003cstrong>運転者を含む\u003c/strong>）や積載の制限を超えてはいけない。\u003cstrong>12 歳未満の子供は、3 人を 2 人\u003c/strong>として数える\u003c/li>\u003c/ul>\n\u003cp>普通自動車の積載の制限は、次のとおりです（道路交通法施行令第 22 条）。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>制限\u003c/th>\u003cth>普通自動車\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>重量\u003c/td>\u003ctd>自動車検査証などに記録された最大積載量まで\u003c/td>\u003c/tr>\u003ctr>\u003ctd>長さ\u003c/td>\u003ctd>自動車の長さ × 1.2 まで\u003c/td>\u003c/tr>\u003ctr>\u003ctd>幅\u003c/td>\u003ctd>自動車の幅 × 1.2 まで\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高さ\u003c/td>\u003ctd>地上 3.8 メートルまで（三輪のものなどは 2.5 メートル）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>はみ出し\u003c/td>\u003ctd>車体の前後から自動車の長さの 10 分の 1、左右から自動車の幅の 10 分の 1 まで\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_22-Pr_1-It_4\" target=\"_blank\" rel=\"noopener\">道路交通法施行令 第22条第4号\u003c/a>\u003c/figcaption>\u003cblockquote>自動車の法第五十七条第一項の政令で定める乗車人員又は積載物の重量、大きさ若しくは積載の方法の制限は、次の各号に定めるところによる。\u003cbr>四　積載物は、次に掲げる制限を超えることとなるような方法で積載しないこと。\u003cbr>　イ　自動車の車体の前後から自動車の長さの十分の一の長さ（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の前後から〇・三メートル）を超えてはみ出さないこと。\u003cbr>　ロ　自動車の車体の左右から自動車の幅の十分の一の幅（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の左右から〇・一五メートル）を超えてはみ出さないこと。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G12-4\">積み方\u003c/h3>\n\u003cul>\u003cli>運転の妨げになったり、車の安定が悪くなったり、外から方向指示器、ナンバープレート、ブレーキ灯、尾灯などが見えにくくなったりする積み方をしてはいけない\u003c/li>\u003cli>人や荷物が転落、飛散しないよう、ドアを確実に閉め、ロープやシートで荷物を確実に積む。荷物が転落、飛散したときは、後続車に注意しながら速やかに取り除く\u003c/li>\u003cli>危険物を運ぶときは、包装や積載を確実にし、危険物を運搬中であることを示す標示板などを掲げる。駐車するときは危険な場所を避け、危険物を見張る\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=38\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第4節4 乗車と積載\u003c/a>\u003c/figcaption>\u003cblockquote>運転者は、人が転落したり、荷物が転落、飛散したりしないようにドアを確実に閉め、ロープやシートを使つて荷物を確実に積まなければなりません。また、荷物が転落、飛散してしまつたときは、速やかにその物を除去するなど必要な措置を採らなければなりません。その場合には後続車などに十分注意しましよう。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G12-1","title":"点検"},{"id":"G12-2","title":"装備品"},{"id":"G12-3","title":"乗車と積載の制限"},{"id":"G12-4","title":"積み方"}],"search":[{"id":"","title":"","text":"この章から、本免許で増える範囲です。ここでは、自動車の点検と、人の乗せ方・荷物の積み方の制限を覚えます。"},{"id":"G12-1","title":"点検","text":"点検 ハンドル、ブレーキ、マフラーなどが整備されていないため、交通の危険を生じさせたり、有害なガスや騒音でほかの人に迷惑を掛けたりするおそれのある車を運転してはいけません（道路交通法第 62 条）。 点検内容日常点検使用者や運転しようとする人が、自分の責任で行う。自家用の普通乗用自動車は、走行距離や運行時の状態などから判断した適切な時期に行う（事業用の自動車やレンタカーなどは 1 日 1 回、運行の前）定期点検自家用の普通乗用自動車は 1 年ごと（自家用の普通貨物自動車やレンタカーなどは 6 か月ごと、事業用の自動車などは 3 か月ごと） 交通の方法に関する教則 第4章第3節3 定期点検事業用の自動車、自家用の大型自動車及び中型自動車や準中型貨物自動車、普通貨物自動車などのレンタカーについては３箇月ごとに、自家用の準中型貨物自動車及び普通貨物自動車や普通乗用自動車などのレンタカーなどについては６箇月ごとに、自家用の普通乗用自動車などについては１年ごとに点検し、必要な整備をしなければなりません。 日常点検の例です。 ブレーキペダル：踏みしろや、いっぱいに踏み込んだときの床板とのすき間、踏みごたえが適当かエンジンオイル：量がオイルレベル・ゲージの範囲内かファンベルト：中央部を手で押して、少したわむ程度か。損傷がないかタイヤ：空気圧、亀裂や損傷、異常な摩耗、溝の深さ（ウェア・インジケータ（スリップ・サイン）で見る）灯火装置と方向指示器：点灯・点滅の具合、レンズの汚れや損傷"},{"id":"G12-2","title":"装備品","text":"装備品 発炎筒、赤ランプなどの非常信号用具を備えなければならない高速道路を通行するときは、故障などで止まっていることを示す停止表示器材を備え付ける 交通の方法に関する教則 第4章第3節2 装備品などの点検発炎筒、赤ランプなどの非常信号用具を備えなければなりません。また、高速道路（高速自動車国道又は自動車専用道路）を通行するときは、故障などで停止していることを示すための停止表示器材を備え付けるようにしましよう。"},{"id":"G12-3","title":"乗車と積載の制限","text":"乗車と積載の制限 座席でないところに人を乗せたり、荷台や座席でないところに荷物を積んだりしてはいけない。ただし、貨物自動車の荷台に、荷物の見張りのため必要最小限度の人を乗せるときや、出発地の警察署長の許可を受けたときは別乗車定員（運転者を含む）や積載の制限を超えてはいけない。12 歳未満の子供は、3 人を 2 人として数える 普通自動車の積載の制限は、次のとおりです（道路交通法施行令第 22 条）。 制限普通自動車重量自動車検査証などに記録された最大積載量まで長さ自動車の長さ × 1.2 まで幅自動車の幅 × 1.2 まで高さ地上 3.8 メートルまで（三輪のものなどは 2.5 メートル）はみ出し車体の前後から自動車の長さの 10 分の 1、左右から自動車の幅の 10 分の 1 まで 道路交通法施行令 第22条第4号自動車の法第五十七条第一項の政令で定める乗車人員又は積載物の重量、大きさ若しくは積載の方法の制限は、次の各号に定めるところによる。 四 積載物は、次に掲げる制限を超えることとなるような方法で積載しないこと。 イ 自動車の車体の前後から自動車の長さの十分の一の長さ（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の前後から〇・三メートル）を超えてはみ出さないこと。 ロ 自動車の車体の左右から自動車の幅の十分の一の幅（大型自動二輪車及び普通自動二輪車にあつては、その乗車装置又は積載装置の左右から〇・一五メートル）を超えてはみ出さないこと。"},{"id":"G12-4","title":"積み方","text":"積み方 運転の妨げになったり、車の安定が悪くなったり、外から方向指示器、ナンバープレート、ブレーキ灯、尾灯などが見えにくくなったりする積み方をしてはいけない人や荷物が転落、飛散しないよう、ドアを確実に閉め、ロープやシートで荷物を確実に積む。荷物が転落、飛散したときは、後続車に注意しながら速やかに取り除く危険物を運ぶときは、包装や積載を確実にし、危険物を運搬中であることを示す標示板などを掲げる。駐車するときは危険な場所を避け、危険物を見張る 交通の方法に関する教則 第4章第4節4 乗車と積載運転者は、人が転落したり、荷物が転落、飛散したりしないようにドアを確実に閉め、ロープやシートを使つて荷物を確実に積まなければなりません。また、荷物が転落、飛散してしまつたときは、速やかにその物を除去するなど必要な措置を採らなければなりません。その場合には後続車などに十分注意しましよう。"}],"only":"本免"},{"id":"G13","subject":"学科","num":13,"title":"安全運転の知識","html":"\u003cp>この章では、運転に関わる目の特性、走っている車に働く自然の力（摩擦、遠心力、衝撃力）と速度の影響、交通公害と地球温暖化の防止、運転適性を覚えます。\u003c/p>\n\u003ch3 id=\"G13-1\">視覚の特性\u003c/h3>\n\u003cul>\u003cli>一点だけを見つめたり、ぼんやり見たりせず、絶えず前方に注意し、ルームミラーやサイドミラーで周りにも目を配る\u003c/li>\u003cli>速度が上がると視力が低下し、特に\u003cstrong>近くのもの\u003c/strong>が見えにくくなる\u003c/li>\u003cli>疲労の影響は、\u003cstrong>目に最も強く\u003c/strong>現れる。疲れるほど見落としや見間違いが増える\u003c/li>\u003cli>明るさが急に変わると、視力は一時急激に低下する。トンネルに入る前や出るときは速度を落とす\u003c/li>\u003cli>夜間は、対向車のライトを直視しない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第5節1（3） 視覚の特性\u003c/a>\u003c/figcaption>\u003cblockquote>（3）明るさが急に変わると、視力は、一時急激に低下します。トンネルに入る前やトンネルから出るときは速度を落としましよう。また、夜間は対向車のライトを直視しないようにしましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G13-2\">自然の力と速度\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>力\u003c/th>\u003cth>ポイント\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>摩擦の力\u003c/td>\u003ctd>車は、タイヤと路面の摩擦で止まる。ぬれたアスファルトでは摩擦抵抗が\u003cstrong>小さく\u003c/strong>なり、制動距離が\u003cstrong>長く\u003c/strong>なる。高速で急ブレーキを掛けると、車輪がロックして滑る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>遠心力\u003c/td>\u003ctd>カーブで車を外側に滑らせようとする力。カーブの半径が\u003cstrong>小さいほど\u003c/strong>大きく、\u003cstrong>速度の 2 乗\u003c/strong>に比例して大きくなる。重心が高かったり片寄ったりすると倒れやすい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>衝撃力\u003c/td>\u003ctd>速度と重量に応じて大きくなり、衝撃が\u003cstrong>短い時間\u003c/strong>に加わるほど大きくなる。時速 60 キロメートルでコンクリートの壁にぶつかると、約 14 メートル（ビルの 5 階程度）の高さから落ちたのと同じくらいの衝撃\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>制動距離、遠心力、衝撃力は、どれも\u003cstrong>速度の 2 乗\u003c/strong>に比例します。速度が 2 倍になると、これらは 2 倍ではなく \u003cstrong>4 倍\u003c/strong>になります。カーブでは、カーブに入る前の直線部分で早めにブレーキを掛け、十分速度を落とします。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=39\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第5節2（4） 自動車に働く自然の力\u003c/a>\u003c/figcaption>\u003cblockquote>（4）速度の影響制動距離、遠心力、衝撃力などは、いずれも速度の２乗に比例して大きくなります。速度が２倍になれば、制動距離、カーブで車の横滑りや転倒をさせようとする力、交通事故の大きさに関係する衝撃力は、２倍になるのではなく、４倍になります。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G13-3\">交通公害と地球温暖化\u003c/h3>\n\u003cul>\u003cli>最高速度や積載制限を守り、不必要な急発進、急ブレーキ、空ぶかしを避けて、排出ガスや騒音、振動を少なくする\u003c/li>\u003cli>排出ガスには、一酸化炭素、炭化水素、窒素酸化物など人体に有害な物質が含まれる。光化学スモッグが発生したときや発生するおそれのあるときは、自動車の使用を控える\u003c/li>\u003cli>二酸化炭素などを減らすため、やさしい発進、加速度の少ない運転、駐停車中のアイドリングストップなどの\u003cstrong>エコドライブ\u003c/strong>に努める\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=40\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第4章第5節3（3） 交通公害、地球温暖化の防止など\u003c/a>\u003c/figcaption>\u003cblockquote>（3）地球温暖化の一因となつている二酸化炭素や人体に有害な物質である窒素酸化物等の排出削減のために、やさしい発進、加速度の少ない運転、駐停車時のアイドリングストップなどの環境負荷の軽減に配慮した自動車の使用（エコドライブ）に努めましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G13-4\">運転適性\u003c/h3>\n\u003cp>自分の運転適性を自覚することは、安全運転に大切です。運転適性についての指導は、各都道府県の交通安全活動推進センターなどで受けられます。\u003c/p>","sections":[{"id":"G13-1","title":"視覚の特性"},{"id":"G13-2","title":"自然の力と速度"},{"id":"G13-3","title":"交通公害と地球温暖化"},{"id":"G13-4","title":"運転適性"}],"search":[{"id":"","title":"","text":"この章では、運転に関わる目の特性、走っている車に働く自然の力（摩擦、遠心力、衝撃力）と速度の影響、交通公害と地球温暖化の防止、運転適性を覚えます。"},{"id":"G13-1","title":"視覚の特性","text":"視覚の特性 一点だけを見つめたり、ぼんやり見たりせず、絶えず前方に注意し、ルームミラーやサイドミラーで周りにも目を配る速度が上がると視力が低下し、特に近くのものが見えにくくなる疲労の影響は、目に最も強く現れる。疲れるほど見落としや見間違いが増える明るさが急に変わると、視力は一時急激に低下する。トンネルに入る前や出るときは速度を落とす夜間は、対向車のライトを直視しない 交通の方法に関する教則 第4章第5節1（3） 視覚の特性（3）明るさが急に変わると、視力は、一時急激に低下します。トンネルに入る前やトンネルから出るときは速度を落としましよう。また、夜間は対向車のライトを直視しないようにしましよう。"},{"id":"G13-2","title":"自然の力と速度","text":"自然の力と速度 力ポイント摩擦の力車は、タイヤと路面の摩擦で止まる。ぬれたアスファルトでは摩擦抵抗が小さくなり、制動距離が長くなる。高速で急ブレーキを掛けると、車輪がロックして滑る遠心力カーブで車を外側に滑らせようとする力。カーブの半径が小さいほど大きく、速度の 2 乗に比例して大きくなる。重心が高かったり片寄ったりすると倒れやすい衝撃力速度と重量に応じて大きくなり、衝撃が短い時間に加わるほど大きくなる。時速 60 キロメートルでコンクリートの壁にぶつかると、約 14 メートル（ビルの 5 階程度）の高さから落ちたのと同じくらいの衝撃 制動距離、遠心力、衝撃力は、どれも速度の 2 乗に比例します。速度が 2 倍になると、これらは 2 倍ではなく 4 倍になります。カーブでは、カーブに入る前の直線部分で早めにブレーキを掛け、十分速度を落とします。 交通の方法に関する教則 第4章第5節2（4） 自動車に働く自然の力（4）速度の影響制動距離、遠心力、衝撃力などは、いずれも速度の２乗に比例して大きくなります。速度が２倍になれば、制動距離、カーブで車の横滑りや転倒をさせようとする力、交通事故の大きさに関係する衝撃力は、２倍になるのではなく、４倍になります。"},{"id":"G13-3","title":"交通公害と地球温暖化","text":"交通公害と地球温暖化 最高速度や積載制限を守り、不必要な急発進、急ブレーキ、空ぶかしを避けて、排出ガスや騒音、振動を少なくする排出ガスには、一酸化炭素、炭化水素、窒素酸化物など人体に有害な物質が含まれる。光化学スモッグが発生したときや発生するおそれのあるときは、自動車の使用を控える二酸化炭素などを減らすため、やさしい発進、加速度の少ない運転、駐停車中のアイドリングストップなどのエコドライブに努める 交通の方法に関する教則 第4章第5節3（3） 交通公害、地球温暖化の防止など（3）地球温暖化の一因となつている二酸化炭素や人体に有害な物質である窒素酸化物等の排出削減のために、やさしい発進、加速度の少ない運転、駐停車時のアイドリングストップなどの環境負荷の軽減に配慮した自動車の使用（エコドライブ）に努めましよう。"},{"id":"G13-4","title":"運転適性","text":"運転適性 自分の運転適性を自覚することは、安全運転に大切です。運転適性についての指導は、各都道府県の交通安全活動推進センターなどで受けられます。"}],"only":"本免"},{"id":"G14","subject":"学科","num":14,"title":"駐車と停車","html":"\u003cp>この章では、駐車と停車の違い、駐車も停車も禁止の場所、駐車が禁止の場所、駐停車の方法、時間制限駐車区間、車から離れるときの措置を覚えます。距離の数字がよく問われます。\u003c/p>\n\u003ch3 id=\"G14-1\">駐車と停車の違い\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>用語\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>駐車\u003c/td>\u003ctd>車が継続的に停止すること。運転者が車から離れていて、すぐに運転できない状態で停止すること\u003c/td>\u003c/tr>\u003ctr>\u003ctd>停車\u003c/td>\u003ctd>駐車にあたらない短時間の停止\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>人の乗り降り\u003c/strong>のための停止と、\u003cstrong>5 分以内の荷物の積卸し\u003c/strong>のための停止は、駐車になりません。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_2-Pr_1-It_18\" target=\"_blank\" rel=\"noopener\">道路交通法 第2条第1項第18号\u003c/a>\u003c/figcaption>\u003cblockquote>この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。\u003cbr>十八　駐車　車両等が客待ち、荷待ち、貨物の積卸し、故障その他の理由により継続的に停止すること（貨物の積卸しのための停止で五分を超えない時間内のもの及び人の乗降のための停止を除く。）、又は車両等が停止（特定自動運行中の停止を除く。）をし、かつ、当該車両等の運転をする者（以下「運転者」という。）がその車両等を離れて直ちに運転することができない状態にあることをいう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G14-2\">駐車も停車も禁止の場所\u003c/h3>\n\u003cp>次の場所では、駐車も停車もしてはいけません（赤信号や危険防止のための一時停止などは別）。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場所\u003c/th>\u003cth>範囲\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>「駐停車禁止」の標識・標示のある場所\u003c/td>\u003ctd>その場所\u003c/td>\u003c/tr>\u003ctr>\u003ctd>軌道敷内、坂の頂上付近、勾配の急な坂、トンネル\u003c/td>\u003ctd>その場所\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交差点、道路の曲がり角\u003c/td>\u003ctd>交差点の中と、交差点の側端や曲がり角から \u003cstrong>5 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>横断歩道、自転車横断帯\u003c/td>\u003ctd>その中と、前後の側端から \u003cstrong>5 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>踏切\u003c/td>\u003ctd>その中と、前後の側端から \u003cstrong>10 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安全地帯\u003c/td>\u003ctd>安全地帯の左側と、その前後 \u003cstrong>10 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>バスや路面電車の停留所\u003c/td>\u003ctd>標示板（標示柱）から \u003cstrong>10 メートル以内\u003c/strong>（運行時間中だけ）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第44条第1項（条文を開く）\u003c/summary>\u003cblockquote>車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。\u003cbr>一　交差点、横断歩道、自転車横断帯、踏切、軌道敷内、坂の頂上付近、勾配の急な坂又はトンネル\u003cbr>二　交差点の側端又は道路の曲がり角から五メートル以内の部分\u003cbr>三　横断歩道又は自転車横断帯の前後の側端からそれぞれ前後に五メートル以内の部分\u003cbr>四　安全地帯が設けられている道路の当該安全地帯の左側の部分及び当該部分の前後の側端からそれぞれ前後に十メートル以内の部分\u003cbr>五　乗合自動車の停留所又はトロリーバス若しくは路面電車の停留場を表示する標示柱又は標示板が設けられている位置から十メートル以内の部分（当該停留所又は停留場に係る運行系統に属する乗合自動車、トロリーバス又は路面電車の運行時間中に限る。）\u003cbr>六　踏切の前後の側端からそれぞれ前後に十メートル以内の部分\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_44-Pr_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"G14-3\">駐車が禁止の場所\u003c/h3>\n\u003cp>次の場所では、駐車をしてはいけません（停車はできます）。警察署長の許可を受けたときは別です。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場所\u003c/th>\u003cth>範囲\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>「駐車禁止」の標識・標示のある場所\u003c/td>\u003ctd>その場所\u003c/td>\u003c/tr>\u003ctr>\u003ctd>火災報知機\u003c/td>\u003ctd>\u003cstrong>1 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>駐車場や車庫などの自動車用の出入口\u003c/td>\u003ctd>\u003cstrong>3 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>道路工事の区域\u003c/td>\u003ctd>区域の端から \u003cstrong>5 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>消防用機械器具の置場、消防用防火水槽、これらの出入口\u003c/td>\u003ctd>\u003cstrong>5 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>消火栓、指定消防水利の標識の位置、防火水槽の取り入れ口\u003c/td>\u003ctd>\u003cstrong>5 メートル以内\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>道路交通法 第45条第1項（条文を開く）\u003c/summary>\u003cblockquote>車両は、道路標識等により駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、駐車してはならない。ただし、公安委員会の定めるところにより警察署長の許可を受けたときは、この限りでない。\u003cbr>一　人の乗降、貨物の積卸し、駐車又は自動車の格納若しくは修理のため道路外に設けられた施設又は場所の道路に接する自動車用の出入口から三メートル以内の部分\u003cbr>二　道路工事が行なわれている場合における当該工事区域の側端から五メートル以内の部分\u003cbr>三　消防用機械器具の置場若しくは消防用防火水槽の側端又はこれらの道路に接する出入口から五メートル以内の部分\u003cbr>四　消火栓、指定消防水利の標識が設けられている位置又は消防用防火水槽の吸水口若しくは吸管投入孔から五メートル以内の部分\u003cbr>五　火災報知機から一メートル以内の部分\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_45-Pr_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>駐車したとき、車の右側の道路上に \u003cstrong>3.5 メートル以上\u003c/strong>の余地がなくなる場所では、駐車してはいけません（標識で余地が指定されていれば、その余地）。荷物の積卸しで運転者がすぐ運転できるときや、傷病者の救護のためやむを得ないときは別です。\u003c/p>\n\u003ch3 id=\"G14-4\">駐停車の方法\u003c/h3>\n\u003cul>\u003cli>歩道や路側帯のない道路では、道路の\u003cstrong>左端\u003c/strong>に沿う\u003c/li>\u003cli>歩道や路側帯のある道路では、\u003cstrong>車道の左端\u003c/strong>に沿う\u003c/li>\u003cli>幅の広い路側帯には入れるが、車の左側に \u003cstrong>0.75 メートル以上\u003c/strong>の余地を空ける。白の実線と破線の路側帯（駐停車禁止路側帯）や、白の 2 本線の路側帯（歩行者用路側帯）には入れない\u003c/li>\u003cli>道路に平行して駐停車している車と、並んで駐停車しない（二重駐車をしない）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=59\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第8節3（3） 駐車、停車の方法\u003c/a>\u003c/figcaption>\u003cblockquote>（3）路側帯の幅が広い場合には、路側帯に入れますが、このときは０.75メートル以上の余地を空けておかなければなりません。ただし、路側帯の幅が広い場合でも、白の実線と破線の標示（付表３（２）10）や、白の２本線の標示（付表３（２）11）のあるところでは、路側帯に入れません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G14-5\">時間制限駐車区間と違法駐車\u003c/h3>\n\u003cul>\u003cli>パーキング・メーターのある区間では、メーターを直ちに作動させる。パーキング・チケット発給設備のある区間では、チケットの発給を直ちに受け、車の\u003cstrong>前面の見やすい場所\u003c/strong>（フロントガラスの内側）に掲示する\u003c/li>\u003cli>標識で示された時間を超えて駐車しない\u003c/li>\u003cli>高齢運転者等専用場所では、専用場所駐車標章を交付された普通自動車だけが駐停車できる。標章を受けられるのは、70 歳以上の人、聴覚障害や肢体不自由で免許に条件が付いている人、妊娠中か出産後 8 週間以内の人\u003c/li>\u003cli>違法駐車で警察官などから移動を命じられたら、直ちに移動する。レッカー移動の費用は運転者などの負担になる\u003c/li>\u003cli>放置車両確認標章を取り付けられた車の使用者は、放置違反金の納付を命じられることがある。標章は、使用者や運転者などが取り除ける（運転するときは取り除く）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=61\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第8節7（3） 放置車両確認標章\u003c/a>\u003c/figcaption>\u003cblockquote>（3）放置車両確認標章を取り付けられた車の使用者、運転者やその車の管理について責任がある者は、これを取り除くことができます。運転するときは、交通事故防止のため、放置車両確認標章を取り除きましょう。（平18公安告４・追加、平20公安告９・一部改正、平21公安告29・旧６繰下・一部改正、令２公安告48・令４公安告53・一部改正）\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G14-6\">保管場所と車から離れるとき\u003c/h3>\n\u003cul>\u003cli>自動車の保有者は、使用の本拠の位置から \u003cstrong>2 キロメートル以内\u003c/strong>の道路以外の場所に、保管場所を確保する\u003c/li>\u003cli>道路を車庫代わりに使わない。同じ場所に引き続き \u003cstrong>12 時間（夜間は 8 時間）以上\u003c/strong>駐車しない\u003c/li>\u003c/ul>\n\u003cp>車から離れるときは、次の措置をとります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>目的\u003c/th>\u003cth>措置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>危険防止\u003c/td>\u003ctd>エンジンを止め、ハンドブレーキを掛ける。ギアは平地や下り坂では\u003cstrong>バック\u003c/strong>、上り坂では\u003cstrong>ロー\u003c/strong>に入れる（AT 車は \u003cstrong>P\u003c/strong>）。坂道では輪止めをする\u003c/td>\u003c/tr>\u003ctr>\u003ctd>盗難防止\u003c/td>\u003ctd>エンジンキーを携帯し、窓を確実に閉めてドアをロックする。盗難防止装置があれば作動させる\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=62\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第5章第8節10（1） 車から離れるときの義務\u003c/a>\u003c/figcaption>\u003cblockquote>（1）危険防止のための措置車から離れるときは、車が暴走しないように次の措置を執らなければなりません。\u003cbr>アエンジンを止め、ハンドブレーキを掛けること。\u003cbr>イギアは、平地や下り坂ではバック、上り坂ではローに入れておくこと。オートマチック車では、チェンジレバーをPに入れておくこと。\u003cbr>ウ坂道では、輪止めをすること。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G14-1","title":"駐車と停車の違い"},{"id":"G14-2","title":"駐車も停車も禁止の場所"},{"id":"G14-3","title":"駐車が禁止の場所"},{"id":"G14-4","title":"駐停車の方法"},{"id":"G14-5","title":"時間制限駐車区間と違法駐車"},{"id":"G14-6","title":"保管場所と車から離れるとき"}],"search":[{"id":"","title":"","text":"この章では、駐車と停車の違い、駐車も停車も禁止の場所、駐車が禁止の場所、駐停車の方法、時間制限駐車区間、車から離れるときの措置を覚えます。距離の数字がよく問われます。"},{"id":"G14-1","title":"駐車と停車の違い","text":"駐車と停車の違い 用語意味駐車車が継続的に停止すること。運転者が車から離れていて、すぐに運転できない状態で停止すること停車駐車にあたらない短時間の停止 人の乗り降りのための停止と、5 分以内の荷物の積卸しのための停止は、駐車になりません。 道路交通法 第2条第1項第18号この法律において、次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。 十八 駐車 車両等が客待ち、荷待ち、貨物の積卸し、故障その他の理由により継続的に停止すること（貨物の積卸しのための停止で五分を超えない時間内のもの及び人の乗降のための停止を除く。）、又は車両等が停止（特定自動運行中の停止を除く。）をし、かつ、当該車両等の運転をする者（以下「運転者」という。）がその車両等を離れて直ちに運転することができない状態にあることをいう。"},{"id":"G14-2","title":"駐車も停車も禁止の場所","text":"駐車も停車も禁止の場所 次の場所では、駐車も停車もしてはいけません（赤信号や危険防止のための一時停止などは別）。 場所範囲「駐停車禁止」の標識・標示のある場所その場所軌道敷内、坂の頂上付近、勾配の急な坂、トンネルその場所交差点、道路の曲がり角交差点の中と、交差点の側端や曲がり角から 5 メートル以内横断歩道、自転車横断帯その中と、前後の側端から 5 メートル以内踏切その中と、前後の側端から 10 メートル以内安全地帯安全地帯の左側と、その前後 10 メートル以内バスや路面電車の停留所標示板（標示柱）から 10 メートル以内（運行時間中だけ） 道路交通法 第44条第1項（条文を開く）車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。 一 交差点、横断歩道、自転車横断帯、踏切、軌道敷内、坂の頂上付近、勾配の急な坂又はトンネル 二 交差点の側端又は道路の曲がり角から五メートル以内の部分 三 横断歩道又は自転車横断帯の前後の側端からそれぞれ前後に五メートル以内の部分 四 安全地帯が設けられている道路の当該安全地帯の左側の部分及び当該部分の前後の側端からそれぞれ前後に十メートル以内の部分 五 乗合自動車の停留所又はトロリーバス若しくは路面電車の停留場を表示する標示柱又は標示板が設けられている位置から十メートル以内の部分（当該停留所又は停留場に係る運行系統に属する乗合自動車、トロリーバス又は路面電車の運行時間中に限る。） 六 踏切の前後の側端からそれぞれ前後に十メートル以内の部分e-Gov 法令検索で読む"},{"id":"G14-3","title":"駐車が禁止の場所","text":"駐車が禁止の場所 次の場所では、駐車をしてはいけません（停車はできます）。警察署長の許可を受けたときは別です。 場所範囲「駐車禁止」の標識・標示のある場所その場所火災報知機1 メートル以内駐車場や車庫などの自動車用の出入口3 メートル以内道路工事の区域区域の端から 5 メートル以内消防用機械器具の置場、消防用防火水槽、これらの出入口5 メートル以内消火栓、指定消防水利の標識の位置、防火水槽の取り入れ口5 メートル以内 道路交通法 第45条第1項（条文を開く）車両は、道路標識等により駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、駐車してはならない。ただし、公安委員会の定めるところにより警察署長の許可を受けたときは、この限りでない。 一 人の乗降、貨物の積卸し、駐車又は自動車の格納若しくは修理のため道路外に設けられた施設又は場所の道路に接する自動車用の出入口から三メートル以内の部分 二 道路工事が行なわれている場合における当該工事区域の側端から五メートル以内の部分 三 消防用機械器具の置場若しくは消防用防火水槽の側端又はこれらの道路に接する出入口から五メートル以内の部分 四 消火栓、指定消防水利の標識が設けられている位置又は消防用防火水槽の吸水口若しくは吸管投入孔から五メートル以内の部分 五 火災報知機から一メートル以内の部分e-Gov 法令検索で読む 駐車したとき、車の右側の道路上に 3.5 メートル以上の余地がなくなる場所では、駐車してはいけません（標識で余地が指定されていれば、その余地）。荷物の積卸しで運転者がすぐ運転できるときや、傷病者の救護のためやむを得ないときは別です。"},{"id":"G14-4","title":"駐停車の方法","text":"駐停車の方法 歩道や路側帯のない道路では、道路の左端に沿う歩道や路側帯のある道路では、車道の左端に沿う幅の広い路側帯には入れるが、車の左側に 0.75 メートル以上の余地を空ける。白の実線と破線の路側帯（駐停車禁止路側帯）や、白の 2 本線の路側帯（歩行者用路側帯）には入れない道路に平行して駐停車している車と、並んで駐停車しない（二重駐車をしない） 交通の方法に関する教則 第5章第8節3（3） 駐車、停車の方法（3）路側帯の幅が広い場合には、路側帯に入れますが、このときは０.75メートル以上の余地を空けておかなければなりません。ただし、路側帯の幅が広い場合でも、白の実線と破線の標示（付表３（２）10）や、白の２本線の標示（付表３（２）11）のあるところでは、路側帯に入れません。"},{"id":"G14-5","title":"時間制限駐車区間と違法駐車","text":"時間制限駐車区間と違法駐車 パーキング・メーターのある区間では、メーターを直ちに作動させる。パーキング・チケット発給設備のある区間では、チケットの発給を直ちに受け、車の前面の見やすい場所（フロントガラスの内側）に掲示する標識で示された時間を超えて駐車しない高齢運転者等専用場所では、専用場所駐車標章を交付された普通自動車だけが駐停車できる。標章を受けられるのは、70 歳以上の人、聴覚障害や肢体不自由で免許に条件が付いている人、妊娠中か出産後 8 週間以内の人違法駐車で警察官などから移動を命じられたら、直ちに移動する。レッカー移動の費用は運転者などの負担になる放置車両確認標章を取り付けられた車の使用者は、放置違反金の納付を命じられることがある。標章は、使用者や運転者などが取り除ける（運転するときは取り除く） 交通の方法に関する教則 第5章第8節7（3） 放置車両確認標章（3）放置車両確認標章を取り付けられた車の使用者、運転者やその車の管理について責任がある者は、これを取り除くことができます。運転するときは、交通事故防止のため、放置車両確認標章を取り除きましょう。（平18公安告４・追加、平20公安告９・一部改正、平21公安告29・旧６繰下・一部改正、令２公安告48・令４公安告53・一部改正）"},{"id":"G14-6","title":"保管場所と車から離れるとき","text":"保管場所と車から離れるとき 自動車の保有者は、使用の本拠の位置から 2 キロメートル以内の道路以外の場所に、保管場所を確保する道路を車庫代わりに使わない。同じ場所に引き続き 12 時間（夜間は 8 時間）以上駐車しない 車から離れるときは、次の措置をとります。 目的措置危険防止エンジンを止め、ハンドブレーキを掛ける。ギアは平地や下り坂ではバック、上り坂ではローに入れる（AT 車は P）。坂道では輪止めをする盗難防止エンジンキーを携帯し、窓を確実に閉めてドアをロックする。盗難防止装置があれば作動させる 交通の方法に関する教則 第5章第8節10（1） 車から離れるときの義務（1）危険防止のための措置車から離れるときは、車が暴走しないように次の措置を執らなければなりません。 アエンジンを止め、ハンドブレーキを掛けること。 イギアは、平地や下り坂ではバック、上り坂ではローに入れておくこと。オートマチック車では、チェンジレバーをPに入れておくこと。 ウ坂道では、輪止めをすること。"}],"only":"本免"},{"id":"G15","subject":"学科","num":15,"title":"夜間・悪天候・緊急時","html":"\u003cp>この章では、夜間の運転と灯火のきまり、雨・雪・霧のときの運転、エンストやパンク、横滑りなど緊急のときの対処を覚えます。\u003c/p>\n\u003ch3 id=\"G15-1\">夜間の運転\u003c/h3>\n\u003cul>\u003cli>夜間は視界が悪く、歩行者や自転車の発見が遅れる。速度感が鈍って速度超過になりがちなので、昼間より速度を落とす\u003c/li>\u003cli>自分の車と対向車のライトで、\u003cstrong>道路の中央付近の歩行者が見えなくなる\u003c/strong>ことがある\u003c/li>\u003cli>視線はできるだけ\u003cstrong>先の方\u003c/strong>へ向け、早く障害物を見つける。前の車に続くときは、そのブレーキ灯に注意する\u003c/li>\u003cli>単調な運転で眠くなったら、安全な場所に止めて休む\u003c/li>\u003cli>\u003cstrong>薄暮時\u003c/strong>は事故が多いので、早めにライトをつける\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第3節1（2） 夜間の走行\u003c/a>\u003c/figcaption>\u003cblockquote>（2）走行中には、自分の車と対向車のライトで、道路の中央付近の歩行者が見えなくなることがあるので、十分注意しましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G15-2\">灯火\u003c/h3>\n\u003cp>\u003cstrong>夜間\u003c/strong>（日没時から日出時まで）に道路にあるときは、前照灯、車幅灯、尾灯などをつけます。昼間でも、トンネルの中や濃い霧の中などで、視界が \u003cstrong>50 メートル\u003c/strong>（高速道路では \u003cstrong>200 メートル\u003c/strong>）以下のときは同じです。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_19\" target=\"_blank\" rel=\"noopener\">道路交通法施行令 第19条\u003c/a>\u003c/figcaption>\u003cblockquote>（夜間以外の時間で灯火をつけなければならない場合）\u003cbr>第十九条　法第五十二条第一項後段の政令で定める場合は、トンネルの中、濃霧がかかつている場所その他の場所で、視界が高速自動車国道及び自動車専用道路においては二百メートル、その他の道路においては五十メートル以下であるような暗い場所を通行する場合及び当該場所に停車し、又は駐車している場合とする。\u003c/blockquote>\u003c/figure>\n\u003cul>\u003cli>前照灯は、交通量の多い市街地などのほかは\u003cstrong>上向き\u003c/strong>にして、歩行者などを早く見つける\u003c/li>\u003cli>対向車と行き違うときや、ほかの車の直後を走るときは、前照灯を\u003cstrong>減光するか下向き\u003c/strong>にする（道路交通法第 52 条第 2 項）\u003c/li>\u003cli>対向車のライトがまぶしいときは、視点を\u003cstrong>やや左前方\u003c/strong>に移す\u003c/li>\u003cli>見通しの悪い交差点やカーブの手前では、前照灯を上向きにするか点滅させて、接近を知らせる\u003c/li>\u003cli>室内灯は、バスのほかは走行中につけない\u003c/li>\u003cli>夜間に道路に駐停車するときは、非常点滅表示灯、駐車灯か尾灯をつける。道路照明などで 50 メートル後方から見える場所や、停止表示器材を置いたときは別（高速道路では、灯火に加えて停止表示器材も置く）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第3節2（6） 灯火\u003c/a>\u003c/figcaption>\u003cblockquote>（6）夜間、道路に駐停車するときは、非常点滅表示灯、駐車灯又は尾灯をつけなければなりません。昼間でも、トンネルの中や濃い霧の中などで50メートル先が見えないような場所に駐停車するときも同じです。しかし、道路照明などにより、50メートル後方から見える場所に駐停車しているときや、停止表示器材を置いて駐停車しているときは別です。夜間、高速道路でやむを得ず駐停車する場合には、非常点滅表示灯、駐車灯又は尾灯をつけるほか、停止表示器材を置かなければなりません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G15-3\">雨・雪・霧\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>天候\u003c/th>\u003cth>注意\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>雨\u003c/td>\u003ctd>晴れの日より速度を落とし、車間距離を十分とる。\u003cstrong>降り始め\u003c/strong>の舗装道路、工事現場の鉄板、路面電車のレールは滑りやすい。地盤が緩むので、山道では路肩に寄り過ぎない。深い水たまりを通ると、ブレーキが効かなくなることがある\u003c/td>\u003c/tr>\u003ctr>\u003ctd>雪道\u003c/td>\u003ctd>タイヤチェーンなどの滑り止めか、雪路用タイヤを着ける。「タイヤチェーンを取り付けていない車両通行止め」の標識がある道路では、チェーンを着けないと通れない。\u003cstrong>車の通った跡\u003c/strong>を選んで走る。急発進、急ブレーキ、急ハンドルはしない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>霧\u003c/td>\u003ctd>霧灯があれば霧灯を、なければ前照灯を早めにつける。中央線やガードレール、前の車の尾灯を目安に、速度を落とす。必要に応じて警音器を使う\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第4節1（4） 雨の日の運転\u003c/a>\u003c/figcaption>\u003cblockquote>（4）雨の降り始めの舗装道路はスリップしやすいので気を付けましよう。また、工事現場の鉄板、路面電車のレールなども滑りやすいので危険です。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G15-4\">緊急時の措置\u003c/h3>\n\u003cul>\u003cli>踏切や交差点でエンストしたときは、ギアをローかセコンドに入れ、セルモーターを使って車を動かすこともできる（\u003cstrong>AT 車などではこの方法は使えない\u003c/strong>）\u003c/li>\u003cli>ぬかるみで車輪が空回りするときは、古毛布や砂利などを滑り止めに使う\u003c/li>\u003cli>エンジンの回転数が上がったまま下がらなくなったときは、ギアをニュートラルにして安全な場所に行き、止まってからエンジンスイッチを切る\u003c/li>\u003cli>走行中にタイヤが\u003cstrong>パンク\u003c/strong>したときは、ハンドルをしっかり握って方向を直し、急ブレーキを避けて、\u003cstrong>断続的に\u003c/strong>ブレーキを踏んで止まる\u003c/li>\u003cli>後輪が横滑りを始めたときは、\u003cstrong>ブレーキを掛けず\u003c/strong>、アクセルを緩め、ハンドルで向きを立て直す。後輪が右に滑ったら、ハンドルを\u003cstrong>右\u003c/strong>に切る\u003c/li>\u003cli>下り坂でブレーキが効かなくなったときは、手早く減速チェンジをしてハンドブレーキを引く。それでも止まらないときは、山側の溝に車輪を落とすなどして止める\u003c/li>\u003cli>正面衝突のおそれがあるときは、警音器とブレーキを同時に使い、できる限り左側によける。道路外が危険な場所でなければ、道路外に出ることをためらわない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第6章第5節（5） 緊急時の措置\u003c/a>\u003c/figcaption>\u003cblockquote>（5）後輪の横滑りは、スピードの出し過ぎ、急ハンドル又は急加速が原因で生じます。後輪が横滑りを始めたときは、ブレーキを掛けてはいけません。まずアクセルを緩め、同時にハンドルで車の向きを立て直すようにします。この場合、後輪が右（左）に滑つたときは、車は左（右）に向くので、ハンドルを右（左）に切ります。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G15-1","title":"夜間の運転"},{"id":"G15-2","title":"灯火"},{"id":"G15-3","title":"雨・雪・霧"},{"id":"G15-4","title":"緊急時の措置"}],"search":[{"id":"","title":"","text":"この章では、夜間の運転と灯火のきまり、雨・雪・霧のときの運転、エンストやパンク、横滑りなど緊急のときの対処を覚えます。"},{"id":"G15-1","title":"夜間の運転","text":"夜間の運転 夜間は視界が悪く、歩行者や自転車の発見が遅れる。速度感が鈍って速度超過になりがちなので、昼間より速度を落とす自分の車と対向車のライトで、道路の中央付近の歩行者が見えなくなることがある視線はできるだけ先の方へ向け、早く障害物を見つける。前の車に続くときは、そのブレーキ灯に注意する単調な運転で眠くなったら、安全な場所に止めて休む薄暮時は事故が多いので、早めにライトをつける 交通の方法に関する教則 第6章第3節1（2） 夜間の走行（2）走行中には、自分の車と対向車のライトで、道路の中央付近の歩行者が見えなくなることがあるので、十分注意しましよう。"},{"id":"G15-2","title":"灯火","text":"灯火 夜間（日没時から日出時まで）に道路にあるときは、前照灯、車幅灯、尾灯などをつけます。昼間でも、トンネルの中や濃い霧の中などで、視界が 50 メートル（高速道路では 200 メートル）以下のときは同じです。 道路交通法施行令 第19条（夜間以外の時間で灯火をつけなければならない場合） 第十九条 法第五十二条第一項後段の政令で定める場合は、トンネルの中、濃霧がかかつている場所その他の場所で、視界が高速自動車国道及び自動車専用道路においては二百メートル、その他の道路においては五十メートル以下であるような暗い場所を通行する場合及び当該場所に停車し、又は駐車している場合とする。 前照灯は、交通量の多い市街地などのほかは上向きにして、歩行者などを早く見つける対向車と行き違うときや、ほかの車の直後を走るときは、前照灯を減光するか下向きにする（道路交通法第 52 条第 2 項）対向車のライトがまぶしいときは、視点をやや左前方に移す見通しの悪い交差点やカーブの手前では、前照灯を上向きにするか点滅させて、接近を知らせる室内灯は、バスのほかは走行中につけない夜間に道路に駐停車するときは、非常点滅表示灯、駐車灯か尾灯をつける。道路照明などで 50 メートル後方から見える場所や、停止表示器材を置いたときは別（高速道路では、灯火に加えて停止表示器材も置く） 交通の方法に関する教則 第6章第3節2（6） 灯火（6）夜間、道路に駐停車するときは、非常点滅表示灯、駐車灯又は尾灯をつけなければなりません。昼間でも、トンネルの中や濃い霧の中などで50メートル先が見えないような場所に駐停車するときも同じです。しかし、道路照明などにより、50メートル後方から見える場所に駐停車しているときや、停止表示器材を置いて駐停車しているときは別です。夜間、高速道路でやむを得ず駐停車する場合には、非常点滅表示灯、駐車灯又は尾灯をつけるほか、停止表示器材を置かなければなりません。"},{"id":"G15-3","title":"雨・雪・霧","text":"雨・雪・霧 天候注意雨晴れの日より速度を落とし、車間距離を十分とる。降り始めの舗装道路、工事現場の鉄板、路面電車のレールは滑りやすい。地盤が緩むので、山道では路肩に寄り過ぎない。深い水たまりを通ると、ブレーキが効かなくなることがある雪道タイヤチェーンなどの滑り止めか、雪路用タイヤを着ける。「タイヤチェーンを取り付けていない車両通行止め」の標識がある道路では、チェーンを着けないと通れない。車の通った跡を選んで走る。急発進、急ブレーキ、急ハンドルはしない霧霧灯があれば霧灯を、なければ前照灯を早めにつける。中央線やガードレール、前の車の尾灯を目安に、速度を落とす。必要に応じて警音器を使う 交通の方法に関する教則 第6章第4節1（4） 雨の日の運転（4）雨の降り始めの舗装道路はスリップしやすいので気を付けましよう。また、工事現場の鉄板、路面電車のレールなども滑りやすいので危険です。"},{"id":"G15-4","title":"緊急時の措置","text":"緊急時の措置 踏切や交差点でエンストしたときは、ギアをローかセコンドに入れ、セルモーターを使って車を動かすこともできる（AT 車などではこの方法は使えない）ぬかるみで車輪が空回りするときは、古毛布や砂利などを滑り止めに使うエンジンの回転数が上がったまま下がらなくなったときは、ギアをニュートラルにして安全な場所に行き、止まってからエンジンスイッチを切る走行中にタイヤがパンクしたときは、ハンドルをしっかり握って方向を直し、急ブレーキを避けて、断続的にブレーキを踏んで止まる後輪が横滑りを始めたときは、ブレーキを掛けず、アクセルを緩め、ハンドルで向きを立て直す。後輪が右に滑ったら、ハンドルを右に切る下り坂でブレーキが効かなくなったときは、手早く減速チェンジをしてハンドブレーキを引く。それでも止まらないときは、山側の溝に車輪を落とすなどして止める正面衝突のおそれがあるときは、警音器とブレーキを同時に使い、できる限り左側によける。道路外が危険な場所でなければ、道路外に出ることをためらわない 交通の方法に関する教則 第6章第5節（5） 緊急時の措置（5）後輪の横滑りは、スピードの出し過ぎ、急ハンドル又は急加速が原因で生じます。後輪が横滑りを始めたときは、ブレーキを掛けてはいけません。まずアクセルを緩め、同時にハンドルで車の向きを立て直すようにします。この場合、後輪が右（左）に滑つたときは、車は左（右）に向くので、ハンドルを右（左）に切ります。"}],"only":"本免"},{"id":"G16","subject":"学科","num":16,"title":"高速道路","html":"\u003cp>高速道路とは、\u003cstrong>高速自動車国道\u003c/strong>と\u003cstrong>自動車専用道路\u003c/strong>のことです。この章では、高速道路に入る前の準備、本線車道への入り方、速度と車間距離、走り方、駐停車の禁止と故障のときの措置、出口の出方を覚えます。\u003c/p>\n\u003ch3 id=\"G16-1\">高速道路に入る前に\u003c/h3>\n\u003cul>\u003cli>ミニカー、小型二輪車、一般原動機付自転車は、高速道路を通行できない\u003c/li>\u003cli>燃料、冷却水、エンジンオイルの量、ファンベルト、タイヤ（空気圧は\u003cstrong>やや高め\u003c/strong>、溝の深さ）を点検する\u003c/li>\u003cli>積荷が転落・飛散しないよう点検し、必要なら積み直す（道路交通法第 75 条の 10）\u003c/li>\u003cli>故障に備えて、\u003cstrong>停止表示器材\u003c/strong>を用意する\u003c/li>\u003cli>休息時間を織り込んだ、ゆとりのある運転計画を立てる\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=71\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第7章第1節（1） 高速道路に入る前の心得\u003c/a>\u003c/figcaption>\u003cblockquote>（1）車を点検すること高速道路を通行する場合は、特に次の点検をしなければなりません。高速道路で、燃料、冷却水、エンジンオイルの不足により、停止することのないようにしなければなりません。\u003cbr>ア燃料の量が十分であるか。\u003cbr>イ冷却水の量が規定の範囲内にあるか。\u003cbr>ウラジエータキャップが確実に締まつているか。\u003cbr>エエンジンオイルの量が適当であるか。\u003cbr>オファンベルトの張り具合が適当であるか、また、損傷がないか。\u003cbr>カタイヤの空気圧が適当であるか（高速道路を走行するときは、空気圧をやや高めにする。）。\u003cbr>キタイヤの溝の深さが十分であるか。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G16-2\">本線車道への入り方と速度\u003c/h3>\n\u003cp>本線車道は、通常高速で走る部分です（加速車線、減速車線、登坂車線、路側帯、路肩を除く）。\u003c/p>\n\u003cul>\u003cli>加速車線があるときは、加速車線で\u003cstrong>十分加速\u003c/strong>する\u003c/li>\u003cli>本線車道を通行している車の進行を妨げてはいけない\u003c/li>\u003c/ul>\n\u003cp>標識などで指定されていない高速自動車国道の本線車道の速度は、次のとおりです。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>自動車\u003c/th>\u003cth>最高速度\u003c/th>\u003cth>最低速度\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>普通自動車（三輪のものと、けん引しているものを除く）\u003c/td>\u003ctd>時速 100 キロメートル\u003c/td>\u003ctd>時速 50 キロメートル\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>道路交通法施行令 第27条（条文を開く）\u003c/summary>\u003cblockquote>（最高速度）\u003cbr>第二十七条　最高速度のうち、自動車が高速自動車国道の本線車道又はこれに接する加速車線若しくは減速車線を通行する場合の最高速度は、次の各号に掲げる自動車の区分に従い、それぞれ当該各号に定めるとおりとする。\u003cbr>一　次に掲げる自動車　百キロメートル毎時\u003cbr>　イ　大型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。次号において同じ。）のうち専ら人を運搬する構造のもの\u003cbr>　ロ　中型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。次号において同じ。）のうち、専ら人を運搬する構造のもの又は車両総重量が八千キログラム未満、最大積載重量が五千キログラム未満及び乗車定員が十人以下のもの\u003cbr>　ハ　準中型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。）\u003cbr>　ニ　普通自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。）\u003cbr>　ホ　大型自動二輪車\u003cbr>　ヘ　普通自動二輪車\u003cbr>二　大型自動車のうち前号イに掲げるもの以外のもの及び中型自動車のうち同号ロに掲げるもの以外のもの　九十キロメートル毎時\u003cbr>三　前二号に掲げる自動車以外の自動車　八十キロメートル毎時\u003cbr>２　法第三十九条第一項の緊急自動車が高速自動車国道の本線車道又はこれに接する加速車線若しくは減速車線を通行する場合の最高速度は、第十二条第一項及び前項の規定にかかわらず、百キロメートル毎時とする。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_4_2-At_27\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cul>\u003cli>長く高速で走ったり、夜間に高速で走ったりすると、速度感が鈍る。速度計で確かめる\u003c/li>\u003cli>車間距離は、乾燥した路面で新しいタイヤなら、時速 100 キロメートルで約 \u003cstrong>100 メートル\u003c/strong>、時速 80 キロメートルで約 80 メートル。雨にぬれた路面でタイヤが減っていれば、その約 2 倍が必要なことがある\u003c/li>\u003cli>雨の中を高速で走ると、タイヤが浮いてハンドルやブレーキが効かなくなることがある（\u003cstrong>ハイドロプレーニング現象\u003c/strong>）\u003c/li>\u003c/ul>\n\u003ch3 id=\"G16-3\">走り方\u003c/h3>\n\u003cul>\u003cli>車両通行帯のやや左寄りを走る\u003c/li>\u003cli>\u003cstrong>路側帯や路肩を通行してはいけない\u003c/strong>\u003c/li>\u003cli>本線車道で、\u003cstrong>転回、後退、中央分離帯の横切り\u003c/strong>をしてはいけない\u003c/li>\u003cli>追越しは早めに合図をし、進路を戻すときは、追い越した車の\u003cstrong>全体\u003c/strong>がルームミラーに映ってから戻る\u003c/li>\u003cli>急ブレーキは危険。一段低いギアでエンジンブレーキを使い、フットブレーキを数回に分けて踏む。急ハンドルも避ける\u003c/li>\u003cli>強風のときは速度を落とす。トンネルや切り通しの出口では、横風でハンドルを取られることがある\u003c/li>\u003cli>高速でトンネルに入ると視力が急に低下するので、手前で速度を落とす\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=73\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第7章第2節3（4） 走行方法\u003c/a>\u003c/figcaption>\u003cblockquote>（4）本線車道では、転回したり、後退したり、中央分離帯を横切つたりしてはいけません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G16-4\">駐停車の禁止と故障のとき\u003c/h3>\n\u003cp>高速道路では、次の場合のほかは駐車も停車もしてはいけません（道路交通法第 75 条の 8）。\u003c/p>\n\u003cul>\u003cli>危険防止のため一時停止するとき\u003c/li>\u003cli>故障などでやむを得ないとき、十分な幅のある路肩や路側帯に駐停車するとき\u003c/li>\u003cli>パーキングエリアで駐停車するとき、料金の支払いのため停車するとき\u003c/li>\u003c/ul>\n\u003cp>故障などで運転できなくなったときは、次のようにします。\u003c/p>\n\u003cul>\u003cli>自動車の\u003cstrong>後方\u003c/strong>の路上に\u003cstrong>停止表示器材\u003c/strong>を置く。夜間（昼間でも視界 200 メートル以下のとき）は、非常点滅表示灯、駐車灯か尾灯もつける\u003c/li>\u003cli>110 番通報で警察に連絡し、非常電話でレッカー車を呼ぶなどして、速やかに安全な場所へ移動させる\u003c/li>\u003cli>危険防止の措置をとった後は、\u003cstrong>車に残らず\u003c/strong>、ガードレールの外側などの安全な場所に避難する\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=74\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第7章第2節4（4） 駐車、停車の禁止など\u003c/a>\u003c/figcaption>\u003cblockquote>（4）高速道路上で運転することができなくなつた車にとどまることは、後続車が衝突する交通事故が発生するおそれが大きく、大変危険です。必要な危険防止措置をとつた後は、車に残らず、ガードレールの外側などの安全な場所に避難しましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G16-5\">本線車道から出るとき\u003c/h3>\n\u003cul>\u003cli>出口を予告する案内標識に注意する\u003c/li>\u003cli>出口に近づいたら、あらかじめ出口に接続する車両通行帯を通る。減速車線があれば、その車線で、\u003cstrong>速度計で確かめながら\u003c/strong>速度を落とす\u003c/li>\u003cli>一般道路に出たら、速度の出し過ぎに注意する\u003c/li>\u003c/ul>","sections":[{"id":"G16-1","title":"高速道路に入る前に"},{"id":"G16-2","title":"本線車道への入り方と速度"},{"id":"G16-3","title":"走り方"},{"id":"G16-4","title":"駐停車の禁止と故障のとき"},{"id":"G16-5","title":"本線車道から出るとき"}],"search":[{"id":"","title":"","text":"高速道路とは、高速自動車国道と自動車専用道路のことです。この章では、高速道路に入る前の準備、本線車道への入り方、速度と車間距離、走り方、駐停車の禁止と故障のときの措置、出口の出方を覚えます。"},{"id":"G16-1","title":"高速道路に入る前に","text":"高速道路に入る前に ミニカー、小型二輪車、一般原動機付自転車は、高速道路を通行できない燃料、冷却水、エンジンオイルの量、ファンベルト、タイヤ（空気圧はやや高め、溝の深さ）を点検する積荷が転落・飛散しないよう点検し、必要なら積み直す（道路交通法第 75 条の 10）故障に備えて、停止表示器材を用意する休息時間を織り込んだ、ゆとりのある運転計画を立てる 交通の方法に関する教則 第7章第1節（1） 高速道路に入る前の心得（1）車を点検すること高速道路を通行する場合は、特に次の点検をしなければなりません。高速道路で、燃料、冷却水、エンジンオイルの不足により、停止することのないようにしなければなりません。 ア燃料の量が十分であるか。 イ冷却水の量が規定の範囲内にあるか。 ウラジエータキャップが確実に締まつているか。 エエンジンオイルの量が適当であるか。 オファンベルトの張り具合が適当であるか、また、損傷がないか。 カタイヤの空気圧が適当であるか（高速道路を走行するときは、空気圧をやや高めにする。）。 キタイヤの溝の深さが十分であるか。"},{"id":"G16-2","title":"本線車道への入り方と速度","text":"本線車道への入り方と速度 本線車道は、通常高速で走る部分です（加速車線、減速車線、登坂車線、路側帯、路肩を除く）。 加速車線があるときは、加速車線で十分加速する本線車道を通行している車の進行を妨げてはいけない 標識などで指定されていない高速自動車国道の本線車道の速度は、次のとおりです。 自動車最高速度最低速度普通自動車（三輪のものと、けん引しているものを除く）時速 100 キロメートル時速 50 キロメートル 道路交通法施行令 第27条（条文を開く）（最高速度） 第二十七条 最高速度のうち、自動車が高速自動車国道の本線車道又はこれに接する加速車線若しくは減速車線を通行する場合の最高速度は、次の各号に掲げる自動車の区分に従い、それぞれ当該各号に定めるとおりとする。 一 次に掲げる自動車 百キロメートル毎時 イ 大型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。次号において同じ。）のうち専ら人を運搬する構造のもの ロ 中型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。次号において同じ。）のうち、専ら人を運搬する構造のもの又は車両総重量が八千キログラム未満、最大積載重量が五千キログラム未満及び乗車定員が十人以下のもの ハ 準中型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。） ニ 普通自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。） ホ 大型自動二輪車 ヘ 普通自動二輪車 二 大型自動車のうち前号イに掲げるもの以外のもの及び中型自動車のうち同号ロに掲げるもの以外のもの 九十キロメートル毎時 三 前二号に掲げる自動車以外の自動車 八十キロメートル毎時 ２ 法第三十九条第一項の緊急自動車が高速自動車国道の本線車道又はこれに接する加速車線若しくは減速車線を通行する場合の最高速度は、第十二条第一項及び前項の規定にかかわらず、百キロメートル毎時とする。e-Gov 法令検索で読む 長く高速で走ったり、夜間に高速で走ったりすると、速度感が鈍る。速度計で確かめる車間距離は、乾燥した路面で新しいタイヤなら、時速 100 キロメートルで約 100 メートル、時速 80 キロメートルで約 80 メートル。雨にぬれた路面でタイヤが減っていれば、その約 2 倍が必要なことがある雨の中を高速で走ると、タイヤが浮いてハンドルやブレーキが効かなくなることがある（ハイドロプレーニング現象）"},{"id":"G16-3","title":"走り方","text":"走り方 車両通行帯のやや左寄りを走る路側帯や路肩を通行してはいけない本線車道で、転回、後退、中央分離帯の横切りをしてはいけない追越しは早めに合図をし、進路を戻すときは、追い越した車の全体がルームミラーに映ってから戻る急ブレーキは危険。一段低いギアでエンジンブレーキを使い、フットブレーキを数回に分けて踏む。急ハンドルも避ける強風のときは速度を落とす。トンネルや切り通しの出口では、横風でハンドルを取られることがある高速でトンネルに入ると視力が急に低下するので、手前で速度を落とす 交通の方法に関する教則 第7章第2節3（4） 走行方法（4）本線車道では、転回したり、後退したり、中央分離帯を横切つたりしてはいけません。"},{"id":"G16-4","title":"駐停車の禁止と故障のとき","text":"駐停車の禁止と故障のとき 高速道路では、次の場合のほかは駐車も停車もしてはいけません（道路交通法第 75 条の 8）。 危険防止のため一時停止するとき故障などでやむを得ないとき、十分な幅のある路肩や路側帯に駐停車するときパーキングエリアで駐停車するとき、料金の支払いのため停車するとき 故障などで運転できなくなったときは、次のようにします。 自動車の後方の路上に停止表示器材を置く。夜間（昼間でも視界 200 メートル以下のとき）は、非常点滅表示灯、駐車灯か尾灯もつける110 番通報で警察に連絡し、非常電話でレッカー車を呼ぶなどして、速やかに安全な場所へ移動させる危険防止の措置をとった後は、車に残らず、ガードレールの外側などの安全な場所に避難する 交通の方法に関する教則 第7章第2節4（4） 駐車、停車の禁止など（4）高速道路上で運転することができなくなつた車にとどまることは、後続車が衝突する交通事故が発生するおそれが大きく、大変危険です。必要な危険防止措置をとつた後は、車に残らず、ガードレールの外側などの安全な場所に避難しましよう。"},{"id":"G16-5","title":"本線車道から出るとき","text":"本線車道から出るとき 出口を予告する案内標識に注意する出口に近づいたら、あらかじめ出口に接続する車両通行帯を通る。減速車線があれば、その車線で、速度計で確かめながら速度を落とす一般道路に出たら、速度の出し過ぎに注意する"}],"only":"本免"},{"id":"G17","subject":"学科","num":17,"title":"二輪車","html":"\u003cp>普通免許では二輪車（自動二輪車）は運転できませんが、本免許の学科試験には、二輪車の運転の方法も出ます（普通免許で運転できる一般原動機付自転車も二輪車です）。この章では、二輪車の特性、ヘルメットと服装、二人乗り、乗車姿勢、カーブとブレーキの方法を覚えます。\u003c/p>\n\u003ch3 id=\"G17-1\">二輪車の特性と準備\u003c/h3>\n\u003cp>二輪車（大型自動二輪車、普通自動二輪車、一般原動機付自転車）は、\u003cstrong>体で安定を保ちながら走り、止まると安定を失う\u003c/strong>乗り物です。四輪車から二輪車の動きが見えないことがあるので、一層の注意が要ります。\u003c/p>\n\u003cul>\u003cli>車種は体格に合ったものを選ぶ。最初は小型から始める。平地でセンタースタンドを楽に立てられること、またがったとき\u003cstrong>両足のつま先が地面に届く\u003c/strong>こと、8 の字型に押して歩けることを確かめる\u003c/li>\u003cli>\u003cstrong>乗車用ヘルメット\u003c/strong>をかぶる（PS（c）マークか JIS マークの付いたもの。あごひもを確実に締める）。\u003cstrong>工事用安全帽は乗車用ヘルメットではない\u003c/strong>\u003c/li>\u003cli>体の露出が少ない服装で、できるだけプロテクターを着ける。夜間は反射材の付いたものを着ける\u003c/li>\u003cli>点検では、ブレーキの遊びや効き、タイヤの空気圧、チェーンの張り（中央部を指で押して調べる）、灯火、バックミラー、マフラーなどを確かめる\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=76\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第8章第1節2 乗車用ヘルメットの着用\u003c/a>\u003c/figcaption>\u003cblockquote>乗車用ヘルメットをかぶらないで大型自動二輪車や普通自動二輪車や一般原動機付自転車を運転してはいけません。また、乗車用ヘルメットをかぶらない者を乗せて大型自動二輪車や普通自動二輪車を運転してはいけません。乗車用ヘルメットは、PS（c）マークかJISマークの付いたものを使い、あごひもを確実に締めるなど正しく着用しましよう。工事用安全帽は乗車用ヘルメットではありません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G17-2\">二人乗り\u003c/h3>\n\u003cp>次のときは、二人乗りをしてはいけません。\u003c/p>\n\u003cul>\u003cli>後部座席のない自動二輪車や、\u003cstrong>一般原動機付自転車\u003c/strong>\u003c/li>\u003cli>普通二輪免許（大型二輪免許）を受けて \u003cstrong>1 年\u003c/strong>たっていない人が運転するとき\u003c/li>\u003cli>高速道路では、\u003cstrong>20 歳未満\u003c/strong>の人か、免許を受けていた期間が \u003cstrong>3 年未満\u003c/strong>の人が運転するとき\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=77\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第8章第1節4（5） 二人乗りの禁止\u003c/a>\u003c/figcaption>\u003cblockquote>（5）普通二輪免許を受けた者で、20歳未満のもの又は普通二輪免許を受けていた期間が３年未満のものが、高速道路で普通自動二輪車を運転するとき。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G17-3\">乗車姿勢と走り方\u003c/h3>\n\u003cul>\u003cli>ステップに土踏まずを載せ、足先をまっすぐ前に向け、\u003cstrong>タンクを両ひざでしめる\u003c/strong>\u003c/li>\u003cli>\u003cstrong>手首を下げ\u003c/strong>、ハンドルを前に押すような気持ちでグリップを\u003cstrong>軽く\u003c/strong>持つ。肩の力を抜き、ひじをわずかに曲げる\u003c/li>\u003cli>車の間を縫って走ったり、ジグザグ運転、無理な追越しや割込みをしたりしない。げたやサンダルで運転しない\u003c/li>\u003cli>カーブでは、手前の直線部分で十分速度を落とす。曲がるときは、ハンドルを切るのではなく、\u003cstrong>車体を傾けて\u003c/strong>自然に曲がる。カーブの途中は\u003cstrong>クラッチを切らず\u003c/strong>、スロットルで速度を加減する\u003c/li>\u003cli>ぬかるみや砂利道では、低速ギアで速度を落とし、スロットルで速度を一定に保つ。急な操作をしない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第8章第3節1（2） カーブでの運転方法\u003c/a>\u003c/figcaption>\u003cblockquote>（2）曲がるときは、ハンドルを切るのではなく、車体を傾けることによつて自然に曲がるような要領で行いましよう。\u003c/blockquote>\u003c/figure>\n\u003cp>一般原動機付自転車は、「二段階」の標識のある道路や、車両通行帯が 3 つ以上ある道路の、信号機などのある交差点では、\u003cstrong>二段階の右折方法\u003c/strong>で右折します。あらかじめ道路の左端に寄り、交差点の手前の側端から 30 メートルの地点で右折の合図をし、青信号で交差点の向こう側まで直進して、そこで向きを変えます。\u003c/p>\n\u003ch3 id=\"G17-4\">ブレーキ\u003c/h3>\n\u003cp>二輪車のブレーキには、前輪ブレーキ、後輪ブレーキ、エンジンブレーキがあります。\u003c/p>\n\u003cul>\u003cli>車体を\u003cstrong>垂直\u003c/strong>に保ち、ハンドルを切らずに、エンジンブレーキを効かせながら\u003cstrong>前後輪のブレーキを同時に\u003c/strong>掛ける\u003c/li>\u003cli>乾燥した路面では\u003cstrong>前輪\u003c/strong>ブレーキをやや強く、滑りやすい路面では\u003cstrong>後輪\u003c/strong>ブレーキをやや強く掛ける\u003c/li>\u003cli>エンジンブレーキは、低速ギアほど制動力が大きい。ただし、いきなり高速からローに入れず、順序よくシフトダウンする\u003c/li>\u003cli>急ブレーキは横滑りの原因になる。ブレーキは数回に分けて使う\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=80\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第8章第4節2（2） ブレーキを掛けるときの注意\u003c/a>\u003c/figcaption>\u003cblockquote>（2）乾燥した路面でブレーキを掛けるときは、前輪ブレーキをやや強く、路面が滑りやすいときは、後輪ブレーキをやや強く掛けましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G17-5\">オートマチック二輪車とその他\u003c/h3>\n\u003cul>\u003cli>オートマチック二輪車は、スロットルを急に回すと\u003cstrong>急発進\u003c/strong>する危険がある。低速でスロットルを完全に戻すと、安定を失うことがある\u003c/li>\u003cli>変形ハンドルや、マフラーを外したりしんを抜いたりする\u003cstrong>改造をしてはいけない\u003c/strong>\u003c/li>\u003cli>二輪車を押して歩くときは歩行者として扱われる。ただし、\u003cstrong>エンジンを掛けたまま\u003c/strong>のものや、側車付きのもの、ほかの車をけん引しているものは別\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=82\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第8章第6節3 押して歩くとき\u003c/a>\u003c/figcaption>\u003cblockquote>二輪車を押して歩くときは、歩行者として扱われます。しかし、エンジンを掛けているものやほかの車をけん引しているものや側車付きのものを押しているときは、歩行者としては扱われません。\u003c/blockquote>\u003c/figure>","sections":[{"id":"G17-1","title":"二輪車の特性と準備"},{"id":"G17-2","title":"二人乗り"},{"id":"G17-3","title":"乗車姿勢と走り方"},{"id":"G17-4","title":"ブレーキ"},{"id":"G17-5","title":"オートマチック二輪車とその他"}],"search":[{"id":"","title":"","text":"普通免許では二輪車（自動二輪車）は運転できませんが、本免許の学科試験には、二輪車の運転の方法も出ます（普通免許で運転できる一般原動機付自転車も二輪車です）。この章では、二輪車の特性、ヘルメットと服装、二人乗り、乗車姿勢、カーブとブレーキの方法を覚えます。"},{"id":"G17-1","title":"二輪車の特性と準備","text":"二輪車の特性と準備 二輪車（大型自動二輪車、普通自動二輪車、一般原動機付自転車）は、体で安定を保ちながら走り、止まると安定を失う乗り物です。四輪車から二輪車の動きが見えないことがあるので、一層の注意が要ります。 車種は体格に合ったものを選ぶ。最初は小型から始める。平地でセンタースタンドを楽に立てられること、またがったとき両足のつま先が地面に届くこと、8 の字型に押して歩けることを確かめる乗車用ヘルメットをかぶる（PS（c）マークか JIS マークの付いたもの。あごひもを確実に締める）。工事用安全帽は乗車用ヘルメットではない体の露出が少ない服装で、できるだけプロテクターを着ける。夜間は反射材の付いたものを着ける点検では、ブレーキの遊びや効き、タイヤの空気圧、チェーンの張り（中央部を指で押して調べる）、灯火、バックミラー、マフラーなどを確かめる 交通の方法に関する教則 第8章第1節2 乗車用ヘルメットの着用乗車用ヘルメットをかぶらないで大型自動二輪車や普通自動二輪車や一般原動機付自転車を運転してはいけません。また、乗車用ヘルメットをかぶらない者を乗せて大型自動二輪車や普通自動二輪車を運転してはいけません。乗車用ヘルメットは、PS（c）マークかJISマークの付いたものを使い、あごひもを確実に締めるなど正しく着用しましよう。工事用安全帽は乗車用ヘルメットではありません。"},{"id":"G17-2","title":"二人乗り","text":"二人乗り 次のときは、二人乗りをしてはいけません。 後部座席のない自動二輪車や、一般原動機付自転車普通二輪免許（大型二輪免許）を受けて 1 年たっていない人が運転するとき高速道路では、20 歳未満の人か、免許を受けていた期間が 3 年未満の人が運転するとき 交通の方法に関する教則 第8章第1節4（5） 二人乗りの禁止（5）普通二輪免許を受けた者で、20歳未満のもの又は普通二輪免許を受けていた期間が３年未満のものが、高速道路で普通自動二輪車を運転するとき。"},{"id":"G17-3","title":"乗車姿勢と走り方","text":"乗車姿勢と走り方 ステップに土踏まずを載せ、足先をまっすぐ前に向け、タンクを両ひざでしめる手首を下げ、ハンドルを前に押すような気持ちでグリップを軽く持つ。肩の力を抜き、ひじをわずかに曲げる車の間を縫って走ったり、ジグザグ運転、無理な追越しや割込みをしたりしない。げたやサンダルで運転しないカーブでは、手前の直線部分で十分速度を落とす。曲がるときは、ハンドルを切るのではなく、車体を傾けて自然に曲がる。カーブの途中はクラッチを切らず、スロットルで速度を加減するぬかるみや砂利道では、低速ギアで速度を落とし、スロットルで速度を一定に保つ。急な操作をしない 交通の方法に関する教則 第8章第3節1（2） カーブでの運転方法（2）曲がるときは、ハンドルを切るのではなく、車体を傾けることによつて自然に曲がるような要領で行いましよう。 一般原動機付自転車は、「二段階」の標識のある道路や、車両通行帯が 3 つ以上ある道路の、信号機などのある交差点では、二段階の右折方法で右折します。あらかじめ道路の左端に寄り、交差点の手前の側端から 30 メートルの地点で右折の合図をし、青信号で交差点の向こう側まで直進して、そこで向きを変えます。"},{"id":"G17-4","title":"ブレーキ","text":"ブレーキ 二輪車のブレーキには、前輪ブレーキ、後輪ブレーキ、エンジンブレーキがあります。 車体を垂直に保ち、ハンドルを切らずに、エンジンブレーキを効かせながら前後輪のブレーキを同時に掛ける乾燥した路面では前輪ブレーキをやや強く、滑りやすい路面では後輪ブレーキをやや強く掛けるエンジンブレーキは、低速ギアほど制動力が大きい。ただし、いきなり高速からローに入れず、順序よくシフトダウンする急ブレーキは横滑りの原因になる。ブレーキは数回に分けて使う 交通の方法に関する教則 第8章第4節2（2） ブレーキを掛けるときの注意（2）乾燥した路面でブレーキを掛けるときは、前輪ブレーキをやや強く、路面が滑りやすいときは、後輪ブレーキをやや強く掛けましよう。"},{"id":"G17-5","title":"オートマチック二輪車とその他","text":"オートマチック二輪車とその他 オートマチック二輪車は、スロットルを急に回すと急発進する危険がある。低速でスロットルを完全に戻すと、安定を失うことがある変形ハンドルや、マフラーを外したりしんを抜いたりする改造をしてはいけない二輪車を押して歩くときは歩行者として扱われる。ただし、エンジンを掛けたままのものや、側車付きのもの、ほかの車をけん引しているものは別 交通の方法に関する教則 第8章第6節3 押して歩くとき二輪車を押して歩くときは、歩行者として扱われます。しかし、エンジンを掛けているものやほかの車をけん引しているものや側車付きのものを押しているときは、歩行者としては扱われません。"}],"only":"本免"},{"id":"G18","subject":"学科","num":18,"title":"事故・故障・災害のとき","html":"\u003cp>この章では、交通事故を起こしたときや見かけたときの措置、故障したときの措置、地震や災害のときの運転と避難のしかたを覚えます。\u003c/p>\n\u003ch3 id=\"G18-1\">交通事故のとき\u003c/h3>\n\u003cp>交通事故が起きたときは、運転者や乗務員は次の措置をとります（道路交通法第 72 条）。\u003c/p>\n\u003col>\u003cli>事故の続発を防ぐため、ほかの交通の妨げにならない安全な場所（路肩、空地など）に車を止め、\u003cstrong>エンジンを切る\u003c/strong>\u003c/li>\u003cli>負傷者がいれば、救急車などが来るまで、止血など可能な\u003cstrong>応急救護処置\u003c/strong>をする。\u003cstrong>むやみに負傷者を動かさない\u003c/strong>（特に頭部に傷を受けているとき）。ただし、後続事故のおそれがあるときは、早く安全な場所に移す\u003c/li>\u003cli>事故の場所、負傷者の数や程度、物の損壊の程度、積載物などを\u003cstrong>警察官に報告\u003c/strong>し、指示を受ける\u003c/li>\u003c/ol>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=83\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第10章第1節1（2） 運転者などの義務\u003c/a>\u003c/figcaption>\u003cblockquote>（2）負傷者がいる場合は、医師、救急車などが到着するまでの間、ガーゼや清潔なハンカチなどで止血するなど、可能な応急救護処置を行う。この場合、むやみに負傷者を動かさない（特に頭部に傷を受けているときは動かさない）ようにする。ただし、後続事故のおそれがある場合は、早く負傷者を救出して安全な場所に移動させる。\u003c/blockquote>\u003c/figure>\n\u003cul>\u003cli>軽いけがでも必ず警察官に届ける。外傷がなくても、頭部などに強い衝撃を受けたときは、\u003cstrong>医師の診断\u003c/strong>を受ける（後遺症が出ることがある）\u003c/li>\u003cli>緊急自動車や、けが人を運んでいる車、乗合バスなどの運転者は、業務のため運転を続ける必要があるときは、ほかの乗務員に救護や報告をさせて、運転を続けられる\u003c/li>\u003c/ul>\n\u003ch3 id=\"G18-2\">事故の現場に居合わせたとき\u003c/h3>\n\u003cul>\u003cli>負傷者の救護や事故車両の移動などに、進んで協力する\u003c/li>\u003cli>ひき逃げを見かけたら、負傷者を救護し、その車のナンバー、車種、色などを 110 番通報などで警察官に届け出る\u003c/li>\u003cli>事故現場ではガソリンが流れていたり、積荷に危険物があったりするので、\u003cstrong>たばこを吸わない\u003c/strong>\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=84\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第10章第1節3（3） 現場に居合わせた人の協力\u003c/a>\u003c/figcaption>\u003cblockquote>（3）事故現場には、ガソリンが流れたり、積荷に危険物があつたりするので、たばこを吸つたり、マツチを捨てたりしないようにしましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G18-3\">故障したとき\u003c/h3>\n\u003cul>\u003cli>故障や燃料切れのときは、ほかの交通の妨げにならない場所に駐車し、速やかに修理や補給をする\u003c/li>\u003cli>夜間、一般道路でやむを得ず駐車するときは、非常点滅表示灯などをつけるか、停止表示器材を置く\u003c/li>\u003cli>故障車は、一次措置を終えたらすぐに JAF や修理業者などを呼び、速やかに道路外へ移動させる\u003c/li>\u003cli>やむを得ず一般の車でけん引するときは、故障車との間を \u003cstrong>5 メートル以内\u003c/strong>の安全な間隔に保って丈夫なロープでつなぎ、ロープに \u003cstrong>30 センチメートル平方以上の白い布\u003c/strong>を付ける\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=85\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第10章第2節4 故障などのとき\u003c/a>\u003c/figcaption>\u003cblockquote>道路に故障車両を放置することは、追突事故などの原因となり非常に危険です。停止表示器材を置くなど、一次措置を終えるとすぐに、近くの電話などでJAF（日本自動車連盟）や修理業者などの車を呼んで、速やかに道路外へ移動させるようにしましよう。やむを得ず一般車両でけん引するときは、けん引する車と故障車の間に安全な間隔（５メートル以内）を保ちながら丈夫なロープなどで確実につなぎ、ロープに白い布（30センチメートル平方以上）を付けなければなりません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G18-4\">地震と災害のとき\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>場面\u003c/th>\u003cth>すること\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>警戒宣言が発せられたとき\u003c/td>\u003ctd>あわてずに\u003cstrong>低速\u003c/strong>で走り、カーラジオなどで地震情報や交通情報を聞く\u003c/td>\u003c/tr>\u003ctr>\u003ctd>緊急地震速報を知ったとき\u003c/td>\u003ctd>非常点滅表示灯をつけるなどして周りに注意を促し、\u003cstrong>急ブレーキを避けて\u003c/strong>緩やかに速度を落とす\u003c/td>\u003c/tr>\u003ctr>\u003ctd>運転中に大地震が起きたとき\u003c/td>\u003ctd>急ハンドル、急ブレーキを避け、できるだけ安全な方法で\u003cstrong>道路の左側\u003c/strong>に止める。情報を聞いて行動する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>車を置いて避難するとき\u003c/td>\u003ctd>できるだけ道路外に移す。やむを得ず道路上に置くときは、道路の左側に寄せ、エンジンを止め、\u003cstrong>キーは付けたまま\u003c/strong>（か車内の分かりやすい場所に置き）、窓を閉め、\u003cstrong>ドアはロックしない\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>運転中でないとき\u003c/td>\u003ctd>津波から避難するためやむを得ない場合のほかは、避難に車を使わない\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>交通の方法に関する教則 第10章第3節3（1） 大地震が発生したとき（条文を開く）\u003c/summary>\u003cblockquote>（1）車を運転中に大地震が発生したとき\u003cbr>ア急ハンドル、急ブレーキを避けるなど、できるだけ安全な方法により道路の左側に停止させること。\u003cbr>イ停止後は、カーラジオ等により地震情報や交通情報を聞き、その情報や周囲の状況に応じて行動すること。\u003cbr>ウ引き続き車を運転するときは、道路の損壊、信号機の作動停止、道路上の障害物などに十分注意すること。\u003cbr>エ車を置いて避難するときは、できるだけ道路外の場所に移動しておくこと。やむを得ず道路上に置いて避難するときは、道路の左側に寄せて駐車し、エンジンを止め、エンジンキーは付けたままとするか運転席などの車内の分かりやすい場所に置いておくこととし、窓を閉め、ドアはロックしないこと。駐車するときは、避難する人の通行や災害応急対策の実施の妨げとなるような場所には駐車しないこと。\u003c/blockquote>\u003cp>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=86\" target=\"_blank\" rel=\"noopener\">警察庁の教則の全文（PDF）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>災害対策基本法による交通の規制が行われたときは、通行禁止区域などにある車を、区間の指定なら規制区間以外の場所へ、区域の指定なら道路外の場所へ、速やかに移動させます。移動が難しいときは、\u003cstrong>道路の左端\u003c/strong>に沿って駐車するなど、緊急通行車両の妨げにならない方法で駐車します。\u003c/p>","sections":[{"id":"G18-1","title":"交通事故のとき"},{"id":"G18-2","title":"事故の現場に居合わせたとき"},{"id":"G18-3","title":"故障したとき"},{"id":"G18-4","title":"地震と災害のとき"}],"search":[{"id":"","title":"","text":"この章では、交通事故を起こしたときや見かけたときの措置、故障したときの措置、地震や災害のときの運転と避難のしかたを覚えます。"},{"id":"G18-1","title":"交通事故のとき","text":"交通事故のとき 交通事故が起きたときは、運転者や乗務員は次の措置をとります（道路交通法第 72 条）。 事故の続発を防ぐため、ほかの交通の妨げにならない安全な場所（路肩、空地など）に車を止め、エンジンを切る負傷者がいれば、救急車などが来るまで、止血など可能な応急救護処置をする。むやみに負傷者を動かさない（特に頭部に傷を受けているとき）。ただし、後続事故のおそれがあるときは、早く安全な場所に移す事故の場所、負傷者の数や程度、物の損壊の程度、積載物などを警察官に報告し、指示を受ける 交通の方法に関する教則 第10章第1節1（2） 運転者などの義務（2）負傷者がいる場合は、医師、救急車などが到着するまでの間、ガーゼや清潔なハンカチなどで止血するなど、可能な応急救護処置を行う。この場合、むやみに負傷者を動かさない（特に頭部に傷を受けているときは動かさない）ようにする。ただし、後続事故のおそれがある場合は、早く負傷者を救出して安全な場所に移動させる。 軽いけがでも必ず警察官に届ける。外傷がなくても、頭部などに強い衝撃を受けたときは、医師の診断を受ける（後遺症が出ることがある）緊急自動車や、けが人を運んでいる車、乗合バスなどの運転者は、業務のため運転を続ける必要があるときは、ほかの乗務員に救護や報告をさせて、運転を続けられる"},{"id":"G18-2","title":"事故の現場に居合わせたとき","text":"事故の現場に居合わせたとき 負傷者の救護や事故車両の移動などに、進んで協力するひき逃げを見かけたら、負傷者を救護し、その車のナンバー、車種、色などを 110 番通報などで警察官に届け出る事故現場ではガソリンが流れていたり、積荷に危険物があったりするので、たばこを吸わない 交通の方法に関する教則 第10章第1節3（3） 現場に居合わせた人の協力（3）事故現場には、ガソリンが流れたり、積荷に危険物があつたりするので、たばこを吸つたり、マツチを捨てたりしないようにしましよう。"},{"id":"G18-3","title":"故障したとき","text":"故障したとき 故障や燃料切れのときは、ほかの交通の妨げにならない場所に駐車し、速やかに修理や補給をする夜間、一般道路でやむを得ず駐車するときは、非常点滅表示灯などをつけるか、停止表示器材を置く故障車は、一次措置を終えたらすぐに JAF や修理業者などを呼び、速やかに道路外へ移動させるやむを得ず一般の車でけん引するときは、故障車との間を 5 メートル以内の安全な間隔に保って丈夫なロープでつなぎ、ロープに 30 センチメートル平方以上の白い布を付ける 交通の方法に関する教則 第10章第2節4 故障などのとき道路に故障車両を放置することは、追突事故などの原因となり非常に危険です。停止表示器材を置くなど、一次措置を終えるとすぐに、近くの電話などでJAF（日本自動車連盟）や修理業者などの車を呼んで、速やかに道路外へ移動させるようにしましよう。やむを得ず一般車両でけん引するときは、けん引する車と故障車の間に安全な間隔（５メートル以内）を保ちながら丈夫なロープなどで確実につなぎ、ロープに白い布（30センチメートル平方以上）を付けなければなりません。"},{"id":"G18-4","title":"地震と災害のとき","text":"地震と災害のとき 場面すること警戒宣言が発せられたときあわてずに低速で走り、カーラジオなどで地震情報や交通情報を聞く緊急地震速報を知ったとき非常点滅表示灯をつけるなどして周りに注意を促し、急ブレーキを避けて緩やかに速度を落とす運転中に大地震が起きたとき急ハンドル、急ブレーキを避け、できるだけ安全な方法で道路の左側に止める。情報を聞いて行動する車を置いて避難するときできるだけ道路外に移す。やむを得ず道路上に置くときは、道路の左側に寄せ、エンジンを止め、キーは付けたまま（か車内の分かりやすい場所に置き）、窓を閉め、ドアはロックしない運転中でないとき津波から避難するためやむを得ない場合のほかは、避難に車を使わない 交通の方法に関する教則 第10章第3節3（1） 大地震が発生したとき（条文を開く）（1）車を運転中に大地震が発生したとき ア急ハンドル、急ブレーキを避けるなど、できるだけ安全な方法により道路の左側に停止させること。 イ停止後は、カーラジオ等により地震情報や交通情報を聞き、その情報や周囲の状況に応じて行動すること。 ウ引き続き車を運転するときは、道路の損壊、信号機の作動停止、道路上の障害物などに十分注意すること。 エ車を置いて避難するときは、できるだけ道路外の場所に移動しておくこと。やむを得ず道路上に置いて避難するときは、道路の左側に寄せて駐車し、エンジンを止め、エンジンキーは付けたままとするか運転席などの車内の分かりやすい場所に置いておくこととし、窓を閉め、ドアはロックしないこと。駐車するときは、避難する人の通行や災害応急対策の実施の妨げとなるような場所には駐車しないこと。警察庁の教則の全文（PDF）で読む 災害対策基本法による交通の規制が行われたときは、通行禁止区域などにある車を、区間の指定なら規制区間以外の場所へ、区域の指定なら道路外の場所へ、速やかに移動させます。移動が難しいときは、道路の左端に沿って駐車するなど、緊急通行車両の妨げにならない方法で駐車します。"}],"only":"本免"},{"id":"G19","subject":"学科","num":19,"title":"自動車の所有者などの義務","html":"\u003cp>この章では、自動車を持つ人が守ること（保管場所、登録、検査、保険、車の管理）と、車の使用者や安全運転管理者の義務を覚えます。\u003c/p>\n\u003ch3 id=\"G19-1\">自動車の所有者などの義務\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>保管場所\u003c/strong>：使用の本拠の位置から 2 キロメートル以内の、道路以外の場所に確保する\u003c/li>\u003cli>\u003cstrong>登録\u003c/strong>：自動車は登録を受け（軽自動車は届け出）、ナンバープレートを付ける。原動機付自転車は申告をしてナンバープレートを付ける\u003c/li>\u003cli>\u003cstrong>検査\u003c/strong>：自動車は、一定の時期に検査を受ける。前面ガラスの検査標章の数字は、\u003cstrong>次の検査の時期（年月）\u003c/strong>を示す\u003c/li>\u003cli>\u003cstrong>保険\u003c/strong>：自賠責保険か責任共済に加入する（原動機付自転車も必ず）。なるべく任意保険にも入る\u003c/li>\u003cli>\u003cstrong>管理\u003c/strong>：無免許の人や酒を飲んだ人に車を貸さない。車のかぎの保管に注意する\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=88\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第11章第1節4 強制保険などの加入\u003c/a>\u003c/figcaption>\u003cblockquote>自賠責保険か責任共済に加入しなければなりません。原動機付自転車も必ず自賠責保険か責任共済に加入しなければなりません。また、なるべく一般の任意保険にも加入するようにしましよう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G19-2\">使用者の義務\u003c/h3>\n\u003cul>\u003cli>車の使用者は、運転者に交通規則を守らせ、安全運転管理者などに安全運転の管理をさせるよう努める\u003c/li>\u003cli>車の適正な駐車のために必要な措置を講じる\u003c/li>\u003cli>運転者が最高速度違反、過積載、過労運転をしたときは、使用者が公安委員会から再発防止の措置を指示されることがある。繰り返すと、その自動車を一定期間運転させられなくなる処分を受けることがある\u003c/li>\u003cli>放置違反金を納めず督促を受けた使用者は、納付を証する書面を見せなければ、新しく自動車検査証を受けられない\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=89\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第11章第2節1（6） 使用者の義務など\u003c/a>\u003c/figcaption>\u003cblockquote>（6）放置違反金を納付の期限までに納付せず、公安委員会から督促を受けた自動車の使用者は、その放置違反金、延滞金及び手数料を納付したことなどを証する書面を提示しなければ、新たに自動車検査証を受けることができません。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"G19-3\">安全運転管理者\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>事業所の自動車\u003c/th>\u003cth>置く人\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>乗車定員 \u003cstrong>11 人以上\u003c/strong>の自動車を \u003cstrong>1 台\u003c/strong>以上、またはその他の自動車を \u003cstrong>5 台\u003c/strong>以上使う\u003c/td>\u003ctd>安全運転管理者\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自動車を \u003cstrong>20 台\u003c/strong>以上使う\u003c/td>\u003ctd>台数に応じて、副安全運転管理者も\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>台数を数えるとき、大型自動二輪車と普通自動二輪車は、それぞれ \u003cstrong>0.5 台\u003c/strong>として計算します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90\" target=\"_blank\" rel=\"noopener\">交通の方法に関する教則 第11章第2節2（1） 安全運転管理者など\u003c/a>\u003c/figcaption>\u003cblockquote>（1）自動車の使用者は、自動車の安全な運転に必要な業務を行わせるため、乗車定員が11人以上の自動車にあつては１台、その他の自動車にあつては５台（大型自動二輪車と普通自動二輪車はそれぞれ０.５台として計算します。）以上の車を使用する事業所ごとに、安全運転管理者を置かなければなりません。また、自動車運転代行業者は、その営業所ごとに安全運転管理者を置かなければなりません。\u003c/blockquote>\u003c/figure>\n\u003cp>安全運転管理者の仕事の例です。\u003c/p>\n\u003cul>\u003cli>交通安全教育を行う。運転者の適性、技能、知識や交通規則を守っているかを把握する\u003c/li>\u003cli>長距離運転などのときは、\u003cstrong>交代運転者\u003c/strong>を配置する\u003c/li>\u003cli>日常点検の実施や運転者の健康状態を確かめ、必要な指示をする\u003c/li>\u003cli>運転前と運転後の運転者の\u003cstrong>酒気帯びの有無\u003c/strong>を、目視などとアルコール検知器で確認し、記録を \u003cstrong>1 年間\u003c/strong>保存する\u003c/li>\u003cli>\u003cstrong>運転日誌\u003c/strong>をつけさせる\u003c/li>\u003c/ul>","sections":[{"id":"G19-1","title":"自動車の所有者などの義務"},{"id":"G19-2","title":"使用者の義務"},{"id":"G19-3","title":"安全運転管理者"}],"search":[{"id":"","title":"","text":"この章では、自動車を持つ人が守ること（保管場所、登録、検査、保険、車の管理）と、車の使用者や安全運転管理者の義務を覚えます。"},{"id":"G19-1","title":"自動車の所有者などの義務","text":"自動車の所有者などの義務 保管場所：使用の本拠の位置から 2 キロメートル以内の、道路以外の場所に確保する登録：自動車は登録を受け（軽自動車は届け出）、ナンバープレートを付ける。原動機付自転車は申告をしてナンバープレートを付ける検査：自動車は、一定の時期に検査を受ける。前面ガラスの検査標章の数字は、次の検査の時期（年月）を示す保険：自賠責保険か責任共済に加入する（原動機付自転車も必ず）。なるべく任意保険にも入る管理：無免許の人や酒を飲んだ人に車を貸さない。車のかぎの保管に注意する 交通の方法に関する教則 第11章第1節4 強制保険などの加入自賠責保険か責任共済に加入しなければなりません。原動機付自転車も必ず自賠責保険か責任共済に加入しなければなりません。また、なるべく一般の任意保険にも加入するようにしましよう。"},{"id":"G19-2","title":"使用者の義務","text":"使用者の義務 車の使用者は、運転者に交通規則を守らせ、安全運転管理者などに安全運転の管理をさせるよう努める車の適正な駐車のために必要な措置を講じる運転者が最高速度違反、過積載、過労運転をしたときは、使用者が公安委員会から再発防止の措置を指示されることがある。繰り返すと、その自動車を一定期間運転させられなくなる処分を受けることがある放置違反金を納めず督促を受けた使用者は、納付を証する書面を見せなければ、新しく自動車検査証を受けられない 交通の方法に関する教則 第11章第2節1（6） 使用者の義務など（6）放置違反金を納付の期限までに納付せず、公安委員会から督促を受けた自動車の使用者は、その放置違反金、延滞金及び手数料を納付したことなどを証する書面を提示しなければ、新たに自動車検査証を受けることができません。"},{"id":"G19-3","title":"安全運転管理者","text":"安全運転管理者 事業所の自動車置く人乗車定員 11 人以上の自動車を 1 台以上、またはその他の自動車を 5 台以上使う安全運転管理者自動車を 20 台以上使う台数に応じて、副安全運転管理者も 台数を数えるとき、大型自動二輪車と普通自動二輪車は、それぞれ 0.5 台として計算します。 交通の方法に関する教則 第11章第2節2（1） 安全運転管理者など（1）自動車の使用者は、自動車の安全な運転に必要な業務を行わせるため、乗車定員が11人以上の自動車にあつては１台、その他の自動車にあつては５台（大型自動二輪車と普通自動二輪車はそれぞれ０.５台として計算します。）以上の車を使用する事業所ごとに、安全運転管理者を置かなければなりません。また、自動車運転代行業者は、その営業所ごとに安全運転管理者を置かなければなりません。 安全運転管理者の仕事の例です。 交通安全教育を行う。運転者の適性、技能、知識や交通規則を守っているかを把握する長距離運転などのときは、交代運転者を配置する日常点検の実施や運転者の健康状態を確かめ、必要な指示をする運転前と運転後の運転者の酒気帯びの有無を、目視などとアルコール検知器で確認し、記録を 1 年間保存する運転日誌をつけさせる"}],"only":"本免"}],"questions":[{"id":"G01-01","subject":"学科","chapter":"G01","text":"\u003cp>交通規則は、道路を通行するみんなが、安全、円滑に通行するために守るべき共通の約束事である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>教則は、交通規則を「みんなが道路を安全、円滑に通行する上で守るべき共通の約束事」とし、守ることは社会人としての基本的な責務だとしています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第1節1 交通規則を守ること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=5","site":"警察庁の教則の全文（PDF）","lines":["道路は、多数の人や車が通行するところです。運転者や歩行者が一人でも自分勝手に通行すると、交通が混乱したり、交通事故が起きたりします。また、自分だけはよくても、ほかの人に迷惑を掛けたりすることがあります。","交通規則は、このようなことから、みんなが道路を安全、円滑に通行する上で守るべき共通の約束事として決められているものです。言い換えれば、交通規則を守ることは、社会人としての基本的な責務なのです。","交通規則の内容は、この教則で述べられていますが、具体的には、信号機や標識などによつて個々に示されていますので、それらの意味をよく理解し、決められた交通規則をお互いに守るようにしましよう。"]}],"section":"G01-1","fixed":true},{"id":"G01-02","subject":"学科","chapter":"G01","text":"\u003cp>交通規則を守っていれば、沿道に住む人への騒音などの迷惑まで考える必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自分の通行の利便だけでなく、沿道で生活している人々に、不愉快な騒音などの迷惑を掛けないように配慮することも、通行するときの心構えです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第1節2（2） 道路を通行するときの心構え","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=6","site":"警察庁の教則の全文（PDF）","lines":["（2）自分の通行の利便だけを考えるのではなく、沿道で生活している人々に対して、不愉快な騒音などの迷惑を掛けないように配慮すること。"]}],"section":"G01-1","fixed":true},{"id":"G01-03","subject":"学科","chapter":"G01","text":"\u003cp>万一に備えて、自動車保険に加入したり、応急救護処置に必要な知識を身に付けたりしておくことは、通行するときの心構えの一つである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動車保険への加入、応急救護処置の知識、救急用具を車に備え付けることなど、平素から十分な用意をしておくことが心構えとして挙げられています。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第1節2（3） 道路を通行するときの心構え","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=6","site":"警察庁の教則の全文（PDF）","lines":["（3）万一の場合に備えて、自動車保険に加入したり、応急救護処置（交通事故の現場においてその負傷者を救護するため必要な応急の処置をいいます。）に必要な知識を身に付けたり、救急用具を車に備え付けたりするなど平素から十分な用意をしておくこと。"]}],"section":"G01-1","fixed":true},{"id":"G01-04","subject":"学科","chapter":"G01","text":"\u003cp>自動車の死角や内輪差などの特性は、自動車の運転者だけが知っておけばよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転者はもちろん、歩行者や、特定小型原動機付自転車や自転車に乗る人も、自動車の死角、内輪差などの特性をよく知っておくことが求められます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第1節2（5） 道路を通行するときの心構え","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=6","site":"警察庁の教則の全文（PDF）","lines":["（5）自動車の運転者はもちろん、歩行者、特定小型原動機付自転車（第３章第１節２の特定小型原動機付自転車をいいます。）や自転車に乗る人も、自動車の死角、内輪差など自動車の特性をよく知つておくこと。"]}],"section":"G01-1","fixed":true},{"id":"G01-05","subject":"学科","chapter":"G01","text":"\u003cp>交差点で、横の道路の信号が赤であれば、前方の信号は青なので、横の信号を見て発進してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>信号は前方の信号を見ます。全方向が一時的に赤になる信号や、時差式の信号のように、横が赤でも前方が青とは限らない信号があります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節1（2） 信号の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（2）信号機の信号は、前方の信号を見るようにしましよう。横の信号が赤であつても、前方の信号が青であるとは限りません。例えば、全方向が一時的に赤になる信号や、時差式信号機のように特定方向の信号が赤に変わる時間をずらせているものもあります。"]}],"section":"G01-4","fixed":true},{"id":"G01-06","subject":"学科","chapter":"G01","text":"\u003cp>前方の信号が青色の灯火のとき、自動車は、直進、左折、右折をすることができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>青色の灯火では、自動車は直進し、左折し、右折することができます（二段階の右折方法による原付などは別）。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","青色の灯火｜一　歩行者及び遠隔操作型小型車（遠隔操作により道路を通行しているものに限る。）（以下この条において「歩行者等」という。）は、進行することができること。二　自動車、一般原動機付自転車（法第十八条第一項に規定する一般原動機付自転車をいう。以下同じ。）（右折につき一般原動機付自転車が法第三十四条第五項本文の規定によることとされる交差点を通行する一般原動機付自転車（以下この表において「多通行帯道路等通行一般原動機付自転車」という。）を除く。）、トロリーバス及び路面電車は、直進し、左折し、又は右折することができること。三　多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車（法第十七条第三項に規定する特定小型原動機付自転車をいう。以下この条及び第四十一条の三第一項において同じ。）及び軽車両は、直進（右折しようとして右折する地点まで直進し、その地点において右折することを含む。青色の灯火の矢印の項を除き、以下この条において同じ。）をし、又は左折することができること。"]}],"section":"G01-2","fixed":true},{"id":"G01-07","subject":"学科","chapter":"G01","text":"\u003cp>前方の信号が黄色の灯火に変わったとき、停止位置に近づいていて安全に停止することができない場合は、そのまま進むことができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>黄色の灯火では停止位置から先へ進んではいけませんが、黄色に変わったときに停止位置に近接していて安全に停止できない場合は別です。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","黄色の灯火｜一　歩行者等は、道路の横断を始めてはならず、また、道路を横断している歩行者等は、速やかに、その横断を終わるか、又は横断をやめて引き返さなければならないこと。二　車両及び路面電車（以下この表において「車両等」という。）は、停止位置を越えて進行してはならないこと。ただし、黄色の灯火の信号が表示された時において当該停止位置に近接しているため安全に停止することができない場合を除く。"]}],"section":"G01-2","fixed":true},{"id":"G01-08","subject":"学科","chapter":"G01","text":"\u003cp>黄色の灯火の信号は「注意して進め」という意味なので、停止位置の手前で黄色に変わっても、速度を落とせば進んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>黄色の灯火は、停止位置を越えて進んではいけないという意味です。進めるのは、停止位置に近づいていて安全に停止できない場合だけです。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","黄色の灯火｜一　歩行者等は、道路の横断を始めてはならず、また、道路を横断している歩行者等は、速やかに、その横断を終わるか、又は横断をやめて引き返さなければならないこと。二　車両及び路面電車（以下この表において「車両等」という。）は、停止位置を越えて進行してはならないこと。ただし、黄色の灯火の信号が表示された時において当該停止位置に近接しているため安全に停止することができない場合を除く。"]}],"section":"G01-2","fixed":true},{"id":"G01-09","subject":"学科","chapter":"G01","text":"\u003cp>前方の信号が赤色の灯火に変わったときは、交差点で既に左折している車も、その場で停止しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>赤色の灯火でも、交差点で既に左折している車両等は、そのまま進行することができます。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","赤色の灯火｜一　歩行者等は、道路を横断してはならないこと。二　車両等は、停止位置を越えて進行してはならないこと。三　交差点において既に左折している車両等は、そのまま進行することができること。四　交差点において既に右折している車両等（多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車及び軽車両を除く。）は、そのまま進行することができること。この場合において、当該車両等は、青色の灯火により進行することができることとされている車両等の進行妨害をしてはならない。五　交差点において既に右折している多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車及び軽車両は、その右折している地点において停止しなければならないこと。"]}],"section":"G01-2","fixed":true},{"id":"G01-10","subject":"学科","chapter":"G01","text":"\u003cp>交差点で既に右折している自動車は、信号が赤色の灯火に変わってもそのまま進むことができ、青色の灯火で進んで来る車があっても、先に進んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>既に右折している自動車はそのまま進めますが、青色の灯火で進むことができる車両等の進行を妨げてはいけません。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","赤色の灯火｜一　歩行者等は、道路を横断してはならないこと。二　車両等は、停止位置を越えて進行してはならないこと。三　交差点において既に左折している車両等は、そのまま進行することができること。四　交差点において既に右折している車両等（多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車及び軽車両を除く。）は、そのまま進行することができること。この場合において、当該車両等は、青色の灯火により進行することができることとされている車両等の進行妨害をしてはならない。五　交差点において既に右折している多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車及び軽車両は、その右折している地点において停止しなければならないこと。"]}],"section":"G01-2","fixed":true},{"id":"G01-11","subject":"学科","chapter":"G01","text":"\u003cp>黄色の灯火の点滅の信号では、車は、停止位置で一時停止しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>黄色の灯火の点滅は、ほかの交通に注意して進行することができるという意味です。一時停止しなければならないのは、赤色の灯火の点滅です。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","黄色の灯火の点滅｜歩行者等及び車両等は、他の交通に注意して進行することができること。","赤色の灯火の点滅｜一　歩行者等は、他の交通に注意して進行することができること。二　車両等は、停止位置において一時停止しなければならないこと。"]}],"section":"G01-2","fixed":true},{"id":"G01-12","subject":"学科","chapter":"G01","text":"\u003cp>赤色の灯火の点滅の信号では、車は、ほかの交通に注意して進むことができ、一時停止する必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>赤色の灯火の点滅では、車両等は停止位置で一時停止しなければなりません。ほかの交通に注意して進めるのは、黄色の灯火の点滅のときと、赤色の灯火の点滅のときの歩行者です。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","赤色の灯火の点滅｜一　歩行者等は、他の交通に注意して進行することができること。二　車両等は、停止位置において一時停止しなければならないこと。"]}],"section":"G01-2","fixed":true},{"id":"G01-13","subject":"学科","chapter":"G01","text":"\u003cp>前方の信号が赤色の灯火でも、同時に青色の灯火の左向きの矢印が出ていれば、自動車は左折することができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>青色の灯火の矢印の信号では、車両は、黄色や赤色の灯火の信号にかかわらず、矢印の方向に進行することができます。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","青色の灯火の矢印｜車両は、黄色の灯火又は赤色の灯火の信号にかかわらず、矢印の方向に進行することができること。この場合において、交差点において右折する多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車及び軽車両は、直進する多通行帯道路等通行一般原動機付自転車、特定小型原動機付自転車及び軽車両とみなす。"]}],"section":"G01-2","fixed":true},{"id":"G01-14","subject":"学科","chapter":"G01","text":"\u003cp>停止線のない交差点で、交差点のすぐ手前に横断歩道があるとき、赤色の灯火の信号での停止位置は、横断歩道の手前である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>停止位置は交差点の直前ですが、交差点の直近に横断歩道等があるときは、その横断歩道等の外側までを交差点に含めて考えるので、横断歩道の手前で止まります。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","備考　この表において「停止位置」とは、次に掲げる位置（道路標識等による停止線が設けられているときは、その停止線の直前）をいう。一　交差点（交差点の直近に横断歩道等がある場合においては、その横断歩道等の外側までの道路の部分を含む。以下この表において同じ。）の手前の場所にあつては、交差点の直前二　交差点以外の場所で横断歩道等又は踏切がある場所にあつては、横断歩道等又は踏切の直前三　交差点以外の場所で横断歩道、自転車横断帯及び踏切がない場所にあつては、信号機の直前"]}],"section":"G01-3","fixed":true},{"id":"G01-15","subject":"学科","chapter":"G01","text":"\u003cp>交差点以外の場所で、横断歩道も自転車横断帯も踏切もないところに信号機があり、停止線がないときは、信号機の直前で停止する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>交差点以外で横断歩道、自転車横断帯や踏切がない場所の停止位置は、信号機の直前です（停止線があればその直前）。\u003c/p>","refs":[{"label":"道路交通法施行令 第2条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_2-Pr_1","lines":["法第四条第四項に規定する信号機の表示する信号の種類及び意味は、次の表に掲げるとおりとし、同表の下欄に掲げる信号の意味は、それぞれ同表の上欄に掲げる信号を表示する信号機に対面する交通について表示されるものとする。","信号の種類｜信号の意味","備考　この表において「停止位置」とは、次に掲げる位置（道路標識等による停止線が設けられているときは、その停止線の直前）をいう。一　交差点（交差点の直近に横断歩道等がある場合においては、その横断歩道等の外側までの道路の部分を含む。以下この表において同じ。）の手前の場所にあつては、交差点の直前二　交差点以外の場所で横断歩道等又は踏切がある場所にあつては、横断歩道等又は踏切の直前三　交差点以外の場所で横断歩道、自転車横断帯及び踏切がない場所にあつては、信号機の直前"]}],"section":"G01-3","fixed":true},{"id":"G01-16","subject":"学科","chapter":"G01","text":"\u003cp>白地に青の左向きの矢印の標示板がある交差点では、前方の信号が赤でも、周りの交通に注意しながら左折することができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>この標示板（左折可）があるときは、前方の信号が赤や黄であっても、歩行者など周りの交通に注意しながら左折できます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節1（4） 信号の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（4）道路の左端や信号機に、白地に青の左向きの矢印の標示板（付表２（２））のあるときは、車は、前方の信号が赤や黄であつても、歩行者など周りの交通に注意しながら左折できます。この場合、信号機の信号に従つて横断している歩行者、特定小型原動機付自転車や自転車の通行を妨げてはいけません。"]}],"section":"G01-4","fixed":true},{"id":"G01-17","subject":"学科","chapter":"G01","text":"\u003cp>左折可の標示板がある交差点で、前方の信号が赤のときに左折する場合、信号に従って横断している歩行者がいても、左折する車が優先する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>左折可の標示板によって左折するときも、信号機の信号に従って横断している歩行者、特定小型原動機付自転車や自転車の通行を妨げてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節1（4） 信号の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（4）道路の左端や信号機に、白地に青の左向きの矢印の標示板（付表２（２））のあるときは、車は、前方の信号が赤や黄であつても、歩行者など周りの交通に注意しながら左折できます。この場合、信号機の信号に従つて横断している歩行者、特定小型原動機付自転車や自転車の通行を妨げてはいけません。"]}],"section":"G01-4","fixed":true},{"id":"G01-18","subject":"学科","chapter":"G01","text":"\u003cp>「バス専用」の標示板のある信号機の信号は、標示板に示された車を対象としたものである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>「バス専用」などの標示板のある信号機の信号は、その示されている車を対象としています。このように信号が特定されているときは、その特定された信号に従います。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第2節1（3） 信号の意味","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=7","site":"警察庁の教則の全文（PDF）","lines":["（3）人の形の記号のある信号は、歩行者及び遠隔操作型小型車（遠隔操作により道路を通行しているものに限ります。以下この（３）において同じです。）と横断歩道を進行する特例特定小型原動機付自転車（第３章第３節１（３）の特例特定小型原動機付自転車をいいます。）及び普通自転車（第３章第２節３の普通自転車をいいます。）に対するものですが、特定小型原動機付自転車及びその他の自転車もその信号機に「歩行者・自転車専用」と表示されている（付表２（１））場合は、その信号機の信号に従わなければなりません。この場合の信号機の信号の意味は付表１（２）のとおりです。また、「バス専用」などの標示板（付表２（１））のある信号機の信号は、その示されている車（注１）を対象としています。このように車や歩行者及び遠隔操作型小型車に対して信号が特定されているときは、その特定された信号に従わなければなりません。"]}],"section":"G01-4","fixed":true},{"id":"G01-19","subject":"学科","chapter":"G01","text":"\u003cp>警察官が手信号で交通整理をしているとき、手信号が信号機の信号と違っていれば、信号機の信号に従わなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>警察官や交通巡視員の手信号や灯火による信号が信号機の信号と違っていても、警察官などの信号の方が優先します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第3節1 警察官などの指示に従うこと","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=8","site":"警察庁の教則の全文（PDF）","lines":["警察官や交通巡視員が手信号や灯火による信号（付表１（３））により交通整理を行つている場合は、この手信号や信号に従わなければなりません。この場合、手信号や灯火による信号が信号機の信号と違つていても、その警察官や交通巡視員の信号の方が優先します。"]},{"label":"道路交通法 第7条","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_1-At_7","lines":["（信号機の信号等に従う義務）","第七条　道路を通行する歩行者等又は車両等は、信号機の表示する信号又は警察官等の手信号等（前条第一項後段の場合においては、当該手信号等）に従わなければならない。"]}],"section":"G01-5","fixed":true},{"id":"G01-20","subject":"学科","chapter":"G01","text":"\u003cp>警察官の指示が、標識や標示で示された交通の規制と違っている場合は、警察官の指示に従う。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>警察官が行う指示が標識・標示による交通の規制と違っていても、指示の方が優先します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第1章第3節2 警察官などの指示に従うこと","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=9","site":"警察庁の教則の全文（PDF）","lines":["警察官や交通巡視員が通行の方法などについて必要な指示をすることがありますが、その場合は、警察官や交通巡視員の指示に従つて行動しなければなりません。警察官が行う指示が標識・標示によつて示された交通の規制と違つていても、指示の方が優先します。"]}],"section":"G01-5","fixed":true},{"id":"G01-21","subject":"学科","chapter":"G01","text":"\u003cp>警察官が腕を横に水平に上げているとき、その腕に平行する方向の交通は、赤色の灯火の信号と同じ意味である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>腕を横に水平に上げた状態では、腕に平行する交通は青色の灯火、腕に対面する交通は赤色の灯火の信号と同じ意味です。\u003c/p>","refs":[{"label":"道路交通法施行令 第4条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_4-Pr_1","lines":["法第六条第一項に規定する手信号の種類及び意味は、次の表に掲げるとおりとする。","手信号の種類｜手信号の意味","腕を横に水平にあげた状態（横に水平にあげた腕をおろし、引き続き身体の方向を変えないで交通整理をしている状態を含む。）｜一　横に水平にあげた腕（腕をおろした場合においては、身体の正面。以下この表において同じ。）に平行する交通については、第二条第一項の表に掲げる青色の灯火の信号の意味に同じ。二　横に水平にあげた腕に対面する交通については、第二条第一項の表に掲げる赤色の灯火の信号の意味に同じ。"]}],"section":"G01-5","fixed":true},{"id":"G01-22","subject":"学科","chapter":"G01","text":"\u003cp>警察官が腕を横に水平に上げているとき、警察官の身体の正面に対面する方向の交通は、黄色の灯火の信号と同じ意味である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>腕を横に水平に上げた状態で、腕に対面する交通（警察官の正面や背面の方向）は、赤色の灯火の信号と同じ意味です。\u003c/p>","refs":[{"label":"道路交通法施行令 第4条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_4-Pr_1","lines":["法第六条第一項に規定する手信号の種類及び意味は、次の表に掲げるとおりとする。","手信号の種類｜手信号の意味","腕を横に水平にあげた状態（横に水平にあげた腕をおろし、引き続き身体の方向を変えないで交通整理をしている状態を含む。）｜一　横に水平にあげた腕（腕をおろした場合においては、身体の正面。以下この表において同じ。）に平行する交通については、第二条第一項の表に掲げる青色の灯火の信号の意味に同じ。二　横に水平にあげた腕に対面する交通については、第二条第一項の表に掲げる赤色の灯火の信号の意味に同じ。"]}],"section":"G01-5","fixed":true},{"id":"G01-23","subject":"学科","chapter":"G01","text":"\u003cp>警察官が腕を垂直に上げているとき、それまで腕に平行していた方向の交通は、黄色の灯火の信号と同じ意味である。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>腕を垂直に上げた状態では、上げる前に腕に平行していた交通は黄色の灯火、対面していた交通は赤色の灯火の信号と同じ意味です。\u003c/p>","refs":[{"label":"道路交通法施行令 第4条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_1-At_4-Pr_1","lines":["法第六条第一項に規定する手信号の種類及び意味は、次の表に掲げるとおりとする。","手信号の種類｜手信号の意味","腕を垂直にあげた状態（横に水平にあげた腕を垂直にあげ、又は垂直にあげた腕を横に水平にあげた状態にもどすまでの間の状態を含む。）｜一　腕を垂直にあげる前の状態における水平にあげた腕に平行する交通については、第二条第一項の表に掲げる黄色の灯火の信号の意味に同じ。二
