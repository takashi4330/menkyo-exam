駐車　車両等が客待ち、荷待ち、貨物の積卸し、故障その他の理由により継続的に停止すること（貨物の積卸しのための停止で五分を超えない時間内のもの及び人の乗降のための停止を除く。）、又は車両等が停止（特定自動運行中の停止を除く。）をし、かつ、当該車両等の運転をする者（以下「運転者」という。）がその車両等を離れて直ちに運転することができない状態にあることをいう。"]}],"section":"G14-1","fixed":true},{"id":"G14-04","subject":"学科","chapter":"G14","text":"\u003cp>交差点とその側端から 5 メートル以内の場所では、駐車も停車もしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>交差点と、交差点の側端から 5 メートル以内の部分は、駐停車禁止の場所です。\u003c/p>","refs":[{"label":"道路交通法 第44条第1項第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_44-Pr_1-It_1","lines":["車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。","一　交差点、横断歩道、自転車横断帯、踏切、軌道敷内、坂の頂上付近、勾配の急な坂又はトンネル"]},{"label":"道路交通法 第44条第1項第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_44-Pr_1-It_2","lines":["車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。","二　交差点の側端又は道路の曲がり角から五メートル以内の部分"]}],"section":"G14-2","fixed":true},{"id":"G14-05","subject":"学科","chapter":"G14","text":"\u003cp>踏切とその前後の側端から 5 メートル以内の場所では、駐車も停車もしてはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>踏切の駐停車禁止の範囲は、前後の側端からそれぞれ 10 メートル以内です。5 メートル以内なのは、横断歩道や自転車横断帯です。\u003c/p>","refs":[{"label":"道路交通法 第44条第1項第6号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_44-Pr_1-It_6","lines":["車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。","六　踏切の前後の側端からそれぞれ前後に十メートル以内の部分"]}],"section":"G14-2","fixed":true},{"id":"G14-06","subject":"学科","chapter":"G14","text":"\u003cp>横断歩道とその前後の側端から 5 メートル以内の場所では、駐車も停車もしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>横断歩道や自転車横断帯と、その前後の側端からそれぞれ 5 メートル以内は、駐停車禁止の場所です。\u003c/p>","refs":[{"label":"道路交通法 第44条第1項第3号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_44-Pr_1-It_3","lines":["車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。","三　横断歩道又は自転車横断帯の前後の側端からそれぞれ前後に五メートル以内の部分"]}],"section":"G14-2","fixed":true},{"id":"G14-07","subject":"学科","chapter":"G14","text":"\u003cp>安全地帯の左側と、その前後 10 メートル以内の場所では、駐車も停車もしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>安全地帯の左側の部分と、その前後の側端からそれぞれ 10 メートル以内は、駐停車禁止の場所です。\u003c/p>","refs":[{"label":"道路交通法 第44条第1項第4号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_44-Pr_1-It_4","lines":["車両は、道路標識等により停車及び駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。","四　安全地帯が設けられている道路の当該安全地帯の左側の部分及び当該部分の前後の側端からそれぞれ前後に十メートル以内の部分"]}],"section":"G14-2","fixed":true},{"id":"G14-08","subject":"学科","chapter":"G14","text":"\u003cp>バスの停留所の標示板から 10 メートル以内の場所は、バスの運行時間外であっても、駐車も停車もしてはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>バスや路面電車の停留所の標示板（標示柱）から 10 メートル以内の駐停車禁止は、運行時間中に限ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節2（2） 駐車、停車の禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=58","site":"警察庁の教則の全文（PDF）","lines":["（2）次の場所では、駐車も停車もしてはいけません。ただし、赤信号や危険防止のために一時停止する場合などは別です。","ア「駐停車禁止」の標識（付表３（１）17）や標示（付表３（２）４）のある場所","イ軌道敷内","ウ坂の頂上付近やこう配の急な坂","エトンネル","オ交差点とその端から５メートル以内の場所","カ道路の曲がり角から５メートル以内の場所","キ横断歩道、自転車横断帯とその端から前後に５メートル以内の場所","ク踏切とその端から前後10メートル以内の場所","ケ安全地帯の左側とその前後10メートル以内の場所","コバス、路面電車の停留所の標示板（標示柱）から10メートル以内の場所（運行時間中に限ります。）"]}],"section":"G14-2","fixed":true},{"id":"G14-09","subject":"学科","chapter":"G14","text":"\u003cp>火災報知機から 3 メートル以内の場所では、駐車してはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>火災報知機の駐車禁止の範囲は、1 メートル以内です。3 メートル以内なのは、駐車場や車庫などの自動車用の出入口です。\u003c/p>","refs":[{"label":"道路交通法 第45条第1項第5号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_45-Pr_1-It_5","lines":["車両は、道路標識等により駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、駐車してはならない。ただし、公安委員会の定めるところにより警察署長の許可を受けたときは、この限りでない。","五　火災報知機から一メートル以内の部分"]}],"section":"G14-3","fixed":true},{"id":"G14-10","subject":"学科","chapter":"G14","text":"\u003cp>駐車場や車庫などの自動車用の出入口から 3 メートル以内の場所では、駐車してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路外の施設の、道路に接する自動車用の出入口から 3 メートル以内の部分は、駐車禁止の場所です。\u003c/p>","refs":[{"label":"道路交通法 第45条第1項第1号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_45-Pr_1-It_1","lines":["車両は、道路標識等により駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、駐車してはならない。ただし、公安委員会の定めるところにより警察署長の許可を受けたときは、この限りでない。","一　人の乗降、貨物の積卸し、駐車又は自動車の格納若しくは修理のため道路外に設けられた施設又は場所の道路に接する自動車用の出入口から三メートル以内の部分"]}],"section":"G14-3","fixed":true},{"id":"G14-11","subject":"学科","chapter":"G14","text":"\u003cp>消火栓から 5 メートル以内の場所では、駐車だけでなく、停車も禁止されている。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>消火栓から 5 メートル以内は駐車禁止の場所で、停車は禁止されていません。\u003c/p>","refs":[{"label":"道路交通法 第45条第1項第4号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_45-Pr_1-It_4","lines":["車両は、道路標識等により駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、駐車してはならない。ただし、公安委員会の定めるところにより警察署長の許可を受けたときは、この限りでない。","四　消火栓、指定消防水利の標識が設けられている位置又は消防用防火水槽の吸水口若しくは吸管投入孔から五メートル以内の部分"]}],"section":"G14-3","fixed":true},{"id":"G14-12","subject":"学科","chapter":"G14","text":"\u003cp>道路工事の区域の端から 5 メートル以内の場所では、駐車も停車もしてはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>道路工事の区域の側端から 5 メートル以内は駐車禁止の場所で、停車は禁止されていません。\u003c/p>","refs":[{"label":"道路交通法 第45条第1項第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_45-Pr_1-It_2","lines":["車両は、道路標識等により駐車が禁止されている道路の部分及び次に掲げるその他の道路の部分においては、駐車してはならない。ただし、公安委員会の定めるところにより警察署長の許可を受けたときは、この限りでない。","二　道路工事が行なわれている場合における当該工事区域の側端から五メートル以内の部分"]}],"section":"G14-3","fixed":true},{"id":"G14-13","subject":"学科","chapter":"G14","text":"\u003cp>駐車したとき、車の右側の道路上に 3.5 メートル以上の余地がなくなる場所では、原則として駐車してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>駐車する場合に、車の右側の道路上に 3.5 メートル（標識で指定されていればその距離）以上の余地がないこととなる場所では、駐車してはいけません。\u003c/p>","refs":[{"label":"道路交通法 第45条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_9-At_45-Pr_2","lines":["車両は、第四十七条第二項又は第三項の規定により駐車する場合に当該車両の右側の道路上に三・五メートル（道路標識等により距離が指定されているときは、その距離）以上の余地がないこととなる場所においては、駐車してはならない。ただし、貨物の積卸しを行なう場合で運転者がその車両を離れないとき、若しくは運転者がその車両を離れたが直ちに運転に従事することができる状態にあるとき、又は傷病者の救護のためやむを得ないときは、この限りでない。"]}],"section":"G14-3","fixed":true},{"id":"G14-14","subject":"学科","chapter":"G14","text":"\u003cp>荷物の積卸しのために駐車し、運転者がすぐに運転できる状態にあるときでも、右側に 3.5 メートル以上の余地がなければ駐車してはいけない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>荷物の積卸しで運転者がすぐに運転できるときや、傷病者の救護のためやむを得ないときは、余地がなくても駐車できます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節2（4） 駐車、停車の禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=58","site":"警察庁の教則の全文（PDF）","lines":["（4）駐車した場合、車の右側の道路上に３.５メートル以上の余地がなくなる場所では駐車してはいけません。また、標識（付表３（１）19）により余地が指定されているときには、その余地がとれない場所では駐車してはいけません。しかし、荷物の積卸しで運転者がすぐ運転できるときや傷病者の救護のためやむを得ないときは、駐車できます。"]}],"section":"G14-3","fixed":true},{"id":"G14-15","subject":"学科","chapter":"G14","text":"\u003cp>歩道や路側帯のない道路で駐車や停車をするときは、道路の左端に沿う。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>歩道や路側帯のない道路では、道路の左端に沿って駐停車します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節3（1） 駐車、停車の方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=59","site":"警察庁の教則の全文（PDF）","lines":["（1）歩道や路側帯のない道路では、道路の左端に沿うこと。"]}],"section":"G14-4","fixed":true},{"id":"G14-16","subject":"学科","chapter":"G14","text":"\u003cp>幅の広い路側帯に入って駐車するときは、車の左側に 0.75 メートル以上の余地を空けなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>路側帯の幅が広い場合には路側帯に入れますが、0.75 メートル以上の余地を空けておかなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節3（3） 駐車、停車の方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=59","site":"警察庁の教則の全文（PDF）","lines":["（3）路側帯の幅が広い場合には、路側帯に入れますが、このときは０.75メートル以上の余地を空けておかなければなりません。ただし、路側帯の幅が広い場合でも、白の実線と破線の標示（付表３（２）10）や、白の２本線の標示（付表３（２）11）のあるところでは、路側帯に入れません。"]}],"section":"G14-4","fixed":true},{"id":"G14-17","subject":"学科","chapter":"G14","text":"\u003cp>白の実線と破線で示された路側帯でも、幅が広ければ、中に入って駐車してよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>路側帯の幅が広い場合でも、白の実線と破線の標示や、白の 2 本線の標示のあるところでは、路側帯に入れません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節3（3） 駐車、停車の方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=59","site":"警察庁の教則の全文（PDF）","lines":["（3）路側帯の幅が広い場合には、路側帯に入れますが、このときは０.75メートル以上の余地を空けておかなければなりません。ただし、路側帯の幅が広い場合でも、白の実線と破線の標示（付表３（２）10）や、白の２本線の標示（付表３（２）11）のあるところでは、路側帯に入れません。"]}],"section":"G14-4","fixed":true},{"id":"G14-18","subject":"学科","chapter":"G14","text":"\u003cp>道路に平行して駐車している車と並んで、駐車や停車をしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路に平行して駐停車している車と並んで駐停車してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節3（5） 駐車、停車の方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=59","site":"警察庁の教則の全文（PDF）","lines":["（5）道路に平行して駐停車している車と並んで駐停車しないこと。"]}],"section":"G14-4","fixed":true},{"id":"G14-19","subject":"学科","chapter":"G14","text":"\u003cp>パーキング・チケット発給設備のある時間制限駐車区間では、発給を受けたチケットを車内に置いておけば、掲示しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>パーキング・チケットは、駐車している間、車の前面の見やすい場所（フロントガラスの内側）に、前方から見やすいように掲示します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節4（2） 時間制限駐車区間での駐車","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=60","site":"警察庁の教則の全文（PDF）","lines":["（2）パーキング・チケット発給設備が在る時間制限駐車区間で駐車するときは、パーキング・チケット発給設備からパーキング・チケットの発給を直ちに受け、駐車している間、これを車の前面の見やすい場所（フロントガラスのある車では、その内側）に前方から見やすいように掲示すること。"]}],"section":"G14-5","fixed":true},{"id":"G14-20","subject":"学科","chapter":"G14","text":"\u003cp>時間制限駐車区間では、標識で示されている時間を超えて駐車してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>パーキング・メーターが車を感知した時、又はチケットの発給を受けた時から、標識で表示されている時間を超えて駐車してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節4（3） 時間制限駐車区間での駐車","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=60","site":"警察庁の教則の全文（PDF）","lines":["（3）時間制限駐車区間では、パーキング・メーターが車を感知した時又はパーキング・チケットの発給を受けた時から、標識（付表３（１）20）によつて表示されている時間を超えて駐車しないこと。"]}],"section":"G14-5","fixed":true},{"id":"G14-21","subject":"学科","chapter":"G14","text":"\u003cp>違法に駐車している車の運転者は、警察官や交通巡視員から移動を命じられたときは、直ちに車を移動しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>違法に駐車している車の運転者などは、現場で警察官や交通巡視員から移動を命じられたときは、直ちにその車を移動しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節6（1） 車の移動など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=61","site":"警察庁の教則の全文（PDF）","lines":["（1）違法に駐車している車の運転者やその車の管理について責任がある者は、現場で警察官や交通巡視員からその車を移動するように命じられたときは、直ちにその車を移動しなければなりません。"]}],"section":"G14-5","fixed":true},{"id":"G14-22","subject":"学科","chapter":"G14","text":"\u003cp>放置車両確認標章を取り付けられた車の運転者は、運転するときに、その標章を取り除くことができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>放置車両確認標章を取り付けられた車の使用者、運転者などは、これを取り除くことができます。運転するときは、交通事故防止のため取り除きます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節7（3） 放置車両確認標章","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=61","site":"警察庁の教則の全文（PDF）","lines":["（3）放置車両確認標章を取り付けられた車の使用者、運転者やその車の管理について責任がある者は、これを取り除くことができます。運転するときは、交通事故防止のため、放置車両確認標章を取り除きましょう。（平18公安告４・追加、平20公安告９・一部改正、平21公安告29・旧６繰下・一部改正、令２公安告48・令４公安告53・一部改正）"]}],"section":"G14-5","fixed":true},{"id":"G14-23","subject":"学科","chapter":"G14","text":"\u003cp>自動車の保管場所は、使用の本拠の位置から 5 キロメートル以内の、道路以外の場所に確保しなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>保管場所は、使用の本拠の位置から 2 キロメートル以内の、道路以外の場所に確保しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節9（1） 自動車の保管場所","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=62","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車の保有者は、住所など自動車の使用の本拠の位置から２キロメートル以内の、道路以外の場所に保管場所を確保しなければなりません。"]}],"section":"G14-6","fixed":true},{"id":"G14-24","subject":"学科","chapter":"G14","text":"\u003cp>道路上の同じ場所に、引き続き 12 時間（夜間は 8 時間）以上駐車してはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路を車庫代わりに使用してはいけません。道路上の同じ場所に引き続き 12 時間（夜間は 8 時間）以上駐車してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節9（2） 自動車の保管場所","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=62","site":"警察庁の教則の全文（PDF）","lines":["（2）道路を車庫がわりに使用してはいけません。道路上に駐車する場合、同じ場所に引き続き12時間（夜間は８時間）以上駐車してはいけません（特定の村の区域内の道路を除きます。）。"]}],"section":"G14-6","fixed":true},{"id":"G14-25","subject":"学科","chapter":"G14","text":"\u003cp>オートマチック車から離れるときは、エンジンを止め、ハンドブレーキを掛けて、チェンジレバーを N に入れておく。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>車から離れるときは、エンジンを止め、ハンドブレーキを掛け、オートマチック車ではチェンジレバーを P に入れておきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節10（1） 車から離れるときの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=62","site":"警察庁の教則の全文（PDF）","lines":["（1）危険防止のための措置車から離れるときは、車が暴走しないように次の措置を執らなければなりません。","アエンジンを止め、ハンドブレーキを掛けること。","イギアは、平地や下り坂ではバック、上り坂ではローに入れておくこと。オートマチック車では、チェンジレバーをPに入れておくこと。","ウ坂道では、輪止めをすること。"]}],"section":"G14-6","fixed":true},{"id":"G14-26","subject":"学科","chapter":"G14","text":"\u003cp>マニュアル車を下り坂に止めて車から離れるときは、ギアをローに入れておく。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ギアは、平地や下り坂ではバック、上り坂ではローに入れておきます。坂道では輪止めもします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節10（1） 車から離れるときの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=62","site":"警察庁の教則の全文（PDF）","lines":["（1）危険防止のための措置車から離れるときは、車が暴走しないように次の措置を執らなければなりません。","アエンジンを止め、ハンドブレーキを掛けること。","イギアは、平地や下り坂ではバック、上り坂ではローに入れておくこと。オートマチック車では、チェンジレバーをPに入れておくこと。","ウ坂道では、輪止めをすること。"]}],"section":"G14-6","fixed":true},{"id":"G14-27","subject":"学科","chapter":"G14","text":"\u003cp>車から離れるときは、短い時間であっても、エンジンを止めてキーを携帯し、窓を閉めてドアをロックする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>盗難防止のため、車から離れるときは、エンジンを止めてキーを携帯し、窓を確実に閉めてドアをロックします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節10（2） 車から離れるときの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=62","site":"警察庁の教則の全文（PDF）","lines":["（2）盗難防止のための措置盗難車が犯罪に使用される例が多くみられます。そのような犯罪を防止するためにも、車から離れるときは、車を盗まれないように次の措置を執らなければなりません。","アエンジンを止め、エンジンキーを携帯すること。","イ窓を確実に閉めドアをロックすること。","ウハンドルの施錠装置など盗難防止装置があるときは、それを作動させること。","エ貴重品などを持ち出さない場合は、トランクに入れて施錠すること。"]}],"section":"G14-6","fixed":true},{"id":"G14-28","subject":"学科","chapter":"G14","text":"\u003cp>専用場所駐車標章の交付を受けられる人には、妊娠中か出産後 8 週間以内の運転者が含まれる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>専用場所駐車標章は、70 歳以上の高齢運転者、聴覚障害や肢体不自由で免許に条件を付されている運転者、妊娠中又は出産後 8 週間以内の運転者が交付を受けられます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第5章第8節5（3） 高齢運転者等専用場所等での駐車、停車","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=60","site":"警察庁の教則の全文（PDF）","lines":["（3）専用場所駐車標章は、普通自動車を運転することができる免許を受けた者で次に当たるものに限り、公安委員会に申請して、交付を受けることができます。","ア70歳以上の高齢運転者","イ両耳の聴力が補聴器を用いても10メートルの距離で90デシベルの警音器の音が聞こえない程度の聴覚障害のあることを理由に免許に条件を付されている運転者","ウ肢体不自由であることを理由に免許に条件を付されている運転者","エ妊娠中又は出産後８週間以内の運転者"]}],"section":"G14-5","fixed":true},{"id":"G15-01","subject":"学科","chapter":"G15","text":"\u003cp>夜間は速度感が鈍り、速度超過になりがちなので、昼間より速度を落として慎重に運転する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>夜間は視界が悪く、速度感が鈍り、速度超過になりがちです。昼間より速度を落として慎重に運転します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節1（1） 夜間の走行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67","site":"警察庁の教則の全文（PDF）","lines":["（1）夜間は視界が悪くなるため、歩行者、特定小型原動機付自転車や自転車などの発見が遅れます。また、速度感が鈍り、速度超過になりがちです。その上、夜間は、過労運転や酒酔い運転をする者や、酔つて歩く者などがいたりするので、昼間より速度を落として慎重に運転しましよう。少しでも危ないと感じたときは、まず速度を落とすことが大切です。"]}],"section":"G15-1","fixed":true},{"id":"G15-02","subject":"学科","chapter":"G15","text":"\u003cp>夜間は、自分の車と対向車のライトで、道路の中央付近にいる歩行者が見えなくなることがある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>走行中には、自分の車と対向車のライトで、道路の中央付近の歩行者が見えなくなることがあるので、十分注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節1（2） 夜間の走行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67","site":"警察庁の教則の全文（PDF）","lines":["（2）走行中には、自分の車と対向車のライトで、道路の中央付近の歩行者が見えなくなることがあるので、十分注意しましよう。"]}],"section":"G15-1","fixed":true},{"id":"G15-03","subject":"学科","chapter":"G15","text":"\u003cp>夜間に運転するときは、視線をできるだけ車のすぐ前の路面に向けて走る。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>視線は、できるだけ先の方へ向け、少しでも早く前方の障害物を発見するようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節1（3） 夜間の走行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67","site":"警察庁の教則の全文（PDF）","lines":["（3）視線は、できるだけ先の方へ向け、少しでも早く前方の障害物を発見するようにしましよう。"]}],"section":"G15-1","fixed":true},{"id":"G15-04","subject":"学科","chapter":"G15","text":"\u003cp>薄暮時は事故が多く発生するので、早めにライトをつけて、自分の車の存在を知らせる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>薄暮時には事故が多く発生するので、早めにライトを点灯し、自分の車の存在を知らせます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節1（6） 夜間の走行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=67","site":"警察庁の教則の全文（PDF）","lines":["（6）薄暮時には事故が多く発生しますので、早めにライトを点灯し、自分の車の存在を知らせるようにしましよう。"]}],"section":"G15-1","fixed":true},{"id":"G15-05","subject":"学科","chapter":"G15","text":"\u003cp>灯火をつけなければならない「夜間」とは、日没時から日出時までの時間をいう。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>夜間とは、日没時から日出時までの時間です。夜間、道路にあるときは、前照灯、車幅灯、尾灯などをつけなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第52条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_52-Pr_1","lines":["車両等は、夜間（日没時から日出時までの時間をいう。以下この条及び第六十三条の九第二項において同じ。）、道路にあるときは、政令で定めるところにより、前照灯、車幅灯、尾灯その他の灯火をつけなければならない。政令で定める場合においては、夜間以外の時間にあつても、同様とする。"]}],"section":"G15-2","fixed":true},{"id":"G15-06","subject":"学科","chapter":"G15","text":"\u003cp>昼間でも、トンネルの中などで視界が 50 メートル以下の一般道路を通るときは、前照灯などの灯火をつけなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>トンネルの中、濃霧がかかっている場所などで、視界が一般道路で 50 メートル（高速道路などで 200 メートル）以下のときは、昼間でも灯火をつけます。\u003c/p>","refs":[{"label":"道路交通法施行令 第19条","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_19","lines":["（夜間以外の時間で灯火をつけなければならない場合）","第十九条　法第五十二条第一項後段の政令で定める場合は、トンネルの中、濃霧がかかつている場所その他の場所で、視界が高速自動車国道及び自動車専用道路においては二百メートル、その他の道路においては五十メートル以下であるような暗い場所を通行する場合及び当該場所に停車し、又は駐車している場合とする。"]}],"section":"G15-2","fixed":true},{"id":"G15-07","subject":"学科","chapter":"G15","text":"\u003cp>高速道路では、昼間に霧で視界が 100 メートル以下になったときから、灯火をつければよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>高速自動車国道と自動車専用道路では、視界が 200 メートル以下のときは、昼間でも灯火をつけなければなりません。\u003c/p>","refs":[{"label":"道路交通法施行令 第19条","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_3-At_19","lines":["（夜間以外の時間で灯火をつけなければならない場合）","第十九条　法第五十二条第一項後段の政令で定める場合は、トンネルの中、濃霧がかかつている場所その他の場所で、視界が高速自動車国道及び自動車専用道路においては二百メートル、その他の道路においては五十メートル以下であるような暗い場所を通行する場合及び当該場所に停車し、又は駐車している場合とする。"]}],"section":"G15-2","fixed":true},{"id":"G15-08","subject":"学科","chapter":"G15","text":"\u003cp>夜間、交通量の多い市街地などを除き、前照灯を上向きにして、歩行者などを早く見つけるようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>前照灯は、交通量の多い市街地などを通行しているときを除き、上向きにして、歩行者などを少しでも早く発見するようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節2（2） 灯火","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（2）前照灯は、交通量の多い市街地などを通行しているときを除き、上向きにして、歩行者などを少しでも早く発見するようにしましよう。ただし、対向車と行き違うときや、ほかの車の直後を通行しているときは、前照灯を減光するか、下向きに切り替えなければなりません。"]}],"section":"G15-2","fixed":true},{"id":"G15-09","subject":"学科","chapter":"G15","text":"\u003cp>夜間、対向車と行き違うときも、歩行者を早く見つけるため、前照灯は上向きのままにしておく。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>対向車と行き違うときや、ほかの車の直後を通行しているときは、前照灯を減光するか、下向きに切り替えなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節2（2） 灯火","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（2）前照灯は、交通量の多い市街地などを通行しているときを除き、上向きにして、歩行者などを少しでも早く発見するようにしましよう。ただし、対向車と行き違うときや、ほかの車の直後を通行しているときは、前照灯を減光するか、下向きに切り替えなければなりません。"]},{"label":"道路交通法 第52条第2項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_3-Se_10-At_52-Pr_2","lines":["車両等が、夜間（前項後段の場合を含む。）、他の車両等と行き違う場合又は他の車両等の直後を進行する場合において、他の車両等の交通を妨げるおそれがあるときは、車両等の運転者は、政令で定めるところにより、灯火を消し、灯火の光度を減ずる等灯火を操作しなければならない。"]}],"section":"G15-2","fixed":true},{"id":"G15-10","subject":"学科","chapter":"G15","text":"\u003cp>対向車のライトがまぶしいときは、視点をやや右前方に移して、目がくらまないようにする。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>対向車のライトがまぶしいときは、視点をやや左前方に移して、目がくらまないようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節2（3） 灯火","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（3）交通量の多い市街地の道路などでは、前照灯を下向きに切り替えて運転しましよう。また、対向車のライトがまぶしいときは、視点をやや左前方に移して、目がくらまないようにしましよう。"]}],"section":"G15-2","fixed":true},{"id":"G15-11","subject":"学科","chapter":"G15","text":"\u003cp>夜間、見通しの悪い交差点やカーブの手前では、前照灯を上向きにするか点滅させて、ほかの車や歩行者に接近を知らせる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>見通しの悪い交差点やカーブなどの手前では、前照灯を上向きにするか点滅させて、交差点への接近を知らせます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節2（4） 灯火","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（4）見通しの悪い交差点やカーブなどの手前では、前照灯を上向きにするか点滅させて、ほかの車や歩行者に交差点への接近を知らせましよう。"]}],"section":"G15-2","fixed":true},{"id":"G15-12","subject":"学科","chapter":"G15","text":"\u003cp>夜間、道路照明によって 50 メートル後方から見える場所に駐車するときでも、必ず駐車灯などをつけなければならない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>夜間に駐停車するときは非常点滅表示灯、駐車灯又は尾灯をつけますが、道路照明などにより 50 メートル後方から見える場所や、停止表示器材を置いて駐停車しているときは別です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第3節2（6） 灯火","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（6）夜間、道路に駐停車するときは、非常点滅表示灯、駐車灯又は尾灯をつけなければなりません。昼間でも、トンネルの中や濃い霧の中などで50メートル先が見えないような場所に駐停車するときも同じです。しかし、道路照明などにより、50メートル後方から見える場所に駐停車しているときや、停止表示器材を置いて駐停車しているときは別です。夜間、高速道路でやむを得ず駐停車する場合には、非常点滅表示灯、駐車灯又は尾灯をつけるほか、停止表示器材を置かなければなりません。"]}],"section":"G15-2","fixed":true},{"id":"G15-13","subject":"学科","chapter":"G15","text":"\u003cp>雨の降り始めの舗装道路は、スリップしやすいので注意する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>雨の降り始めの舗装道路はスリップしやすいので気を付けます。工事現場の鉄板や路面電車のレールなども滑りやすく危険です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第4節1（4） 雨の日の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（4）雨の降り始めの舗装道路はスリップしやすいので気を付けましよう。また、工事現場の鉄板、路面電車のレールなども滑りやすいので危険です。"]}],"section":"G15-3","fixed":true},{"id":"G15-14","subject":"学科","chapter":"G15","text":"\u003cp>雨の日の山道では、地盤が固まって安定するので、路肩に寄って走るのが安全である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>雨の日は地盤が緩んでいることがあるので、山道などでは路肩に寄り過ぎないようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第4節1（3） 雨の日の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（3）地盤が緩んでいることがあるので、山道などでは路肩に寄り過ぎないようにしましよう。"]}],"section":"G15-3","fixed":true},{"id":"G15-15","subject":"学科","chapter":"G15","text":"\u003cp>深い水たまりを通ると、ブレーキが効かなくなったり、効きが悪くなったりすることがある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>深い水たまりを通ると、ブレーキドラムに水が入るため、ブレーキが効かなくなったり、効きが悪くなったりすることがあるので、避けて通ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第4節1（6） 雨の日の運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=68","site":"警察庁の教則の全文（PDF）","lines":["（6）深い水たまりを通ると、ブレーキドラムに水が入るため、ブレーキが効かなくなつたり、効きが悪くなつたりすることがあるので、避けて通りましよう。"]}],"section":"G15-3","fixed":true},{"id":"G15-16","subject":"学科","chapter":"G15","text":"\u003cp>雪道では、できるだけ車の通った跡を選んで走る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>雪道では、できるだけ車の通った跡を選んで走るようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第4節2（3） 雪道などの運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=69","site":"警察庁の教則の全文（PDF）","lines":["（3）できるだけ車の通つた跡を選んで走るようにしましよう。"]}],"section":"G15-3","fixed":true},{"id":"G15-17","subject":"学科","chapter":"G15","text":"\u003cp>タイヤチェーンを着けていない車の通行が標識で禁止されている道路でも、スタッドレスタイヤを着けていれば通行できる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>標識によってタイヤチェーンを着けていない車の通行が禁止されている道路では、タイヤにタイヤチェーンを着けないで通行してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第4節2（1） 雪道などの運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=69","site":"警察庁の教則の全文（PDF）","lines":["（1）雪道や凍り付いた道は大変滑りやすく危険です。タイヤにタイヤチェーンなどの滑り止め装置を着けるか、スノータイヤ、スタッドレスタイヤなどの雪路用タイヤを着けましよう。ただし、標識（付表３（１）11の２）によつてタイヤチェーンを着けていない車の通行が禁止されている道路では、タイヤにタイヤチェーンを着けないで通行してはいけません。"]}],"section":"G15-3","fixed":true},{"id":"G15-18","subject":"学科","chapter":"G15","text":"\u003cp>霧のときは、霧灯があれば霧灯を、なければ前照灯を早めにつけ、中央線や前の車の尾灯を目安にして、速度を落として走る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>霧灯のあるときは霧灯を、ないときは前照灯を早めにつけ、中心線やガードレールや前の車の尾灯を目安にし、速度を落として運転します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第4節3（1） 霧などのときの運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=69","site":"警察庁の教則の全文（PDF）","lines":["（1）霧や吹雪などは、視界を極めて狭くします。霧灯（淡黄色などの補助前照灯）のあるときは霧灯を、ないときは前照灯を早めにつけましよう。中心線やガードレールや前の車の尾灯を目安にし、速度を落として運転しましよう。"]}],"section":"G15-3","fixed":true},{"id":"G15-19","subject":"学科","chapter":"G15","text":"\u003cp>オートマチック車が踏切内でエンストしたときは、ギアをローに入れ、セルモーターを使って車を動かす。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>ギアをローかセコンドに入れ、セルモーターで車を動かす方法は、オートマチック車やクラッチペダルを踏まないとエンジンが始動しない車には使えません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（1） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（1）踏切や交差点の中でエンストしたときは、気が焦れば焦るほどエンジンが掛からないものです。このようなときは、非常手段としてギアをローかセコンドに入れ、セルモーター（始動電動機）を使つて車を動かすこともできます。（ただし、オートマチック車やクラッチペダルを踏まないとエンジンが始動しない装置を備えている車には、この方法は使えません。）"]}],"section":"G15-4","fixed":true},{"id":"G15-20","subject":"学科","chapter":"G15","text":"\u003cp>走行中にエンジンの回転数が上がったまま下がらなくなったときは、走りながら直ちにエンジンスイッチを切る。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>四輪車では、ギアをニュートラルにして車輪にエンジンの力を掛けないようにしながら路肩など安全な場所に行き、停止した後にエンジンスイッチを切ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（3） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（3）走行中にエンジンの回転数が上がつた後、故障等により、下がらなくなつたときは、四輪車の場合はギアをニュートラルにして車輪にエンジンの力を掛けないようにしながら路肩など安全な場所に行き、そこで停止した後にエンジンスイッチを切ること、二輪車の場合は点火スイッチを切つてエンジンの回転を止めることが大切です。"]}],"section":"G15-4","fixed":true},{"id":"G15-21","subject":"学科","chapter":"G15","text":"\u003cp>走行中にタイヤがパンクしたときは、急ブレーキを掛けて、できるだけ早く車を止める。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>パンクしたときは、ハンドルをしっかり握り、車の方向を直すことに全力を傾けます。急ブレーキを避け、断続的にブレーキを踏んで止めます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（4） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（4）走行中にタイヤがパンクしたときは、ハンドルをしつかりと握り、車の方向を直すことに全力を傾けます。急ブレーキを避け、断続的にブレーキを踏んで止めます。"]}],"section":"G15-4","fixed":true},{"id":"G15-22","subject":"学科","chapter":"G15","text":"\u003cp>後輪が右に横滑りを始めたときは、アクセルを緩め、ハンドルを右に切って車の向きを立て直す。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>後輪が横滑りを始めたときは、ブレーキを掛けず、アクセルを緩め、同時にハンドルで車の向きを立て直します。後輪が右に滑ったときは、車は左に向くので、ハンドルを右に切ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（5） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（5）後輪の横滑りは、スピードの出し過ぎ、急ハンドル又は急加速が原因で生じます。後輪が横滑りを始めたときは、ブレーキを掛けてはいけません。まずアクセルを緩め、同時にハンドルで車の向きを立て直すようにします。この場合、後輪が右（左）に滑つたときは、車は左（右）に向くので、ハンドルを右（左）に切ります。"]}],"section":"G15-4","fixed":true},{"id":"G15-23","subject":"学科","chapter":"G15","text":"\u003cp>後輪が横滑りを始めたときは、すぐに強くブレーキを掛けて止める。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>後輪が横滑りを始めたときは、ブレーキを掛けてはいけません。まずアクセルを緩め、ハンドルで向きを立て直します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（5） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（5）後輪の横滑りは、スピードの出し過ぎ、急ハンドル又は急加速が原因で生じます。後輪が横滑りを始めたときは、ブレーキを掛けてはいけません。まずアクセルを緩め、同時にハンドルで車の向きを立て直すようにします。この場合、後輪が右（左）に滑つたときは、車は左（右）に向くので、ハンドルを右（左）に切ります。"]}],"section":"G15-4","fixed":true},{"id":"G15-24","subject":"学科","chapter":"G15","text":"\u003cp>下り坂でブレーキが効かなくなったときは、手早く減速チェンジをして、ハンドブレーキを引く。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>下り坂などでブレーキが効かなくなったときは、手早く減速チェンジをし、ハンドブレーキを引きます。それでも止まらないときは、山側の溝に車輪を落とすなどして止めます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（6） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（6）下り坂などでブレーキが効かなくなつたときは、手早く減速チェンジをし、ハンドブレーキを引きます。それでも停止しないようなときは、山側のみぞに車輪を落としたり、ガードレールに車体をすり寄せたり、道路わきの砂利などに突つ込んだりして止めます。"]}],"section":"G15-4","fixed":true},{"id":"G15-25","subject":"学科","chapter":"G15","text":"\u003cp>対向車と正面衝突しそうになったときは、警音器とブレーキを同時に使い、できる限り左側によける。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>正面衝突のおそれが生じたときは、警音器とブレーキを同時に使い、できる限り左側によけます。道路外が危険な場所でないときは、道路外に出ることをためらってはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第6章第5節（7） 緊急時の措置","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=70","site":"警察庁の教則の全文（PDF）","lines":["（7）対向車と正面衝突のおそれが生じたときは、警音器とブレーキを同時に使い、できる限り左側によけます。衝突の寸前まであきらめないで、少しでもブレーキとハンドルでかわすようにします。もし道路外が危険な場所でないときは、道路外に出ることをためらつてはいけません。"]}],"section":"G15-4","fixed":true},{"id":"G16-01","subject":"学科","chapter":"G16","text":"\u003cp>高速道路とは、高速自動車国道と自動車専用道路をいう。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>高速道路とは、高速自動車国道と自動車専用道路をいいます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章 高速道路での走行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=71","site":"警察庁の教則の全文（PDF）","lines":["高速道路とは、高速自動車国道と自動車専用道路をいいます。高速道路では、ミニカー、小型二輪車（注10）、一般原動機付自転車は通行できません。また、農耕用作業車のように構造上時速50キロメートル以上の速度の出ない自動車やほかの車を牽引しているため時速50キロメートル以上の速度で走ることのできない自動車も、高速自動車国道を通行することはできません。"]}],"section":"G16-1","fixed":true},{"id":"G16-02","subject":"学科","chapter":"G16","text":"\u003cp>一般原動機付自転車は、左端を走るのであれば、高速道路を通行することができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>高速道路では、ミニカー、小型二輪車、一般原動機付自転車は通行できません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章 高速道路での走行","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=71","site":"警察庁の教則の全文（PDF）","lines":["高速道路とは、高速自動車国道と自動車専用道路をいいます。高速道路では、ミニカー、小型二輪車（注10）、一般原動機付自転車は通行できません。また、農耕用作業車のように構造上時速50キロメートル以上の速度の出ない自動車やほかの車を牽引しているため時速50キロメートル以上の速度で走ることのできない自動車も、高速自動車国道を通行することはできません。"]}],"section":"G16-1","fixed":true},{"id":"G16-03","subject":"学科","chapter":"G16","text":"\u003cp>高速道路を走るときは、タイヤの空気圧をやや低めにしておく。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>高速道路を走行するときは、タイヤの空気圧をやや高めにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第1節（1） 高速道路に入る前の心得","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=71","site":"警察庁の教則の全文（PDF）","lines":["（1）車を点検すること高速道路を通行する場合は、特に次の点検をしなければなりません。高速道路で、燃料、冷却水、エンジンオイルの不足により、停止することのないようにしなければなりません。","ア燃料の量が十分であるか。","イ冷却水の量が規定の範囲内にあるか。","ウラジエータキャップが確実に締まつているか。","エエンジンオイルの量が適当であるか。","オファンベルトの張り具合が適当であるか、また、損傷がないか。","カタイヤの空気圧が適当であるか（高速道路を走行するときは、空気圧をやや高めにする。）。","キタイヤの溝の深さが十分であるか。"]}],"section":"G16-1","fixed":true},{"id":"G16-04","subject":"学科","chapter":"G16","text":"\u003cp>高速道路を通行するときは、あらかじめ、燃料、冷却水、エンジンオイルの量や、荷物の積載の状態を点検しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>高速自動車国道等で運転しようとするときは、あらかじめ、燃料、冷却水、原動機のオイルの量、貨物の積載の状態を点検します。\u003c/p>","refs":[{"label":"道路交通法 第75条の10","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4_2-Se_3-At_75_10","lines":["（自動車の運転者の遵守事項）","第七十五条の十　自動車の運転者は、高速自動車国道等において自動車を運転しようとするときは、あらかじめ、燃料、冷却水若しくは原動機のオイルの量又は貨物の積載の状態を点検し、必要がある場合においては、高速自動車国道等において燃料、冷却水若しくは原動機のオイルの量の不足のため当該自動車を運転することができなくなること又は積載している物を転落させ、若しくは飛散させることを防止するための措置を講じなければならない。"]},{"label":"交通の方法に関する教則 第7章第1節（2） 高速道路に入る前の心得","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=71","site":"警察庁の教則の全文（PDF）","lines":["（2）積荷の状態を調べること高速で走行すると、荷物が転落、飛散しやすくなるので、高速道路を通行するときは、前もつて、荷物が転落、飛散しないように点検し、荷物を積み直すなど必要な措置を採らなければなりません。"]}],"section":"G16-1","fixed":true},{"id":"G16-05","subject":"学科","chapter":"G16","text":"\u003cp>高速道路に入る前に、故障などで停止したときに使う停止表示器材を用意しておく。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>高速道路上で故障などによって停止するときは停止表示器材を置かなければならないので、前もって準備しておきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第1節（3） 高速道路に入る前の心得","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=71","site":"警察庁の教則の全文（PDF）","lines":["（3）停止表示器材を用意すること高速道路上で故障などによつて停止するときは、停止していることを表示する停止表示器材を置かなければなりませんので、前もつて準備しておきましよう。停止表示器材は、努めてTSマークの付いたものを使いましよう。"]}],"section":"G16-1","fixed":true},{"id":"G16-06","subject":"学科","chapter":"G16","text":"\u003cp>本線車道に入ろうとするとき、加速車線があるときは、加速車線を通行して十分加速しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>本線車道へ入ろうとする場合で、加速車線があるときは、加速車線を通行して、十分加速しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節1（1） 本線車道へ入るときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=72","site":"警察庁の教則の全文（PDF）","lines":["（1）本線車道へ入ろうとする場合で、加速車線があるときは、加速車線を通行して、十分加速しなければなりません。"]}],"section":"G16-2","fixed":true},{"id":"G16-07","subject":"学科","chapter":"G16","text":"\u003cp>本線車道に入ろうとするときは、本線車道を通行している車の進行を妨げてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>本線車道へ入ろうとするときは、本線車道を通行している車の進行を妨げてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節1（2） 本線車道へ入るときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=72","site":"警察庁の教則の全文（PDF）","lines":["（2）本線車道へ入ろうとするときは、本線車道を通行している車の進行を妨げてはいけません。また、本線車道と本線車道が合流するところで、標示により前方の本線車道の優先が指定されているときは、その本線車道を通行している車の進行を妨げてはいけません。"]}],"section":"G16-2","fixed":true},{"id":"G16-08","subject":"学科","chapter":"G16","text":"\u003cp>標識などで指定されていない高速自動車国道の本線車道では、普通自動車の最高速度は時速 100 キロメートルである。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>高速自動車国道の本線車道などでの普通自動車（三輪のものとけん引しているものを除く）の最高速度は、時速 100 キロメートルです。\u003c/p>","refs":[{"label":"道路交通法施行令 第27条","url":"https://laws.e-gov.go.jp/law/335CO0000000270#Mp-Ch_4_2-At_27","lines":["（最高速度）","第二十七条　最高速度のうち、自動車が高速自動車国道の本線車道又はこれに接する加速車線若しくは減速車線を通行する場合の最高速度は、次の各号に掲げる自動車の区分に従い、それぞれ当該各号に定めるとおりとする。","一　次に掲げる自動車　百キロメートル毎時","　イ　大型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。次号において同じ。）のうち専ら人を運搬する構造のもの","　ロ　中型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。次号において同じ。）のうち、専ら人を運搬する構造のもの又は車両総重量が八千キログラム未満、最大積載重量が五千キログラム未満及び乗車定員が十人以下のもの","　ハ　準中型自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。）","　ニ　普通自動車（三輪のもの並びに牽引するための構造及び装置を有し、かつ、牽引されるための構造及び装置を有する車両を牽引するものを除く。）","　ホ　大型自動二輪車","　ヘ　普通自動二輪車","二　大型自動車のうち前号イに掲げるもの以外のもの及び中型自動車のうち同号ロに掲げるもの以外のもの　九十キロメートル毎時","三　前二号に掲げる自動車以外の自動車　八十キロメートル毎時","２　法第三十九条第一項の緊急自動車が高速自動車国道の本線車道又はこれに接する加速車線若しくは減速車線を通行する場合の最高速度は、第十二条第一項及び前項の規定にかかわらず、百キロメートル毎時とする。"]}],"section":"G16-2","fixed":true},{"id":"G16-09","subject":"学科","chapter":"G16","text":"\u003cp>標識などで指定されていない高速自動車国道の本線車道では、普通自動車の最低速度は時速 40 キロメートルである。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>標識などで指定されていない高速自動車国道の本線車道の最低速度は、時速 50 キロメートルです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節2（3） 速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=72","site":"警察庁の教則の全文（PDF）","lines":["（3）標識や標示で最高速度や最低速度が指定されていない高速自動車国道の本線車道では、次の最高速度を超えたり、最低速度に達しない速度で運転してはいけません。自動車の種類最高速度（キロメート最低速度（キロメートル毎時）ル毎時）大型乗用自動車、特定中型貨物自動車以外の10050中型自動車、準中型自動車、普通自動車（三輪のものを除く。）、大型自動二輪車、普通自動二輪車大型貨物自動車、特定中型貨物自動車（三輪90のものを除く。）上記以外の自動車80他の車をけん引するとき備考１本線車道が道路の構造上往復の方向別に分離されていない区間では、この表の適用はなく、一般道路と同じです。２高速自動車国道でほかの車をけん引して走ることができるのは、けん引するための構造と装置のある車が、けん引されるための構造と装置のある車をけん引する場合に限ります。"]}],"section":"G16-2","fixed":true},{"id":"G16-10","subject":"学科","chapter":"G16","text":"\u003cp>高速道路を時速 100 キロメートルで走るときは、路面が乾燥していてタイヤが新しければ、約 50 メートルの車間距離で十分である。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>路面が乾燥していてタイヤが新しい場合でも、時速 100 キロメートルでは約 100 メートルの車間距離が必要です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節2（4） 速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=72","site":"警察庁の教則の全文（PDF）","lines":["（4）車間距離を十分とつて走りましよう。路面が乾燥していて、タイヤが新しい場合は、時速100キロメートルでは約100メートル、時速80キロメートルでは約80メートルの車間距離をとる必要があります。また、路面が雨にぬれ、タイヤが減つている場合は、この約２倍程度の車間距離が必要となることがあります。"]}],"section":"G16-2","fixed":true},{"id":"G16-11","subject":"学科","chapter":"G16","text":"\u003cp>雨の中を高速で走ると、タイヤが浮いて、ハンドルやブレーキが効かなくなることがある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>雨の中を高速で走行すると、タイヤが浮いて、ハンドルやブレーキが効かなくなることがあります（ハイドロプレーニング現象）。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節2（5） 速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=72","site":"警察庁の教則の全文（PDF）","lines":["（5）雨や雪や霧など悪天候下での高速走行は特に危険です。雨の中を高速で走行すると、スリップを起こしたり、タイヤが浮いて、ハンドルやブレーキが効かなくなることがあります（ハイドロプレーニング現象）。また雪の日は路面が滑りやすく、視界も悪くなるので、高速での走行は避けましよう。","これら悪天候下ではインターチェンジが閉鎖され通行止めになることがありますので、交通情報に特に注意しましよう。"]}],"section":"G16-2","fixed":true},{"id":"G16-12","subject":"学科","chapter":"G16","text":"\u003cp>長い時間高速で走ると速度感が鈍り、速度を出し過ぎがちになるので、速度計で確かめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>長い時間高速で走ったり、夜間高速で走ったりしていると速度感が鈍り、速度を出し過ぎがちです。速度計で確かめます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節2（2） 速度","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=72","site":"警察庁の教則の全文（PDF）","lines":["（2）悪天候のときは、その状況に応じた速度で走らなければなりません。長い時間高速で走つたり、夜間高速で走つたりしていると速度感が鈍り、速度を出し過ぎがちです。速度計で確かめましよう。"]}],"section":"G16-2","fixed":true},{"id":"G16-13","subject":"学科","chapter":"G16","text":"\u003cp>高速道路が渋滞しているときは、路側帯や路肩を通行してもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>高速道路の路側帯や路肩を通行してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節3（2） 走行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=73","site":"警察庁の教則の全文（PDF）","lines":["（2）高速道路の路側帯や路肩を通行してはいけません。"]}],"section":"G16-3","fixed":true},{"id":"G16-14","subject":"学科","chapter":"G16","text":"\u003cp>高速道路の本線車道では、転回や後退をしたり、中央分離帯を横切ったりしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>本線車道では、転回したり、後退したり、中央分離帯を横切ったりしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節3（4） 走行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=73","site":"警察庁の教則の全文（PDF）","lines":["（4）本線車道では、転回したり、後退したり、中央分離帯を横切つたりしてはいけません。"]}],"section":"G16-3","fixed":true},{"id":"G16-15","subject":"学科","chapter":"G16","text":"\u003cp>高速道路で追越しをしたあと進路を戻すときは、追い越した車の前の部分がルームミラーに映れば、すぐに戻ってよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>進路を戻すときは、追い越した車の全体がルームミラーに映ったことを確認してから行います。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節3（5） 走行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=73","site":"警察庁の教則の全文（PDF）","lines":["（5）追越しをする場合は、早目に合図をし、追越し車線の車の動きなどに注意してから行いましよう。特に、進路を戻すときは、追い越した車全体がルームミラーに映つたことを確認してから行いましよう。"]}],"section":"G16-3","fixed":true},{"id":"G16-16","subject":"学科","chapter":"G16","text":"\u003cp>高速走行中にブレーキを掛けるときは、一段低いギアに落としてエンジンブレーキを使うとともに、フットブレーキを数回に分けて踏む。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>高速走行中の急ブレーキはたいへん危険です。一段低いギアに落としてエンジンブレーキを使い、フットブレーキを数回に分けて踏みます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節3（8） 走行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=73","site":"警察庁の教則の全文（PDF）","lines":["（8）高速で走行中に急ブレーキを掛けることは、たいへん危険です。ブレーキを掛けるときは、一段低いギアに落としエンジンブレーキを使うとともに、フットブレーキを数回に分けて踏むようにしましよう。"]}],"section":"G16-3","fixed":true},{"id":"G16-17","subject":"学科","chapter":"G16","text":"\u003cp>強風のときは、ハンドルを取られないよう、速度を上げて素早く通過する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>強風のときは、ハンドルを取られやすいので速度を落とし、注意して運転します。トンネルや切り通しの出口などでは、横風に注意します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節3（10） 走行方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=73","site":"警察庁の教則の全文（PDF）","lines":["（10）強風のときは、ハンドルを取られやすいので速度を落とし、注意して運転しましよう。特に、トンネルや切り通しの出口などでは、横風のためにハンドルを取られることがあるので注意しましよう。"]}],"section":"G16-3","fixed":true},{"id":"G16-18","subject":"学科","chapter":"G16","text":"\u003cp>高速道路では、料金所で料金を支払うために停車することも禁止されている。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>料金の支払いのため料金徴収所で停車するときや、パーキングエリアで駐停車するときなどは、高速道路でも駐停車できます。\u003c/p>","refs":[{"label":"道路交通法 第75条の8第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4_2-Se_2-At_75_8-Pr_1","lines":["自動車（これにより牽引されるための構造及び装置を有する車両を含む。以下この条において同じ。）は、高速自動車国道等においては、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、停車し、又は駐車してはならない。ただし、次の各号のいずれかに掲げる場合においては、この限りでない。","一　駐車の用に供するため区画された場所において停車し、又は駐車するとき。","二　故障その他の理由により停車し、又は駐車することがやむを得ない場合において、停車又は駐車のため十分な幅員がある路肩又は路側帯に停車し、又は駐車するとき。","三　乗合自動車が、その属する運行系統に係る停留所において、乗客の乗降のため停車し、又は運行時間を調整するため駐車するとき。","四　料金支払いのため料金徴収所において停車するとき。"]}],"section":"G16-4","fixed":true},{"id":"G16-19","subject":"学科","chapter":"G16","text":"\u003cp>高速道路で故障などのためやむを得ないときは、十分な幅のある路肩や路側帯に駐車や停車をすることができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>故障その他の理由により駐停車することがやむを得ない場合に、十分な幅員がある路肩や路側帯に駐停車するときは、禁止の例外です。\u003c/p>","refs":[{"label":"道路交通法 第75条の8第1項第2号","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4_2-Se_2-At_75_8-Pr_1-It_2","lines":["二　故障その他の理由により停車し、又は駐車することがやむを得ない場合において、停車又は駐車のため十分な幅員がある路肩又は路側帯に停車し、又は駐車するとき。"]}],"section":"G16-4","fixed":true},{"id":"G16-20","subject":"学科","chapter":"G16","text":"\u003cp>高速道路で故障して運転できなくなったときは、停止表示器材を自動車の前方の路上に置く。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>停止表示器材は、自動車の後方の路上に置き、後続車の運転者に停止していることが分かるようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節4（2） 駐車、停車の禁止など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=74","site":"警察庁の教則の全文（PDF）","lines":["（2）高速道路で故障、燃料切れ、交通事故などにより運転することができなくなつたときは自動車の後方の路上に停止表示器材を置き（歩行が困難で自動車の後方の路上に停止表示器材を置くことができない場合には、停止表示灯については自動車の側方の路上などの後方から見やすい場所に置くこともできます。）、後続車の運転者に停止していることが分かるようにしなければなりません。これと併せて夜間（昼間において視界が200メートル以下の場合も同じです。）は、非常点滅表示灯、駐車灯や尾灯をつけなければなりません。停止表示器材を置くときには、発炎筒を使つて合図をするなど後続車に十分注意しましよう。また、風の強いときなどに停止表示板を用いる場合には、倒れたりすることのないよう必要な措置を講じましよう。特に車体の後部に連結して補強措置を講ずる場合には、きちんと連結しましよう。なお、修理などが終わり現場を立ち去るときは、停止表示器材を置き忘れないようにしましよう。"]}],"section":"G16-4","fixed":true},{"id":"G16-21","subject":"学科","chapter":"G16","text":"\u003cp>高速道路で運転できなくなったときは、危険防止の措置をとったあと、後続車に追突されないよう車の中にとどまって救援を待つ。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転できなくなった車にとどまることは、後続車が衝突するおそれが大きく大変危険です。必要な措置をとった後は、車に残らず、ガードレールの外側などの安全な場所に避難します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節4（4） 駐車、停車の禁止など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=74","site":"警察庁の教則の全文（PDF）","lines":["（4）高速道路上で運転することができなくなつた車にとどまることは、後続車が衝突する交通事故が発生するおそれが大きく、大変危険です。必要な危険防止措置をとつた後は、車に残らず、ガードレールの外側などの安全な場所に避難しましよう。"]}],"section":"G16-4","fixed":true},{"id":"G16-22","subject":"学科","chapter":"G16","text":"\u003cp>本線車道から出るときは、あらかじめ出口に接続する車両通行帯を通り、減速車線があるときは、その車線で速度計を確かめながら速度を落とす。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>出口に近づいたときは、あらかじめ出口に接続する車両通行帯を通行し、減速車線があるときはその車線を通り、感覚に頼らずに速度計で確かめながら速度を落とします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節5（2） 本線車道から出るとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=75","site":"警察庁の教則の全文（PDF）","lines":["（2）出口に近づいたときは、あらかじめ出口に接続する車両通行帯を通行しなければなりません。この場合、減速車線があるときは、その車線を通り、感覚に頼らずに速度計で確かめながら速度を落とさなければなりません。"]}],"section":"G16-5","fixed":true},{"id":"G16-23","subject":"学科","chapter":"G16","text":"\u003cp>高速道路から一般道路に出たあとは、速度を出し過ぎになりがちなので、速度に十分注意する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>一般道路へ出たときは、速やかに一般道路に見合った運転方法をとります。高速運転に慣れた後は速度を出し過ぎになりがちです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第7章第2節5（3） 本線車道から出るとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=75","site":"警察庁の教則の全文（PDF）","lines":["（3）一般道路へ出たときは、速やかに一般道路に見合つた運転方法をとりましよう。特に、高速運転に慣れた後は速度を出し過ぎになりがちですから、速度には十分注意しましよう。"]}],"section":"G16-5","fixed":true},{"id":"G17-01","subject":"学科","chapter":"G17","text":"\u003cp>二輪車は、体で安定を保ちながら走り、停止すると安定を失うという特性を持っている。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>二輪車は、体で安定を保ちながら走り、停止すれば安定を失うという構造上の特性を持っているため、四輪車とは違った運転技術が必要です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節 二輪車の運転者の心得","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=76","site":"警察庁の教則の全文（PDF）","lines":["二輪車は、体で安定を保ちながら走り、停止すれば安定を失うという構造上の特性を持つているため、四輪車とは違つた運転技術を必要とします。また、二輪車の動きが四輪車からは見えないことがあるので、周りの交通の動きについて一層の注意が必要となります。手軽な乗り物であると気を許さないで、常に慎重に運転しましよう。"]}],"section":"G17-1","fixed":true},{"id":"G17-02","subject":"学科","chapter":"G17","text":"\u003cp>二輪車は、体力に自信があれば、最初から大型の車種を選んでよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>体力に自信があってもいきなり大型車に乗るのは危険です。最初は小型の車種から始め、熟練度に応じて大型の車種に乗ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節1（1） 車種の選定","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=76","site":"警察庁の教則の全文（PDF）","lines":["（1）体格に合つた車種を選ぶようにしましよう。体力に自信があつてもいきなり大型車に乗るのは危険です。最初は小型の車種から始め、熟練度に応じて大型の車種に乗るようにしましよう。","車種の選定に当たつては、次のことができるかどうかを確かめましよう。","ア平地でセンタースタンドを立てることが楽にできること。","イ二輪車にまたがつたとき、両足のつま先が地面に届くこと。","ウ８の字型に押して歩くことが完全にできること。"]}],"section":"G17-1","fixed":true},{"id":"G17-03","subject":"学科","chapter":"G17","text":"\u003cp>二輪車の車種を選ぶときは、またがったときに両足のつま先が地面に届くかどうかを確かめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車種の選定に当たっては、平地でセンタースタンドを楽に立てられること、またがったとき両足のつま先が地面に届くこと、8 の字型に押して歩けることを確かめます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節1（1） 車種の選定","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=76","site":"警察庁の教則の全文（PDF）","lines":["（1）体格に合つた車種を選ぶようにしましよう。体力に自信があつてもいきなり大型車に乗るのは危険です。最初は小型の車種から始め、熟練度に応じて大型の車種に乗るようにしましよう。","車種の選定に当たつては、次のことができるかどうかを確かめましよう。","ア平地でセンタースタンドを立てることが楽にできること。","イ二輪車にまたがつたとき、両足のつま先が地面に届くこと。","ウ８の字型に押して歩くことが完全にできること。"]}],"section":"G17-1","fixed":true},{"id":"G17-04","subject":"学科","chapter":"G17","text":"\u003cp>工事用の安全帽は、二輪車の乗車用ヘルメットの代わりにかぶってよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>工事用安全帽は乗車用ヘルメットではありません。PS（c）マークか JIS マークの付いた乗車用ヘルメットを、あごひもを確実に締めて正しく着用します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節2 乗車用ヘルメットの着用","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=76","site":"警察庁の教則の全文（PDF）","lines":["乗車用ヘルメットをかぶらないで大型自動二輪車や普通自動二輪車や一般原動機付自転車を運転してはいけません。また、乗車用ヘルメットをかぶらない者を乗せて大型自動二輪車や普通自動二輪車を運転してはいけません。乗車用ヘルメットは、PS（c）マークかJISマークの付いたものを使い、あごひもを確実に締めるなど正しく着用しましよう。工事用安全帽は乗車用ヘルメットではありません。"]}],"section":"G17-1","fixed":true},{"id":"G17-05","subject":"学科","chapter":"G17","text":"\u003cp>二輪車に乗るときは、体の露出がなるべく少なくなる服装をし、できるだけプロテクターを着ける。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>二輪車に乗るときは、体の露出がなるべく少なくなるような服装をし、できるだけプロテクターを着用します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節3 服装など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=77","site":"警察庁の教則の全文（PDF）","lines":["二輪車に乗るときは、体の露出がなるべく少なくなるような服装をし、できるだけプロテクターを着用しましよう。大型自動二輪車や普通自動二輪車の同乗者についても同様です。また、ほかの運転者から見て、よく目に付きやすいものを着用するようにしましよう。夜間は、反射性の衣服又は反射材の付いた乗車用ヘルメットを着用するようにしましよう。"]}],"section":"G17-1","fixed":true},{"id":"G17-06","subject":"学科","chapter":"G17","text":"\u003cp>一般原動機付自転車は、後部座席があれば二人乗りをすることができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>一般原動機付自転車を運転するときは、二人乗りをしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節4（1） 二人乗りの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=77","site":"警察庁の教則の全文（PDF）","lines":["（1）大型自動二輪車や普通自動二輪車で後部座席がないものや一般原動機付自転車を運転するとき。"]}],"section":"G17-2","fixed":true},{"id":"G17-07","subject":"学科","chapter":"G17","text":"\u003cp>普通二輪免許を受けて 1 年たっていない人は、普通自動二輪車で二人乗りをしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>普通二輪免許を受けて 1 年を経過していない者が普通自動二輪車を運転するときは、二人乗りをしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節4（3） 二人乗りの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=77","site":"警察庁の教則の全文（PDF）","lines":["（3）普通二輪免許を受けて１年を経過していない者が普通自動二輪車を運転するとき。"]}],"section":"G17-2","fixed":true},{"id":"G17-08","subject":"学科","chapter":"G17","text":"\u003cp>普通二輪免許を受けて 3 年以上たっていれば、19 歳の人でも、高速道路で普通自動二輪車の二人乗りをすることができる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>高速道路での二人乗りは、20 歳未満の人や、普通二輪免許を受けていた期間が 3 年未満の人はできません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節4（5） 二人乗りの禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=77","site":"警察庁の教則の全文（PDF）","lines":["（5）普通二輪免許を受けた者で、20歳未満のもの又は普通二輪免許を受けていた期間が３年未満のものが、高速道路で普通自動二輪車を運転するとき。"]}],"section":"G17-2","fixed":true},{"id":"G17-09","subject":"学科","chapter":"G17","text":"\u003cp>二輪車のチェーンの緩みは、チェーンの中央部を指で押して調べる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>チェーンが緩み過ぎていたり、張り過ぎていたりしないかは、チェーンの中央部を指で押して調べます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第1節6（4） 二輪車の点検","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78","site":"警察庁の教則の全文（PDF）","lines":["（4）チェーンが緩み過ぎていたり、張り過ぎていたりしないか（緩みは、チェーンの中央部を指で押してみて調べる。）。適当な注油がなされているか。"]}],"section":"G17-1","fixed":true},{"id":"G17-10","subject":"学科","chapter":"G17","text":"\u003cp>二輪車に乗るときは、ステップに土踏まずを載せ、タンクを両ひざでしめる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>ステップに土踏まずを載せて足の裏がほぼ水平になるようにし、足先をまっすぐ前方に向けて、タンクを両ひざでしめます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第2節（1） 正しい乗り方","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78","site":"警察庁の教則の全文（PDF）","lines":["（1）ステップに土踏まずを載せて、足の裏がほぼ水平になるようにする。また、足先がまつすぐ前方を向くようにして、タンクを両ひざでしめる。"]}],"section":"G17-3","fixed":true},{"id":"G17-11","subject":"学科","chapter":"G17","text":"\u003cp>二輪車のグリップは、手首を上げて、できるだけ強く握る。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>手首を下げて、ハンドルを前に押すような気持ちでグリップを軽く持ちます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第2節（2） 正しい乗り方","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78","site":"警察庁の教則の全文（PDF）","lines":["（2）手首を下げて、ハンドルを前に押すような気持ちでグリップを軽く持つ。"]}],"section":"G17-3","fixed":true},{"id":"G17-12","subject":"学科","chapter":"G17","text":"\u003cp>二輪車は機動性に富むので、渋滞しているときは、車の間を縫って走るのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>二輪車は機動性に富んでいますが、車の間を縫って走ったり、ジグザグ運転をしたりしてはいけません。極めて危険で、周りの運転者にも不安を与えます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第3節 安全な運転の方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78","site":"警察庁の教則の全文（PDF）","lines":["二輪車は機動性に富んでいますが、車の間を縫つて走つたり、ジグザグ運転、無理な追越しや割込みをしたりしてはいけません。そのような運転方法は極めて危険であるばかりでなく、周囲の運転者にも不安を与えます。車間距離や側方間隔を十分に保ちましよう。交通渋滞のときなどには、前の車に乗つている人が急にドアを開けたり、歩行者が車の間から飛び出したりすることがあるので注意しましよう。また、げたやサンダルなど運転の妨げになる履物を履いて運転してはいけません。"]}],"section":"G17-3","fixed":true},{"id":"G17-13","subject":"学科","chapter":"G17","text":"\u003cp>二輪車でカーブを曲がるときは、ハンドルを切るのではなく、車体を傾けて自然に曲がるようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>曲がるときは、ハンドルを切るのではなく、車体を傾けることによって自然に曲がるような要領で行います。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第3節1（2） カーブでの運転方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78","site":"警察庁の教則の全文（PDF）","lines":["（2）曲がるときは、ハンドルを切るのではなく、車体を傾けることによつて自然に曲がるような要領で行いましよう。"]}],"section":"G17-3","fixed":true},{"id":"G17-14","subject":"学科","chapter":"G17","text":"\u003cp>二輪車でカーブを走っている途中は、クラッチを切って惰性で走るのがよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>カーブの途中ではスロットルで速度を加減し、クラッチを切らないで常に車輪にエンジンの力を掛けておきます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第3節1（3） カーブでの運転方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=78","site":"警察庁の教則の全文（PDF）","lines":["（3）カーブの途中では、スロットルで速度を加減しましよう。クラッチを切らないで常に車輪にエンジンの力を掛けておき、カーブの後半で前方の安全を確かめてから、やや加速するようにしましよう。"]}],"section":"G17-3","fixed":true},{"id":"G17-15","subject":"学科","chapter":"G17","text":"\u003cp>二輪車でぬかるみや砂利道を走るときは、低速ギアで速度を落とし、スロットルで速度を一定に保って通る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>ぬかるみや砂利道では、低速ギアなどを使って速度を落とし、ブレーキや急加速、大きなハンドル操作を避け、スロットルで速度を一定に保ちます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第3節2（2） ぬかるみ、砂利道などでの運転方法","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=79","site":"警察庁の教則の全文（PDF）","lines":["（2）ブレーキを掛けたり、急に加速したり、大きなハンドル操作をしたりしないようにしましよう。スロットルで速度を一定に保ち、バランスをとりながら通行しましよう。"]}],"section":"G17-3","fixed":true},{"id":"G17-16","subject":"学科","chapter":"G17","text":"\u003cp>二段階の右折方法で右折する一般原動機付自転車は、あらかじめ道路の左端に寄り、交差点の手前の側端から 30 メートルの地点で右折の合図をする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>二段階の右折方法では、あらかじめできるだけ道路の左端に寄って、交差点の手前の側端から 30 メートルの地点に達したときに右折の合図を行います。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第3節3（2） 右折するときの運転","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=79","site":"警察庁の教則の全文（PDF）","lines":["（2）一般原動機付自転車の右折交差点（環状交差点を除きます。）での右折は、次の方法でしなければなりません。","ア二段階の右折方法「一般原動機付自転車の右折方法（二段階）」の標識（付表３（１）35の２）のある道路や車両通行帯（交差点の付近に設けられた右左折のための車両通行帯を含みます。）が３以上ある道路（「一般原動機付自転車の右折方法（小回り）」の標識（付表３（１）35の３）のある道路を除きます。）の信号機などにより交通整理の行われている交差点では、あらかじめできるだけ道路の左端に寄つて、その交差点の手前の側端から30メートルの地点に達したときに右折の合図を行い、青信号で徐行しながら交差点の向こう側までまつすぐに進み、その地点で止まつて右に向きを変え、ここで合図をやめ、前方の信号が青になつてから進むようにしなければなりません。なお、このような場合は、青の矢印の信号によつて右折することはできません。","イ小回りの右折方法「一般原動機付自転車の右折方法（小回り）」の標識のある道路の交差点などア以外の交差点では、あらかじめできるだけ道路の中央に寄り、交差点の中心のすぐ内側を徐行しながら進行しなければなりません。","幅の広い道路で右折しようとするときは、十分手前のところから徐々に右折の車線に移るようにしましよう。急に左側の車線から右側の車線に移動すると極めて危険です。なお、このような場合は、青の矢印の信号に従つて右折することができます。"]}],"section":"G17-3","fixed":true},{"id":"G17-17","subject":"学科","chapter":"G17","text":"\u003cp>二輪車でブレーキを掛けるときは、車体を垂直に保ち、ハンドルを切らない状態で、前後輪のブレーキを同時に掛ける。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車体を垂直に保ち、ハンドルを切らない状態で、エンジンブレーキを効かせながら前後輪のブレーキを同時に掛けます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第4節2（1） ブレーキを掛けるときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=80","site":"警察庁の教則の全文（PDF）","lines":["（1）ブレーキを掛けるときは、車体を垂直に保ち、ハンドルを切らない状態で、エンジンブレーキを効かせながら前後輪のブレーキを同時に掛けましよう。このとき乗車姿勢を正しく保たないと前のめりになります。"]}],"section":"G17-4","fixed":true},{"id":"G17-18","subject":"学科","chapter":"G17","text":"\u003cp>二輪車では、乾燥した路面では後輪ブレーキをやや強く、滑りやすい路面では前輪ブレーキをやや強く掛ける。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>乾燥した路面では前輪ブレーキをやや強く、路面が滑りやすいときは後輪ブレーキをやや強く掛けます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第4節2（2） ブレーキを掛けるときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=80","site":"警察庁の教則の全文（PDF）","lines":["（2）乾燥した路面でブレーキを掛けるときは、前輪ブレーキをやや強く、路面が滑りやすいときは、後輪ブレーキをやや強く掛けましよう。"]}],"section":"G17-4","fixed":true},{"id":"G17-19","subject":"学科","chapter":"G17","text":"\u003cp>エンジンブレーキを強く効かせたいときは、ギアをいきなり高速からローに入れる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>エンジンブレーキは低速ギアほど制動力が大きくなりますが、いきなり高速からローに入れるとエンジンを傷めたり転倒したりするおそれがあるので、順序よくシフトダウンします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第4節2（3） ブレーキを掛けるときの注意","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=80","site":"警察庁の教則の全文（PDF）","lines":["（3）エンジンブレーキは、低速ギアになるほど制動力が大きくなります。しかし、ギアをいきなり高速からローに入れるとエンジンを傷めたり、転倒したりするおそれがありますので、順序よくシフトダウンしましよう。"]}],"section":"G17-4","fixed":true},{"id":"G17-20","subject":"学科","chapter":"G17","text":"\u003cp>オートマチック二輪車は、スロットルを急に回すと急発進する危険がある。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>オートマチック二輪車はクラッチ操作がいらない分、スロットルを急に回転させると急発進する危険があります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第5節2 発進","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=81","site":"警察庁の教則の全文（PDF）","lines":["クラッチ操作がいらない分、スロットルを急に回転させると急発進する危険がありますので注意しましよう。"]}],"section":"G17-5","fixed":true},{"id":"G17-21","subject":"学科","chapter":"G17","text":"\u003cp>マフラーを取り外したり、マフラーのしんを抜いたりする改造をしてはいけない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>マフラーを取り外したり、切断したり、しんを抜いたり、穴を開けたりすると騒音が大きくなるので、このような改造をしてはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第6節1 改造の禁止","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=81","site":"警察庁の教則の全文（PDF）","lines":["変形ハンドルは運転の妨げとなり、また、マフラーを取り外したり、切断したり、マフラーのしんを抜いたり、マフラーに穴を開けたりすると騒音が大きくなるので、このような改造をしてはいけません。"]}],"section":"G17-5","fixed":true},{"id":"G17-22","subject":"学科","chapter":"G17","text":"\u003cp>二輪車を押して歩くときは、エンジンを掛けたままでも歩行者として扱われる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>二輪車を押して歩くときは歩行者として扱われますが、エンジンを掛けているものや、側車付きのもの、ほかの車をけん引しているものは別です。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第8章第6節3 押して歩くとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=82","site":"警察庁の教則の全文（PDF）","lines":["二輪車を押して歩くときは、歩行者として扱われます。しかし、エンジンを掛けているものやほかの車をけん引しているものや側車付きのものを押しているときは、歩行者としては扱われません。"]}],"section":"G17-5","fixed":true},{"id":"G18-01","subject":"学科","chapter":"G18","text":"\u003cp>交通事故を起こしたときは、事故の続発を防ぐため、ほかの交通の妨げにならない安全な場所に車を止め、エンジンを切る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>事故の続発を防ぐため、他の交通の妨げにならないような安全な場所（路肩、空地など）に車を止め、エンジンを切ります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節1（1） 運転者などの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=83","site":"警察庁の教則の全文（PDF）","lines":["（1）事故の続発を防ぐため、他の交通の妨げにならないような安全な場所（路肩、空地など）に車を止め、エンジンを切る。"]}],"section":"G18-1","fixed":true},{"id":"G18-02","subject":"学科","chapter":"G18","text":"\u003cp>交通事故で頭部に傷を受けた負傷者がいるときは、早く病院に運ぶため、すぐに抱えて自分の車に乗せる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>むやみに負傷者を動かさないようにし、特に頭部に傷を受けているときは動かしません。後続事故のおそれがある場合は、早く安全な場所に移動させます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節1（2） 運転者などの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=83","site":"警察庁の教則の全文（PDF）","lines":["（2）負傷者がいる場合は、医師、救急車などが到着するまでの間、ガーゼや清潔なハンカチなどで止血するなど、可能な応急救護処置を行う。この場合、むやみに負傷者を動かさない（特に頭部に傷を受けているときは動かさない）ようにする。ただし、後続事故のおそれがある場合は、早く負傷者を救出して安全な場所に移動させる。"]}],"section":"G18-1","fixed":true},{"id":"G18-03","subject":"学科","chapter":"G18","text":"\u003cp>交通事故の現場で後続事故のおそれがあるときは、早く負傷者を救出して、安全な場所に移動させる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>むやみに負傷者を動かさないのが原則ですが、後続事故のおそれがある場合は、早く負傷者を救出して安全な場所に移動させます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節1（2） 運転者などの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=83","site":"警察庁の教則の全文（PDF）","lines":["（2）負傷者がいる場合は、医師、救急車などが到着するまでの間、ガーゼや清潔なハンカチなどで止血するなど、可能な応急救護処置を行う。この場合、むやみに負傷者を動かさない（特に頭部に傷を受けているときは動かさない）ようにする。ただし、後続事故のおそれがある場合は、早く負傷者を救出して安全な場所に移動させる。"]}],"section":"G18-1","fixed":true},{"id":"G18-04","subject":"学科","chapter":"G18","text":"\u003cp>交通事故の当事者どうしで話し合いがついたときは、警察官に事故を報告しなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>交通事故があったときは、事故が発生した場所、負傷者数や負傷の程度、物の損壊の程度などを警察官に報告しなければなりません。\u003c/p>","refs":[{"label":"道路交通法 第72条第1項","url":"https://laws.e-gov.go.jp/law/335AC0000000105#Mp-Ch_4-Se_2-At_72-Pr_1","lines":["交通事故があつたときは、当該交通事故に係る車両等の運転者その他の乗務員（以下この節において「運転者等」という。）は、直ちに車両等の運転を停止して、負傷者を救護し、道路における危険を防止する等必要な措置を講じなければならない。この場合において、当該車両等の運転者（運転者が死亡し、又は負傷したためやむを得ないときは、その他の乗務員。次項において同じ。）は、警察官が現場にいるときは当該警察官に、警察官が現場にいないときは直ちに最寄りの警察署（派出所又は駐在所を含む。同項において同じ。）の警察官に当該交通事故が発生した日時及び場所、当該交通事故における死傷者の数及び負傷者の負傷の程度並びに損壊した物及びその損壊の程度、当該交通事故に係る車両等の積載物並びに当該交通事故について講じた措置（第七十五条の二十三第一項及び第三項において「交通事故発生日時等」という。）を報告しなければならない。"]},{"label":"交通の方法に関する教則 第10章第1節1（3） 運転者などの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=83","site":"警察庁の教則の全文（PDF）","lines":["（3）事故が発生した場所、負傷者数や負傷の程度、物の損壊の程度、事故にあつた車の積載物などを警察官に報告し、指示を受ける。","なお、緊急自動車、けが人や病人を運搬中の車や、乗合バスなどの運転者は、業務のために引き続きその車を運転する必要があるときは、他の乗務員に負傷者の救護や警察官への報告など必要な措置を行わせて、運転を続けることができる。"]}],"section":"G18-1","fixed":true},{"id":"G18-05","subject":"学科","chapter":"G18","text":"\u003cp>交通事故で外傷がなくても、頭部などに強い衝撃を受けたときは、医師の診断を受ける。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>軽いけがでも必ず警察官に届け、外傷がなくても頭部などに強い衝撃を受けたときは、医師の診断を受けます。後になって後遺症が起きることがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節2 医師の診断を受けること","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=84","site":"警察庁の教則の全文（PDF）","lines":["軽いけがでも、必ず警察官に届け、外傷がなくても頭部などに強い衝撃を受けたときは、医師の診断を受けましよう。後になつて後遺症が起きて困ることがあります。"]}],"section":"G18-1","fixed":true},{"id":"G18-06","subject":"学科","chapter":"G18","text":"\u003cp>乗合バスの運転者は、業務のため運転を続ける必要があるときは、ほかの乗務員に負傷者の救護や警察官への報告をさせて、運転を続けることができる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>緊急自動車、けが人や病人を運搬中の車、乗合バスなどの運転者は、業務のために引き続き運転する必要があるときは、他の乗務員に必要な措置を行わせて、運転を続けることができます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節1 運転者などの義務","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=83","site":"警察庁の教則の全文（PDF）","lines":["交通事故が起きたときは、運転者や乗務員は次のような措置を採らなければなりません。","（1）事故の続発を防ぐため、他の交通の妨げにならないような安全な場所（路肩、空地など）に車を止め、エンジンを切る。","（2）負傷者がいる場合は、医師、救急車などが到着するまでの間、ガーゼや清潔なハンカチなどで止血するなど、可能な応急救護処置を行う。この場合、むやみに負傷者を動かさない（特に頭部に傷を受けているときは動かさない）ようにする。ただし、後続事故のおそれがある場合は、早く負傷者を救出して安全な場所に移動させる。","（3）事故が発生した場所、負傷者数や負傷の程度、物の損壊の程度、事故にあつた車の積載物などを警察官に報告し、指示を受ける。","なお、緊急自動車、けが人や病人を運搬中の車や、乗合バスなどの運転者は、業務のために引き続きその車を運転する必要があるときは、他の乗務員に負傷者の救護や警察官への報告など必要な措置を行わせて、運転を続けることができる。"]}],"section":"G18-1","fixed":true},{"id":"G18-07","subject":"学科","chapter":"G18","text":"\u003cp>ひき逃げを見かけたときは、負傷者を救護するとともに、その車のナンバー、車種、色などを警察官に届け出る。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>ひき逃げを見かけたときは、負傷者を救護し、その車のナンバー、車種、色など車の特徴を、110 番通報などで警察官に届け出ます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節3（2） 現場に居合わせた人の協力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=84","site":"警察庁の教則の全文（PDF）","lines":["（2）ひき逃げを見かけたときは、負傷者を救護するとともに、その車のナンバー、車種、色など車の特徴を110番通報などで警察官に届け出ましよう。"]}],"section":"G18-2","fixed":true},{"id":"G18-08","subject":"学科","chapter":"G18","text":"\u003cp>交通事故の現場に居合わせたときは、気持ちを落ち着かせるため、たばこを吸ってから救護に当たるとよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>事故現場にはガソリンが流れたり、積荷に危険物があったりするので、たばこを吸ったり、マッチを捨てたりしないようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第1節3（3） 現場に居合わせた人の協力","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=84","site":"警察庁の教則の全文（PDF）","lines":["（3）事故現場には、ガソリンが流れたり、積荷に危険物があつたりするので、たばこを吸つたり、マツチを捨てたりしないようにしましよう。"]}],"section":"G18-2","fixed":true},{"id":"G18-09","subject":"学科","chapter":"G18","text":"\u003cp>夜間、一般道路でやむを得ず駐車するときは、非常点滅表示灯などをつけるか、停止表示器材を置いて、停止していることが分かるようにする。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>夜間やむを得ず一般道路で駐車する場合には、非常点滅表示灯などをつけるか、停止表示器材を置くなど、他の車に停止していることが分かるようにしなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第2節2 故障などのとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=84","site":"警察庁の教則の全文（PDF）","lines":["夜間やむを得ず一般道路で駐車する場合には、非常点滅表示灯などをつけるか、停止表示器材を置くなど、他の車に停止していることが分かるようにしなければなりません。昼間、一般道路で駐車する場合にも、停止表示器材を置いたり、トランクをあけたりして駐車していることを表示するようにしましよう。"]}],"section":"G18-3","fixed":true},{"id":"G18-10","subject":"学科","chapter":"G18","text":"\u003cp>故障車を一般の車でロープでけん引するときは、追突を防ぐため、故障車との間を 10 メートル以上空ける。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>やむを得ず一般車両でけん引するときは、けん引する車と故障車の間に 5 メートル以内の安全な間隔を保ち、丈夫なロープなどで確実につなぎます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第2節4 故障などのとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=85","site":"警察庁の教則の全文（PDF）","lines":["道路に故障車両を放置することは、追突事故などの原因となり非常に危険です。停止表示器材を置くなど、一次措置を終えるとすぐに、近くの電話などでJAF（日本自動車連盟）や修理業者などの車を呼んで、速やかに道路外へ移動させるようにしましよう。やむを得ず一般車両でけん引するときは、けん引する車と故障車の間に安全な間隔（５メートル以内）を保ちながら丈夫なロープなどで確実につなぎ、ロープに白い布（30センチメートル平方以上）を付けなければなりません。"]}],"section":"G18-3","fixed":true},{"id":"G18-11","subject":"学科","chapter":"G18","text":"\u003cp>故障車をロープでけん引するときは、ロープに 30 センチメートル平方以上の白い布を付けなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>やむを得ず一般車両でけん引するときは、ロープに白い布（30 センチメートル平方以上）を付けなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第2節4 故障などのとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=85","site":"警察庁の教則の全文（PDF）","lines":["道路に故障車両を放置することは、追突事故などの原因となり非常に危険です。停止表示器材を置くなど、一次措置を終えるとすぐに、近くの電話などでJAF（日本自動車連盟）や修理業者などの車を呼んで、速やかに道路外へ移動させるようにしましよう。やむを得ず一般車両でけん引するときは、けん引する車と故障車の間に安全な間隔（５メートル以内）を保ちながら丈夫なロープなどで確実につなぎ、ロープに白い布（30センチメートル平方以上）を付けなければなりません。"]}],"section":"G18-3","fixed":true},{"id":"G18-12","subject":"学科","chapter":"G18","text":"\u003cp>道路で故障した車は、停止表示器材を置くなどの一次措置を終えたら、修理業者などを呼んで速やかに道路外へ移動させる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>道路に故障車両を放置することは非常に危険です。一次措置を終えるとすぐに、JAF や修理業者などの車を呼んで、速やかに道路外へ移動させます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第2節4 故障などのとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=85","site":"警察庁の教則の全文（PDF）","lines":["道路に故障車両を放置することは、追突事故などの原因となり非常に危険です。停止表示器材を置くなど、一次措置を終えるとすぐに、近くの電話などでJAF（日本自動車連盟）や修理業者などの車を呼んで、速やかに道路外へ移動させるようにしましよう。やむを得ず一般車両でけん引するときは、けん引する車と故障車の間に安全な間隔（５メートル以内）を保ちながら丈夫なロープなどで確実につなぎ、ロープに白い布（30センチメートル平方以上）を付けなければなりません。"]}],"section":"G18-3","fixed":true},{"id":"G18-13","subject":"学科","chapter":"G18","text":"\u003cp>車を運転中に警戒宣言が発せられたことを知ったときは、急いで強化地域の外に出るため、速度を上げて走る。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>警戒宣言が発せられたことを知ったときは、あわてることなく、低速で走行し、カーラジオ等で地震情報や交通情報を聞いて、その情報に応じて行動します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節1（1） 地震災害に関する警戒宣言が発せられたとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=85","site":"警察庁の教則の全文（PDF）","lines":["（1）車を運転中に警戒宣言が発せられたとき","ア警戒宣言が発せられたことを知つたときは、地震の発生に備えて、あわてることなく、低速で走行するとともに、カーラジオ等により継続して地震情報や交通情報を聞き、その情報に応じて行動すること。","イ車を置いて避難するときは、できるだけ道路外の場所に移動しておくこと。やむを得ず道路上に置いて避難するときは、道路の左側に寄せて駐車し、エンジンを止め、エンジンキーは付けたままとするか運転席などの車内の分かりやすい場所に置いておくこととし、窓を閉め、ドアはロックしないこと。駐車するときは、避難する人の通行や地震防災応急対策の実施の妨げとなるような場所には駐車しないこと。"]}],"section":"G18-4","fixed":true},{"id":"G18-14","subject":"学科","chapter":"G18","text":"\u003cp>車を運転中に緊急地震速報が発表されたことを知ったときは、直ちに急ブレーキを掛けて止まる。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>あわてることなく、非常点滅表示灯をつけるなどして周囲の車に注意を促した後、急ブレーキを避け、緩やかに速度を落とします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節2 緊急地震速報が発表されたとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=86","site":"警察庁の教則の全文（PDF）","lines":["緊急地震速報は、気象庁が、予想される地震動の大きさがおおむね震度５弱以上である場合などに、震度４以上を予想した区域などを、その揺れが来る前に発表するものです。","車を運転中に緊急地震速報が発表されたことを知つたときは、運転者は、周囲の状況に応じて、あわてることなく、非常点滅表示灯をつけるなどして周囲の車に注意を促した後、急ブレーキを避け、緩やかに速度を落としましよう。"]}],"section":"G18-4","fixed":true},{"id":"G18-15","subject":"学科","chapter":"G18","text":"\u003cp>車を運転中に大地震が起きたときは、急ハンドルや急ブレーキを避け、できるだけ安全な方法で道路の左側に止める。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>急ハンドル、急ブレーキを避けるなど、できるだけ安全な方法により道路の左側に停止させます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節3（1） 大地震が発生したとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=86","site":"警察庁の教則の全文（PDF）","lines":["（1）車を運転中に大地震が発生したとき","ア急ハンドル、急ブレーキを避けるなど、できるだけ安全な方法により道路の左側に停止させること。","イ停止後は、カーラジオ等により地震情報や交通情報を聞き、その情報や周囲の状況に応じて行動すること。","ウ引き続き車を運転するときは、道路の損壊、信号機の作動停止、道路上の障害物などに十分注意すること。","エ車を置いて避難するときは、できるだけ道路外の場所に移動しておくこと。やむを得ず道路上に置いて避難するときは、道路の左側に寄せて駐車し、エンジンを止め、エンジンキーは付けたままとするか運転席などの車内の分かりやすい場所に置いておくこととし、窓を閉め、ドアはロックしないこと。駐車するときは、避難する人の通行や災害応急対策の実施の妨げとなるような場所には駐車しないこと。"]}],"section":"G18-4","fixed":true},{"id":"G18-16","subject":"学科","chapter":"G18","text":"\u003cp>大地震のため車を道路上に置いて避難するときは、エンジンを止め、エンジンキーを抜いて、ドアをロックしておく。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>やむを得ず道路上に置いて避難するときは、道路の左側に寄せて駐車し、エンジンを止め、キーは付けたままとするか車内の分かりやすい場所に置き、窓を閉め、ドアはロックしません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節3（1） 大地震が発生したとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=86","site":"警察庁の教則の全文（PDF）","lines":["（1）車を運転中に大地震が発生したとき","ア急ハンドル、急ブレーキを避けるなど、できるだけ安全な方法により道路の左側に停止させること。","イ停止後は、カーラジオ等により地震情報や交通情報を聞き、その情報や周囲の状況に応じて行動すること。","ウ引き続き車を運転するときは、道路の損壊、信号機の作動停止、道路上の障害物などに十分注意すること。","エ車を置いて避難するときは、できるだけ道路外の場所に移動しておくこと。やむを得ず道路上に置いて避難するときは、道路の左側に寄せて駐車し、エンジンを止め、エンジンキーは付けたままとするか運転席などの車内の分かりやすい場所に置いておくこととし、窓を閉め、ドアはロックしないこと。駐車するときは、避難する人の通行や災害応急対策の実施の妨げとなるような場所には駐車しないこと。"]}],"section":"G18-4","fixed":true},{"id":"G18-17","subject":"学科","chapter":"G18","text":"\u003cp>運転中でないときに大地震が起きた場合は、津波から避難するためやむを得ない場合を除き、避難のために車を使わない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車を運転中以外の場合に大地震が発生したときは、津波から避難するためやむを得ない場合を除き、避難のために車を使用しません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節3（2） 大地震が発生したとき","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=86","site":"警察庁の教則の全文（PDF）","lines":["（2）車を運転中以外の場合に大地震が発生したとき","ア津波から避難するためやむを得ない場合を除き、避難のために車を使用しないこと。","イ津波から避難するためやむを得ず車を使用するときは、道路の損壊、信号機の作動停止、道路上の障害物などに十分注意しながら運転すること。"]}],"section":"G18-4","fixed":true},{"id":"G18-18","subject":"学科","chapter":"G18","text":"\u003cp>災害対策基本法による交通の規制で区域が指定されたときは、通行禁止区域内にある車を、速やかに道路外の場所に移動させる。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>区域を指定して交通の規制が行われたときは、速やかに車を道路外の場所へ移動させます。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節4（1） 災害が発生したときなどに災害対策基本法による交通の規制が行われたときなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=87","site":"警察庁の教則の全文（PDF）","lines":["（1）速やかに、車を次の場所へ移動させること。","ア道路の区間を指定して交通の規制が行われたときは、規制が行われている道路の区間以外の場所","イ区域を指定して交通の規制が行われたときは、道路外の場所"]}],"section":"G18-4","fixed":true},{"id":"G18-19","subject":"学科","chapter":"G18","text":"\u003cp>災害対策基本法による交通の規制が行われた区域で、車を速やかに移動させることが難しいときは、道路の中央に寄せて駐車する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>速やかな移動が困難なときは、車をできるだけ道路の左端に沿って駐車するなど、緊急通行車両の通行の妨害とならない方法で駐車します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第10章第3節4（2） 災害が発生したときなどに災害対策基本法による交通の規制が行われたときなど","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=87","site":"警察庁の教則の全文（PDF）","lines":["（2）速やかな移動が困難なときは、車をできるだけ道路の左端に沿つて駐車するなど、緊急通行車両の通行の妨害とならない方法により駐車すること。"]}],"section":"G18-4","fixed":true},{"id":"G19-01","subject":"学科","chapter":"G19","text":"\u003cp>原動機付自転車も、自賠責保険か責任共済に必ず加入しなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動車は自賠責保険か責任共済に加入しなければなりません。原動機付自転車も必ず加入しなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第1節4 強制保険などの加入","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=88","site":"警察庁の教則の全文（PDF）","lines":["自賠責保険か責任共済に加入しなければなりません。原動機付自転車も必ず自賠責保険か責任共済に加入しなければなりません。また、なるべく一般の任意保険にも加入するようにしましよう。"]}],"section":"G19-1","fixed":true},{"id":"G19-02","subject":"学科","chapter":"G19","text":"\u003cp>自賠責保険に加入していれば、一般の任意保険には加入する必要はないとされている。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自賠責保険か責任共済への加入は義務で、さらに、なるべく一般の任意保険にも加入するようにします。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第1節4 強制保険などの加入","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=88","site":"警察庁の教則の全文（PDF）","lines":["自賠責保険か責任共済に加入しなければなりません。原動機付自転車も必ず自賠責保険か責任共済に加入しなければなりません。また、なるべく一般の任意保険にも加入するようにしましよう。"]}],"section":"G19-1","fixed":true},{"id":"G19-03","subject":"学科","chapter":"G19","text":"\u003cp>前面ガラスにはられた検査標章の数字は、次の検査の時期（年月）を示している。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動車は一定の時期に検査を受けなければなりません。前面ガラスの検査標章の数字は、次の検査の時期（年月）を示します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第1節3 自動車の検査","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=88","site":"警察庁の教則の全文（PDF）","lines":["自動車は、一定の時期に検査を受けなければなりません。前面ガラスにはられた検査標章の数字は、次の検査の時期（年月）を示します。"]}],"section":"G19-1","fixed":true},{"id":"G19-04","subject":"学科","chapter":"G19","text":"\u003cp>自動車の検査は、新しく買ったときに一度受ければ、その後は受けなくてよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>自動車は、一定の時期に検査を受けなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第1節3 自動車の検査","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=88","site":"警察庁の教則の全文（PDF）","lines":["自動車は、一定の時期に検査を受けなければなりません。前面ガラスにはられた検査標章の数字は、次の検査の時期（年月）を示します。"]}],"section":"G19-1","fixed":true},{"id":"G19-05","subject":"学科","chapter":"G19","text":"\u003cp>原動機付自転車は、申告をして、標識（ナンバープレート）を付けなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>自動車は登録を受け（軽自動車は届け出）て番号標を付け、原動機付自転車は申告をして標識（ナンバープレート）を付けなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第1節2 自動車の登録（届け出）等","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=88","site":"警察庁の教則の全文（PDF）","lines":["自動車は登録を受け（軽自動車は届け出）て、番号標（ナンバープレート）を付けなければなりません。また、原動機付自転車は申告をして、標識（ナンバープレート）を付けなければなりません。"]}],"section":"G19-1","fixed":true},{"id":"G19-06","subject":"学科","chapter":"G19","text":"\u003cp>酒を少し飲んだだけの人であれば、車を貸してもよい。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>無免許の人や酒を飲んだ人に車を貸してはいけません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第1節5 自動車の管理","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=89","site":"警察庁の教則の全文（PDF）","lines":["無免許の人や酒を飲んだ人に車を貸してはいけません。また、車を勝手に持ち出されないように、車のかぎの保管に十分注意しましよう。"]}],"section":"G19-1","fixed":true},{"id":"G19-07","subject":"学科","chapter":"G19","text":"\u003cp>車の使用者は、車の適正な駐車のために必要な措置を講じなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>車の使用者は、車の適正な駐車のために必要な措置を講じなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節1（3） 使用者の義務など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=89","site":"警察庁の教則の全文（PDF）","lines":["（3）車の使用者は、車の適正な駐車のために必要な措置を講じなければなりません。"]}],"section":"G19-2","fixed":true},{"id":"G19-08","subject":"学科","chapter":"G19","text":"\u003cp>運転者が最高速度違反を繰り返しても、その車の使用者が処分を受けることはない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転者の最高速度違反などについて、使用者が公安委員会から再発防止の措置を指示されることがあり、繰り返されると、一定期間その自動車を運転させることができなくなる処分を受けることがあります。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節1（4） 使用者の義務など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=89","site":"警察庁の教則の全文（PDF）","lines":["（4）運転者が次のようなことをしたときには、公安委員会から、その車の使用者に対して、再発を防止するために必要な措置をとることを指示されることがあります。それでも、なおこのようなことが繰り返された場合には、使用者は、一定期間その自動車を運転したり、運転させたりすることができなくなる処分を受けることがあります。","ア最高速度違反行為（最高速度を超える速度で車を運転する行為をいいます。）","イ過積載運転行為（過積載をして車を運転する行為をいいます。）","ウ過労運転（過労により正常な運転ができないおそれがある状態で車を運転する行為をいいます。）","なお、自動車運転代行業者は、代行運転自動車や随伴用自動車の運転者がア、ウの行為や駐停車違反行為（違法に駐車又は停車をする行為をいいます。）をしたときにも、公安委員会から、再発を防止するために必要な措置をとることを指示されたり、その営業を停止する処分を受けたりすることがあります。"]}],"section":"G19-2","fixed":true},{"id":"G19-09","subject":"学科","chapter":"G19","text":"\u003cp>放置違反金を納めずに督促を受けた自動車の使用者は、納付したことなどを証する書面を提示しなければ、新たに自動車検査証を受けることができない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>放置違反金を期限までに納付せず督促を受けた使用者は、放置違反金などを納付したことを証する書面を提示しなければ、新たに自動車検査証を受けられません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節1（6） 使用者の義務など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=89","site":"警察庁の教則の全文（PDF）","lines":["（6）放置違反金を納付の期限までに納付せず、公安委員会から督促を受けた自動車の使用者は、その放置違反金、延滞金及び手数料を納付したことなどを証する書面を提示しなければ、新たに自動車検査証を受けることができません。"]}],"section":"G19-2","fixed":true},{"id":"G19-10","subject":"学科","chapter":"G19","text":"\u003cp>乗車定員が 11 人以上の自動車を 1 台だけ使う事業所には、安全運転管理者を置く必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>乗車定員が 11 人以上の自動車は 1 台、その他の自動車は 5 台以上を使用する事業所ごとに、安全運転管理者を置かなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節2（1） 安全運転管理者など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車の使用者は、自動車の安全な運転に必要な業務を行わせるため、乗車定員が11人以上の自動車にあつては１台、その他の自動車にあつては５台（大型自動二輪車と普通自動二輪車はそれぞれ０.５台として計算します。）以上の車を使用する事業所ごとに、安全運転管理者を置かなければなりません。また、自動車運転代行業者は、その営業所ごとに安全運転管理者を置かなければなりません。"]}],"section":"G19-3","fixed":true},{"id":"G19-11","subject":"学科","chapter":"G19","text":"\u003cp>乗車定員 10 人以下の自動車を 5 台以上使う事業所には、安全運転管理者を置かなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>乗車定員が 11 人以上の自動車以外の自動車では、5 台以上を使用する事業所ごとに安全運転管理者を置かなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節2（1） 安全運転管理者など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車の使用者は、自動車の安全な運転に必要な業務を行わせるため、乗車定員が11人以上の自動車にあつては１台、その他の自動車にあつては５台（大型自動二輪車と普通自動二輪車はそれぞれ０.５台として計算します。）以上の車を使用する事業所ごとに、安全運転管理者を置かなければなりません。また、自動車運転代行業者は、その営業所ごとに安全運転管理者を置かなければなりません。"]}],"section":"G19-3","fixed":true},{"id":"G19-12","subject":"学科","chapter":"G19","text":"\u003cp>安全運転管理者を置く台数を数えるときは、自動二輪車は 1 台を 2 台として計算する。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>大型自動二輪車と普通自動二輪車は、それぞれ 0.5 台として計算します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節2（1） 安全運転管理者など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90","site":"警察庁の教則の全文（PDF）","lines":["（1）自動車の使用者は、自動車の安全な運転に必要な業務を行わせるため、乗車定員が11人以上の自動車にあつては１台、その他の自動車にあつては５台（大型自動二輪車と普通自動二輪車はそれぞれ０.５台として計算します。）以上の車を使用する事業所ごとに、安全運転管理者を置かなければなりません。また、自動車運転代行業者は、その営業所ごとに安全運転管理者を置かなければなりません。"]}],"section":"G19-3","fixed":true},{"id":"G19-13","subject":"学科","chapter":"G19","text":"\u003cp>20 台以上の自動車を使う事業所には、台数に応じて副安全運転管理者を置かなければならない。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>20 台以上の自動車を使用する事業所には、使用する台数に応じて所定の数の副安全運転管理者を置かなければなりません。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節2（2） 安全運転管理者など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90","site":"警察庁の教則の全文（PDF）","lines":["（2）20台以上の自動車（大型自動二輪車と普通自動二輪車はそれぞれ０.５台として計算します。）を使用する事業所（自動車運転代行業者にあつては、10台以上の随伴用自動車を使用する営業所）には、それぞれ使用する台数に応じて所定の数の副安全運転管理者を置かなければなりません。"]}],"section":"G19-3","fixed":true},{"id":"G19-14","subject":"学科","chapter":"G19","text":"\u003cp>安全運転管理者は、運転前と運転後の運転者の酒気帯びの有無を、目視などとアルコール検知器で確認し、その記録を 1 年間保存する。\u003c/p>","choices":["○","×"],"answer":0,"explain":"\u003cp>運転しようとする運転者と運転を終了した運転者の酒気帯びの有無を、目視等とアルコール検知器で確認し、記録を 1 年間保存し、検知器を常時有効に保持します。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節2（3） 安全運転管理者など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90","site":"警察庁の教則の全文（PDF）","lines":["（3）安全運転管理者は、次のことを確実に行つて、運転者に安全な運転をさせるようにしなければなりません。また、副安全運転管理者は、これらの業務について安全運転管理者を補助しなければなりません。","ア交通安全教育を行うこと。","イ自動車の運転についての運転者の適性、技能、知識や運転者が交通規則を守つているかを把握するための措置をとること。","ウ最高速度違反行為、過積載運転行為、過労運転、違法な駐車をした場合において、運転者が車を離れて直ちに運転することができない状態にする行為（代行運転自動車及び随伴用自動車については駐停車違反行為）の防止などに十分気を配つて運行計画を作成すること。","エ長距離運転などの場合は、交代運転者を配置すること。","オ異常な気象や天災などの場合は、必要な指示をするなど安全運転をさせるための措置をとること。","カ日常点検の実施や運転者の健康状態などを確認し、安全運転に必要な指示をすること。","キ運転しようとする運転者及び運転を終了した運転者に対し、酒気帯びの有無について、当該運転者の状態を目視等で確認するほか、アルコール検知器を用いて確認し、その記録を一年間保存するとともに、アルコール検知器を常時有効に保持すること。","ク運転日誌をつけさせること。","ケ自動車の運転についての技能、知識など安全運転に必要な事項について指導すること。"]}],"section":"G19-3","fixed":true},{"id":"G19-15","subject":"学科","chapter":"G19","text":"\u003cp>安全運転管理者は、運転者に運転日誌をつけさせる必要はない。\u003c/p>","choices":["○","×"],"answer":1,"explain":"\u003cp>運転日誌をつけさせることは、安全運転管理者が行う業務の一つです。\u003c/p>","refs":[{"label":"交通の方法に関する教則 第11章第2節2（3） 安全運転管理者など","url":"https://www.npa.go.jp/bureau/traffic/20261106kyousoku.pdf#page=90","site":"警察庁の教則の全文（PDF）","lines":["（3）安全運転管理者は、次のことを確実に行つて、運転者に安全な運転をさせるようにしなければなりません。また、副安全運転管理者は、これらの業務について安全運転管理者を補助しなければなりません。","ア交通安全教育を行うこと。","イ自動車の運転についての運転者の適性、技能、知識や運転者が交通規則を守つているかを把握するための措置をとること。","ウ最高速度違反行為、過積載運転行為、過労運転、違法な駐車をした場合において、運転者が車を離れて直ちに運転することができない状態にする行為（代行運転自動車及び随伴用自動車については駐停車違反行為）の防止などに十分気を配つて運行計画を作成すること。","エ長距離運転などの場合は、交代運転者を配置すること。","オ異常な気象や天災などの場合は、必要な指示をするなど安全運転をさせるための措置をとること。","カ日常点検の実施や運転者の健康状態などを確認し、安全運転に必要な指示をすること。","キ運転しようとする運転者及び運転を終了した運転者に対し、酒気帯びの有無について、当該運転者の状態を目視等で確認するほか、アルコール検知器を用いて確認し、その記録を一年間保存するとともに、アルコール検知器を常時有効に保持すること。","ク運転日誌をつけさせること。","ケ自動車の運転についての技能、知識など安全運転に必要な事項について指導すること。"]}],"section":"G19-3","fixed":true}]};</script>
<script>
'use strict';
const D = window.HAM;
const QBY = new Map(D.questions.map(q => [q.id, q])), CHBY = new Map(D.chapters.map(c => [c.id, c]));
const $app = document.getElementById('app');

// 記録はこのブラウザーの localStorage だけに置く。使えない（プライベートモードなど）ときも動くようにする
const KEY = D.app.storageKey;
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(KEY + k); } catch { /* 使えない */ } },
};
// 解いた記録は 4アマと 3アマで共通（3アマは 4アマの章を含むので、同じ問題の記録をそのまま使う）。
// 練習の設定と模擬試験の結果は資格ごと。4アマは前からの名前（prefs・mock）のまま、ほかは「.資格」を付けて置く
const keyOf = (k, id) => id === D.licenses[0].id ? k : `${k}.${id}`;
let stats = store.get('stats', {});           // 問題の番号 → { n: 解いた回数, ok: 正解の回数, last: 最後の結果 1/0, t: 時刻 }
let L, QS, CHS, SUBJECTS, prefs;              // いまの資格と、その問題・章・科目（本番の形）・練習の設定
let sess = null;                              // 練習
let exam = null, timer = 0, skipHash = false; // 模擬試験
function useLicense(id) {
  L = D.licenses.find(l => l.id === id) || D.licenses[0];
  const set = new Set(L.chapters);
  CHS = D.chapters.filter(c => set.has(c.id));
  QS = D.questions.filter(q => set.has(q.chapter));
  SUBJECTS = L.exam.subjects;
  prefs = Object.assign({ subj: '', chapters: null, n: 10, order: 'random' }, store.get(keyOf('prefs', L.id), {}));
  if (prefs.chapters) prefs.chapters = prefs.chapters.filter(c => set.has(c));
  store.set('lic', L.id);
  document.getElementById('lic').hidden = D.licenses.length < 2; // 資格が 1 つだけのアプリは切り替えを出さない
  document.getElementById('lic').innerHTML = D.licenses.map(l => `<button type="button" data-lic="${esc(l.id)}" aria-pressed="${l === L}" title="${esc(l.name)}">${esc(l.short)}</button>`).join('');
}
const savePrefs = () => store.set(keyOf('prefs', L.id), prefs);
const mockKey = () => keyOf('mock', L.id);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const qOf = id => QBY.get(id);
const chOf = q => CHBY.get(q.chapter);
const chLabel = c => `第${c.num}章 ${c.title}`;
const textOnly = h => h.replace(/<br>/g, ' ').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
const snippet = (q, n = 44) => { const t = textOnly(q.text).replace(/\s+/g, ' ').trim(); return esc(t.length > n ? t.slice(0, n) + '…' : t); };
const orderFor = q => { const o = q.choices.map((_, i) => i); return q.fixed ? o : shuffle(o); };
const chaptersFor = subj => CHS.filter(c => !subj || c.subject === subj);
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtMin = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)} 分 ${s % 60} 秒`; };
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
const go = hash => { if (location.hash === hash) route(); else location.hash = hash; };
// 本番の形の説明。科目で問題数と合格点が同じ資格（4アマ）と、ちがう資格（3アマ）で言い方を変える。
